<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Баланс</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,600;14..32,800;14..32,900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #06040a; --card: #0e0a14; --elevated: #140c1a;
            --text: #e8ddf0; --sub: #8a7d94; --muted: #5e5268;
            --border: rgba(180,100,140,0.15);
            --gold: #f0b90b; --red: #e85d3a; --purple: #a371f7; --green: #10b981;
            --radius: 16px; --radius-sm: 10px;
        }
        [data-theme="light"] {
            --bg: #f7f2eb; --card: #fefcf8; --elevated: #fbf8f3;
            --text: #2d1a1a; --sub: #6b4e4e; --muted: #8b6b6b;
            --border: rgba(180,80,60,0.12);
            --gold: #b8860b; --red: #a03020; --purple: #7b5ea7; --green: #27ae60;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; scroll-padding-top: 100px; }
        body { font-family: 'Inter',system-ui,sans-serif; background: var(--bg); background-image: radial-gradient(ellipse at 50% 0%, rgba(200,40,40,0.06) 0%, transparent 60%), radial-gradient(ellipse at 20% 80%, rgba(163,113,247,0.04) 0%, transparent 50%); color: var(--text); min-height: 100vh; line-height: 1.5; }
        .container { max-width: 1100px; margin: 0 auto; padding: 24px 20px 60px; }

        .header { text-align: center; padding: 32px 0 8px; position: relative; }
        .header-title { font-size: clamp(2.2rem,6vw,3.2rem); font-weight: 900; letter-spacing: -0.03em; background: linear-gradient(135deg,#8b0000 0%,#e85d3a 40%,#ffd700 70%,#e85d3a 100%); background-size: 200% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; filter: drop-shadow(0 0 30px rgba(232,93,58,0.5)); animation: shimmer 3s linear infinite; margin-bottom: 4px; }
        @keyframes shimmer { 0%{background-position:0% center} 100%{background-position:200% center} }
        .header-subtitle { font-size: 0.9rem; color: var(--red); font-weight: 500; letter-spacing: 0.04em; }
        .theme-toggle { position: absolute; right: 0; top: 50%; transform: translateY(-50%); background: var(--elevated); border: 1px solid var(--border); color: var(--sub); padding: 8px 12px; border-radius: 20px; cursor: pointer; font-size: 0.85rem; font-family: inherit; transition: 0.2s; }
        .theme-toggle:hover { background: var(--card); color: var(--red); border-color: var(--red); }

        .nav-wrapper { margin-bottom: 28px; position: sticky; top: 12px; z-index: 100; }
        .nav-toggle { display: none; width: 100%; padding: 13px 18px; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); color: var(--gold); font-size: 0.95rem; font-weight: 700; cursor: pointer; text-align: left; }
        .nav-bar { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; padding: 6px; background: var(--card); border-radius: var(--radius); border: 1px solid var(--border); }
        .nav-link { padding: 8px 14px; border-radius: 20px; color: var(--sub); text-decoration: none; font-size: 0.78rem; font-weight: 500; transition: 0.2s; }
        .nav-link:hover { color: var(--text); background: var(--elevated); }
        .nav-link.active { background: linear-gradient(135deg,var(--red),var(--gold)); color: #000; font-weight: 700; }

        .section { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px 22px; margin-bottom: 20px; position: relative; overflow: hidden; animation: fadeSlideIn 0.4s ease; }
        .section::after { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; opacity: 0.6; }
        .section.gold::after { background: linear-gradient(90deg,transparent,var(--gold),transparent); }
        .section-title { font-size: 1.15rem; font-weight: 800; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
        .section.gold .section-title { color: var(--gold); }

        .race-bar { display: flex; gap: 0; margin-bottom: 14px; border-radius: var(--radius-sm); overflow: hidden; border: 1px solid var(--border); }
        .race-chip { flex: 1; padding: 12px 8px; text-align: center; cursor: pointer; transition: 0.2s; color: var(--muted); background: var(--elevated); border-right: 1px solid var(--border); display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .race-chip:last-child { border-right: none; }
        .race-chip .chip-emoji { font-size: 1.3rem; }
        .race-chip .chip-name { font-size: 0.75rem; font-weight: 600; }
        .race-chip .chip-bonus { font-size: 0.6rem; color: var(--muted); }
        .race-chip:hover { background: var(--card); color: var(--text); }
        .race-chip.active { background: rgba(240,185,11,0.1); color: var(--gold); box-shadow: inset 0 -3px 0 var(--gold); }
        .race-chip.active .chip-bonus { color: var(--gold); }

        .table-wrapper { overflow-x: auto; -webkit-overflow-scrolling: touch; border-radius: var(--radius-sm); border: 1px solid var(--border); }
        table { width: 100%; border-collapse: collapse; font-size: 0.78rem; min-width: 950px; }
        th { background: var(--elevated); color: var(--gold); font-weight: 700; padding: 8px 10px; text-align: center; font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.04em; cursor: pointer; user-select: none; position: relative; padding-right: 20px !important; transition: background 0.15s; }
        th:hover { background: var(--elevated); }
        th::after { content: '⇅'; position: absolute; right: 5px; opacity: 0.4; font-size: 10px; }
        th.asc::after { content: '↑'; opacity: 1; color: var(--gold); }
        th.desc::after { content: '↓'; opacity: 1; color: var(--gold); }
        td { padding: 7px 10px; text-align: center; border-bottom: 1px solid var(--border); color: var(--text); }
        tbody tr { animation: fadeInRow 0.3s ease forwards; opacity: 0; }
        tbody tr:nth-child(1) { animation-delay: 0.02s; } tbody tr:nth-child(2) { animation-delay: 0.04s; } tbody tr:nth-child(3) { animation-delay: 0.06s; }
        tbody tr:nth-child(4) { animation-delay: 0.08s; } tbody tr:nth-child(5) { animation-delay: 0.10s; } tbody tr:nth-child(6) { animation-delay: 0.12s; }
        tbody tr:nth-child(7) { animation-delay: 0.14s; } tbody tr:nth-child(8) { animation-delay: 0.16s; } tbody tr:nth-child(9) { animation-delay: 0.18s; }
        tbody tr:nth-child(10) { animation-delay: 0.20s; } tbody tr:nth-child(11) { animation-delay: 0.22s; } tbody tr:nth-child(12) { animation-delay: 0.24s; }
        tbody tr:nth-child(13) { animation-delay: 0.26s; } tbody tr:nth-child(14) { animation-delay: 0.28s; } tbody tr:nth-child(15) { animation-delay: 0.30s; }
        tr:hover td { background: rgba(255,255,255,0.02); }
        td:first-child { font-weight: 600; color: var(--gold); text-align: left; }
        .number { text-align: right; font-variant-numeric: tabular-nums; }

        .formula-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 10px; }
        .formula-card { background: var(--elevated); border-radius: var(--radius-sm); padding: 14px 16px; border-left: 3px solid var(--gold); animation: fadeSlideIn 0.3s ease; }
        .formula-card .f-title { font-size: 0.8rem; font-weight: 700; color: var(--gold); margin-bottom: 4px; }
        .formula-card .f-body { font-size: 0.75rem; color: var(--sub); line-height: 1.6; font-family: 'SF Mono','Consolas',monospace; }
        .formula-card .f-note { font-size: 0.65rem; color: var(--muted); margin-top: 4px; }

        .beer-btn { position: fixed; bottom: 20px; right: 20px; width: 48px; height: 48px; background: var(--gold); color: #000; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.3rem; text-decoration: none; box-shadow: 0 4px 16px rgba(240,185,11,0.3); z-index: 99; transition: transform 0.2s; animation: float 3s ease-in-out infinite; }
        .beer-btn:hover { transform: scale(1.1); }

        @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
        @keyframes fadeSlideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeInRow { from { opacity: 0; transform: translateX(-8px); } to { opacity: 1; transform: translateX(0); } }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: var(--gold); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #ffd700; }
        * { scrollbar-width: thin; scrollbar-color: var(--gold) transparent; }

        @media (max-width: 768px) {
            .container { padding: 12px 14px 80px; }
            .header { padding: 20px 0 8px; }
            .header-title { font-size: 1.8rem; }
            .theme-toggle { position: static; transform: none; margin: 12px auto 0; display: block; width: fit-content; }
            .nav-toggle { display: block; }
            .nav-bar { display: none; flex-direction: column; margin-top: 8px; }
            .nav-bar.show { display: flex; }
            .nav-link { padding: 12px 16px; border-radius: var(--radius-sm); justify-content: center; }
            .section { padding: 18px 14px; }
            .race-bar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0; }
            .race-chip { flex: none; min-width: 0; border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); padding: 10px 6px; }
            .race-chip:nth-child(4n) { border-right: none; }
            .race-chip .chip-emoji { font-size: 1.1rem; }
            .race-chip .chip-name { font-size: 0.65rem; }
            .race-chip .chip-bonus { font-size: 0.55rem; }
            table { font-size: 0.68rem; min-width: 780px; }
            th, td { padding: 5px 7px; }
            .formula-grid { grid-template-columns: 1fr; }
            .beer-btn { bottom: 16px; right: 16px; width: 42px; height: 42px; font-size: 1.1rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header"><h1 class="header-title">БАЛАНС</h1><p class="header-subtitle">Статы, мощь и расчёты каждого класса</p><button class="theme-toggle" onclick="toggleTheme()">🌓</button></header>
        <div class="nav-wrapper">
            <button class="nav-toggle" onclick="toggleNav()">☰ Меню</button>
            <nav class="nav-bar" id="pageNav">
                <a href="index.html" class="nav-link">📊 Статистика</a>
				<a href="logs.html" class="nav-link">📜 Логи</a>
                <a href="calc.html" class="nav-link">🎲 Калькулятор</a>
				<a href="balance.html" class="nav-link active">⚖️ Баланс</a>

            </nav>
        </div>

        <div class="section gold">
            <div class="race-bar" id="raceBar">
                <div class="race-chip active" onclick="selectRace('')">
                    <span class="chip-emoji">⚔️</span>
                    <span class="chip-name">Без расы</span>
                    <span class="chip-bonus">базовые статы</span>
                </div>
            </div>
            <div class="table-wrapper">
                <table id="classes-balance-table">
                    <thead><tr><th data-sort="name">Класс</th><th data-sort="hp">HP</th><th data-sort="atk">ATK</th><th data-sort="def">DEF</th><th data-sort="dex">DEX</th><th data-sort="min">MIN</th><th data-sort="max">MAX</th><th data-sort="avg">AVG</th><th data-sort="acc">ACC</th><th data-sort="surv">SURV</th><th data-sort="dmg5">DMG/5</th><th data-sort="power">POWER</th><th data-sort="cpi">CPI</th></tr></thead>
                    <tbody id="classes-balance-tbody"></tbody>
                </table>
            </div>
        </div>
        <div class="section gold">
            <div class="table-wrapper">
                <table id="races-balance-table">
                    <thead><tr><th data-sort="name">Раса</th><th data-sort="hp">HP</th><th data-sort="atk">ATK</th><th data-sort="def">DEF</th><th data-sort="dex">DEX</th><th data-sort="min">MIN</th><th data-sort="max">MAX</th></tr></thead>
                    <tbody id="races-balance-tbody"></tbody>
                </table>
            </div>
        </div>
        <div class="section gold">
            <div class="formula-grid" id="formulaGrid"></div>
        </div>
    </div>
    <a href="https://www.donationalerts.com/r/rvotaenota" target="_blank" class="beer-btn" title="Угостить пивом 🍺">🍺</a>
    <script>
        function toggleTheme(){const html=document.documentElement;const current=html.getAttribute('data-theme');const next=current==='dark'?'light':'dark';html.setAttribute('data-theme',next);localStorage.setItem('eternis-theme',next);}
        (function(){const saved=localStorage.getItem('eternis-theme');if(saved)document.documentElement.setAttribute('data-theme',saved);})();
        function toggleNav(){const nav=document.getElementById('pageNav'),btn=document.querySelector('.nav-toggle');nav.classList.toggle('show');btn.textContent=nav.classList.contains('show')?'✕ Закрыть':'☰ Меню';}
        document.querySelectorAll('.nav-link').forEach(l=>l.addEventListener('click',()=>{document.getElementById('pageNav').classList.remove('show');document.querySelector('.nav-toggle').textContent='☰ Меню';}));

        const URL = 'https://raw.githubusercontent.com/rvotaenotaTTV/dnd-stats/main/data.json';
        let CLASSES = [], RACES = [], CONFIG = {}, selRace = '';

        fetch(URL).then(r => r.json()).then(d => {
            CONFIG = d.config;
            CLASSES = d.classes;
            RACES = d.races;
            initRaceBar();
            renderClasses();
            renderRaces();
            renderFormulas();
            initSort();
        }).catch(() => {
            document.getElementById('classes-balance-tbody').innerHTML = '<tr><td colspan="13" style="text-align:center;color:var(--red);">Ошибка загрузки</td></tr>';
        });

        function initRaceBar() {
            const bar = document.getElementById('raceBar');
            const icons = {
                'Человек': '🧑', 'Орк': '👹', 'Дворф': '🧔', 'Нежить': '💀',
                'Эльф': '🧝', 'Табакси': '🐱', 'Тифлинг': '😈'
            };
            RACES.forEach(r => {
                const c = document.createElement('div');
                c.className = 'race-chip';
                const bonus = [];
                if (r.BonusHp) bonus.push(`HP+${r.BonusHp}`);
                if (r.BonusAtk) bonus.push(`ATK+${r.BonusAtk}`);
                if (r.BonusDef) bonus.push(`DEF+${r.BonusDef}`);
                if (r.BonusDex) bonus.push(`DEX+${r.BonusDex}`);
                if (r.BonusMin) bonus.push(`MIN+${r.BonusMin}`);
                if (r.BonusMax) bonus.push(`MAX+${r.BonusMax}`);
                c.innerHTML = `<span class="chip-emoji">${icons[r.Name] || r.Emoji}</span><span class="chip-name">${r.Name}</span><span class="chip-bonus">${bonus.join('·') || '—'}</span>`;
                c.onclick = () => selectRace(r.Name);
                bar.appendChild(c);
            });
        }

        function selectRace(name) {
            selRace = name;
            document.querySelectorAll('.race-chip').forEach(c => c.classList.remove('active'));
            const chips = document.querySelectorAll('.race-chip');
            const idx = name ? RACES.findIndex(r => r.Name === name) + 1 : 0;
            if (chips[idx]) chips[idx].classList.add('active');
            renderClasses();
            document.querySelectorAll('#classes-balance-table th').forEach(h => h.classList.remove('asc', 'desc'));
            const th = document.querySelector('#classes-balance-table th[data-sort="power"]');
            if (th) th.classList.add('desc');
            sortTable('power', 'desc');
        }

        function calc(cls, race) {
            let h = cls.Hp, a = cls.Atk, d = cls.Def, dx = cls.Dex || 0, mn = cls.Min, mx = cls.Max;
            if (race) {
                h += race.BonusHp; a += race.BonusAtk; d += race.BonusDef;
                dx += race.BonusDex; mn += race.BonusMin; mx += race.BonusMax;
            }
            const avg = (mn + mx) / 2;
            const accCPI = (CONFIG.accBaseCPI + a) / 20;
            const atkBonus = 1 + a * CONFIG.cpiAtkBonus;
            const surv = Math.round(h * (1 + d * CONFIG.defReduction));
            const effHP = h * (1 + d * CONFIG.effHpDefMult);
            let cpi = Math.pow(effHP, CONFIG.cpiHpPower) * Math.pow(avg * accCPI * atkBonus * CONFIG.cpiFixedReduction, CONFIG.cpiDmgPower);
            if (a > 8) { cpi -= (a - 8) * 0.8; if (a > 9) cpi -= (a - 9) * 0.5; }
            if (mn > 5) cpi += (mn - 5) * 0.4;
            if (h > 28) cpi += (h - 28) * 0.2;
            const power = Math.round(cpi * CONFIG.powerMultiplier * 10) / 10;
            const enemyDef = 2;
            const acc = Math.round(Math.min(CONFIG.hitChanceMax, Math.max(CONFIG.hitChanceMin, (CONFIG.hitChanceBase + a - enemyDef) / 20)) * 100);
            const dmg5 = Math.round(avg * Math.min(CONFIG.hitChanceMax, Math.max(CONFIG.hitChanceMin, (CONFIG.hitChanceBase + a - enemyDef) / 20)) * 5);
            return { hp: h, atk: a, def: d, dex: dx, min: mn, max: mx, avg: Math.round(avg * 10) / 10, acc: acc, surv: surv, dmg5: dmg5, cpi: Math.round(cpi * 100) / 100, power: power };
        }

        function renderClasses() {
            const race = selRace ? RACES.find(r => r.Name === selRace) : null;
            const data = CLASSES.map(c => ({ ...c, s: calc(c, race) })).sort((a, b) => b.s.power - a.s.power);
            const tbody = document.getElementById('classes-balance-tbody');
            tbody.innerHTML = data.map(c => {
                const s = c.s;
                return `<tr data-name="${c.Name}" data-hp="${s.hp}" data-atk="${s.atk}" data-def="${s.def}" data-dex="${s.dex}" data-min="${s.min}" data-max="${s.max}" data-avg="${s.avg}" data-acc="${s.acc}" data-surv="${s.surv}" data-dmg5="${s.dmg5}" data-cpi="${s.cpi}" data-power="${s.power}"><td>${c.Emoji} ${c.Name}</td><td class="number">${s.hp}</td><td class="number">${s.atk}</td><td class="number">${s.def}</td><td class="number">${s.dex}</td><td class="number">${s.min}</td><td class="number">${s.max}</td><td class="number">${s.avg}</td><td class="number">${s.acc}%</td><td class="number">${s.surv}</td><td class="number">${s.dmg5}</td><td class="number" style="font-weight:700;color:var(--gold)">${s.power.toFixed(1)}</td><td class="number">${s.cpi.toFixed(2)}</td></tr>`;
            }).join('');
        }

        function renderRaces() {
            const tbody = document.getElementById('races-balance-tbody');
            tbody.innerHTML = RACES.map(r => `<tr data-name="${r.Name}" data-hp="${r.BonusHp}" data-atk="${r.BonusAtk}" data-def="${r.BonusDef}" data-dex="${r.BonusDex}" data-min="${r.BonusMin}" data-max="${r.BonusMax}"><td>${r.Emoji} ${r.Name}</td><td class="number">${r.BonusHp > 0 ? '+' : ''}${r.BonusHp}</td><td class="number">${r.BonusAtk > 0 ? '+' : ''}${r.BonusAtk}</td><td class="number">${r.BonusDef > 0 ? '+' : ''}${r.BonusDef}</td><td class="number">${r.BonusDex > 0 ? '+' : ''}${r.BonusDex}</td><td class="number">${r.BonusMin > 0 ? '+' : ''}${r.BonusMin}</td><td class="number">${r.BonusMax > 0 ? '+' : ''}${r.BonusMax}</td></tr>`).join('');
        }

        function sortTable(key, dir) {
            const tbody = document.querySelector('#classes-balance-table tbody');
            const rows = Array.from(tbody.querySelectorAll('tr'));
            rows.sort((a, b) => {
                const va = isNaN(a.dataset[key]) ? a.dataset[key] : parseFloat(a.dataset[key]);
                const vb = isNaN(b.dataset[key]) ? b.dataset[key] : parseFloat(b.dataset[key]);
                return dir === 'asc' ? (va > vb ? 1 : -1) : (va < vb ? 1 : -1);
            });
            rows.forEach(r => tbody.appendChild(r));
        }

        function initSort() {
            document.querySelectorAll('th[data-sort]').forEach(th => {
                th.addEventListener('click', () => {
                    const table = th.closest('table');
                    const key = th.dataset.sort;
                    const isAsc = th.classList.contains('asc');
                    table.querySelectorAll('th').forEach(h => h.classList.remove('asc', 'desc'));
                    th.classList.add(isAsc ? 'desc' : 'asc');
                    if (table.id === 'classes-balance-table') {
                        sortTable(key, isAsc ? 'desc' : 'asc');
                    } else {
                        const tbody = table.querySelector('tbody');
                        const rows = Array.from(tbody.querySelectorAll('tr'));
                        rows.sort((a, b) => {
                            const va = isNaN(a.dataset[key]) ? a.dataset[key] : parseFloat(a.dataset[key]);
                            const vb = isNaN(b.dataset[key]) ? b.dataset[key] : parseFloat(b.dataset[key]);
                            return (isAsc ? 'desc' : 'asc') === 'asc' ? (va > vb ? 1 : -1) : (va < vb ? 1 : -1);
                        });
                        rows.forEach(r => tbody.appendChild(r));
                    }
                });
            });
        }

        function renderFormulas() {
            const c = CONFIG;
            document.getElementById('formulaGrid').innerHTML = `
                <div class="formula-card"><div class="f-title">📊 POWER</div><div class="f-body">POWER = CPI × ${c.powerMultiplier}</div><div class="f-note">Итоговая боевая мощь класса</div></div>
                <div class="formula-card"><div class="f-title">🧠 CPI</div><div class="f-body">CPI = Базовый CPI − Штраф ATK + Бонус MIN + Бонус HP</div><div class="f-note">Базовая сила минус штрафы плюс бонусы</div></div>
                <div class="formula-card"><div class="f-title">📐 Базовый CPI</div><div class="f-body">(Эфф. HP)<sup>${c.cpiHpPower}</sup> × (AVG × ACC × Бонус × ${c.cpiFixedReduction})<sup>${c.cpiDmgPower}</sup></div><div class="f-note">Геометрическое среднее защиты и нападения</div></div>
                <div class="formula-card"><div class="f-title">🛡️ Эффективное HP</div><div class="f-body">HP × (1 + DEF × ${c.effHpDefMult})</div><div class="f-note">+${(c.effHpDefMult * 100).toFixed(0)}% выживаемости за каждое очко DEF</div></div>
                <div class="formula-card"><div class="f-title">⚔️ Атака</div><div class="f-body">AVG × ACC × (1 + ATK × ${c.cpiAtkBonus}) × ${c.cpiFixedReduction}</div><div class="f-note">AVG = (MIN+MAX)/2<br>ACC = (${c.accBaseCPI} + ATK) / 20<br>Бонус = 1 + ATK × ${c.cpiAtkBonus}</div></div>
                <div class="formula-card"><div class="f-title">🎯 Точность в бою</div><div class="f-body">(${c.hitChanceBase} + ATK − DEF) / 20</div><div class="f-note">Шанс попасть. Ограничена ${(c.hitChanceMin * 100).toFixed(0)}%–${(c.hitChanceMax * 100).toFixed(0)}%</div></div>
                <div class="formula-card"><div class="f-title">💥 DMG/5</div><div class="f-body">AVG × ACC × 5</div><div class="f-note">Ожидаемый урон за 5 раундов (ACC из боя, с DEF врага)</div></div>
                <div class="formula-card"><div class="f-title">⚙️ Поправки</div><div class="f-body">ATK > 8: −(ATK−8) × 0.8<br>ATK > 9: ещё −(ATK−9) × 0.5<br>MIN > 5: +(MIN−5) × 0.4<br>HP > 28: +(HP−28) × 0.2</div><div class="f-note">Штрафы и бонусы к CPI</div></div>
                <div class="formula-card"><div class="f-title">🏃 DEX</div><div class="f-body">Инициатива = d20 + DEX</div><div class="f-note">Не влияет на POWER</div></div>
            `;
        }
    </script>
</body>
</html>
