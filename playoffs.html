<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Лига Этерниса</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0e17; --bg2: #111827; --bg3: #1a2332; --bg4: #152028;
            --text: #e8edf3; --text2: #9ca3af; --text3: #6b7280;
            --border: rgba(255,255,255,0.08); --gold: #f0b90b; --purple: #a371f7;
            --red: #ef4444; --green: #10b981;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
        .container { max-width: 1300px; margin: 0 auto; padding: 20px 24px 48px; }
        .header { text-align: center; padding: 32px 0 20px; position: relative; }
        .header h1 {
            font-size: clamp(2rem, 5vw, 2.8rem); font-weight: 900;
            background: linear-gradient(135deg, #ffd700, #f0a500, #ffd700, #f0a500);
            background-size: 200% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text; animation: shimmer 3s linear infinite;
        }
        @keyframes shimmer { 0%{background-position:0% center} 100%{background-position:200% center} }
        .header p { font-size: 0.85rem; color: var(--text3); }
        .nav { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; padding: 6px;
            background: var(--bg2); border-radius: 20px; border: 1px solid var(--border); margin-bottom: 24px; }
        .nav a { padding: 9px 16px; border-radius: 20px; color: var(--text2); text-decoration: none; font-size: 0.8rem; font-weight: 500; }
        .nav a:hover { color: var(--text); background: var(--bg3); }
        .nav a.active { background: linear-gradient(135deg, var(--gold), #e0a800); color: #000; font-weight: 700; }
        .tabs { display: flex; gap: 8px; margin-bottom: 24px; }
        .tabs button { padding: 10px 24px; border: 2px solid var(--border); background: var(--bg3);
            color: var(--text2); border-radius: 20px; cursor: pointer; font-weight: 600; font-size: 0.85rem; }
        .tabs button.active { background: linear-gradient(135deg, var(--gold), #e0a800); color: #000; border-color: transparent; }
        .tab { display: none; }
        .tab.active { display: block; }
        .faction-switch { display: flex; gap: 8px; margin-bottom: 8px; }
        .faction-switch button { flex: 1; padding: 12px; border: 2px solid var(--border); background: var(--bg3);
            color: var(--text2); border-radius: 12px; cursor: pointer; font-weight: 700; font-size: 0.9rem; }
        .faction-switch button.light.active { border-color: var(--gold); color: var(--gold); background: rgba(255,215,0,0.08); }
        .faction-switch button.dark.active { border-color: var(--purple); color: var(--purple); background: rgba(163,113,247,0.08); }
        .faction-note { text-align: center; color: var(--text3); font-size: 0.7rem; margin-bottom: 16px; font-style: italic; }
        table { width: 100%; border-collapse: collapse; font-size: 0.82rem; background: var(--bg4); }
        th { background: var(--bg3); color: var(--gold); padding: 10px 12px; text-align: left; font-size: 0.7rem;
            text-transform: uppercase; letter-spacing: 0.06em; border-bottom: 2px solid var(--border); cursor: pointer; }
        td { padding: 8px 12px; border-bottom: 1px solid var(--border); }
        tr.playoff-row.light td { background: rgba(255,215,0,0.08); }
        tr.playoff-row.dark td { background: rgba(163,113,247,0.08); }
        tr.cutoff td { border-bottom: 2px solid var(--gold); }
        .pos { width: 40px; text-align: center; font-weight: 700; }
        .pos.top-1 { color: #ffd700; } .pos.top-2 { color: #c0c0c0; } .pos.top-3 { color: #cd7f32; }
        .skill { color: var(--gold); font-weight: 700; }

        /* Админ-кнопка */
        .admin-trigger { position: fixed; bottom: 24px; left: 24px; width: 40px; height: 40px;
            background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06);
            color: rgba(255,255,255,0.2); border-radius: 50%; cursor: pointer; font-size: 1rem;
            z-index: 999; transition: all 0.3s; display: flex; align-items: center; justify-content: center; }
        .admin-trigger:hover { color: rgba(255,255,255,0.6); border-color: rgba(255,255,255,0.2); }
        .admin-trigger.active { color: var(--gold); border-color: var(--gold); background: rgba(255,215,0,0.1); }
        
        /* ПЛЕЙ-ОФФ */
        .bracket-wrapper { overflow-x: auto; padding: 10px 0; }
        .bracket { display: flex; justify-content: center; gap: 0; padding: 20px 0; min-width: fit-content; }
        .round { display: flex; flex-direction: column; justify-content: center; gap: 8px; flex: 1; min-width: 140px; max-width: 180px; }
        .round.final { flex: 1.8; min-width: 200px; max-width: 260px; }
        .round-title { text-align: center; font-size: 0.65rem; font-weight: 700; padding: 5px 8px;
            border-radius: 6px; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 1px; white-space: nowrap; }
        .round.light .round-title { background: rgba(255,215,0,0.12); color: var(--gold); }
        .round.dark .round-title { background: rgba(163,113,247,0.12); color: var(--purple); }
        .round-title.final-title { background: linear-gradient(90deg, rgba(255,215,0,0.3), rgba(163,113,247,0.3)); color: #fff; }
        .match { background: var(--bg4); border: 1px solid var(--border); border-radius: 8px;
            padding: 5px 6px; margin: 0 3px 3px 3px; }
        .match .p { padding: 5px 6px; font-size: 0.7rem; display: flex; align-items: center; gap: 5px;
            border-radius: 4px; transition: all 0.15s; white-space: nowrap; }
        .match .p.clickable { cursor: pointer; }
        .match .p.clickable:hover { background: rgba(255,255,255,0.05); }
        .match .p.winner { background: rgba(16,185,129,0.15); color: var(--green); font-weight: 700; }
        .match .p.loser { opacity: 0.3; }
        .match .seed { color: var(--text3); font-size: 0.55rem; min-width: 18px; font-weight: 600; }
        .match .divider { height: 1px; background: var(--border); margin: 3px 0; }
        .grand-final { border: 2px solid transparent; border-radius: 12px; padding: 14px; text-align: center;
            background: linear-gradient(var(--bg4), var(--bg4)) padding-box,
                linear-gradient(135deg, #ffd700, #a371f7, #ffd700) border-box; background-size: 200% 200%;
            animation: glow 4s ease infinite; }
        @keyframes glow { 0%,100%{background-position:0% 50%} 50%{background-position:100% 50%} }
        .grand-final .label { font-size: 0.6rem; text-transform: uppercase; letter-spacing: 2px; color: var(--gold); margin-bottom: 6px; }
        .grand-final .champ { font-size: 0.8rem; font-weight: 800; }
        .grand-final .champ.light { color: var(--gold); } .grand-final .champ.dark { color: var(--purple); }
        .grand-final .champ.clickable { cursor: pointer; }
        .grand-final .champ.clickable:hover { opacity: 0.8; }
        .grand-final .champ.winner { color: #fff; text-shadow: 0 0 8px rgba(255,215,0,0.6); }
        .grand-final .vs { color: var(--text3); font-size: 0.65rem; margin: 6px 0; font-weight: 700; }

        /* Админ-панель */
        .admin-panel { position: fixed; bottom: 80px; left: 24px; background: var(--bg4);
            border: 1px solid var(--border); border-radius: 12px; padding: 12px;
            display: none; z-index: 999; min-width: 180px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
        .admin-panel.visible { display: block; }
        .admin-panel button { display: block; width: 100%; padding: 8px 16px; margin-bottom: 6px;
            border-radius: 8px; cursor: pointer; font-size: 0.75rem; font-weight: 600; font-family: inherit;
            text-align: left; transition: all 0.2s; }
        .admin-panel button:last-child { margin-bottom: 0; }
        .btn-save { background: var(--green); color: #fff; border: none; }
        .btn-save:hover { background: #059669; }
        .btn-export { background: var(--bg3); color: var(--text2); border: 1px solid var(--border); }
        .btn-export:hover { color: var(--gold); border-color: var(--gold); }
        .btn-clear { background: transparent; color: var(--text3); border: 1px solid transparent; }
        .btn-clear:hover { color: var(--red); border-color: var(--red); }
        .admin-hint { font-size: 0.6rem; color: var(--text3); margin-top: 6px; text-align: center; }

        .status { text-align: center; padding: 40px; color: var(--text2); }
        .player-link { color: inherit; text-decoration: none; }
        .player-link:hover { color: var(--gold); }

        @media (max-width: 768px) {
            .container { padding: 12px 14px 32px; }
            .bracket { flex-direction: column; align-items: center; }
            .round { min-width: 100%; max-width: 100%; }
            .round.final { min-width: 100%; max-width: 100%; }
            .admin-trigger { bottom: 16px; left: 16px; }
            .admin-panel { bottom: 70px; left: 16px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header"><h1>ЛИГА ЭТЕРНИСА</h1><p>Турнирная таблица и плей-офф</p></div>
        <div class="nav" id="nav">
            <a href="index.html">📊 Статистика</a><a href="logs.html">📜 Логи</a>
            <a href="calc.html">🎲 Калькулятор</a><a href="balance.html">⚖️ Баланс</a>
            <a href="simulator.html">🧪 Симулятор</a><a href="gradient.html">📈 Градиент</a>
            <a href="guide.html">⚔️ Гайд</a><a href="hall.html">🏆 Зал Славы</a>
            <a href="lore.html">📜 Лор</a><a href="tavern.html">🍺 Таверна</a>
            <a href="dungeon.html">🏔 Подземелье</a>
            <a href="league.html" class="active">🏟 Лига</a><a href="player.html">👤 Профиль</a>
        </div>

        <div class="tabs">
            <button class="active" onclick="switchTab('standings')">📊 Таблица</button>
            <button onclick="switchTab('playoffs')">🏆 Плей-офф</button>
        </div>

        <div id="tab-standings" class="tab active">
            <div class="faction-switch">
                <button class="light active" onclick="showFaction('light')">🌝 Орден Света</button>
                <button class="dark" onclick="showFaction('dark')">🌚 Культ Тьмы</button>
            </div>
            <p class="faction-note">Топ-8 выходят в плей-офф</p>
            <div id="standings-content"><div class="status">Загрузка...</div></div>
        </div>

        <div id="tab-playoffs" class="tab">
            <div id="playoffs-content"><div class="status">Загрузка...</div></div>
        </div>
    </div>

    <!-- Админ-триггер и панель -->
    <button class="admin-trigger" id="adminTrigger" onclick="toggleAdmin()" title="Управление">🛠</button>
    <div class="admin-panel" id="adminPanel">
        <button class="btn-save" onclick="savePlayoffs()">💾 Сохранить</button>
        <button class="btn-export" onclick="exportPlayoffs()">📋 Копировать JSON</button>
        <button class="btn-clear" onclick="clearPlayoffs()">🗑 Сбросить всё</button>
        <div class="admin-hint">Клик по игроку в сетке = автовыбор победителя</div>
    </div>

    <script>
        const DATA_URL = 'https://raw.githubusercontent.com/rvotaenotaTTV/dnd-stats/main/stats_data.json';
        let allPlayers = [], lightPlayers = [], darkPlayers = [], currentFaction = 'light';
        let isAdmin = false;

        let PLAYOFFS = JSON.parse(localStorage.getItem('eternis-playoffs')) || {
            light_round1: ['','','',''], light_round2: ['',''], light_champion: '',
            dark_round1: ['','','',''], dark_round2: ['',''], dark_champion: '',
            grand_champion: ''
        };

        function toggleAdmin() {
            isAdmin = !isAdmin;
            document.getElementById('adminTrigger').classList.toggle('active', isAdmin);
            document.getElementById('adminPanel').classList.toggle('visible', isAdmin);
            if (isAdmin) renderPlayoffs();
        }

        function savePlayoffs() {
            localStorage.setItem('eternis-playoffs', JSON.stringify(PLAYOFFS));
            const btn = document.querySelector('.btn-save');
            btn.textContent = '✅ Сохранено!';
            setTimeout(() => btn.textContent = '💾 Сохранить', 2000);
        }

        function exportPlayoffs() {
            navigator.clipboard.writeText(JSON.stringify(PLAYOFFS, null, 2));
            const btn = document.querySelector('.btn-export');
            btn.textContent = '✅ Скопировано!';
            setTimeout(() => btn.textContent = '📋 Копировать JSON', 2000);
        }

        function clearPlayoffs() {
            if (!confirm('Очистить ВСЕ результаты плей-офф?')) return;
            PLAYOFFS = { light_round1: ['','','',''], light_round2: ['',''], light_champion: '',
                dark_round1: ['','','',''], dark_round2: ['',''], dark_champion: '', grand_champion: '' };
            localStorage.removeItem('eternis-playoffs');
            renderPlayoffs();
        }

        function shortName(name) {
            return name && name.length > 3 ? name.substring(0, 3).toUpperCase() : (name ? name.toUpperCase() : '???');
        }

        function switchTab(t) {
            document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tabs button').forEach(el => el.classList.remove('active'));
            document.getElementById('tab-'+t).classList.add('active');
            event.target.classList.add('active');
            if (t === 'playoffs') renderPlayoffs();
        }

        function showFaction(f) {
            currentFaction = f;
            document.querySelectorAll('.faction-switch button').forEach(el => el.classList.remove('active'));
            event.target.classList.add('active');
            renderStandings();
        }

        function renderStandings() {
            const players = currentFaction === 'light' ? [...lightPlayers] : [...darkPlayers];
            const c = document.getElementById('standings-content');
            if (!players.length) { c.innerHTML = '<div class="status">Нет данных.</div>'; return; }
            const rc = 'playoff-row ' + currentFaction;
            let h = '<table><thead><tr><th class="pos">#</th><th>Игрок</th><th>Класс</th><th>W</th><th>L</th><th>%</th><th>🌟</th></tr></thead><tbody>';
            players.forEach((p,i) => {
                const t = (p.wins||0)+(p.losses||0), wr = t>0?((p.wins||0)*100/t).toFixed(1):'0.0';
                const pc = i===0?' top-1':i===1?' top-2':i===2?' top-3':'';
                h += `<tr class="${i<8?rc:''} ${i===7?'cutoff':''}">
                    <td class="pos${pc}">${i+1}</td>
                    <td><a href="player.html?name=${encodeURIComponent(p.display||'')}" class="player-link">${p.emoji||'⚔️'} ${p.display||''}</a></td>
                    <td>${p.name||''}</td><td>${p.wins||0}</td><td>${p.losses||0}</td>
                    <td>${wr}%</td><td class="skill">${p.skill||0}</td></tr>`;
            });
            h += '</tbody></table>';
            c.innerHTML = h;
        }

        function findPlayer(name) { return name ? allPlayers.find(p => p.display === name) || null : null; }

        function clickPlayer(matchType, idx, playerName, isFinal) {
            if (!isAdmin) return;
            if (isFinal) {
                PLAYOFFS[matchType] = PLAYOFFS[matchType] === playerName ? '' : playerName;
            } else {
                const arr = PLAYOFFS[matchType];
                arr[idx] = arr[idx] === playerName ? '' : playerName;
            }
            // Автосохранение
            localStorage.setItem('eternis-playoffs', JSON.stringify(PLAYOFFS));
            renderPlayoffs();
        }

        function renderPlayoffs() {
            const light = lightPlayers.slice(0, 8), dark = darkPlayers.slice(0, 8);
            const c = document.getElementById('playoffs-content');
            if (light.length < 8 || dark.length < 8) {
                c.innerHTML = '<div class="status">Нужно по 8 игроков в каждой фракции.</div>'; return;
            }
            light.forEach((p,i) => p.seed = i+1);
            dark.forEach((p,i) => p.seed = i+1);

            const playerRow = (p, matchType, idx, isFinal, otherWinner) => {
                if (!p) return '<div class="p" style="opacity:0.2">—</div>';
                const won = isFinal ? PLAYOFFS[matchType] === p.display : (PLAYOFFS[matchType]||[])[idx] === p.display;
                const lost = otherWinner && !won;
                const cls = won ? ' winner' : (lost ? ' loser' : '');
                const mark = won ? ' ✅' : '';
                const clickable = isAdmin ? ' clickable' : '';
                const onclick = isAdmin ? `onclick="clickPlayer('${matchType}',${idx},'${p.display.replace(/'/g,"\\'")}',${isFinal})"` : '';
                return `<div class="p${cls}${clickable}" ${onclick}>
                    <span class="seed">#${p.seed}</span>${p.emoji||''} ${shortName(p.display)}${mark}</div>`;
            };

            const match = (a, b, matchType, idx) => {
                const wa = (PLAYOFFS[matchType]||[])[idx] === (a?.display||'');
                const wb = (PLAYOFFS[matchType]||[])[idx] === (b?.display||'');
                return `<div class="match">
                    ${playerRow(a, matchType, idx, false, wb)}
                    <div class="divider"></div>
                    ${playerRow(b, matchType, idx, false, wa)}
                </div>`;
            };

            const finalMatch = (a, b, matchType) => {
                const wa = PLAYOFFS[matchType] === (a?.display||'');
                const wb = PLAYOFFS[matchType] === (b?.display||'');
                return `<div class="match">
                    ${playerRow(a, matchType, 0, true, wb)}
                    <div class="divider"></div>
                    ${playerRow(b, matchType, 0, true, wa)}
                </div>`;
            };

            const lr1 = PLAYOFFS.light_round1.map(findPlayer);
            const lr2 = PLAYOFFS.light_round2.map(findPlayer);
            const lc = findPlayer(PLAYOFFS.light_champion);
            const dr1 = PLAYOFFS.dark_round1.map(findPlayer);
            const dr2 = PLAYOFFS.dark_round2.map(findPlayer);
            const dc = findPlayer(PLAYOFFS.dark_champion);
            const gc = findPlayer(PLAYOFFS.grand_champion);

            let gfHtml = '';
            if (gc) {
                const isLight = gc.faction === 'Орден Света';
                gfHtml = `<div class="champ ${isLight?'light':'dark'} winner">👑 ${gc.emoji||''} ${shortName(gc.display)} 👑</div>`;
            } else if (lc && dc) {
                const lw = PLAYOFFS.grand_champion === lc.display;
                const dw = PLAYOFFS.grand_champion === dc.display;
                const cl = isAdmin ? ' clickable' : '';
                const clL = isAdmin ? `onclick="clickPlayer('grand_champion',0,'${lc.display.replace(/'/g,"\\'")}',true)"` : '';
                const clD = isAdmin ? `onclick="clickPlayer('grand_champion',0,'${dc.display.replace(/'/g,"\\'")}',true)"` : '';
                gfHtml = `
                    <div class="champ light${lw?' winner':''}${cl}" ${clL}>
                        🌝 ${lc.emoji||''} ${shortName(lc.display)}${lw?' ✅':''}
                    </div>
                    <div class="vs">⚔️ VS ⚔️</div>
                    <div class="champ dark${dw?' winner':''}${cl}" ${clD}>
                        🌚 ${dc.emoji||''} ${shortName(dc.display)}${dw?' ✅':''}
                    </div>`;
            } else {
                gfHtml = `<div class="champ light">🌝 ${lc?lc.emoji+' '+shortName(lc.display):'Чемпион Света'}</div>
                          <div class="vs">⚔️ VS ⚔️</div>
                          <div class="champ dark">🌚 ${dc?dc.emoji+' '+shortName(dc.display):'Чемпион Тьмы'}</div>`;
            }

            c.innerHTML = `<div class="bracket-wrapper"><div class="bracket">
                <div class="round light"><div class="round-title">1/8 Света</div>
                    ${match(light[0],light[7],'light_round1',0)}${match(light[1],light[6],'light_round1',1)}
                    ${match(light[2],light[5],'light_round1',2)}${match(light[3],light[4],'light_round1',3)}</div>
                <div class="round light"><div class="round-title">1/4 Света</div>
                    ${match(lr1[0],lr1[1],'light_round2',0)}${match(lr1[2],lr1[3],'light_round2',1)}</div>
                <div class="round light"><div class="round-title">Финал</div>
                    ${finalMatch(lr2[0],lr2[1],'light_champion')}</div>
                <div class="round final"><div class="round-title final-title">🏆 ГРАНД-ФИНАЛ</div>
                    <div class="grand-final"><div class="label">ЧЕМПИОН ЛИГИ ЭТЕРНИСА</div>${gfHtml}</div></div>
                <div class="round dark"><div class="round-title">Финал</div>
                    ${finalMatch(dr2[0],dr2[1],'dark_champion')}</div>
                <div class="round dark"><div class="round-title">1/4 Тьмы</div>
                    ${match(dr1[0],dr1[1],'dark_round2',0)}${match(dr1[2],dr1[3],'dark_round2',1)}</div>
                <div class="round dark"><div class="round-title">1/8 Тьмы</div>
                    ${match(dark[0],dark[7],'dark_round1',0)}${match(dark[1],dark[6],'dark_round1',1)}
                    ${match(dark[2],dark[5],'dark_round1',2)}${match(dark[3],dark[4],'dark_round1',3)}</div>
            </div></div>`;
        }

        async function init() {
            try {
                const r = await fetch(DATA_URL);
                const d = await r.json();
                allPlayers = (d.players||[]).filter(p => p.name && p.name !== 'Unknown' && p.skill > 0);
                allPlayers.sort((a,b) => b.skill - a.skill);
                lightPlayers = allPlayers.filter(p => p.faction === 'Орден Света');
                darkPlayers = allPlayers.filter(p => p.faction === 'Культ Тьмы');
                renderStandings();
            } catch(e) {
                document.getElementById('standings-content').innerHTML = '<div class="status">❌ Ошибка загрузки</div>';
            }
        }
        init();
    </script>
</body>
</html>
