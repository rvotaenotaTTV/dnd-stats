<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Статистика</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,600;14..32,800;14..32,900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #06040a; --card: #0e0a14; --elevated: #140c1a;
            --text: #e8ddf0; --sub: #8a7d94; --muted: #5e5268;
            --border: rgba(180,100,140,0.15);
            --gold: #f0b90b; --red: #e85d3a; --purple: #a371f7; --green: #10b981;
            --radius: 16px; --radius-sm: 10px;
        }
        [data-theme="light"] {
            --bg: #f7f2eb; --card: #fefcf8; --elevated: #fbf8f3;
            --text: #2d1a1a; --sub: #6b4e4e; --muted: #8b6b6b;
            --border: rgba(180,80,60,0.12);
            --gold: #b8860b; --red: #a03020; --purple: #7b5ea7; --green: #27ae60;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; scroll-padding-top: 100px; }
        body { font-family: 'Inter',system-ui,sans-serif; background: var(--bg); background-image: radial-gradient(ellipse at 50% 0%, rgba(200,40,40,0.06) 0%, transparent 60%), radial-gradient(ellipse at 20% 80%, rgba(163,113,247,0.04) 0%, transparent 50%); color: var(--text); min-height: 100vh; line-height: 1.5; }
        .container { max-width: 1200px; margin: 0 auto; padding: 24px 20px 60px; }

        .header { text-align: center; padding: 32px 0 8px; position: relative; }
        .header-title { font-size: clamp(2.2rem,6vw,3.2rem); font-weight: 900; letter-spacing: -0.03em; background: linear-gradient(135deg,#8b0000 0%,#e85d3a 40%,#ffd700 70%,#e85d3a 100%); background-size: 200% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; filter: drop-shadow(0 0 30px rgba(232,93,58,0.5)); animation: shimmer 3s linear infinite; margin-bottom: 4px; }
        @keyframes shimmer { 0%{background-position:0% center} 100%{background-position:200% center} }
        .header-subtitle { font-size: 0.9rem; color: var(--red); font-weight: 500; letter-spacing: 0.04em; }
        .theme-toggle { position: absolute; right: 0; top: 50%; transform: translateY(-50%); background: var(--elevated); border: 1px solid var(--border); color: var(--sub); padding: 8px 12px; border-radius: 20px; cursor: pointer; font-size: 0.85rem; font-family: inherit; transition: 0.2s; }
        .theme-toggle:hover { background: var(--card); color: var(--red); border-color: var(--red); }

        .nav-wrapper { margin-bottom: 28px; position: sticky; top: 12px; z-index: 100; }
        .nav-toggle { display: none; width: 100%; padding: 13px 18px; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); color: var(--gold); font-size: 0.95rem; font-weight: 700; cursor: pointer; text-align: left; }
        .nav-bar { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; padding: 6px; background: var(--card); border-radius: var(--radius); border: 1px solid var(--border); }
        .nav-link { padding: 8px 14px; border-radius: 20px; color: var(--sub); text-decoration: none; font-size: 0.78rem; font-weight: 500; transition: 0.2s; }
        .nav-link:hover { color: var(--text); background: var(--elevated); }
        .nav-link.active { background: linear-gradient(135deg,var(--red),var(--gold)); color: #000; font-weight: 700; }

        .section { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px 22px; margin-bottom: 20px; position: relative; overflow: hidden; }
        .section::after { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; opacity: 0.6; }
        .section.gold::after { background: linear-gradient(90deg,transparent,var(--gold),transparent); }
        .section-title { font-size: 1.15rem; font-weight: 800; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
        .section.gold .section-title { color: var(--gold); }

        .stats-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; margin-bottom: 24px; }
        .stat-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 20px 14px; text-align: center; transition: 0.2s; position: relative; overflow: hidden; animation: fadeSlideIn 0.4s ease; }
        .stat-card::after { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, transparent, var(--gold), transparent); opacity: 0.4; }
        .stat-card:hover { transform: translateY(-2px); border-color: rgba(240,185,11,0.3); }
        .stat-value { font-size: 2rem; font-weight: 800; color: var(--gold); }
        .stat-label { color: var(--muted); font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1px; margin-top: 6px; }
        .faction-light { color: var(--gold); }
        .faction-dark { color: var(--purple); }

        .nav-tabs { display: flex; gap: 6px; margin: 20px 0; padding: 6px; background: var(--card); border-radius: var(--radius); border: 1px solid var(--border); flex-wrap: wrap; }
        .tab-btn { background: transparent; border: none; color: var(--sub); padding: 10px 16px; border-radius: var(--radius-sm); cursor: pointer; font-size: 0.82rem; font-weight: 600; font-family: inherit; transition: 0.2s; white-space: nowrap; }
        .tab-btn:hover { background: var(--elevated); color: var(--text); }
        .tab-btn.active { background: linear-gradient(135deg,var(--red),var(--gold)); color: #000; font-weight: 700; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .tables-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); gap: 16px; }
        .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 18px; position: relative; overflow: hidden; margin-bottom: 16px; animation: fadeSlideIn 0.4s ease; }
        .card::after { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, transparent, var(--gold), transparent); opacity: 0.5; }
        .card-title { font-size: 0.95rem; font-weight: 700; color: var(--gold); margin-bottom: 12px; }

        .table-container { border-radius: var(--radius-sm); border: 1px solid var(--border); overflow-x: auto; -webkit-overflow-scrolling: touch; }
        table { width: 100%; border-collapse: collapse; font-size: 0.8rem; min-width: auto; }
        th { background: var(--elevated); color: var(--gold); font-weight: 700; padding: 8px 10px; text-align: left; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.04em; white-space: nowrap; }
        td { padding: 7px 10px; border-bottom: 1px solid var(--border); color: var(--text); }
        tbody tr { animation: fadeInRow 0.3s ease forwards; opacity: 0; }
        tbody tr:nth-child(1) { animation-delay: 0.02s; } tbody tr:nth-child(2) { animation-delay: 0.04s; } tbody tr:nth-child(3) { animation-delay: 0.06s; }
        tbody tr:nth-child(4) { animation-delay: 0.08s; } tbody tr:nth-child(5) { animation-delay: 0.10s; } tbody tr:nth-child(6) { animation-delay: 0.12s; }
        tbody tr:nth-child(7) { animation-delay: 0.14s; } tbody tr:nth-child(8) { animation-delay: 0.16s; } tbody tr:nth-child(9) { animation-delay: 0.18s; }
        tbody tr:nth-child(10) { animation-delay: 0.20s; }
        tr:hover td { background: rgba(255,255,255,0.02); }
        .number { text-align: right; font-variant-numeric: tabular-nums; }
        td:first-child { font-weight: 600; color: var(--gold); }
        .sortable-header { cursor: pointer; user-select: none; position: relative; padding-right: 20px !important; }
        .sortable-header:hover { background: var(--elevated) !important; }
        .sortable-header::after { content: '⇅'; position: absolute; right: 5px; opacity: 0.4; font-size: 10px; }
        .sortable-header.asc::after { content: '↑'; opacity: 1; color: var(--gold); }
        .sortable-header.desc::after { content: '↓'; opacity: 1; color: var(--gold); }
        .search-box { margin-bottom: 12px; display: flex; gap: 8px; align-items: center; }
        .search-input { padding: 8px 14px; background: var(--elevated); border: 1px solid var(--border); border-radius: 20px; color: var(--text); font-size: 0.82rem; font-family: inherit; width: 220px; }
        .search-input:focus { outline: none; border-color: var(--gold); }
        .search-input::placeholder { color: var(--muted); }
        .search-clear { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 1rem; padding: 4px 8px; }
        .search-clear:hover { color: var(--gold); }
        .player-link { color: inherit; text-decoration: none; transition: color 0.2s; }
        .player-link:hover { color: var(--gold) !important; }

        .titles-gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; margin-bottom: 24px; }
        .title-card { background: var(--elevated); border-radius: var(--radius-sm); padding: 14px; border: 1px solid var(--border); transition: 0.2s; animation: fadeSlideIn 0.3s ease; }
        .title-card:hover { transform: translateY(-2px); border-color: var(--gold); }
        .title-emoji { font-size: 1.3rem; }
        .title-name { color: var(--gold); font-weight: 700; margin: 4px 0; font-size: 0.85rem; }
        .title-cond { color: var(--muted); font-size: 0.68rem; margin-bottom: 8px; }
        .title-progress { background: var(--bg); height: 5px; border-radius: 3px; margin: 6px 0; }
        .title-progress-fill { background: var(--gold); height: 5px; border-radius: 3px; }
        .title-holders { color: var(--muted); font-size: 0.7rem; }
        .hunters-top { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 24px; }
        .hunter-card { background: var(--elevated); border: 1px solid rgba(240,185,11,0.2); border-radius: var(--radius-sm); padding: 18px 12px; text-align: center; animation: fadeSlideIn 0.4s ease; }
        .hunter-medal { font-size: 1.8rem; }
        .hunter-name { font-size: 1rem; color: var(--gold); font-weight: 700; }
        .hunter-count { color: var(--muted); font-size: 0.78rem; margin: 4px 0; }
        .records-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; margin: 16px 0; }
        .record-item { background: var(--elevated); border-radius: var(--radius-sm); padding: 14px; border-left: 3px solid var(--gold); animation: fadeSlideIn 0.3s ease; }
        .record-value { font-size: 1.3rem; color: var(--gold); font-weight: 800; }
        .record-label { color: var(--muted); font-size: 0.7rem; margin-top: 2px; }
        .champion-block { background: var(--elevated); border: 1px solid rgba(240,185,11,0.2); border-radius: var(--radius-sm); padding: 22px; text-align: center; margin-bottom: 16px; animation: cardGlow 3s ease-in-out infinite; }
        @keyframes cardGlow { 0%,100%{box-shadow:0 0 0 rgba(240,185,11,0)} 50%{box-shadow:0 0 20px rgba(240,185,11,0.15)} }
        .champion-emoji { font-size: 2.5rem; }
        .champion-name { font-size: 1.3rem; color: var(--gold); font-weight: 800; }
        .champion-class { font-size: 0.85rem; color: var(--muted); }

        .beer-btn { position: fixed; bottom: 20px; right: 20px; width: 48px; height: 48px; background: var(--gold); color: #000; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.3rem; text-decoration: none; box-shadow: 0 4px 16px rgba(240,185,11,0.3); z-index: 99; transition: transform 0.2s; animation: float 3s ease-in-out infinite; }
        .beer-btn:hover { transform: scale(1.1); }

        .spinner { display: inline-block; width: 32px; height: 32px; border: 3px solid var(--border); border-top: 3px solid var(--gold); border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 12px; }
        @keyframes spin { to{transform:rotate(360deg)} }
        @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
        @keyframes fadeSlideIn { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
        @keyframes fadeInRow { from{opacity:0;transform:translateX(-8px)} to{opacity:1;transform:translateX(0)} }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: var(--gold); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #ffd700; }
        * { scrollbar-width: thin; scrollbar-color: var(--gold) transparent; }

		@media (max-width: 768px) {
			.container { padding: 12px 14px 80px; }
			.header { padding: 20px 0 8px; }
			.header-title { font-size: 1.8rem; }
			.theme-toggle { position: static; transform: none; margin: 12px auto 0; display: block; width: fit-content; }
			.nav-toggle { display: block; }
			.nav-bar { display: none; flex-direction: column; margin-top: 8px; }
			.nav-bar.show { display: flex; }
			.nav-link { padding: 12px 16px; border-radius: var(--radius-sm); justify-content: center; }
			.stats-grid { grid-template-columns: repeat(2, 1fr); gap: 8px; }
			.stat-card { padding: 14px 10px; }
			.stat-value { font-size: 1.5rem; }
			.tables-grid { grid-template-columns: 1fr; }
			.nav-tabs { display: grid; grid-template-columns: repeat(2, 1fr); gap: 4px; padding: 6px; }
			.tab-btn { text-align: center; padding: 8px 6px; font-size: 0.75rem; }
			#tab-tops .table-container { overflow-x: visible !important; }
			#tab-tops table { min-width: auto !important; font-size: 0.68rem; }
			#tab-tops td { white-space: normal !important; word-break: break-word; padding: 5px 6px; }
			#tab-tops td:first-child { min-width: auto; width: 28px; }
			#tab-tops th:first-child { min-width: auto; width: 28px; }
			#tab-tops .number { white-space: nowrap; }
			#classes-table, #races-table, #combos-table, #champions-table, #shards-table, #rating-table, #players-table { min-width: 480px; font-size: 0.7rem; }
			th, td { padding: 6px 8px; }
			th { white-space: nowrap; }
			td { white-space: nowrap; }
			#classes-table td:first-child, #races-table td:first-child, #combos-table td:first-child { white-space: normal; word-break: break-word; min-width: 120px; }
			#classes-table th:first-child, #races-table th:first-child, #combos-table th:first-child { min-width: 120px; }
			#champions-table td:first-child, #shards-table td:first-child, #rating-table td:first-child, #players-table td:first-child { min-width: 36px; font-size: 0.65rem; text-align: center; }
			#champions-table th:first-child, #shards-table th:first-child, #rating-table th:first-child, #players-table th:first-child { min-width: 36px; }
			#combos-table td:first-child { white-space: nowrap; min-width: 130px; }
			.titles-gallery { grid-template-columns: repeat(2, 1fr) !important; }
			.hunters-top { grid-template-columns: repeat(3, 1fr); gap: 6px; }
			.hunter-card { padding: 12px 6px; }
			.hunter-name { font-size: 0.8rem; }
			.champion-block > div:last-child { display: flex !important; justify-content: space-around; gap: 8px; margin-top: 12px; flex-wrap: nowrap; }
			.champion-block > div:last-child > div { flex: 1; text-align: center; display: flex; flex-direction: column; justify-content: space-between; min-height: 52px; }
			.champion-block > div:last-child span[style*="font-size: 1.5rem"] { font-size: 1.2rem !important; white-space: nowrap; }
			.champion-block > div:last-child span[style*="color: var(--text-muted)"] { font-size: 0.6rem !important; line-height: 1.3; }
			.search-input { width: 100%; }
			.beer-btn { bottom: 16px; right: 16px; width: 42px; height: 42px; font-size: 1.1rem; }
		}
    </style>
</head>
<body>
    <div class="container">
        <header class="header"><h1 class="header-title">СТАТИСТИКА</h1><p class="header-subtitle">3 Сезон - Кровь Бездны</p><button class="theme-toggle" onclick="toggleTheme()">🌓</button></header>
        <div class="nav-wrapper">
            <button class="nav-toggle" onclick="toggleNav()">☰ Меню</button>
            <nav class="nav-bar" id="pageNav">
                <a href="index.html" class="nav-link active">📊 Статистика</a>
                <a href="logs.html" class="nav-link">📜 Логи</a>
                <a href="calc.html" class="nav-link">🎲 Калькулятор</a>
                <a href="balance.html" class="nav-link">⚖️ Баланс</a>
                <a href="simulator.html" class="nav-link">🧪 Симулятор</a>
                <a href="gradient.html" class="nav-link">📈 Градиент</a>
                <a href="guide.html" class="nav-link">⚔️ Гайд</a>
                <a href="hall.html" class="nav-link">🏆 Зал Славы</a>
                <a href="lore.html" class="nav-link">📜 Лор</a>
                <a href="tavern.html" class="nav-link">🍺 Таверна</a>
                <a href="dungeon.html" class="nav-link">🏔 Подземелье</a>
                <a href="league.html" class="nav-link">🏟 Лига</a>
                <a href="form.html" class="nav-link">🔥 Форма</a>
                <a href="player.html" class="nav-link">👤 Профиль</a>
            </nav>
        </div>
        <div id="content"><div style="text-align:center;padding:48px 20px;color:var(--sub);"><div class="spinner"></div><p>Загрузка статистики...</p></div></div>
    </div>
    <a href="https://www.donationalerts.com/r/rvotaenota" target="_blank" class="beer-btn" title="Угостить пивом 🍺">🍺</a>
    <script>
        function toggleTheme(){const html=document.documentElement;const current=html.getAttribute('data-theme');const next=current==='dark'?'light':'dark';html.setAttribute('data-theme',next);localStorage.setItem('eternis-theme',next);}
        (function(){const saved=localStorage.getItem('eternis-theme');if(saved)document.documentElement.setAttribute('data-theme',saved);})();
        function toggleNav(){const nav=document.getElementById('pageNav'),btn=document.querySelector('.nav-toggle');nav.classList.toggle('show');btn.textContent=nav.classList.contains('show')?'✕ Закрыть':'☰ Меню';}
        document.querySelectorAll('.nav-link').forEach(l=>l.addEventListener('click',()=>{document.getElementById('pageNav').classList.remove('show');document.querySelector('.nav-toggle').textContent='☰ Меню';}));

        const JSON_URL_RAW='https://raw.githubusercontent.com/rvotaenotaTTV/dnd-stats/main/stats_data.json';
        const DATA_URL_RAW='https://raw.githubusercontent.com/rvotaenotaTTV/dnd-stats/main/data.json';
        const JSON_URL_CDN='https://cdn.jsdelivr.net/gh/rvotaenotaTTV/dnd-stats@main/stats_data.json';
        const DATA_URL_CDN='https://cdn.jsdelivr.net/gh/rvotaenotaTTV/dnd-stats@main/data.json';
        function fetchWithTimeout(url,timeout=3000){return Promise.race([fetch(url).then(r=>{if(!r.ok)throw new Error('Status '+r.status);return r}),new Promise((_,reject)=>setTimeout(()=>reject(new Error('timeout')),timeout))]);}

        let classesData=[],racesData=[],classEmojis={},raceEmojis={},players=[],achievements=[];
        fetchWithTimeout(DATA_URL_RAW).catch(()=>fetch(DATA_URL_CDN)).then(r=>r.json()).then(data=>{classesData=data.classes;racesData=data.races;classEmojis=Object.fromEntries(classesData.map(c=>[c.Name,c.Emoji]));raceEmojis=Object.fromEntries(racesData.map(r=>[r.Name,r.Emoji]));return fetchWithTimeout(JSON_URL_RAW).catch(()=>fetch(JSON_URL_CDN));}).then(r=>r.json()).then(data=>{players=data.players.filter(p=>p.name&&p.name!=='Unknown');if(data.dungeon?.players){window._dungeonPlayers={};Object.values(data.dungeon.players).forEach(dp=>{window._dungeonPlayers[dp.display]=dp;});}renderFullStats(data);}).catch(err=>{document.getElementById('content').innerHTML=`<div style="text-align:center;padding:48px 20px;color:var(--red);">❌ Ошибка загрузки данных<br>${err.message}</div>`;});

        function renderFullStats(data){
            const totalPlayers=players.length;
            const totalFights=Math.floor(players.reduce((sum,p)=>sum+p.wins+p.losses,0)/2);
            const lightCount=players.filter(p=>p.faction==='Орден Света').length;
            const darkCount=players.filter(p=>p.faction==='Культ Тьмы').length;
            const fs=data.factionScore||{};
            const factionLight=fs.battleLight||0;
            const factionDark=fs.battleDark||0;
            const duelLight=fs.duelLight||0;
            const duelDark=fs.duelDark||0;
            const lightRemaining = 50 - (duelLight % 50);
            const darkRemaining = 50 - (duelDark % 50);
            let html='';
            html+='<div class="stats-grid">';
            html+=`<div class="stat-card"><div class="stat-value">${totalPlayers}</div><div class="stat-label">👥 Всего игроков</div></div>`;
            html+=`<div class="stat-card"><div class="stat-value">${totalFights}</div><div class="stat-label">⚔️ Всего боёв</div></div>`;
            html+=`<div class="stat-card"><div class="stat-value">${lightCount} <span class="faction-light">🌝</span></div><div class="stat-label">Орден Света</div></div>`;
            html+=`<div class="stat-card"><div class="stat-value">${darkCount} <span class="faction-dark">🌚</span></div><div class="stat-label">Культ Тьмы</div></div>`;
            html+=`<div class="stat-card"><div class="stat-value">${factionLight} : ${factionDark}</div><div class="stat-label">🌝 Свет vs Тьма 🌚</div></div>`;
            html+=`<div class="stat-card"><div class="stat-value"><span style="color:var(--gold);">${lightRemaining}</span> <span style="color:var(--muted);">·</span> <span style="color:var(--purple);">${darkRemaining}</span></div><div class="stat-label">побед до захвата</div></div>`;
            html+='</div>';

            html+='<div class="nav-tabs">';
            html+='<button class="tab-btn active" onclick="switchTab(\'tops\')">🏆 Топы</button>';
            html+='<button class="tab-btn" onclick="switchTab(\'classes\')">⚔️ Классы</button>';
            html+='<button class="tab-btn" onclick="switchTab(\'races\')">🌍 Расы</button>';
            html+='<button class="tab-btn" onclick="switchTab(\'combos\')">🔄 Комбинации</button>';
            html+='<button class="tab-btn" onclick="switchTab(\'records\')">🏅 Рекорды</button>';
            html+='<button class="tab-btn" onclick="switchTab(\'champions\')">👑 Чемпионы</button>';

            achievements=[{emoji:"🌟",name:"Легенда Этерниса",type:"level",value:150},{emoji:"👑",name:"Король арены",type:"tournament",value:10},{emoji:"👑",name:"Властелин Раскола",type:"tournament",value:5},{emoji:"💫",name:"Властелин осколков",type:"level",value:100},{emoji:"👑",name:"Бессмертный",type:"level",value:50},{emoji:"☠️",name:"Бог войны",type:"best",value:20},{emoji:"✨",name:"Мифический",type:"level",value:40},{emoji:"🤖",name:"Читер",type:"winrate",value:90,minFights:50},{emoji:"🤪",name:"Безумный",type:"fights",value:1000},{emoji:"⚡",name:"Живая легенда",type:"level",value:30},{emoji:"💎",name:"Элита",type:"winrate",value:80,minFights:30},{emoji:"🗡️",name:"Мастер клинка",type:"level",value:20},{emoji:"🏆",name:"Триумфатор",type:"wins",value:200},{emoji:"👑",name:"Легенда",type:"wins",value:100},{emoji:"⚔️",name:"Ветеран",type:"fights",value:500},{emoji:"🛡️",name:"Хранитель",type:"level",value:15},{emoji:"⚡",name:"Непобедимый",type:"best",value:10},{emoji:"🏹",name:"Мастер",type:"winrate",value:70,minFights:30},{emoji:"📿",name:"Собиратель",type:"level",value:10},{emoji:"🐉",name:"Король Подземелья",type:"dungeon_record",value:15},{emoji:"🏔",name:"Покоритель глубин",type:"dungeon_record",value:10},{emoji:"👑",name:"Трофейный магнат",type:"dungeon_trophies",value:30},{emoji:"💀",name:"Охотник на боссов",type:"dungeon_bosses",value:10},{emoji:"🌊",name:"Волнорез",type:"dungeon_waves",value:100},{emoji:"🔱",name:"Избранный светом",type:"faction",value:150,faction:"Орден Света"},{emoji:"🌋",name:"Владыка тьмы",type:"faction",value:150,faction:"Культ Тьмы"},{emoji:"⚜️",name:"Аэлион",type:"faction",value:100,faction:"Орден Света"},{emoji:"🌑",name:"Повествователь",type:"faction",value:100,faction:"Культ Тьмы"},{emoji:"🏆",name:"Хранитель Вечности",type:"tournament",value:1},{emoji:"👑",name:"Чемпион",type:"champion"},{emoji:"🛡️",name:"Рыцарь Света",type:"faction",value:50,faction:"Орден Света"},{emoji:"🗡️",name:"Теневой клинок",type:"faction",value:50,faction:"Культ Тьмы"},{emoji:"✨",name:"Страж порядка",type:"faction",value:25,faction:"Орден Света"},{emoji:"🌙",name:"Глас тьмы",type:"faction",value:25,faction:"Культ Тьмы"},{emoji:"🛡️",name:"Воитель",type:"wins",value:50},{emoji:"🛡️",name:"Гладиатор",type:"losses",value:200},{emoji:"🔥",name:"Неудержимый",type:"best",value:5},{emoji:"🎯",name:"Профессионал",type:"winrate",value:60,minFights:30},{emoji:"⚔️",name:"Опытный",type:"wins",value:10},{emoji:"⚙️",name:"Трудяга",type:"fights",value:100},{emoji:"🔥",name:"Задира",type:"best",value:3},{emoji:"🌱",name:"Новичок",type:"wins",value:1},{emoji:"👀",name:"Любопытный",type:"fights",value:50},{emoji:"⚖️",name:"Ровный",type:"winrate",value:50,minFights:10},{emoji:"🥊",name:"Боец",type:"losses",value:10},{emoji:"☯️",name:"Инь-Янь",type:"balance",minFights:20},{emoji:"⚙️",name:"Железный",type:"losses",value:100},{emoji:"🪀",name:"Груша для битья",type:"losses",value:50}];
            function checkAchievement(ach,p){const total=p.wins+p.losses;if(ach.minFights&&total<ach.minFights)return false;switch(ach.type){case"level":return p.level>=ach.value;case"wins":return p.wins>=ach.value;case"losses":return p.losses>=ach.value;case"best":return p.best>=ach.value;case"fights":return total>=ach.value;case"tournament":return p.tournamentWins>=ach.value;case"faction":return p.faction===ach.faction&&p.factionWins>=ach.value;case"winrate":return total>0&&(p.wins*100/total)>=ach.value;case"balance":return p.wins===p.losses&&total>=(ach.minFights||20);case"champion":return p.champion===true;case"dungeon_record":return(p.dungeonRecord||0)>=ach.value;case"dungeon_trophies":return(p.dungeonTrophies||0)>=ach.value;case"dungeon_bosses":return(p.dungeonBosses||0)>=ach.value;case"dungeon_waves":return(p.dungeonTotalWaves||0)>=ach.value;default:return false;}}
            const playerTitles={};const titleCounts={};players.forEach(p=>{if(!p.dungeonRecord&&window._dungeonPlayers){const dp=window._dungeonPlayers[p.display];if(dp){p.dungeonRecord=dp.record;p.dungeonTrophies=dp.trophies;p.dungeonBosses=dp.bosses;p.dungeonTotalWaves=dp.totalWaves;}}const titles=achievements.filter(a=>checkAchievement(a,p)).map(a=>a.emoji+" "+a.name);if(titles.length>0){playerTitles[p.display]=titles;titles.forEach(t=>titleCounts[t]=(titleCounts[t]||0)+1);}});
            const topHunters=Object.entries(playerTitles).sort((a,b)=>b[1].length-a[1].length).slice(0,3);
            html+='<div class="hunters-top">';['🥇','🥈','🥉'].forEach((medal,idx)=>{if(!topHunters[idx])return;const[name,titles]=topHunters[idx];html+=`<div class="hunter-card"><div class="hunter-medal">${medal}</div><div class="hunter-name">${name}</div><div class="hunter-count">${titles.length} титулов</div></div>`;});html+='</div>';
            html+='<div class="card-title">🏅 Все титулы</div><div class="titles-gallery">';
            [...achievements].sort((a,b)=>(titleCounts[a.emoji+" "+a.name]||0)-(titleCounts[b.emoji+" "+b.name]||0)).forEach(ach=>{const fullName=ach.emoji+" "+ach.name;const holders=titleCounts[fullName]||0;const percent=(holders/players.length)*100;const condText=ach.type==='level'?ach.value+' уровень':ach.type==='wins'?ach.value+' побед':ach.type==='losses'?ach.value+' поражений':ach.type==='best'?'Стрик '+ach.value:ach.type==='fights'?ach.value+' боёв':ach.type==='tournament'?ach.value+' турнирных побед':ach.type==='faction'?ach.value+' побед за '+ach.faction:ach.type==='winrate'?'Винрейт '+ach.value+'%':ach.type==='balance'?'Побед = Поражений':ach.type==='dungeon_record'?ach.value+' волн в данже':ach.type==='dungeon_trophies'?ach.value+' трофеев':ach.type==='dungeon_bosses'?ach.value+' боссов':ach.type==='dungeon_waves'?ach.value+' волн всего':'Текущий чемпион';html+=`<div class="title-card"><div class="title-emoji">${ach.emoji}</div><div class="title-name">${ach.name}</div><div class="title-cond">${condText}</div><div class="title-progress"><div class="title-progress-fill" style="width:${percent}%;"></div></div><div class="title-holders">👤 ${holders} игроков</div></div>`;});html+='</div>';
            html+='<div class="card"><div class="card-title">🔍 Прогресс игрока</div><input type="text" id="title-player-search" class="search-input" placeholder="Введите ник..." style="width:100%;margin-bottom:12px;" oninput="showPlayerProgress(this.value)"><div id="player-progress-result" style="display:grid;gap:10px;"><span style="color:var(--muted);">Введите ник, чтобы увидеть прогресс</span></div></div></div>';

            // РЕЙТИНГ
            html+='<div id="tab-rating" class="tab-content">';
            const seasonTop=(data.players||[]).filter(p=>p.skill>0).sort((a,b)=>b.skill-a.skill).slice(0,10);
            html+='<div class="card"><div class="card-title">🏆 Сезонный рейтинг (SKILL)</div>';
            if(seasonTop.length>0){
                html+='<div class="table-container"><table id="rating-table"><thead><tr>';
                html+='<th class="sortable-header" data-sort="rank">#</th>';
                html+='<th class="sortable-header" data-sort="name">Игрок</th>';
                html+='<th class="sortable-header" data-sort="class">Класс</th>';
                html+='<th class="sortable-header" data-sort="skill">Skill</th>';
                html+='<th class="sortable-header" data-sort="level">Ур.</th>';
                html+='<th class="sortable-header" data-sort="tournaments">🏆</th>';
                html+='<th class="sortable-header" data-sort="wl">W/L</th>';
                html+='<th class="sortable-header" data-sort="winrate">Винрейт</th>';
                html+='</tr></thead><tbody id="rating-tbody">';

                seasonTop.forEach((p,i)=>{
                    const player=players.find(pl=>pl.display===p.display)||{};
                    const total=p.wins+p.losses;
                    const wr=total>0?(p.wins*100/total).toFixed(1):'0.0';
                    const rank=i+1;
                    const medal=rank===1?'🥇':(rank===2?'🥈':(rank===3?'🥉':rank));

                    html+=`<tr data-rank="${rank}" data-name="${p.display}" data-class="${player.name||''}" data-skill="${p.skill}" data-level="${p.level||0}" data-tournaments="${p.tournamentWins||0}" data-wl="${total}" data-winrate="${wr}">`;
                    html+=`<td style="color:${rank<=3?'var(--gold)':'var(--muted)'};font-weight:${rank<=3?'700':'400'};">${medal}</td>`;

                    html+=`<td class="number">${p.level||0}</td>`;
                    html+=`<td class="number" style="color:var(--gold);">${p.tournamentWins||0}</td>`;
                    html+=`<td class="number">${p.wins}-${p.losses}</td>`;

                });
                html+='</tbody></table></div>';
                html+='<div style="margin-top:12px;padding:12px;background:var(--elevated);border-radius:var(--radius-sm);border:1px solid var(--border);font-size:0.75rem;color:var(--muted);line-height:1.6;"><span style="color:var(--gold);">📐 Как считается рейтинг:</span><br><code style="color:var(--sub);">Skill ≈ (Победы × Винрейт × 10 + Стрик × 5 + Уровень × 2 + 🏆 × 25) ÷ √(Боёв / 100 + 1)</code></div>';
            }else{
                html+='<div style="text-align:center;padding:40px;color:var(--muted);">Нет данных рейтинга</div>';
            }
            html+='</div></div>';

            // ОСКОЛКИ
            html+='<div id="tab-shards" class="tab-content"><div class="card"><div class="card-title">💎 Топ коллекционеров осколков</div><div class="table-container"><table id="shards-table"><thead><tr><th class="sortable-header" data-sort="rank">#</th><th class="sortable-header" data-sort="name">Игрок</th><th class="sortable-header" data-sort="class">Класс</th><th class="sortable-header" data-sort="shards">Осколки</th><th class="sortable-header" data-sort="level">Уровень</th><th class="sortable-header" data-sort="faction">Фракция</th></tr></thead><tbody id="shards-tbody">';[...players].sort((a,b)=>b.shards-a.shards).forEach((p,i)=>{const fi=p.faction==='Орден Света'?'🌝':(p.faction==='Культ Тьмы'?'🌚':'');html+=`<tr data-rank="${i+1}" data-name="${p.display}" data-class="${p.name}" data-shards="${p.shards}" data-level="${p.level}" data-faction="${fi}"><td>${i+1}</td><td>${p.emoji} ${p.display}</td><td>${p.name}</td><td class="number">${p.shards}</td><td class="number">${p.level}</td><td>${fi}</td></tr>`;});html+='</tbody></table></div></div></div>';

            // ВСЕ ИГРОКИ
            html+='<div id="tab-allplayers" class="tab-content"><div class="card"><div class="card-title">👥 Все игроки ('+totalPlayers+')</div><div class="search-box"><input type="text" id="player-search" class="search-input" placeholder="🔍 Поиск по имени или классу..."><button id="clear-search" class="search-clear">✕</button><span id="search-result" style="color:var(--muted);margin-left:auto;"></span></div><div class="table-container"><table id="players-table"><thead><tr><th class="sortable-header" data-sort="index">#</th><th class="sortable-header" data-sort="name">Name</th><th class="sortable-header" data-sort="class">Class</th><th class="sortable-header" data-sort="wl">W/L</th><th class="sortable-header" data-sort="winrate">Winrate</th><th class="sortable-header" data-sort="streak">Streak</th><th class="sortable-header" data-sort="worst">Worst</th><th class="sortable-header" data-sort="level">Level</th><th class="sortable-header" data-sort="faction">Faction</th></tr></thead><tbody id="players-tbody">';[...players].sort((a,b)=>(b.wins+b.losses)-(a.wins+a.losses)).forEach((p,i)=>{const total=p.wins+p.losses;const wr=total>0?(p.wins*100/total).toFixed(1):'0.0';const fi=p.faction==='Орден Света'?'🌝':(p.faction==='Культ Тьмы'?'🌚':'');html+=`<tr data-index="${i+1}" data-name="${p.display}" data-class="${p.name}" data-wl="${total}" data-winrate="${wr}" data-streak="${p.best}" data-worst="${p.worst||0}" data-level="${p.level}" data-faction="${fi}"><td>${i+1}</td><td><a href="player.html?name=${encodeURIComponent(p.display)}" class="player-link">${p.display}</a></td><td>${p.name}</td><td class="number">${p.wins}-${p.losses}</td><td class="number">${wr}%</td><td class="number">${p.best}</td><td class="number" style="color:var(--red);">${p.worst||0}</td><td class="number">${p.level}</td><td>${fi}</td></tr>`;});html+='</tbody></table></div></div></div>';

            document.getElementById('content').innerHTML=html;
            initSortableTable('classes-table','total','desc');initSortableTable('races-table','total','desc');initSortableTable('combos-table','winrate','desc');initSortableTable('rating-table','skill','desc');initSortableTable('shards-table','shards','desc');initSortableTable('champions-table','wins','desc');initPlayersTable();
            setTimeout(()=>{const hash=window.location.hash.substring(1);const validTabs=['tops','classes','races','combos','rating','shards','records','champions','titles','allplayers'];if(hash&&validTabs.includes(hash))switchTab(hash);},100);
            window.showPlayerProgress=function(nickname){const container=document.getElementById('player-progress-result');if(!nickname){container.innerHTML='<span style="color:var(--muted);">Введите ник, чтобы увидеть прогресс</span>';return;}const player=players.find(p=>p.display.toLowerCase()===nickname.toLowerCase());if(!player){container.innerHTML='<span style="color:var(--red);">Игрок не найден</span>';return;}const total=player.wins+player.losses;const winrate=total>0?(player.wins*100/total):0;const faction=player.faction||'';const nextLevel=achievements.filter(a=>a.type==='level'&&a.value>player.level).sort((a,b)=>a.value-b.value)[0];const nextTournament=achievements.filter(a=>a.type==='tournament'&&a.value>player.tournamentWins).sort((a,b)=>a.value-b.value)[0];const nextWins=achievements.filter(a=>a.type==='wins'&&a.value>player.wins).sort((a,b)=>a.value-b.value)[0];const nextBest=achievements.filter(a=>a.type==='best'&&a.value>player.best).sort((a,b)=>a.value-b.value)[0];const nextFaction=achievements.filter(a=>a.type==='faction'&&a.faction===faction&&a.value>player.factionWins).sort((a,b)=>a.value-b.value)[0];const nextWinrate=achievements.filter(a=>a.type==='winrate'&&a.value>winrate&&(!a.minFights||total>=a.minFights)).sort((a,b)=>a.value-b.value)[0];let html='';function bar(label,current,max,nextTitle){const pct=Math.min(100,(current/max)*100);const done=current>=max;return`<div style="margin-bottom:16px;"><div style="display:flex;justify-content:space-between;margin-bottom:4px;"><span>${label}</span><span style="color:var(--muted);font-size:0.7rem;">${current}/${max}</span></div><div style="background:var(--bg);height:6px;border-radius:3px;"><div style="width:${pct}%;background:${done?'var(--gold)':'var(--purple)'};height:6px;border-radius:3px;"></div></div><div style="margin-top:4px;color:var(--gold);font-size:0.7rem;">${nextTitle?'⏩️ '+nextTitle.emoji+' '+nextTitle.name:'✅ Максимум!'}</div></div>`;}if(nextLevel)html+=bar('📈 Уровень',player.level,nextLevel.value,nextLevel);if(nextTournament)html+=bar('🏆 Турнирные победы',player.tournamentWins,nextTournament.value,nextTournament);if(nextWins)html+=bar('⚔️ Всего побед',player.wins,nextWins.value,nextWins);if(nextBest)html+=bar('🔥 Лучший стрик',player.best,nextBest.value,nextBest);if(nextFaction&&faction){const fi=faction==='Орден Света'?'🌝':'🌚';html+=bar(`${fi} ${faction}`,player.factionWins,nextFaction.value,nextFaction);}if(nextWinrate)html+=bar('📊 Винрейт',winrate.toFixed(1),nextWinrate.value,nextWinrate);if(html==='')html='<span style="color:var(--gold);">🏆 Все титулы получены! Ты легенда!</span>';container.innerHTML=html;};}

        function initSortableTable(tableId,defaultSort,defaultDir){setTimeout(()=>{const table=document.getElementById(tableId);if(!table)return;const tbody=table.querySelector('tbody');const headers=table.querySelectorAll('.sortable-header');let currentSort=defaultSort,currentDir=defaultDir;function sortTable(sortBy){const rows=Array.from(tbody.querySelectorAll('tr'));rows.sort((a,b)=>{let va=a.dataset[sortBy],vb=b.dataset[sortBy];if(sortBy==='name'||sortBy==='class'||sortBy==='faction')return currentDir==='asc'?va.localeCompare(vb):vb.localeCompare(va);va=parseFloat(va)||0;vb=parseFloat(vb)||0;return currentDir==='asc'?va-vb:vb-va;});rows.forEach(row=>tbody.appendChild(row));}headers.forEach(th=>{th.addEventListener('click',()=>{const sortBy=th.dataset.sort;headers.forEach(h=>h.classList.remove('asc','desc'));if(currentSort===sortBy)currentDir=currentDir==='asc'?'desc':'asc';else{currentSort=sortBy;currentDir='desc';}th.classList.add(currentDir);sortTable(currentSort);});});const dh=table.querySelector(`[data-sort="${defaultSort}"]`);if(dh){dh.classList.add(defaultDir);sortTable(defaultSort);}},200);}

        function initPlayersTable(){setTimeout(()=>{const tbody=document.getElementById('players-tbody');const searchInput=document.getElementById('player-search');const clearBtn=document.getElementById('clear-search');const resultSpan=document.getElementById('search-result');const headers=document.querySelectorAll('#players-table .sortable-header');if(!tbody)return;let currentSort='wl',currentDir='desc';const allRows=Array.from(tbody.querySelectorAll('tr'));function filterAndSort(){const searchText=searchInput?.value.toLowerCase()||'';let filtered=allRows.filter(row=>{if(!searchText)return true;const name=row.dataset.name?.toLowerCase()||'';const cls=row.dataset.class?.toLowerCase()||'';return name.includes(searchText)||cls.includes(searchText);});filtered.sort((a,b)=>{let va=a.dataset[currentSort],vb=b.dataset[currentSort];if(currentSort==='name'||currentSort==='class'||currentSort==='faction')return currentDir==='asc'?va.localeCompare(vb):vb.localeCompare(va);va=parseFloat(va)||0;vb=parseFloat(vb)||0;return currentDir==='asc'?va-vb:vb-va;});filtered.forEach((row,idx)=>{row.cells[0].textContent=idx+1;});tbody.innerHTML='';filtered.forEach(row=>tbody.appendChild(row));if(resultSpan)resultSpan.textContent=searchText?`Найдено: ${filtered.length}`:'';}headers.forEach(th=>{th.addEventListener('click',()=>{const sortBy=th.dataset.sort;headers.forEach(h=>h.classList.remove('asc','desc'));if(currentSort===sortBy)currentDir=currentDir==='asc'?'desc':'asc';else{currentSort=sortBy;currentDir='desc';}th.classList.add(currentDir);filterAndSort();});});if(searchInput)searchInput.addEventListener('input',filterAndSort);if(clearBtn)clearBtn.addEventListener('click',()=>{searchInput.value='';filterAndSort();});const wlHeader=document.querySelector('[data-sort="wl"]');if(wlHeader){wlHeader.classList.add('desc');filterAndSort();}},200);}
        window.switchTab=function(tabName){document.querySelectorAll('.tab-content').forEach(t=>t.classList.remove('active'));document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));const tab=document.getElementById('tab-'+tabName);if(tab)tab.classList.add('active');const tabMap={tops:'Топы',classes:'Классы',races:'Расы',combos:'Комбинации',rating:'Рейтинг',shards:'Осколки',records:'Рекорды',champions:'Чемпионы',titles:'Титулы',allplayers:'Игроки'};const label=tabMap[tabName];document.querySelectorAll('.tab-btn').forEach(btn=>{if(label&&btn.textContent.includes(label))btn.classList.add('active');});history.replaceState(null,null,'#'+tabName);};
    </script>
