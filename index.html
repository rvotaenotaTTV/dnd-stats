<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Статистика</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link rel="stylesheet" href="theme.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,600;14..32,800;14..32,900&display=swap" rel="stylesheet">
<style>
    .container { max-width: 1200px; }

    .stats-grid { grid-template-columns: repeat(6, 1fr); margin-bottom: 24px; }
    .stat-card { padding: 20px 14px; transition: 0.2s; position: relative; overflow: hidden; }
    .stat-card::after { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, transparent, var(--gold), transparent); opacity: 0.4; }
    .stat-card:hover { transform: translateY(-2px); border-color: rgba(240,185,11,0.3); }
    .stat-value { font-size: 2rem; }
    .stat-label { margin-top: 6px; }
    .faction-light { color: var(--gold); }
    .faction-dark { color: var(--purple); }

    .nav-tabs { display: flex; gap: 6px; margin: 20px 0; padding: 6px; background: var(--card); border-radius: var(--radius); border: 1px solid var(--border); flex-wrap: wrap; }
    .tab-btn { background: transparent; border: none; color: var(--sub); padding: 10px 16px; border-radius: var(--radius-sm); cursor: pointer; font-size: 0.82rem; font-weight: 600; font-family: inherit; transition: 0.2s; white-space: nowrap; }
    .tab-btn:hover { background: var(--elevated); color: var(--text); }
    .tab-btn.active { background: linear-gradient(135deg, var(--ice), var(--gold)); color: #000; font-weight: 700; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .tables-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); gap: 16px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 18px; position: relative; overflow: hidden; margin-bottom: 16px; animation: fadeSlideIn 0.4s ease; }
    .card::after { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, transparent, var(--gold), transparent); opacity: 0.5; }
    .card-title { font-size: 0.95rem; font-weight: 700; color: var(--gold); margin-bottom: 12px; }

    table { min-width: auto; }
    td:first-child { font-weight: 600; color: var(--gold); }

    .search-box { margin-bottom: 12px; display: flex; gap: 8px; align-items: center; }
    .search-input { width: 220px; }
    .search-clear { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 1rem; padding: 4px 8px; }
    .search-clear:hover { color: var(--gold); }

    .titles-gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; margin-bottom: 24px; }
    .title-card { background: var(--elevated); border-radius: var(--radius-sm); padding: 14px; border: 1px solid var(--border); transition: 0.2s; animation: fadeSlideIn 0.3s ease; }
    .title-card:hover { transform: translateY(-2px); border-color: var(--gold); }
    .title-emoji { font-size: 1.3rem; }
    .title-name { color: var(--gold); font-weight: 700; margin: 4px 0; font-size: 0.85rem; }
    .title-cond { color: var(--muted); font-size: 0.68rem; margin-bottom: 8px; }
    .title-progress { background: var(--bg); height: 5px; border-radius: 3px; margin: 6px 0; }
    .title-progress-fill { background: var(--gold); height: 5px; border-radius: 3px; }
    .title-holders { color: var(--muted); font-size: 0.7rem; }

    .hunters-top { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 24px; padding: 20px 16px 16px; background: var(--elevated); border-radius: var(--radius-sm); border: 1px solid rgba(240,185,11,0.15); position: relative; }
    .hunters-top::before { content: '🏆 ЛИДЕРЫ'; position: absolute; top: -10px; left: 50%; transform: translateX(-50%); background: var(--gold); color: #000; padding: 2px 12px; border-radius: 10px; font-size: 0.6rem; font-weight: 700; letter-spacing: 1px; }
    .hunter-card { background: var(--elevated); border: 1px solid rgba(240,185,11,0.2); border-radius: var(--radius-sm); padding: 18px 12px; text-align: center; animation: fadeSlideIn 0.4s ease; }
    .hunter-medal { font-size: 1.8rem; }
    .hunter-name { font-size: 1rem; color: var(--gold); font-weight: 700; }
    .hunter-count { color: var(--muted); font-size: 0.78rem; margin: 4px 0; }

    .records-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; margin: 16px 0; }
    .record-item { background: var(--elevated); border-radius: var(--radius-sm); padding: 14px; border-left: 3px solid var(--gold); animation: fadeSlideIn 0.3s ease; }
    .record-value { font-size: 1.3rem; color: var(--gold); font-weight: 800; }
    .record-label { color: var(--muted); font-size: 0.7rem; margin-top: 2px; }

    .champion-block { background: var(--elevated); border: 1px solid rgba(240,185,11,0.2); border-radius: var(--radius-sm); padding: 22px; text-align: center; margin-bottom: 16px; animation: cardGlow 3s ease-in-out infinite; }
    @keyframes cardGlow { 0%,100%{box-shadow:0 0 0 rgba(240,185,11,0)} 50%{box-shadow:0 0 20px rgba(240,185,11,0.15)} }
    .champion-emoji { font-size: 2.5rem; }
    .champion-name { font-size: 1.3rem; color: var(--gold); font-weight: 800; }
    .champion-class { font-size: 0.85rem; color: var(--muted); }

    tbody tr:nth-child(1) { animation-delay: 0.02s; } tbody tr:nth-child(2) { animation-delay: 0.04s; } tbody tr:nth-child(3) { animation-delay: 0.06s; }
    tbody tr:nth-child(4) { animation-delay: 0.08s; } tbody tr:nth-child(5) { animation-delay: 0.10s; } tbody tr:nth-child(6) { animation-delay: 0.12s; }
    tbody tr:nth-child(7) { animation-delay: 0.14s; } tbody tr:nth-child(8) { animation-delay: 0.16s; } tbody tr:nth-child(9) { animation-delay: 0.18s; }
    tbody tr:nth-child(10) { animation-delay: 0.20s; }

    @media (max-width: 768px) {
        .stats-grid { grid-template-columns: repeat(2, 1fr); gap: 8px; }
        .stat-card { padding: 14px 10px; }
        .stat-value { font-size: 1.5rem; }
        .tables-grid { grid-template-columns: 1fr; }
        .nav-tabs { display: grid; grid-template-columns: repeat(2, 1fr); gap: 4px; padding: 6px; }
        .tab-btn { text-align: center; padding: 8px 6px; font-size: 0.75rem; }
        #tab-tops .table-container { overflow-x: visible !important; }
        #tab-tops table { min-width: auto !important; font-size: 0.68rem; }
        #tab-tops td { white-space: normal !important; word-break: break-word; padding: 5px 6px; }
        #tab-tops td:first-child { min-width: auto; width: 28px; }
        #tab-tops th:first-child { min-width: auto; width: 28px; }
        #tab-tops .number { white-space: nowrap; }
        #classes-table, #races-table, #combos-table, #champions-table, #shards-table, #rating-table, #players-table { min-width: 480px; font-size: 0.7rem; }
        th, td { padding: 6px 8px; }
        th { white-space: nowrap; }
        td { white-space: nowrap; }
        #classes-table td:first-child, #races-table td:first-child, #combos-table td:first-child { white-space: normal; word-break: break-word; min-width: 120px; }
        #classes-table th:first-child, #races-table th:first-child, #combos-table th:first-child { min-width: 120px; }
        #champions-table td:first-child, #shards-table td:first-child, #rating-table td:first-child, #players-table td:first-child { min-width: 36px; font-size: 0.65rem; text-align: center; }
        #champions-table th:first-child, #shards-table th:first-child, #rating-table th:first-child, #players-table th:first-child { min-width: 36px; }
        #combos-table td:first-child { white-space: nowrap; min-width: 130px; }
        .titles-gallery { grid-template-columns: repeat(2, 1fr) !important; }
        .hunters-top { grid-template-columns: repeat(3, 1fr); gap: 6px; }
        .hunter-card { padding: 12px 6px; }
        .hunter-name { font-size: 0.8rem; }
        .champion-block > div:last-child { display: flex !important; justify-content: space-around; gap: 8px; margin-top: 12px; flex-wrap: nowrap; }
        .champion-block > div:last-child > div { flex: 1; text-align: center; display: flex; flex-direction: column; justify-content: space-between; min-height: 52px; }
        .champion-block > div:last-child span[style*="font-size: 1.5rem"] { font-size: 1.2rem !important; white-space: nowrap; }
        .champion-block > div:last-child span[style*="color: var(--text-muted)"] { font-size: 0.6rem !important; line-height: 1.3; }
        .search-input { width: 100%; }
    }
</style>
</head>
<body>
    <div class="container">
        <header class="header"><h1 class="header-title">СТАТИСТИКА</h1><p class="header-subtitle">5 сезон</p><button class="theme-toggle" onclick="toggleTheme()">🌓</button></header>
		<div class="nav-wrapper">
			<button class="nav-toggle" onclick="toggleNav()">☰ Меню</button>
			<nav class="nav-bar" id="pageNav">
				<div class="nav-group">
					<span class="nav-label">⚔️ Арена ▾</span>
					<div class="nav-dropdown">
						<a href="index.html" class="nav-link active">📊 Статистика</a>
						<a href="dungeon.html" class="nav-link">🏔 Подземелье</a>
						<a href="league.html" class="nav-link">🏟 Лига</a>
						<a href="logs.html" class="nav-link">📜 Логи</a>
						<a href="player.html" class="nav-link">👤 Профиль</a>
					</div>
				</div>
				<div class="nav-group">
					<span class="nav-label">📐 Аналитика ▾</span>
					<div class="nav-dropdown">
						<a href="balance.html" class="nav-link">⚖️ Баланс</a>
						<a href="calc.html" class="nav-link">🎲 Калькулятор</a>
						<a href="simulator.html" class="nav-link">🧪 Симулятор</a>
						<a href="gradient.html" class="nav-link">📈 Градиент</a>
						<a href="form.html" class="nav-link">🔥 Форма</a>
					</div>
				</div>
				<div class="nav-group">
					<span class="nav-label">🌍 Мир ▾</span>
					<div class="nav-dropdown">
						<a href="guide.html" class="nav-link">⚔️ Гайд</a>
						<a href="lore.html" class="nav-link">📜 Лор</a>
						<a href="hall.html" class="nav-link">🏆 Зал Славы</a>
						<a href="tavern.html" class="nav-link">🍺 Таверна</a>
					</div>
				</div>
			</nav>
		</div>
        <div id="content"><div style="text-align:center;padding:48px 20px;color:var(--sub);"><div class="spinner"></div><p>Загрузка статистики...</p></div></div>
    </div>
    <a href="https://www.donationalerts.com/r/rvotaenota" target="_blank" class="beer-btn" title="Угостить пивом 🍺">🍺</a>
	<a href="https://github.com/rvotaenotaTTV/dnd-stats/releases/latest" target="_blank" class="extension-btn" title="Расширение для браузера">🧩</a>
    <script>
        function toggleTheme(){const html=document.documentElement;const current=html.getAttribute('data-theme');const next=current==='dark'?'light':'dark';html.setAttribute('data-theme',next);localStorage.setItem('eternis-theme',next);}
        (function(){const saved=localStorage.getItem('eternis-theme');if(saved)document.documentElement.setAttribute('data-theme',saved);})();
        function toggleNav(){const nav=document.getElementById('pageNav'),btn=document.querySelector('.nav-toggle');nav.classList.toggle('show');btn.textContent=nav.classList.contains('show')?'✕ Закрыть':'☰ Меню';}
        document.querySelectorAll('.nav-link').forEach(l=>l.addEventListener('click',()=>{document.getElementById('pageNav').classList.remove('show');document.querySelector('.nav-toggle').textContent='☰ Меню';}));

        const JSON_URL_RAW='https://raw.githubusercontent.com/rvotaenotaTTV/dnd-stats/main/stats_data.json';
        const DATA_URL_RAW='https://raw.githubusercontent.com/rvotaenotaTTV/dnd-stats/main/data.json';
        const JSON_URL_CDN='https://cdn.jsdelivr.net/gh/rvotaenotaTTV/dnd-stats@main/stats_data.json';
        const DATA_URL_CDN='https://cdn.jsdelivr.net/gh/rvotaenotaTTV/dnd-stats@main/data.json';
        function fetchWithTimeout(url,timeout=3000){return Promise.race([fetch(url).then(r=>{if(!r.ok)throw new Error('Status '+r.status);return r}),new Promise((_,reject)=>setTimeout(()=>reject(new Error('timeout')),timeout))]);}

        let classesData=[],racesData=[],classEmojis={},raceEmojis={},players=[],achievements=[];
        fetchWithTimeout(DATA_URL_RAW).catch(()=>fetch(DATA_URL_CDN)).then(r=>r.json()).then(data=>{classesData=data.classes;racesData=data.races;classEmojis=Object.fromEntries(classesData.map(c=>[c.Name,c.Emoji]));raceEmojis=Object.fromEntries(racesData.map(r=>[r.Name,r.Emoji]));return fetchWithTimeout(JSON_URL_RAW).catch(()=>fetch(JSON_URL_CDN));}).then(r=>r.json()).then(data=>{players=data.players.filter(p=>p.name&&p.name!=='Unknown');if(data.dungeon?.players){window._dungeonPlayers={};Object.values(data.dungeon.players).forEach(dp=>{window._dungeonPlayers[dp.display]=dp;});}renderFullStats(data);}).catch(err=>{document.getElementById('content').innerHTML=`<div style="text-align:center;padding:48px 20px;color:var(--red);">❌ Ошибка загрузки данных<br>${err.message}</div>`;});

		function renderFullStats(data){
			const totalPlayers = players.length;
			const totalFights = Math.floor(players.reduce((s, p) => s + p.wins + p.losses, 0) / 2);
			const lightCount = players.filter(p => p.faction === 'Орден Света').length;
			const darkCount = players.filter(p => p.faction === 'Культ Тьмы').length;
			const { battleLight = 0, battleDark = 0, duelLight = 0, duelDark = 0 } = data.factionScore || {};
			const { subKeepers = 0, subReformers = 0, subInquisitors = 0 } = data;
			const lightRemaining = 50 - (duelLight % 50);
			const darkRemaining = 50 - (duelDark % 50);
			
			const sf = {};
			players.forEach(p => { if (p.subfaction) sf[p.subfaction] = (sf[p.subfaction] || 0) + 1; });

			let html = '';
			html += '<div class="stats-grid">';
			html += `<div class="stat-card"><div class="stat-value">${totalPlayers}</div><div class="stat-label">👥 Всего игроков</div></div>`;
			html += `<div class="stat-card"><div class="stat-value">${totalFights}</div><div class="stat-label">⚔️ Всего боёв</div></div>`;
			html += `<div class="stat-card"><div class="stat-value">${lightCount} <span class="faction-light">🌝</span></div><div class="stat-label">Орден Света</div></div>`;
			html += `<div class="stat-card"><div class="stat-value">${darkCount} <span class="faction-dark">🌚</span></div><div class="stat-label">Культ Тьмы</div></div>`;
			html += `<div class="stat-card"><div class="stat-value">${battleLight} : ${battleDark}</div><div class="stat-label">🌝 Свет vs Тьма 🌚</div></div>`;
			html += `<div class="stat-card"><div class="stat-value"><span style="color:var(--gold);">${lightRemaining}</span> <span style="color:var(--muted);">·</span> <span style="color:var(--purple);">${darkRemaining}</span></div><div class="stat-label">побед до захвата</div></div>`;
			html += '</div>';

			const totalSub = subKeepers + subReformers + subInquisitors;
			const subs = [
				{ icon: '🛡️', n: 'Хранители', val: subKeepers, pct: totalSub > 0 ? Math.round(subKeepers * 100 / totalSub) : 0, cnt: sf['Хранители'] || 0, color: 'var(--gold)', bg: 'rgba(240,185,11,.03)', border: 'rgba(240,185,11,.15)', q: 'Основателю — верность.' },
				{ icon: '⚡', n: 'Реформаторы', val: subReformers, pct: totalSub > 0 ? Math.round(subReformers * 100 / totalSub) : 0, cnt: sf['Реформаторы'] || 0, color: 'var(--ice)', bg: 'rgba(91,192,235,.03)', border: 'rgba(91,192,235,.15)', q: 'Ученику — власть.' },
				{ icon: '🔥', n: 'Инквизиторы', val: subInquisitors, pct: totalSub > 0 ? Math.round(subInquisitors * 100 / totalSub) : 0, cnt: sf['Инквизиторы'] || 0, color: '#ffb850', bg: 'rgba(255,180,80,.03)', border: 'rgba(255,180,80,.15)', q: 'Павшим — забвение.' }
			];

			html += '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:24px">';
			subs.forEach(s => {
				html += `<div style="background:linear-gradient(160deg,var(--elevated),${s.bg});border:1px solid ${s.border};border-radius:var(--radius-sm);padding:16px;text-align:center">`;
				html += `<div style="font-size:1.8rem;margin-bottom:4px">${s.icon}</div>`;
				html += `<div style="font-size:1.4rem;font-weight:800;color:${s.color};margin-bottom:2px">${s.pct}%</div>`;
				html += `<div style="font-weight:700;color:${s.color};font-size:.8rem">${s.n} (${s.cnt})</div>`;
				html += `<div style="font-size:.65rem;color:var(--muted);margin-top:4px;font-style:italic">«${s.q}»</div></div>`;
			});
			html += '</div>';

            html+='<div class="nav-tabs">';
            html+='<button class="tab-btn active" onclick="switchTab(\'tops\')">🏆 Топы</button>';
            html+='<button class="tab-btn" onclick="switchTab(\'classes\')">⚔️ Классы</button>';
            html+='<button class="tab-btn" onclick="switchTab(\'races\')">🌍 Расы</button>';
            html+='<button class="tab-btn" onclick="switchTab(\'combos\')">🔄 Комбинации</button>';
            html+='<button class="tab-btn" onclick="switchTab(\'records\')">🏅 Рекорды</button>';
            html+='<button class="tab-btn" onclick="switchTab(\'champions\')">👑 Чемпионы</button>';
            html+='<button class="tab-btn" onclick="switchTab(\'titles\')">🏅 Титулы</button>';
            html+='<button class="tab-btn" onclick="switchTab(\'shards\')">💎 Осколки</button>';
            html+='<button class="tab-btn" onclick="switchTab(\'rating\')">🏆 Рейтинг</button>';
            html+='<button class="tab-btn" onclick="switchTab(\'allplayers\')">👥 Игроки</button>';
            html+='</div>';

            // TОПЫ
            html+='<div id="tab-tops" class="tab-content active"><div class="tables-grid">';
            const topWins=[...players].sort((a,b)=>b.wins-a.wins).slice(0,15);
            html+='<div class="card"><div class="card-title">🏆 Топ-15 по победам</div><div class="table-container"><table><tr><th>#</th><th>Игрок</th><th>Класс</th><th>Победы</th></tr>';
            topWins.forEach((p,i)=>html+=`<tr><td>${i+1}</td><td><a href="player.html?name=${encodeURIComponent(p.display)}" class="player-link">${p.display}</a></td><td>${p.name}</td><td class="number">${p.wins}</td></tr>`);
            html+='</table></div></div>';
            const topWinrate=players.filter(p=>p.wins+p.losses>=30).map(p=>({...p,wr:p.wins*100/(p.wins+p.losses)})).sort((a,b)=>b.wr-a.wr).slice(0,15);
            html+='<div class="card"><div class="card-title">📈 Топ-15 по винрейту</div><div class="table-container"><table><tr><th>#</th><th>Игрок</th><th>W/L</th><th>Винрейт</th></tr>';
            topWinrate.forEach((p,i)=>html+=`<tr><td>${i+1}</td><td><a href="player.html?name=${encodeURIComponent(p.display)}" class="player-link">${p.display}</a></td><td class="number">${p.wins}-${p.losses}</td><td class="number">${p.wr.toFixed(1)}%</td></tr>`);
            html+='</table></div></div>';
            const topFights=[...players].sort((a,b)=>(b.wins+b.losses)-(a.wins+a.losses)).slice(0,15);
            html+='<div class="card"><div class="card-title">⚔️ Топ-15 по боям</div><div class="table-container"><table><tr><th>#</th><th>Игрок</th><th>Боёв</th><th>W/L</th></tr>';
            topFights.forEach((p,i)=>html+=`<tr><td>${i+1}</td><td><a href="player.html?name=${encodeURIComponent(p.display)}" class="player-link">${p.display}</a></td><td class="number">${p.wins+p.losses}</td><td class="number">${p.wins}-${p.losses}</td></tr>`);
            html+='</table></div></div>';
            const topStreak=[...players].sort((a,b)=>b.best-a.best).slice(0,15);
            html+='<div class="card"><div class="card-title">🔥 Топ-15 по стрику</div><div class="table-container"><table><tr><th>#</th><th>Игрок</th><th>Стрик</th></tr>';
            topStreak.forEach((p,i)=>html+=`<tr><td>${i+1}</td><td><a href="player.html?name=${encodeURIComponent(p.display)}" class="player-link">${p.display}</a></td><td class="number">${p.best}</td></tr>`);
            html+='</table></div></div></div></div>';

			// === КЛАССЫ ===
			html+='<div id="tab-classes" class="tab-content">';
			const classStats={};const classChamps={};
			players.forEach(p=>{const cn=p.name.split('-')[1]||p.name;if(!classStats[cn]){classStats[cn]={wins:0,losses:0,players:0,shards:0,best:0,worst:0,skillTotal:0};classChamps[cn]=0;}classStats[cn].wins+=p.wins;classStats[cn].losses+=p.losses;classStats[cn].players++;classStats[cn].shards+=p.shards;classStats[cn].best=Math.max(classStats[cn].best,p.best);classStats[cn].worst=Math.max(classStats[cn].worst,p.worst||0);classStats[cn].skillTotal+=(p.skill||0);classChamps[cn]+=(p.tournamentWins||0);});
			const heroArchive=data.heroArchive||{};

        function initSortableTable(tableId,defaultSort,defaultDir){setTimeout(()=>{const table=document.getElementById(tableId);if(!table)return;const tbody=table.querySelector('tbody');const headers=table.querySelectorAll('.sortable-header');let currentSort=defaultSort,currentDir=defaultDir;function sortTable(sortBy){const rows=Array.from(tbody.querySelectorAll('tr'));rows.sort((a,b)=>{let va=a.dataset[sortBy],vb=b.dataset[sortBy];if (sortBy === 'name' || sortBy === 'class' || (sortBy === 'faction' && tableId !== 'combos-table'))return currentDir==='asc'?va.localeCompare(vb):vb.localeCompare(va);va=parseFloat(va)||0;vb=parseFloat(vb)||0;return currentDir==='asc'?va-vb:vb-va;});rows.forEach(row=>tbody.appendChild(row));}headers.forEach(th=>{th.addEventListener('click',()=>{const sortBy=th.dataset.sort;headers.forEach(h=>h.classList.remove('asc','desc'));if(currentSort===sortBy)currentDir=currentDir==='asc'?'desc':'asc';else{currentSort=sortBy;currentDir='desc';}th.classList.add(currentDir);sortTable(currentSort);});});const dh=table.querySelector(`[data-sort="${defaultSort}"]`);if(dh){dh.classList.add(defaultDir);sortTable(defaultSort);}},200);}

        function initPlayersTable(){setTimeout(()=>{const tbody=document.getElementById('players-tbody');const searchInput=document.getElementById('player-search');const clearBtn=document.getElementById('clear-search');const resultSpan=document.getElementById('search-result');const headers=document.querySelectorAll('#players-table .sortable-header');if(!tbody)return;let currentSort='wl',currentDir='desc';const allRows=Array.from(tbody.querySelectorAll('tr'));function filterAndSort(){const searchText=searchInput?.value.toLowerCase()||'';let filtered=allRows.filter(row=>{if(!searchText)return true;const name=row.dataset.name?.toLowerCase()||'';const cls=row.dataset.class?.toLowerCase()||'';return name.includes(searchText)||cls.includes(searchText);});filtered.sort((a,b)=>{let va=a.dataset[currentSort],vb=b.dataset[currentSort];if(currentSort==='name'||currentSort==='class'||currentSort==='faction')return currentDir==='asc'?va.localeCompare(vb):vb.localeCompare(va);va=parseFloat(va)||0;vb=parseFloat(vb)||0;return currentDir==='asc'?va-vb:vb-va;});filtered.forEach((row,idx)=>{row.cells[0].textContent=idx+1;});tbody.innerHTML='';filtered.forEach(row=>tbody.appendChild(row));if(resultSpan)resultSpan.textContent=searchText?`Найдено: ${filtered.length}`:'';}headers.forEach(th=>{th.addEventListener('click',()=>{const sortBy=th.dataset.sort;headers.forEach(h=>h.classList.remove('asc','desc'));if(currentSort===sortBy)currentDir=currentDir==='asc'?'desc':'asc';else{currentSort=sortBy;currentDir='desc';}th.classList.add(currentDir);filterAndSort();});});if(searchInput)searchInput.addEventListener('input',filterAndSort);if(clearBtn)clearBtn.addEventListener('click',()=>{searchInput.value='';filterAndSort();});const wlHeader=document.querySelector('[data-sort="wl"]');if(wlHeader){wlHeader.classList.add('desc');filterAndSort();}},200);}
        window.switchTab=function(tabName){document.querySelectorAll('.tab-content').forEach(t=>t.classList.remove('active'));document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));const tab=document.getElementById('tab-'+tabName);if(tab)tab.classList.add('active');const tabMap={tops:'Топы',classes:'Классы',races:'Расы',combos:'Комбинации',rating:'Рейтинг',shards:'Осколки',records:'Рекорды',champions:'Чемпионы',titles:'Титулы',allplayers:'Игроки'};const label=tabMap[tabName];document.querySelectorAll('.tab-btn').forEach(btn=>{if(label&&btn.textContent.includes(label))btn.classList.add('active');});history.replaceState(null,null,'#'+tabName);};
    
		document.querySelectorAll('.nav-label').forEach(label=>{
		label.addEventListener('click',function(e){
			if(window.innerWidth>768)return;
			e.preventDefault();
			const dd=this.nextElementSibling;
			if(dd&&dd.classList.contains('nav-dropdown')){
				const isOpen=dd.style.display==='block';
				document.querySelectorAll('.nav-dropdown').forEach(d=>d.style.display='none');
				dd.style.display=isOpen?'none':'block';
			}
		});
	});
	</script>
