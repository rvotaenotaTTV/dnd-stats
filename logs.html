<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Логи</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,600;14..32,800;14..32,900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #06040a; --card: #0e0a14; --elevated: #140c1a;
            --text: #e8ddf0; --sub: #8a7d94; --muted: #5e5268;
            --border: rgba(180,100,140,0.15);
            --gold: #f0b90b; --red: #e85d3a; --purple: #a371f7; --green: #10b981;
            --radius: 16px; --radius-sm: 10px;
        }
        [data-theme="light"] {
            --bg: #f7f2eb; --card: #fefcf8; --elevated: #fbf8f3;
            --text: #2d1a1a; --sub: #6b4e4e; --muted: #8b6b6b;
            --border: rgba(180,80,60,0.12);
            --gold: #b8860b; --red: #a03020; --purple: #7b5ea7; --green: #27ae60;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; scroll-padding-top: 100px; }
        body { font-family: 'Inter',system-ui,sans-serif; background: var(--bg); background-image: radial-gradient(ellipse at 50% 0%, rgba(200,40,40,0.06) 0%, transparent 60%), radial-gradient(ellipse at 20% 80%, rgba(163,113,247,0.04) 0%, transparent 50%); color: var(--text); min-height: 100vh; line-height: 1.5; }
        .container { max-width: 900px; margin: 0 auto; padding: 24px 20px 60px; }

        .header { text-align: center; padding: 32px 0 8px; position: relative; }
        .header-title { font-size: clamp(2.2rem,6vw,3.2rem); font-weight: 900; letter-spacing: -0.03em; background: linear-gradient(135deg,#8b0000 0%,#e85d3a 40%,#ffd700 70%,#e85d3a 100%); background-size: 200% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; filter: drop-shadow(0 0 30px rgba(232,93,58,0.5)); animation: shimmer 3s linear infinite; margin-bottom: 4px; }
        @keyframes shimmer { 0%{background-position:0% center} 100%{background-position:200% center} }
        .header-subtitle { font-size: 0.9rem; color: var(--red); font-weight: 500; letter-spacing: 0.04em; }
        .theme-toggle { position: absolute; right: 0; top: 50%; transform: translateY(-50%); background: var(--elevated); border: 1px solid var(--border); color: var(--sub); padding: 8px 12px; border-radius: 20px; cursor: pointer; font-size: 0.85rem; font-family: inherit; transition: 0.2s; }
        .theme-toggle:hover { background: var(--card); color: var(--red); border-color: var(--red); }

        .nav-wrapper { margin-bottom: 28px; position: sticky; top: 12px; z-index: 100; }
        .nav-toggle { display: none; width: 100%; padding: 13px 18px; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); color: var(--gold); font-size: 0.95rem; font-weight: 700; cursor: pointer; text-align: left; }
        .nav-bar { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; padding: 6px; background: var(--card); border-radius: var(--radius); border: 1px solid var(--border); }
        .nav-link { padding: 8px 14px; border-radius: 20px; color: var(--sub); text-decoration: none; font-size: 0.78rem; font-weight: 500; transition: 0.2s; }
        .nav-link:hover { color: var(--text); background: var(--elevated); }
        .nav-link.active { background: linear-gradient(135deg,var(--red),var(--gold)); color: #000; font-weight: 700; }

        .section { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px 22px; margin-bottom: 20px; position: relative; overflow: hidden; }
        .section::after { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; opacity: 0.6; }
        .section.gold::after { background: linear-gradient(90deg,transparent,var(--gold),transparent); }

        .controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 20px; }
        .btn { background: var(--elevated); border: 1px solid var(--border); color: var(--text); padding: 10px 18px; border-radius: 25px; cursor: pointer; font-size: 0.85rem; font-weight: 600; font-family: inherit; transition: 0.2s; display: flex; align-items: center; gap: 6px; }
        .btn:hover { background: var(--gold); color: #000; border-color: var(--gold); }
        .search-box { display: flex; align-items: center; background: var(--elevated); border: 1px solid var(--border); border-radius: 25px; padding: 0 14px; height: 40px; gap: 8px; }
        .search-box input { background: transparent; border: none; color: var(--text); font-size: 0.85rem; font-family: inherit; outline: none; width: 160px; }
        .search-box input::placeholder { color: var(--muted); }
        .log-info { color: var(--muted); font-size: 0.8rem; margin-left: auto; white-space: nowrap; }

        .log-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 16px 18px; margin-bottom: 14px; position: relative; overflow: hidden; animation: fadeSlideIn 0.4s ease; }
        .log-card::after { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px; background: linear-gradient(90deg, transparent, rgba(240,185,11,0.3), transparent); }
        .log-header { display: grid; grid-template-columns: 40px 1fr auto 1fr; align-items: center; font-family: 'SF Mono','Consolas',monospace; font-size: 0.85rem; padding-bottom: 10px; border-bottom: 1px solid var(--border); margin-bottom: 8px; }
        .log-num { color: var(--gold); font-weight: 700; }
        .log-header-left { text-align: left; padding-left: 4px; }
        .log-header-right { text-align: right; padding-right: 4px; }
        .log-header-center { text-align: center; font-weight: 700; color: var(--gold); padding: 0 8px; }
        .round-row { display: grid; grid-template-columns: 40px 1fr 30px 1fr; padding: 3px 0; border-bottom: 1px solid var(--border); font-family: 'SF Mono','Consolas',monospace; font-size: 0.8rem; }
        .round-row:last-child { border-bottom: none; }
        .round-num { color: var(--muted); }
        .round-p1 { color: var(--text); text-align: right; padding-right: 6px; }
        .round-p2 { color: var(--text); text-align: left; padding-left: 6px; }
        .round-vs { text-align: center; color: var(--gold); }
        .cup { color: var(--gold); }
        .lightning { color: var(--gold); }
        .crit { color: var(--red); }
        .miss { color: var(--muted); }

        .beer-btn { position: fixed; bottom: 20px; right: 20px; width: 48px; height: 48px; background: var(--gold); color: #000; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.3rem; text-decoration: none; box-shadow: 0 4px 16px rgba(240,185,11,0.3); z-index: 99; transition: transform 0.2s; animation: float 3s ease-in-out infinite; }
        .beer-btn:hover { transform: scale(1.1); }

        .spinner { display: inline-block; width: 32px; height: 32px; border: 3px solid var(--border); border-top: 3px solid var(--gold); border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 12px; }
        @keyframes spin { to{transform:rotate(360deg)} }
        @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
        @keyframes fadeSlideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: var(--gold); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #ffd700; }
        * { scrollbar-width: thin; scrollbar-color: var(--gold) transparent; }

        @media (max-width: 768px) {
            .container { padding: 12px 14px 80px; }
            .header { padding: 20px 0 8px; }
            .header-title { font-size: 1.8rem; }
            .theme-toggle { position: static; transform: none; margin: 12px auto 0; display: block; width: fit-content; }
            .nav-toggle { display: block; }
            .nav-bar { display: none; flex-direction: column; margin-top: 8px; }
            .nav-bar.show { display: flex; }
            .nav-link { padding: 12px 16px; border-radius: var(--radius-sm); justify-content: center; }
            .controls { flex-wrap: wrap; gap: 8px; }
            .btn { flex: 1; min-width: 100px; justify-content: center; }
            .search-box { flex: 1; min-width: 120px; }
            .search-box input { width: 100%; }
            .log-info { width: 100%; text-align: center; margin-left: 0; }
            .log-card { padding: 12px 10px; }
            .log-header { grid-template-columns: 28px 1fr 36px 1fr; font-size: 0.72rem; gap: 4px; }
            .log-num { font-size: 0.65rem; }
            .log-header-left, .log-header-right { line-height: 1.3; }
            .log-header-left { text-align: left; }
            .log-header-right { text-align: right; }
            .log-header-center { font-size: 0.7rem; }
            .log-header-left br, .log-header-right br { display: block !important; content: "" !important; }
            .round-row { grid-template-columns: 24px 1fr 24px 1fr; font-size: 0.7rem; }
            .round-num { font-size: 0.65rem; }
            .round-p1, .round-p2 { font-size: 0.7rem; padding: 0 3px; }
            .round-vs { font-size: 0.7rem; }
            .beer-btn { bottom: 16px; right: 16px; width: 42px; height: 42px; font-size: 1.1rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1 class="header-title">ЛОГИ БОЁВ</h1>
            <p class="header-subtitle">Последние сражения на Арене</p>
            <button class="theme-toggle" onclick="toggleTheme()">🌓</button>
        </header>
        <div class="nav-wrapper">
            <button class="nav-toggle" onclick="toggleNav()">☰ Меню</button>
            <nav class="nav-bar" id="pageNav">
                <a href="index.html" class="nav-link">📊 Статистика</a>
                <a href="logs.html" class="nav-link active">📜 Логи</a>
                <a href="calc.html" class="nav-link">🎲 Калькулятор</a>
                <a href="balance.html" class="nav-link">⚖️ Баланс</a>
                <a href="simulator.html" class="nav-link">🧪 Симулятор</a>
                <a href="gradient.html" class="nav-link">📈 Градиент</a>
                <a href="guide.html" class="nav-link">⚔️ Гайд</a>
                <a href="hall.html" class="nav-link">🏆 Зал Славы</a>
                <a href="lore.html" class="nav-link">📜 Лор</a>
                <a href="tavern.html" class="nav-link">🍺 Таверна</a>
                <a href="dungeon.html" class="nav-link">🏔 Подземелье</a>
                <a href="league.html" class="nav-link">🏟 Лига</a>
                <a href="form.html" class="nav-link">🔥 Форма</a>
                <a href="player.html" class="nav-link">👤 Профиль</a>
            </nav>
        </div>
        <div class="controls">
            <button class="btn" onclick="loadLogs()">🔄 Обновить</button>
            <div class="search-box"><span style="color:var(--muted);">🔍</span><input type="text" id="logSearch" placeholder="Поиск..." oninput="filterLogs()"></div>
            <span class="log-info" id="logCount"></span>
        </div>
        <div id="logs-content"><div style="text-align:center;padding:48px 20px;color:var(--sub);"><div class="spinner"></div><p>Загрузка...</p></div></div>
    </div>
    <a href="https://www.donationalerts.com/r/rvotaenota" target="_blank" class="beer-btn" title="Угостить пивом 🍺">🍺</a>
    <script>
        function toggleTheme() { const html = document.documentElement; const current = html.getAttribute('data-theme'); const next = current === 'dark' ? 'light' : 'dark'; html.setAttribute('data-theme', next); localStorage.setItem('eternis-theme', next); }
        (function() { const saved = localStorage.getItem('eternis-theme'); if (saved) document.documentElement.setAttribute('data-theme', saved); })();
        function toggleNav() { const nav = document.getElementById('pageNav'); const btn = document.querySelector('.nav-toggle'); nav.classList.toggle('show'); btn.textContent = nav.classList.contains('show') ? '✕ Закрыть' : '☰ Меню'; }
        document.querySelectorAll('.nav-link').forEach(link => { link.addEventListener('click', () => { document.getElementById('pageNav').classList.remove('show'); document.querySelector('.nav-toggle').textContent = '☰ Меню'; }); });
        let allFights = [];
        function plural(n, one, two, five) { if (n % 10 === 1 && n % 100 !== 11) return one; if (n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 10 || n % 100 >= 20)) return two; return five; }
        function colorize(text) { return text.replace(/🏆/g,'<span class="cup">🏆</span>').replace(/⚡/g,'<span class="lightning">⚡</span>').replace(/💥\d+/g,m=>`<span class="crit">${m}</span>`).replace(/❌/g,'<span class="miss">❌</span>').replace(/💨/g,'<span class="miss">💨</span>').replace(/🛡/g,'<span class="miss">🛡</span>'); }

        function renderLog(fight, index, total) {
            const fullLog = fight.FullLog;
            const parts = fullLog.split(' | ');
            const header = parts[0];
            const rounds = parts.slice(1);
            const number = total - index;
            const headerMatch = header.match(/^(.+?)\s+(\d+:\d+)\s+(.+)$/);
            let left = '', center = '', right = '';
            if (headerMatch) { left = headerMatch[1]; center = headerMatch[2]; right = headerMatch[3]; }
            const hasLightningLeft = header.indexOf('⚡') < header.indexOf(':');
            let roundsHtml = '';
            rounds.forEach((r, i) => {
                let [hit1, hit2] = r.split(':');
                if (!hasLightningLeft) [hit1, hit2] = [hit2, hit1];
                roundsHtml += `<div class="round-row"><span class="round-num">R${i+1}</span><span class="round-p1">${colorize(hit1)}</span><span class="round-vs">:</span><span class="round-p2">${colorize(hit2)}</span></div>`;
            });

            if (window.matchMedia('(max-width: 768px)').matches) {
                let lp = left.split(' ');
                let ln = lp.pop();
                left = (lp.length ? lp.join(' ') + '<br>' : '') + ln;
                let rp = right.split(' ');
                let rn = rp.pop();
                right = (rp.length ? rp.join(' ') + '<br>' : '') + rn;
            }

            return `<div class="log-card"><div class="log-header"><span class="log-num">#${number}</span><span class="log-header-left">${colorize(left)}</span><span class="log-header-center">${center}</span><span class="log-header-right">${colorize(right)}</span></div><div class="rounds-table">${roundsHtml}</div></div>`;
        }

        function filterLogs() {
            const searchText = document.getElementById('logSearch').value.toLowerCase().trim();
            const content = document.getElementById('logs-content');
            if (!allFights.length) return;
            if (!searchText) {
                let html = ''; const total = allFights.length;
                [...allFights].reverse().forEach((f, i) => { html += renderLog(f, i, total); });
                content.innerHTML = html;
                document.getElementById('logCount').textContent = `Всего: ${total} ${plural(total, 'бой', 'боя', 'боёв')}`;
                return;
            }
            const filtered = allFights.filter(f => f.FullLog.toLowerCase().includes(searchText));
            if (filtered.length === 0) { content.innerHTML = '<div style="text-align:center;padding:48px 20px;color:var(--sub);">🔍 Ничего не найдено</div>'; return; }
            let html = ''; const total = filtered.length;
            [...filtered].reverse().forEach((f, i) => { html += renderLog(f, i, total); });
            content.innerHTML = html;
            document.getElementById('logCount').textContent = `Найдено: ${total} ${plural(total, 'бой', 'боя', 'боёв')}`;
        }

        const LOGS_URL = 'https://raw.githubusercontent.com/rvotaenotaTTV/dnd-stats/main/stats_data.json';
        function loadLogs() {
            const content = document.getElementById('logs-content');
            content.innerHTML = '<div style="text-align:center;padding:48px 20px;color:var(--sub);"><div class="spinner"></div><p>Загрузка...</p></div>';
            fetch(LOGS_URL + '?v=' + Date.now()).then(r => r.json()).then(data => {
                const fights = data.fights || [];
                if (!fights.length) { content.innerHTML = '<div style="text-align:center;padding:48px 20px;color:var(--sub);">📜 Логов пока нет</div>'; return; }
                allFights = fights;
                filterLogs();
            }).catch(() => { content.innerHTML = '<div style="text-align:center;padding:48px 20px;color:var(--red);">❌ Ошибка загрузки</div>'; });
        }
        loadLogs();
        window.addEventListener('resize', () => { if (allFights.length) filterLogs(); });
    </script>
</body>
</html>
