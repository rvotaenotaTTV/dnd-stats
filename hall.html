<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Зал Славы</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="theme.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,600;14..32,800;14..32,900&display=swap" rel="stylesheet">
<style>
    /* ========================================== */
    /* СЕЗОННЫЙ ФРЕЙМ                            */
    /* ========================================== */
    .season-frame{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:28px 24px;margin-bottom:20px;position:relative;overflow:hidden;animation:fadeSlideIn .4s ease}
    .season-frame::after{content:'';position:absolute;top:0;left:0;right:0;height:2px;opacity:.6;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
    .season-frame.live{border-color:rgba(240,185,11,.4)}
    .season-frame.ended{opacity:.9}
    .season-title{font-size:1.2rem;font-weight:800;color:var(--gold);margin-bottom:2px;display:flex;align-items:center;gap:10px}
    .season-badge{display:inline-block;padding:3px 12px;border-radius:20px;font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:1px}
    .season-badge.ended{background:var(--elevated);color:var(--muted)}
    .season-badge.live{background:var(--gold);color:#000;animation:softGlow 2s ease infinite}
    @keyframes softGlow{0%,100%{box-shadow:0 0 8px rgba(240,185,11,.3)}50%{box-shadow:0 0 16px rgba(240,185,11,.6)}}
    .season-quote{background:var(--elevated);border-left:3px solid var(--gold);padding:10px 16px;margin:12px 0 20px;color:var(--sub);font-size:.85rem;font-style:italic;border-radius:0 var(--radius-sm) var(--radius-sm) 0}

    /* ========================================== */
    /* ПОДЗАГОЛОВКИ СЕКЦИЙ                        */
    /* ========================================== */
    .section-subtitle{display:flex;align-items:center;gap:8px;color:var(--gold);font-size:.85rem;font-weight:700;margin:22px 0 12px;padding-bottom:8px;border-bottom:1px solid var(--border);text-transform:uppercase;letter-spacing:2px}
    .section-subtitle::before{content:'';display:inline-block;width:4px;height:16px;background:var(--gold);border-radius:2px}

    /* ========================================== */
    /* СТАТ-КАРТОЧКИ                              */
    /* ========================================== */
    .stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px}
    .stat-card{background:var(--elevated);border-radius:var(--radius-sm);padding:16px 12px;text-align:center;border:1px solid var(--border);transition:transform .2s,box-shadow .2s}
    .stat-card:hover{transform:translateY(-2px)}
    .stat-value{font-size:1.5rem;font-weight:800;color:var(--gold);margin-bottom:2px}
    .stat-label{color:var(--muted);font-size:0.65rem;margin-top:4px;text-transform:uppercase;letter-spacing:1px}
    .stat-sub{color:var(--sub);font-size:.65rem;margin-top:2px}

    /* ========================================== */
    /* КОРОНА РАСКОЛА                             */
    /* ========================================== */
    .crown-section{margin-bottom:20px}
    .crown-bar-visual{display:flex;height:40px;border-radius:var(--radius-sm);overflow:hidden;border:1px solid var(--border);margin-bottom:8px;position:relative}
    .crown-light{background:linear-gradient(90deg,rgba(240,185,11,.7),rgba(240,185,11,.4));display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.8rem;color:#000;transition:flex .5s ease;min-width:40px}
    .crown-dark{background:linear-gradient(90deg,rgba(163,113,247,.4),rgba(163,113,247,.7));display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.8rem;color:#fff;transition:flex .5s ease;min-width:40px}
    .crown-icon-center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:1.4rem;z-index:3;filter:drop-shadow(0 0 6px rgba(240,185,11,.8));transition:left .5s ease}
    .crown-owner{text-align:center;font-size:.8rem;color:var(--sub);font-weight:600}

    /* ========================================== */
    /* ЧЕМПИОНЫ СЕЗОНА                            */
    /* ========================================== */
    .champion-section{background:var(--elevated);border:1px solid rgba(240,185,11,.2);border-radius:var(--radius-sm);padding:20px;margin-bottom:20px;animation:fadeSlideIn .4s ease}
    .champion-section-title{color:var(--gold);font-size:.9rem;font-weight:700;text-align:center;margin-bottom:16px;letter-spacing:2px;text-transform:uppercase}
    .champion-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
    .champion-card{background:var(--card);border-radius:var(--radius-sm);padding:20px 10px;text-align:center;border:1px solid var(--border);animation:fadeSlideIn .3s ease;transition:transform .2s,box-shadow .2s}
    .champion-card:hover{transform:translateY(-3px)}
    .champion-card.rank-1{border-color:rgba(240,185,11,.5);box-shadow:0 0 24px rgba(240,185,11,.15)}
    .champion-card.rank-2{border-color:rgba(192,192,192,.3)}
    .champion-card.rank-3{border-color:rgba(205,127,50,.3)}
    .champ-avatar{width:52px;height:52px;border-radius:50%;background:var(--elevated);border:2px solid var(--border);display:flex;align-items:center;justify-content:center;margin:0 auto 8px;font-size:1.8rem;transition:border-color .2s}
    .champion-card.rank-1 .champ-avatar{border-color:var(--gold);box-shadow:0 0 16px rgba(240,185,11,.3)}
    .champ-name{color:var(--gold);font-weight:700;font-size:.85rem;word-break:break-word;margin-bottom:4px}
    .champ-crowns{display:flex;justify-content:center;align-items:center;gap:1px;font-size:.85rem;flex-wrap:wrap;max-width:100%}
    .champ-wins-text{color:var(--muted);font-size:.65rem;margin-top:2px}

    /* ========================================== */
    /* ТАБЛИЦЫ                                    */
    /* ========================================== */
    .tables-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .table-card{background:var(--elevated);border-radius:var(--radius-sm);padding:16px;border:1px solid var(--border);animation:fadeSlideIn .3s ease}
    .table-card.full-width{grid-column:span 2}
    .table-card h3{color:var(--gold);font-size:.85rem;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:6px}
    .table-card h3 .table-icon{font-size:1rem}
    tr.row-gold td:first-child{border-left:3px solid var(--gold)}
    tr.row-silver td:first-child{border-left:3px solid var(--silver)}
    tr.row-bronze td:first-child{border-left:3px solid var(--bronze)}

    /* ========================================== */
    /* ТАЙМЛАЙН СЕЗОНОВ                           */
    /* ========================================== */
    .timeline-nav{display:flex;justify-content:center;gap:0;margin-bottom:30px;padding:0 20px;position:relative;overflow-x:auto}
    .timeline-nav::before{content:'';position:absolute;top:50%;left:5%;right:5%;height:2px;background:linear-gradient(90deg,transparent,var(--gold),var(--purple),var(--ice),transparent);z-index:0}
    .tl-item{position:relative;z-index:1;padding:8px 16px;cursor:pointer;text-align:center;transition:.3s;flex-shrink:0;min-width:60px}
    .tl-item .tl-dot{width:38px;height:38px;border-radius:50%;margin:0 auto 6px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:.78rem;transition:.3s;background:var(--elevated);border:2px solid var(--border);color:var(--muted)}
    .tl-item.active .tl-dot{background:var(--gold);border-color:var(--gold);color:#000;box-shadow:0 0 20px rgba(240,185,11,.4);transform:scale(1.15)}
    .tl-item.passed .tl-dot{border-color:var(--gold);color:var(--gold);background:rgba(240,185,11,.08)}
    .tl-item .tl-label{font-size:.55rem;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-top:2px;white-space:nowrap}
    .tl-item.active .tl-label{color:var(--gold);font-weight:700}

    /* ========================================== */
    /* ВКЛАДКИ                                    */
    /* ========================================== */
    .tabs{display:flex;gap:8px;margin-bottom:24px;justify-content:center}
    .tab-btn{padding:10px 24px;border:1px solid var(--border);background:var(--elevated);color:var(--sub);border-radius:var(--radius);cursor:pointer;font-weight:600;font-size:0.85rem;font-family:inherit;transition:all .2s}
    .tab-btn:hover{border-color:var(--gold);color:var(--text);background:var(--card)}
    .tab-btn.active{background:var(--tab-active-bg);color:#000;border-color:var(--gold);font-weight:700;box-shadow:0 4px 12px rgba(240,185,11,0.25)}
    .tab-content{display:none;animation:fadeSlideIn .3s ease}
    .tab-content.active{display:block}

    /* ========================================== */
    /* ТАБЛИЦА ЗА ВСЁ ВРЕМЯ                       */
    /* ========================================== */
    .sortable-header{cursor:pointer;user-select:none;position:relative;padding-right:18px;transition:color .2s}
    .sortable-header:hover{color:var(--gold)}
    .sortable-header::after{content:' ↕';position:absolute;right:4px;opacity:0.4;font-size:0.7rem}
    .sortable-header.asc::after{content:' ↑';opacity:1;color:var(--gold)}
    .sortable-header.desc::after{content:' ↓';opacity:1;color:var(--gold)}
    .search-row{display:flex;gap:10px;margin-bottom:16px;align-items:center;flex-wrap:wrap}
    .search-input{padding:10px 16px;background:var(--elevated);border:1px solid var(--border);border-radius:20px;color:var(--text);font-size:.85rem;font-family:inherit;transition:.2s;width:100%;max-width:340px}
    .search-input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(240,185,11,0.1)}
    .search-input::placeholder{color:var(--muted)}
    .search-clear{background:var(--elevated);border:1px solid var(--border);color:var(--sub);padding:8px 14px;border-radius:20px;cursor:pointer;font-size:.75rem;font-family:inherit;transition:.2s;white-space:nowrap}
    .search-clear:hover{border-color:var(--gold);color:var(--gold)}

    /* Стили строк таблицы */
    #total-table tbody tr{transition:background .2s}
    #total-table tbody tr:hover{background:var(--card)}
    #total-table tbody tr.row-gold{background:rgba(240,185,11,0.06)}
    #total-table tbody tr.row-gold:hover{background:rgba(240,185,11,0.12)}
    #total-table tbody tr.row-silver{background:rgba(192,192,192,0.04)}
    #total-table tbody tr.row-silver:hover{background:rgba(192,192,192,0.1)}
    #total-table tbody tr.row-bronze{background:rgba(205,127,50,0.04)}
    #total-table tbody tr.row-bronze:hover{background:rgba(205,127,50,0.1)}
    #total-table tbody td{padding:10px 12px;font-size:0.82rem}
    #total-table tbody td.number{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
    #total-table thead th{position:sticky;top:0;background:var(--elevated);z-index:2;padding:10px 12px;font-size:0.7rem;text-transform:uppercase;letter-spacing:0.5px}
    .player-link{color:var(--gold);text-decoration:none;font-weight:600;transition:color .2s}
    .player-link:hover{color:var(--text);text-decoration:underline}

    /* ========================================== */
    /* МОБИЛЬНАЯ АДАПТАЦИЯ                        */
    /* ========================================== */
    @media(max-width:768px){
        .stats-grid{grid-template-columns:repeat(2,1fr);gap:8px}
        .stat-value{font-size:1.3rem}
        .season-frame{padding:18px 14px}
        .champion-grid{grid-template-columns:repeat(2,1fr)}
        .tables-grid{grid-template-columns:1fr}
        .table-card.full-width{grid-column:span 1}
        .crown-bar-visual{height:32px}
        .timeline-nav{justify-content:flex-start}
        .tl-item{padding:6px 10px;min-width:50px}
        .tl-item .tl-dot{width:30px;height:30px;font-size:.65rem}
        .hall-tab{padding:10px 16px;font-size:.75rem}
        .search-row{flex-direction:column;align-items:stretch}
        .search-input{max-width:100%}
        #total-table thead th{font-size:0.6rem;padding:8px 6px}
        #total-table tbody td{padding:8px 6px;font-size:0.72rem}
    }
</style>
</head>
<body>

<script>
// ==========================================
// ТЕМА И НАВИГАЦИЯ
// ==========================================
function toggleTheme() {
    const h = document.documentElement;
    const c = h.getAttribute('data-theme');
    const n = c === 'dark' ? 'light' : 'dark';
    h.setAttribute('data-theme', n);
    localStorage.setItem('eternis-theme', n);
}
(function() {
    const s = localStorage.getItem('eternis-theme');
    if (s) document.documentElement.setAttribute('data-theme', s);
})();

function toggleNav() {
    const nav = document.getElementById('pageNav');
    const btn = document.querySelector('.nav-toggle');
    nav.classList.toggle('show');
    btn.textContent = nav.classList.contains('show') ? '✕ Закрыть' : '☰ Меню';
}
document.querySelectorAll('.nav-link').forEach(l => {
    l.addEventListener('click', () => {
        document.getElementById('pageNav').classList.remove('show');
        document.querySelector('.nav-toggle').textContent = '☰ Меню';
    });
});

// ==========================================
// КОНФИГУРАЦИЯ
// ==========================================
const STATS_URL = 'https://raw.githubusercontent.com/rvotaenotaTTV/dnd-stats/main/stats_data.json';
const ARCHIVE_BASE = 'https://raw.githubusercontent.com/rvotaenotaTTV/dnd-stats/main/seasons/season_';
const SEASON_ICONS = ['🏁','🔥','💫','🩸','🕯️','⚡','💀'];
const SEASON_SUBTITLES = ['Первые дуэли. Рождение Арены.','Эра Раскола.','Время перемен.','Кровь Бездны.','Экспедиция.','Раскол Ордена.','Возвращение.'];

let currentSeasonNum = -1;
let seasonTabs = [];
let activeSeason = -1;
let dungeonPlayers = {};
let totalPlayersData = [];

// ==========================================
// ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ
// ==========================================
function getRankClass(index) {
    if (index === 0) return 'row-gold';
    if (index === 1) return 'row-silver';
    if (index === 2) return 'row-bronze';
    return '';
}

function switchHallTab(tab) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('#hall-tab-seasons, #hall-tab-alltime').forEach(c => c.classList.remove('active'));
    if (tab === 'seasons') {
        document.querySelector('.tab-btn:nth-child(1)').classList.add('active');
        document.getElementById('hall-tab-seasons').classList.add('active');
    } else {
        document.querySelector('.tab-btn:nth-child(2)').classList.add('active');
        document.getElementById('hall-tab-alltime').classList.add('active');
    }
}

function clearSearch() {
    document.getElementById('totalSearch').value = '';
    filterTotalTable();
}

// ==========================================
// РЕНДЕР СЕЗОНА
// ==========================================
function renderSeason(data, seasonNum, isCurrent) {
    if (data.dungeon && data.dungeon.players) {
        dungeonPlayers = data.dungeon.players;
    } else if (isCurrent) {
        dungeonPlayers = data.dungeon?.players || {};
    }

    const players = data.players || [];
    const heroArchive = data.heroArchive || {};

    const seasonTop = data.seasonTop && data.seasonTop.length > 0
        ? data.seasonTop
        : [...players].filter(p => (p.skill || 0) > 0).sort((a, b) => (b.skill || 0) - (a.skill || 0));

    const factionScore = data.factionScore || {};
    const territory = data.territory || (data.dungeon && data.dungeon.territory) || { light: 0, dark: 0 };

    const totalPlayers = players.length;
    let totalFights = Math.floor(players.reduce((s, p) => s + (p.wins || 0) + (p.losses || 0), 0) / 2);
    let maxStreak = players.reduce((m, p) => (p.best || 0) > m ? (p.best || 0) : m, 0);
    let maxShards = players.reduce((m, p) => (p.shards || 0) > m ? (p.shards || 0) : m, 0);
    let maxLevel = players.reduce((m, p) => (p.level || 0) > m ? (p.level || 0) : m, 0);
    let maxFactionWins = players.reduce((m, p) => (p.factionWins || 0) > m ? (p.factionWins || 0) : m, 0);
    let worstStreak = players.reduce((m, p) => (p.worst || 0) > m ? (p.worst || 0) : m, 0);

    let allForWR = [...players];
    Object.values(heroArchive).forEach(heroes => {
        heroes.forEach(h => {
            totalFights += Math.floor(((h.wins || 0) + (h.losses || 0)) / 2);
            if ((h.best || 0) > maxStreak) maxStreak = h.best || 0;
            if ((h.worst || 0) > worstStreak) worstStreak = h.worst || 0;
            allForWR.push({ wins: h.wins || 0, losses: h.losses || 0, display: h.name || '', name: h.name || '' });
        });
    });

    const topWR = allForWR
        .filter(p => (p.wins || 0) + (p.losses || 0) >= 30)
        .sort((a, b) => {
            const wa = (a.wins || 0) / ((a.wins || 0) + (a.losses || 0) || 1);
            const wb = (b.wins || 0) / ((b.wins || 0) + (b.losses || 0) || 1);
            return wb - wa;
        });
    const maxWinrate = topWR.length > 0 ? topWR[0] : null;

    const champions = players.filter(p => (p.tournamentWins || 0) > 0).sort((a, b) => (b.tournamentWins || 0) - (a.tournamentWins || 0));
    Object.entries(heroArchive).forEach(([playerKey, heroes]) => {
        heroes.forEach(h => {
            if ((h.tournamentWins || 0) > 0) {
                champions.push({
                    display: playerKey,
                    emoji: h.emoji || '',
                    name: h.name || '',
                    tournamentWins: h.tournamentWins || 0,
                    wins: h.wins || 0,
                    losses: h.losses || 0,
                    faction: '',
                    champion: false
                });
            }
        });
    });
    champions.sort((a, b) => (b.tournamentWins || 0) - (a.tournamentWins || 0));

    const maxDungeonBosses = players.reduce((m, p) => {
        const d = dungeonPlayers[p.display];
        return d && d.bosses > m ? d.bosses : m;
    }, 0);
    const maxSkill = seasonTop.length > 0 ? seasonTop[0].skill || '—' : '—';
    const maxDungeonRecord = players.reduce((m, p) => {
        const d = dungeonPlayers[p.display];
        return d && d.record > m ? d.record : m;
    }, 0);
    const maxDungeonTrophies = players.reduce((m, p) => {
        const d = dungeonPlayers[p.display];
        return d && d.trophies > m ? d.trophies : m;
    }, 0);
    const topDungeon = players
        .map(p => {
            const d = dungeonPlayers[p.display];
            return { ...p, record: d?.record || 0, trophies: d?.trophies || 0 };
        })
        .filter(p => p.record > 0)
        .sort((a, b) => b.record - a.record || b.trophies - a.trophies);

    const duelLight = factionScore.duelLight || 0;
    const duelDark = factionScore.duelDark || 0;
    const battleLight = factionScore.battleLight || 0;
    const battleDark = factionScore.battleDark || 0;
    const totalTerritory = (territory.light || 0) + (territory.dark || 0);
    const lightPct = totalTerritory > 0 ? (territory.light / totalTerritory) * 100 : 50;
    const darkPct = totalTerritory > 0 ? (territory.dark / totalTerritory) * 100 : 50;
    const crownOwner = territory.light > territory.dark ? '🌝 Орден Света' : territory.dark > territory.light ? '🌚 Культ Тьмы' : '⚖️ Ничья';

    const seasonName = `${SEASON_ICONS[seasonNum] || '📋'} Сезон ${seasonNum}`;
    const subtitle = SEASON_SUBTITLES[seasonNum] || '';

    let html = `<div class="season-frame ${isCurrent ? 'live' : 'ended'}">`;
    html += `<div class="season-title">${seasonName} <span class="season-badge ${isCurrent ? 'live' : 'ended'}">${isCurrent ? 'LIVE' : 'ЗАВЕРШЁН'}</span></div>`;
    if (subtitle) html += `<div class="season-quote">«${subtitle}»</div>`;

    html += '<div class="section-subtitle">🏟 Арена</div><div class="stats-grid">';
    html += `<div class="stat-card"><div class="stat-value">${totalPlayers}</div><div class="stat-label">👥 Игроков</div></div>`;
    html += `<div class="stat-card"><div class="stat-value">${totalFights}</div><div class="stat-label">⚔️ Боёв</div></div>`;
    html += `<div class="stat-card"><div class="stat-value">${champions.length || '—'}</div><div class="stat-label">👑 Чемпионов</div></div>`;
    html += `<div class="stat-card"><div class="stat-value">${maxSkill}</div><div class="stat-label">⭐ Макс. SKILL</div></div>`;
    html += `<div class="stat-card"><div class="stat-value">${maxLevel}</div><div class="stat-label">📈 Макс. уровень</div></div>`;
    html += `<div class="stat-card"><div class="stat-value">${maxShards}</div><div class="stat-label">💎 Макс. осколков</div></div>`;
    html += `<div class="stat-card"><div class="stat-value">${maxWinrate ? ((maxWinrate.wins || 0) * 100 / ((maxWinrate.wins || 0) + (maxWinrate.losses || 0) || 1)).toFixed(1) + '%' : '—'}</div><div class="stat-label">📈 Лучший винрейт</div><div class="stat-sub">${maxWinrate ? (maxWinrate.display || maxWinrate.name || '') : ''}</div></div>`;
    html += `<div class="stat-card"><div class="stat-value">${maxStreak}</div><div class="stat-label">🔥 Макс. стрик</div></div>`;
    if (worstStreak > 0 || isCurrent) html += `<div class="stat-card"><div class="stat-value">${worstStreak || '—'}</div><div class="stat-label">💔 Худший стрик</div></div>`;
    if (maxFactionWins > 0 || isCurrent) html += `<div class="stat-card"><div class="stat-value">${maxFactionWins || '—'}</div><div class="stat-label">⚔️ Побед за фракцию</div></div>`;
    if (duelLight + duelDark > 0 || isCurrent) html += `<div class="stat-card"><div class="stat-value">${duelLight} : ${duelDark}</div><div class="stat-label">⚔️ Дуэли Свет vs Тьма</div></div>`;
    if (battleLight + battleDark > 0 || isCurrent) html += `<div class="stat-card"><div class="stat-value">${battleLight} : ${battleDark}</div><div class="stat-label">🏆 Битвы Свет vs Тьма</div></div>`;
    html += '</div>';

    if (totalTerritory > 0) {
        html += '<div class="section-subtitle">👑 Корона Раскола</div><div class="crown-section">';
        html += '<div class="crown-bar-visual">';
        html += `<div class="crown-light" style="flex:${lightPct}">${territory.light > 0 ? territory.light : ''}</div>`;
        html += `<div class="crown-dark" style="flex:${darkPct}">${territory.dark > 0 ? territory.dark : ''}</div>`;
        html += `<div class="crown-icon-center" style="left:${lightPct}%">👑</div>`;
        html += '</div>';
        html += `<div class="crown-owner">Владелец: ${crownOwner}</div>`;
        html += '</div>';
    }

    const dungeonKeys = isCurrent ? Object.keys(data.dungeon?.players || {}) : Object.keys(dungeonPlayers);
    if (dungeonKeys.length > 0) {
        html += '<div class="section-subtitle">🏔 Подземелье</div><div class="stats-grid">';
        html += `<div class="stat-card"><div class="stat-value">${dungeonKeys.length}</div><div class="stat-label">👥 Игроков</div></div>`;
        html += `<div class="stat-card"><div class="stat-value">${maxDungeonRecord || '—'}</div><div class="stat-label">🏆 Рекорд волн</div></div>`;
        html += `<div class="stat-card"><div class="stat-value">${maxDungeonBosses || '—'}</div><div class="stat-label">💀 Боссов убито</div></div>`;
        html += `<div class="stat-card"><div class="stat-value">${maxDungeonTrophies || '—'}</div><div class="stat-label">🐉 Трофеев</div></div>`;
        html += '</div>';
    }

    if (champions.length > 0) {
        html += '<div class="champion-section"><div class="champion-section-title">👑 Чемпионы сезона</div><div class="champion-grid">';
        champions.slice(0, 4).forEach((p, i) => {
            const rankClass = i === 0 ? 'rank-1' : i === 1 ? 'rank-2' : i === 2 ? 'rank-3' : '';
            const wins = p.tournamentWins || 0;
            const crownsHtml = wins <= 5 ? '👑'.repeat(wins) : `👑 ×${wins}`;
            html += `<div class="champion-card ${rankClass}">
                <div class="champ-avatar">${p.emoji || '⚔️'}</div>
                <div class="champ-name">${p.display}</div>
                <div class="champ-crowns">${crownsHtml || '👑'}</div>
                <div class="champ-wins-text">${wins} побед</div>
            </div>`;
        });
        html += '</div></div>';
    } else if (!isCurrent) {
        html += '<div class="champion-section" style="opacity:0.5;text-align:center;padding:20px;color:var(--muted);font-style:italic;">Турниры не проводились — эпоха чистых дуэлей</div>';
    }

    html += '<div class="section-subtitle">📊 Таблицы лидеров</div><div class="tables-grid">';

    if (seasonTop.length > 0) {
        html += '<div class="table-card full-width"><h3><span class="table-icon">🏆</span> Сезонный рейтинг (SKILL)</h3><div class="table-container"><table><thead><tr><th>#</th><th>Игрок</th><th>Класс</th><th>Skill</th><th>Победы</th></tr></thead><tbody>';
        seasonTop.slice(0, 5).forEach((p, i) => {
            html += `<tr class="${getRankClass(i)}"><td>${i + 1}</td><td>${p.display}</td><td>${p.emoji || ''}</td><td class="number">${p.skill}</td><td class="number">${p.wins}</td></tr>`;
        });
        html += '</tbody></table></div></div>';
    }

    const mostActive = [...players].sort((a, b) => ((b.wins || 0) + (b.losses || 0)) - ((a.wins || 0) + (a.losses || 0))).slice(0, 5);
    html += '<div class="table-card"><h3><span class="table-icon">🔥</span> Самые активные</h3><div class="table-container"><table><thead><tr><th>#</th><th>Игрок</th><th>Боёв</th></tr></thead><tbody>';
    mostActive.forEach((p, i) => html += `<tr class="${getRankClass(i)}"><td>${i + 1}</td><td>${p.display}</td><td class="number">${(p.wins || 0) + (p.losses || 0)}</td></tr>`);
    html += '</tbody></table></div></div>';

    const topShards = [...players].sort((a, b) => (b.shards || 0) - (a.shards || 0)).slice(0, 5);
    html += '<div class="table-card"><h3><span class="table-icon">💎</span> Коллекционеры осколков</h3><div class="table-container"><table><thead><tr><th>#</th><th>Игрок</th><th>Осколков</th></tr></thead><tbody>';
    topShards.forEach((p, i) => html += `<tr class="${getRankClass(i)}"><td>${i + 1}</td><td>${p.display}</td><td class="number">${p.shards || 0}</td></tr>`);
    html += '</tbody></table></div></div>';

    const topStreaks = [...players].sort((a, b) => (b.best || 0) - (a.best || 0)).slice(0, 5);
    html += '<div class="table-card"><h3><span class="table-icon">🔥</span> Лучшие серии побед</h3><div class="table-container"><table><thead><tr><th>#</th><th>Игрок</th><th>Побед</th></tr></thead><tbody>';
    topStreaks.forEach((p, i) => html += `<tr class="${getRankClass(i)}"><td>${i + 1}</td><td>${p.display}</td><td class="number">${p.best || 0}</td></tr>`);
    html += '</tbody></table></div></div>';

    html += '<div class="table-card"><h3><span class="table-icon">📈</span> Винрейт (30+ боёв)</h3><div class="table-container"><table><thead><tr><th>#</th><th>Игрок</th><th>WR</th><th>W/L</th></tr></thead><tbody>';
    topWR.slice(0, 5).forEach((p, i) => {
        html += `<tr class="${getRankClass(i)}"><td>${i + 1}</td><td>${p.display || p.name || ''}</td><td class="number">${((p.wins || 0) * 100 / ((p.wins || 0) + (p.losses || 0) || 1)).toFixed(1)}%</td><td class="number">${p.wins || 0}-${p.losses || 0}</td></tr>`;
    });
    html += '</tbody></table></div></div>';

    if (topDungeon.length > 0) {
        html += '<div class="table-card"><h3><span class="table-icon">🏔</span> Рекордсмены данжа</h3><div class="table-container"><table><thead><tr><th>#</th><th>Игрок</th><th>Волн</th></tr></thead><tbody>';
        topDungeon.slice(0, 5).forEach((p, i) => html += `<tr class="${getRankClass(i)}"><td>${i + 1}</td><td>${p.display}</td><td class="number">${p.record}</td></tr>`);
        html += '</tbody></table></div></div>';

        html += '<div class="table-card"><h3><span class="table-icon">🐉</span> Охотники на боссов</h3><div class="table-container"><table><thead><tr><th>#</th><th>Игрок</th><th>Трофеев</th></tr></thead><tbody>';
        [...topDungeon].sort((a, b) => (b.trophies || 0) - (a.trophies || 0)).slice(0, 5).forEach((p, i) => {
            html += `<tr class="${getRankClass(i)}"><td>${i + 1}</td><td>${p.display}</td><td class="number">${p.trophies || 0}</td></tr>`;
        });
        html += '</tbody></table></div></div>';
    }

    html += '</div></div>';
    return html;
}

// ==========================================
// ТОТАЛЬНАЯ СТАТИСТИКА ЗА ВСЕ СЕЗОНЫ
// ==========================================
async function loadTotalStats() {
    const tbody = document.getElementById('total-table-body');
    const summary = document.getElementById('total-summary');
    if (!tbody) return;

    const aggregated = {};

    function addPlayer(display, wins, losses, best, shards, tournaments, dp) {
        if (!display) return;
        if (!aggregated[display]) {
            aggregated[display] = {
                display: display,
                wins: 0, losses: 0, best: 0, shards: 0,
                tournaments: 0,
                dungeonRecord: 0, dungeonWaves: 0, dungeonBosses: 0,
                fights: 0, winrate: 0
            };
        }
        const a = aggregated[display];
        a.wins += wins || 0;
        a.losses += losses || 0;
        a.best = Math.max(a.best, best || 0);
        a.shards += shards || 0;
        a.tournaments += tournaments || 0;
        if (dp) {
            a.dungeonRecord = Math.max(a.dungeonRecord, dp.record || 0);
            a.dungeonWaves += dp.totalWaves || 0;
            a.dungeonBosses += dp.bosses || 0;
        }
    }

    // Текущий сезон
    try {
        const d = await fetch(`${STATS_URL}?v=${Date.now()}`).then(r => r.json());
        (d.players || []).forEach(p => {
            const dp = d.dungeon?.players?.[p.display];
            addPlayer(p.display, p.wins, p.losses, p.best, p.shards, p.tournamentWins, dp);
        });
        if (d.heroArchive) {
            Object.entries(d.heroArchive).forEach(([playerName, heroes]) => {
                heroes.forEach(h => {
                    addPlayer(playerName, h.wins, h.losses, h.best, 0, h.tournamentWins, null);
                });
            });
        }
    } catch (e) {}

    // Архивные сезоны
    for (let n = 0; n < 20; n++) {
        try {
            const r = await fetch(`${ARCHIVE_BASE}${n}.json`);
            if (!r.ok) break;
            const d = await r.json();
            (d.players || []).forEach(p => {
                const dp = d.dungeon?.players?.[p.display];
                addPlayer(p.display, p.wins, p.losses, p.best, p.shards, p.tournamentWins, dp);
            });
            if (d.heroArchive) {
                Object.entries(d.heroArchive).forEach(([playerName, heroes]) => {
                    heroes.forEach(h => {
                        addPlayer(playerName, h.wins, h.losses, h.best, 0, h.tournamentWins, null);
                    });
                });
            }
        } catch (e) { break; }
    }

    totalPlayersData = Object.values(aggregated).map(p => {
        p.fights = p.wins + p.losses;
        p.winrate = p.fights > 0 ? parseFloat((p.wins * 100 / p.fights).toFixed(1)) : 0;
        return p;
    });

    if (totalPlayersData.length === 0) {
        tbody.innerHTML = '<tr><td colspan="11" style="text-align:center;color:var(--muted);padding:40px">Нет данных</td></tr>';
        return;
    }

    totalPlayersData.sort((a, b) => b.wins - a.wins);

    const totalWins = totalPlayersData.reduce((s, p) => s + p.wins, 0);
    const totalLosses = totalPlayersData.reduce((s, p) => s + p.losses, 0);
    const totalFightsAll = Math.floor((totalWins + totalLosses) / 2);
    const totalShardsAll = totalPlayersData.reduce((s, p) => s + p.shards, 0);
    const totalTournamentsAll = totalPlayersData.reduce((s, p) => s + p.tournaments, 0);
    const totalDungeonWavesAll = totalPlayersData.reduce((s, p) => s + p.dungeonWaves, 0);
    const totalDungeonBossesAll = totalPlayersData.reduce((s, p) => s + p.dungeonBosses, 0);

    summary.innerHTML = `
        <div style="background:var(--elevated);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 16px;text-align:center;flex:1;min-width:100px">
            <div style="font-size:1.4rem;font-weight:800;color:var(--gold)">${totalPlayersData.length}</div>
            <div style="font-size:0.65rem;color:var(--muted);margin-top:2px">👥 Игроков</div>
        </div>
        <div style="background:var(--elevated);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 16px;text-align:center;flex:1;min-width:100px">
            <div style="font-size:1.4rem;font-weight:800;color:var(--gold)">${totalFightsAll.toLocaleString()}</div>
            <div style="font-size:0.65rem;color:var(--muted);margin-top:2px">⚔️ Боёв</div>
        </div>
        <div style="background:var(--elevated);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 16px;text-align:center;flex:1;min-width:100px">
            <div style="font-size:1.4rem;font-weight:800;color:var(--gold)">${totalShardsAll.toLocaleString()}</div>
            <div style="font-size:0.65rem;color:var(--muted);margin-top:2px">💎 Осколков</div>
        </div>
        <div style="background:var(--elevated);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 16px;text-align:center;flex:1;min-width:100px">
            <div style="font-size:1.4rem;font-weight:800;color:var(--gold)">${totalTournamentsAll}</div>
            <div style="font-size:0.65rem;color:var(--muted);margin-top:2px">👑 Турниров</div>
        </div>
        <div style="background:var(--elevated);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 16px;text-align:center;flex:1;min-width:100px">
            <div style="font-size:1.4rem;font-weight:800;color:var(--gold)">${totalDungeonWavesAll.toLocaleString()}</div>
            <div style="font-size:0.65rem;color:var(--muted);margin-top:2px">🌊 Волн данжа</div>
        </div>
        <div style="background:var(--elevated);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 16px;text-align:center;flex:1;min-width:100px">
            <div style="font-size:1.4rem;font-weight:800;color:var(--gold)">${totalDungeonBossesAll.toLocaleString()}</div>
            <div style="font-size:0.65rem;color:var(--muted);margin-top:2px">🐉 Боссов</div>
        </div>
    `;

    renderTotalTableFromSorted();
    initTotalSortable();
}

// ==========================================
// ТАБЛИЦА «ЗА ВСЁ ВРЕМЯ»
// ==========================================
function filterTotalTable() {
    const query = document.getElementById('totalSearch').value.toLowerCase().trim();
    const tbody = document.getElementById('total-table-body');
    if (!tbody || !totalPlayersData.length) return;
    if (!query) { renderTotalTableFromSorted(); return; }
    const filtered = totalPlayersData.filter(p => p.display.toLowerCase().includes(query));
    if (!filtered.length) {
        tbody.innerHTML = '<tr><td colspan="11" style="text-align:center;color:var(--muted);padding:40px">🔍 Никого не найдено</td></tr>';
        return;
    }
    renderRows(filtered);
}

function renderTotalTableFromSorted() {
    const tbody = document.getElementById('total-table-body');
    if (!tbody || !totalPlayersData.length) return;
    const query = document.getElementById('totalSearch').value.toLowerCase().trim();
    const data = query ? totalPlayersData.filter(p => p.display.toLowerCase().includes(query)) : totalPlayersData;
    if (!data.length) {
        tbody.innerHTML = '<tr><td colspan="11" style="text-align:center;color:var(--muted);padding:40px">🔍 Никого не найдено</td></tr>';
        return;
    }
    renderRows(data);
}

function renderRows(data) {
    const tbody = document.getElementById('total-table-body');
    tbody.innerHTML = data.map((p, i) => {
        const wrColor = p.winrate >= 55 ? 'var(--green)' : p.winrate >= 45 ? 'var(--gold)' : 'var(--red)';
        const wrBg = p.winrate >= 55 ? 'rgba(16,185,129,0.08)' : p.winrate >= 45 ? 'rgba(240,185,11,0.06)' : 'rgba(232,93,58,0.06)';
        return `<tr class="${i === 0 ? 'row-gold' : i === 1 ? 'row-silver' : i === 2 ? 'row-bronze' : ''}">
            <td><a href="player.html?name=${encodeURIComponent(p.display)}" class="player-link">${p.display}</a></td>
            <td class="number">${p.wins.toLocaleString()}</td>
            <td class="number">${p.losses.toLocaleString()}</td>
            <td class="number" style="color:${wrColor};font-weight:700">${p.winrate}%</td>
            <td class="number">${p.fights.toLocaleString()}</td>
            <td class="number">${p.best}</td>
            <td class="number">${p.shards.toLocaleString()}</td>
            <td class="number">${p.tournaments}</td>
            <td class="number">${p.dungeonRecord || '—'}</td>
            <td class="number">${p.dungeonWaves.toLocaleString() || '—'}</td>
            <td class="number">${p.dungeonBosses.toLocaleString() || '—'}</td>
        </tr>`;
    }).join('');
}

function initTotalSortable() {
    const table = document.getElementById('total-table');
    if (!table) return;
    const headers = table.querySelectorAll('.sortable-header');
    let currentSort = 'wins';
    let currentDir = 'desc';

    headers.forEach(th => {
        th.addEventListener('click', () => {
            const sortBy = th.dataset.sort;
            headers.forEach(h => h.classList.remove('asc', 'desc'));
            if (currentSort === sortBy) {
                currentDir = currentDir === 'asc' ? 'desc' : 'asc';
            } else {
                currentSort = sortBy;
                currentDir = 'desc';
            }
            th.classList.add(currentDir);
            if (sortBy === 'display') {
                totalPlayersData.sort((a, b) => currentDir === 'asc' ? a.display.localeCompare(b.display) : b.display.localeCompare(a.display));
            } else if (sortBy === 'winrate') {
                totalPlayersData.sort((a, b) => currentDir === 'asc' ? a.winrate - b.winrate : b.winrate - a.winrate);
            } else {
                totalPlayersData.sort((a, b) => currentDir === 'asc' ? (a[sortBy] || 0) - (b[sortBy] || 0) : (b[sortBy] || 0) - (a[sortBy] || 0));
            }
            filterTotalTable();
        });
    });

    const defaultHeader = table.querySelector('[data-sort="wins"]');
    if (defaultHeader) defaultHeader.classList.add('desc');
}

function renderTimeline() {
    const container = document.getElementById('season-tabs');
    container.innerHTML = seasonTabs.map(sn => {
        const isActive = sn === activeSeason;
        const isPassed = sn < activeSeason;
        return `<div class="tl-item${isActive ? ' active' : ''}${isPassed ? ' passed' : ''}" onclick="switchSeason(${sn})">
            <div class="tl-dot">${sn}</div>
            <div class="tl-label">Сезон ${sn}</div>
        </div>`;
    }).join('');
}

function switchSeason(sn) {
    if (sn === activeSeason) return;
    activeSeason = sn;
    renderTimeline();
    document.querySelectorAll('#hall-tab-seasons .tab-content').forEach(t => t.classList.remove('active'));
    document.getElementById(`tab-s${sn}`).classList.add('active');
}

// ==========================================
// ПОИСК И ЗАГРУЗКА СЕЗОНОВ
// ==========================================
async function detectSeasons() {
    const foundSeasons = [];
    for (let n = 0; n < 20; n++) {
        try {
            const r = await fetch(`${ARCHIVE_BASE}${n}.json`);
            if (!r.ok) break;
            foundSeasons.push(n);
        } catch (e) { break; }
    }

    currentSeasonNum = foundSeasons.length;
    seasonTabs = [...foundSeasons, currentSeasonNum];

    const contentContainer = document.getElementById('tab-content-container');
    contentContainer.innerHTML = '';

    seasonTabs.forEach((sn, idx) => {
        const isCurrent = sn === currentSeasonNum;
        const isLast = idx === seasonTabs.length - 1;
        const tabId = `tab-s${sn}`;
        const div = document.createElement('div');
        div.id = tabId;
        div.className = `tab-content${isLast ? ' active' : ''}`;
        div.innerHTML = '<div class="status-message"><div class="spinner"></div><p>Загрузка...</p></div>';
        contentContainer.appendChild(div);

        if (isCurrent) {
            loadCurrentSeason(sn, tabId);
        } else {
            loadArchiveSeason(sn, tabId);
        }
    });

    activeSeason = currentSeasonNum;
    renderTimeline();
}

async function loadCurrentSeason(sn, tabId) {
    const container = document.getElementById(tabId);
    try {
        const d = await fetch(`${STATS_URL}?v=${Date.now()}`).then(r => r.json());
        container.innerHTML = renderSeason(d, sn, true);
    } catch {
        container.innerHTML = `<div class="season-frame live"><div class="season-title">${SEASON_ICONS[sn] || '📋'} Сезон ${sn}</div><div class="status-message">❌ Не удалось загрузить данные</div></div>`;
    }
}

async function loadArchiveSeason(sn, tabId) {
    const container = document.getElementById(tabId);
    try {
        const d = await fetch(`${ARCHIVE_BASE}${sn}.json`).then(r => r.json());
        if (sn === 0) d.dungeon = { players: {} };
        container.innerHTML = renderSeason(d, sn, false);
    } catch {
        container.innerHTML = `<div class="season-frame ended"><div class="season-title">${SEASON_ICONS[sn] || '📋'} Сезон ${sn}</div><div class="status-message">❌ Архив недоступен</div></div>`;
    }
}

// ==========================================
// МОБИЛЬНАЯ НАВИГАЦИЯ
// ==========================================
document.querySelectorAll('.nav-label').forEach(label => {
    label.addEventListener('click', function(e) {
        if (window.innerWidth > 768) return;
        e.preventDefault();
        const dd = this.nextElementSibling;
        if (dd && dd.classList.contains('nav-dropdown')) {
            const isOpen = dd.style.display === 'block';
            document.querySelectorAll('.nav-dropdown').forEach(d => d.style.display = 'none');
            dd.style.display = isOpen ? 'none' : 'block';
        }
    });
});

// ==========================================
// ЗАПУСК
// ==========================================
detectSeasons();
loadTotalStats();
</script>
</body>
</html>
