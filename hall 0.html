<style>
    .season-frame{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:28px 24px;margin-bottom:20px;position:relative;overflow:hidden;animation:fadeSlideIn .4s ease}
    .season-frame::after{content:'';position:absolute;top:0;left:0;right:0;height:2px;opacity:.6;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
    .season-frame.live{border-color:rgba(240,185,11,.4)}
    .season-frame.ended{opacity:.9}
    .season-title{font-size:1.2rem;font-weight:800;color:var(--gold);margin-bottom:2px;display:flex;align-items:center;gap:10px}
    .season-badge{display:inline-block;padding:3px 12px;border-radius:20px;font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:1px}
    .season-badge.ended{background:var(--elevated);color:var(--muted)}
    .season-badge.live{background:var(--gold);color:#000;animation:softGlow 2s ease infinite}
    @keyframes softGlow{0%,100%{box-shadow:0 0 8px rgba(240,185,11,.3)}50%{box-shadow:0 0 16px rgba(240,185,11,.6)}}
    .season-quote{background:var(--elevated);border-left:3px solid var(--gold);padding:10px 16px;margin:12px 0 20px;color:var(--sub);font-size:.85rem;font-style:italic;border-radius:0 var(--radius-sm) var(--radius-sm) 0}
    .section-subtitle{display:flex;align-items:center;gap:8px;color:var(--gold);font-size:.85rem;font-weight:700;margin:22px 0 12px;padding-bottom:8px;border-bottom:1px solid var(--border);text-transform:uppercase;letter-spacing:2px}
    .section-subtitle::before{content:'';display:inline-block;width:4px;height:16px;background:var(--gold);border-radius:2px}
    .stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px}
    .stat-card{background:var(--elevated);border-radius:var(--radius-sm);padding:16px 12px;text-align:center;border:1px solid var(--border);transition:transform .2s,box-shadow .2s}
    .stat-card:hover{transform:translateY(-2px)}
    .stat-value{font-size:1.5rem;font-weight:800;color:var(--gold);margin-bottom:2px}
    .stat-label{color:var(--muted);font-size:0.65rem;margin-top:4px;text-transform:uppercase;letter-spacing:1px}
    .stat-sub{color:var(--sub);font-size:.65rem;margin-top:2px}
    .crown-section{margin-bottom:20px}
    .crown-bar-visual{display:flex;height:40px;border-radius:var(--radius-sm);overflow:hidden;border:1px solid var(--border);margin-bottom:8px;position:relative}
    .crown-light{background:linear-gradient(90deg,rgba(240,185,11,.7),rgba(240,185,11,.4));display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.8rem;color:#000;transition:flex .5s ease;min-width:40px}
    .crown-dark{background:linear-gradient(90deg,rgba(163,113,247,.4),rgba(163,113,247,.7));display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.8rem;color:#fff;transition:flex .5s ease;min-width:40px}
    .crown-icon-center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:1.4rem;z-index:3;filter:drop-shadow(0 0 6px rgba(240,185,11,.8));transition:left .5s ease}
    .crown-owner{text-align:center;font-size:.8rem;color:var(--sub);font-weight:600}
    .champion-section{background:var(--elevated);border:1px solid rgba(240,185,11,.2);border-radius:var(--radius-sm);padding:20px;margin-bottom:20px;animation:fadeSlideIn .4s ease}
    .champion-section-title{color:var(--gold);font-size:.9rem;font-weight:700;text-align:center;margin-bottom:16px;letter-spacing:2px;text-transform:uppercase}
    .champion-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
    .champion-card{background:var(--card);border-radius:var(--radius-sm);padding:20px 10px;text-align:center;border:1px solid var(--border);animation:fadeSlideIn .3s ease;transition:transform .2s,box-shadow .2s}
    .champion-card:hover{transform:translateY(-3px)}
    .champion-card.rank-1{border-color:rgba(240,185,11,.5);box-shadow:0 0 24px rgba(240,185,11,.15)}
    .champion-card.rank-2{border-color:rgba(192,192,192,.3)}
    .champion-card.rank-3{border-color:rgba(205,127,50,.3)}
    .champ-avatar{width:52px;height:52px;border-radius:50%;background:var(--elevated);border:2px solid var(--border);display:flex;align-items:center;justify-content:center;margin:0 auto 8px;font-size:1.8rem;transition:border-color .2s}
    .champion-card.rank-1 .champ-avatar{border-color:var(--gold);box-shadow:0 0 16px rgba(240,185,11,.3)}
    .champ-name{color:var(--gold);font-weight:700;font-size:.85rem;word-break:break-word;margin-bottom:4px}
    .champ-crowns{display:flex;justify-content:center;align-items:center;gap:1px;font-size:.85rem;flex-wrap:wrap;max-width:100%}
    .champ-wins-text{color:var(--muted);font-size:.65rem;margin-top:2px}
    .tables-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .table-card{background:var(--elevated);border-radius:var(--radius-sm);padding:16px;border:1px solid var(--border);animation:fadeSlideIn .3s ease}
    .table-card.full-width{grid-column:span 2}
    .table-card h3{color:var(--gold);font-size:.85rem;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:6px}
    .table-card h3 .table-icon{font-size:1rem}
    tr.row-gold td:first-child{border-left:3px solid var(--gold)}
    tr.row-silver td:first-child{border-left:3px solid var(--silver)}
    tr.row-bronze td:first-child{border-left:3px solid var(--bronze)}
    .timeline-nav{display:flex;justify-content:center;gap:0;margin-bottom:30px;padding:0 20px;position:relative;overflow-x:auto}
    .timeline-nav::before{content:'';position:absolute;top:50%;left:5%;right:5%;height:2px;background:linear-gradient(90deg,transparent,var(--gold),var(--purple),var(--ice),transparent);z-index:0}
    .tl-item{position:relative;z-index:1;padding:8px 16px;cursor:pointer;text-align:center;transition:.3s;flex-shrink:0;min-width:60px}
    .tl-item .tl-dot{width:38px;height:38px;border-radius:50%;margin:0 auto 6px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:.78rem;transition:.3s;background:var(--elevated);border:2px solid var(--border);color:var(--muted)}
    .tl-item.active .tl-dot{background:var(--gold);border-color:var(--gold);color:#000;box-shadow:0 0 20px rgba(240,185,11,.4);transform:scale(1.15)}
    .tl-item.passed .tl-dot{border-color:var(--gold);color:var(--gold);background:rgba(240,185,11,.08)}
    .tl-item .tl-label{font-size:.55rem;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-top:2px;white-space:nowrap}
    .tl-item.active .tl-label{color:var(--gold);font-weight:700}

    /* Вкладки */
    .hall-tabs{display:flex;gap:0;margin-bottom:24px;border-bottom:2px solid var(--border)}
    .hall-tab{padding:12px 24px;border:none;background:transparent;color:var(--muted);cursor:pointer;font-size:.85rem;font-weight:600;font-family:inherit;transition:.2s;position:relative;border-bottom:2px solid transparent;margin-bottom:-2px}
    .hall-tab:hover{color:var(--text)}
    .hall-tab.active{color:var(--gold);border-bottom-color:var(--gold)}
    .hall-tab-content{display:none;animation:fadeSlideIn .3s ease}
    .hall-tab-content.active{display:block}

    .sortable-header{cursor:pointer;user-select:none;position:relative;padding-right:18px}
    .sortable-header:hover{color:var(--gold)}
    .sortable-header::after{content:' ↕';position:absolute;right:4px;opacity:0.4;font-size:0.7rem}
    .sortable-header.asc::after{content:' ↑';opacity:1;color:var(--gold)}
    .sortable-header.desc::after{content:' ↓';opacity:1;color:var(--gold)}
    .search-input{padding:10px 16px;background:var(--elevated);border:1px solid var(--border);border-radius:20px;color:var(--text);font-size:.85rem;font-family:inherit;transition:.2s;width:100%}
    .search-input:focus{outline:none;border-color:var(--gold)}
    .search-input::placeholder{color:var(--muted)}

    @media(max-width:768px){
        .stats-grid{grid-template-columns:repeat(2,1fr);gap:8px}
        .stat-value{font-size:1.3rem}
        .season-frame{padding:18px 14px}
        .champion-grid{grid-template-columns:repeat(2,1fr)}
        .tables-grid{grid-template-columns:1fr}
        .table-card.full-width{grid-column:span 1}
        .crown-bar-visual{height:32px}
        .timeline-nav{justify-content:flex-start}
        .tl-item{padding:6px 10px;min-width:50px}
        .tl-item .tl-dot{width:30px;height:30px;font-size:.65rem}
        .hall-tab{padding:10px 16px;font-size:.75rem}
    }
</style>

<script>
function toggleTheme(){const h=document.documentElement;const c=h.getAttribute('data-theme');const n=c==='dark'?'light':'dark';h.setAttribute('data-theme',n);localStorage.setItem('eternis-theme',n);}
(function(){const s=localStorage.getItem('eternis-theme');if(s)document.documentElement.setAttribute('data-theme',s);})();
function toggleNav(){const n=document.getElementById('pageNav'),b=document.querySelector('.nav-toggle');n.classList.toggle('show');b.textContent=n.classList.contains('show')?'✕ Закрыть':'☰ Меню';}
document.querySelectorAll('.nav-link').forEach(l=>l.addEventListener('click',()=>{document.getElementById('pageNav').classList.remove('show');document.querySelector('.nav-toggle').textContent='☰ Меню';}));

const STATS_URL='https://raw.githubusercontent.com/rvotaenotaTTV/dnd-stats/main/stats_data.json';
const ARCHIVE_BASE='https://raw.githubusercontent.com/rvotaenotaTTV/dnd-stats/main/seasons/season_';
const SEASON_ICONS=['🏁','🔥','💫','🩸','🕯️'];
const SEASON_SUBTITLES=['Первые дуэли. Рождение Арены.','Эра Раскола.','Время перемен.','Кровь Бездны.','Экспедиция.'];

let currentSeasonNum=-1,seasonTabs=[],activeSeason=-1,dungeonPlayers={},totalPlayersData=[];

function getRankClass(i){return i===0?'row-gold':i===1?'row-silver':i===2?'row-bronze':'';}

function switchHallTab(tab){
    document.querySelectorAll('.hall-tab').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.hall-tab-content').forEach(c=>c.classList.remove('active'));
    if(tab==='seasons'){
        document.querySelector('.hall-tab:nth-child(1)').classList.add('active');
        document.getElementById('hall-tab-seasons').classList.add('active');
    }else{
        document.querySelector('.hall-tab:nth-child(2)').classList.add('active');
        document.getElementById('hall-tab-alltime').classList.add('active');
    }
}

function renderSeason(data,seasonNum,isCurrent){
    if(data.dungeon&&data.dungeon.players){dungeonPlayers=data.dungeon.players}else if(isCurrent){dungeonPlayers=data.dungeon?.players||{}}
    const players=data.players||[],heroArchive=data.heroArchive||{};
    const seasonTop=data.seasonTop&&data.seasonTop.length>0?data.seasonTop:[...players].filter(p=>(p.skill||0)>0).sort((a,b)=>(b.skill||0)-(a.skill||0));
    const factionScore=data.factionScore||{},territory=data.territory||(data.dungeon&&data.dungeon.territory)||{light:0,dark:0};
    const totalPlayers=players.length;
    let totalFights=Math.floor(players.reduce((s,p)=>s+(p.wins||0)+(p.losses||0),0)/2);
    let maxStreak=players.reduce((m,p)=>(p.best||0)>m?(p.best||0):m,0),maxShards=players.reduce((m,p)=>(p.shards||0)>m?(p.shards||0):m,0),maxLevel=players.reduce((m,p)=>(p.level||0)>m?(p.level||0):m,0),maxFactionWins=players.reduce((m,p)=>(p.factionWins||0)>m?(p.factionWins||0):m,0),worstStreak=players.reduce((m,p)=>(p.worst||0)>m?(p.worst||0):m,0);
    let allForWR=[...players];
    Object.values(heroArchive).forEach(heroes=>{heroes.forEach(h=>{totalFights+=Math.floor(((h.wins||0)+(h.losses||0))/2);if((h.best||0)>maxStreak)maxStreak=h.best||0;if((h.worst||0)>worstStreak)worstStreak=h.worst||0;allForWR.push({wins:h.wins||0,losses:h.losses||0,display:h.name||'',name:h.name||''})})});
    const topWR=allForWR.filter(p=>(p.wins||0)+(p.losses||0)>=30).sort((a,b)=>{const wa=(a.wins||0)/((a.wins||0)+(a.losses||0)||1),wb=(b.wins||0)/((b.wins||0)+(b.losses||0)||1);return wb-wa});
    const maxWinrate=topWR.length>0?topWR[0]:null;
    const champions=players.filter(p=>(p.tournamentWins||0)>0).sort((a,b)=>(b.tournamentWins||0)-(a.tournamentWins||0));
    Object.entries(heroArchive).forEach(([pk,heroes])=>{heroes.forEach(h=>{if((h.tournamentWins||0)>0)champions.push({display:pk,emoji:h.emoji||'',name:h.name||'',tournamentWins:h.tournamentWins||0,wins:h.wins||0,losses:h.losses||0,faction:'',champion:false})})});
    champions.sort((a,b)=>(b.tournamentWins||0)-(a.tournamentWins||0));
    const maxDungeonBosses=players.reduce((m,p)=>{const d=dungeonPlayers[p.display];return d&&d.bosses>m?d.bosses:m},0);
    const maxSkill=seasonTop.length>0?seasonTop[0].skill||'—':'—';
    const maxDungeonRecord=players.reduce((m,p)=>{const d=dungeonPlayers[p.display];return d&&d.record>m?d.record:m},0);
    const maxDungeonTrophies=players.reduce((m,p)=>{const d=dungeonPlayers[p.display];return d&&d.trophies>m?d.trophies:m},0);
    const topDungeon=players.map(p=>{const d=dungeonPlayers[p.display];return{...p,record:d?.record||0,trophies:d?.trophies||0}}).filter(p=>p.record>0).sort((a,b)=>b.record-a.record||b.trophies-a.trophies);
    const duelLight=factionScore.duelLight||0,duelDark=factionScore.duelDark||0,battleLight=factionScore.battleLight||0,battleDark=factionScore.battleDark||0;
    const totalTerritory=(territory.light||0)+(territory.dark||0),lightPct=totalTerritory>0?(territory.light/totalTerritory)*100:50,darkPct=totalTerritory>0?(territory.dark/totalTerritory)*100:50;
    const crownOwner=territory.light>territory.dark?'🌝 Орден Света':territory.dark>territory.light?'🌚 Культ Тьмы':'⚖️ Ничья';
    const seasonName=`${SEASON_ICONS[seasonNum]||'📋'} Сезон ${seasonNum}`,subtitle=SEASON_SUBTITLES[seasonNum]||'';
    let h=`<div class="season-frame ${isCurrent?'live':'ended'}">`;
    h+=`<div class="season-title">${seasonName} <span class="season-badge ${isCurrent?'live':'ended'}">${isCurrent?'LIVE':'ЗАВЕРШЁН'}</span></div>`;
    if(subtitle)h+=`<div class="season-quote">«${subtitle}»</div>`;
    h+='<div class="section-subtitle">🏟 Арена</div><div class="stats-grid">';
    h+=`<div class="stat-card"><div class="stat-value">${totalPlayers}</div><div class="stat-label">👥 Игроков</div></div>`;
    h+=`<div class="stat-card"><div class="stat-value">${totalFights}</div><div class="stat-label">⚔️ Боёв</div></div>`;
    h+=`<div class="stat-card"><div class="stat-value">${champions.length||'—'}</div><div class="stat-label">👑 Чемпионов</div></div>`;
    h+=`<div class="stat-card"><div class="stat-value">${maxSkill}</div><div class="stat-label">⭐ Макс. SKILL</div></div>`;
    h+=`<div class="stat-card"><div class="stat-value">${maxLevel}</div><div class="stat-label">📈 Макс. уровень</div></div>`;
    h+=`<div class="stat-card"><div class="stat-value">${maxShards}</div><div class="stat-label">💎 Макс. осколков</div></div>`;
    h+=`<div class="stat-card"><div class="stat-value">${maxWinrate?((maxWinrate.wins||0)*100/((maxWinrate.wins||0)+(maxWinrate.losses||0)||1)).toFixed(1)+'%':'—'}</div><div class="stat-label">📈 Лучший винрейт</div><div class="stat-sub">${maxWinrate?(maxWinrate.display||maxWinrate.name||''):''}</div></div>`;
    h+=`<div class="stat-card"><div class="stat-value">${maxStreak}</div><div class="stat-label">🔥 Макс. стрик</div></div>`;
    if(worstStreak>0||isCurrent)h+=`<div class="stat-card"><div class="stat-value">${worstStreak||'—'}</div><div class="stat-label">💔 Худший стрик</div></div>`;
    if(maxFactionWins>0||isCurrent)h+=`<div class="stat-card"><div class="stat-value">${maxFactionWins||'—'}</div><div class="stat-label">⚔️ Побед за фракцию</div></div>`;
    if(duelLight+duelDark>0||isCurrent)h+=`<div class="stat-card"><div class="stat-value">${duelLight}:${duelDark}</div><div class="stat-label">⚔️ Дуэли Свет vs Тьма</div></div>`;
    if(battleLight+battleDark>0||isCurrent)h+=`<div class="stat-card"><div class="stat-value">${battleLight}:${battleDark}</div><div class="stat-label">🏆 Битвы Свет vs Тьма</div></div>`;
    h+='</div>';
    if(totalTerritory>0){h+='<div class="section-subtitle">👑 Корона Раскола</div><div class="crown-section"><div class="crown-bar-visual">';h+=`<div class="crown-light" style="flex:${lightPct}">${territory.light>0?territory.light:''}</div>`;h+=`<div class="crown-dark" style="flex:${darkPct}">${territory.dark>0?territory.dark:''}</div>`;h+=`<div class="crown-icon-center" style="left:${lightPct}%">👑</div></div>`;h+=`<div class="crown-owner">Владелец: ${crownOwner}</div></div>`}
    const dungeonKeys=isCurrent?Object.keys(data.dungeon?.players||{}):Object.keys(dungeonPlayers);
    if(dungeonKeys.length>0){h+='<div class="section-subtitle">🏔 Подземелье</div><div class="stats-grid">';h+=`<div class="stat-card"><div class="stat-value">${dungeonKeys.length}</div><div class="stat-label">👥 Игроков</div></div>`;h+=`<div class="stat-card"><div class="stat-value">${maxDungeonRecord||'—'}</div><div class="stat-label">🏆 Рекорд волн</div></div>`;h+=`<div class="stat-card"><div class="stat-value">${maxDungeonBosses||'—'}</div><div class="stat-label">💀 Боссов убито</div></div>`;h+=`<div class="stat-card"><div class="stat-value">${maxDungeonTrophies||'—'}</div><div class="stat-label">🐉 Трофеев</div></div>`;h+='</div>'}
    if(champions.length>0){h+='<div class="champion-section"><div class="champion-section-title">👑 Чемпионы сезона</div><div class="champion-grid">';champions.slice(0,4).forEach((p,i)=>{const rc=i===0?'rank-1':i===1?'rank-2':i===2?'rank-3':'',w=p.tournamentWins||0,ch=w<=5?'👑'.repeat(w):`👑 ×${w}`;h+=`<div class="champion-card ${rc}"><div class="champ-avatar">${p.emoji||'⚔️'}</div><div class="champ-name">${p.display}</div><div class="champ-crowns">${ch||'👑'}</div><div class="champ-wins-text">${w} побед</div></div>`});h+='</div></div>'}else if(!isCurrent){h+='<div class="champion-section" style="opacity:0.5;text-align:center;padding:20px;color:var(--muted);font-style:italic;">Турниры не проводились — эпоха чистых дуэлей</div>'}
    h+='<div class="section-subtitle">📊 Таблицы лидеров</div><div class="tables-grid">';
    if(seasonTop.length>0){h+='<div class="table-card full-width"><h3><span class="table-icon">🏆</span> Сезонный рейтинг (SKILL)</h3><div class="table-container"><table><thead><tr><th>#</th><th>Игрок</th><th>Класс</th><th>Skill</th><th>Победы</th></tr></thead><tbody>';seasonTop.slice(0,5).forEach((p,i)=>{h+=`<tr class="${getRankClass(i)}"><td>${i+1}</td><td>${p.display}</td><td>${p.emoji||''}</td><td class="number">${p.skill}</td><td class="number">${p.wins}</td></tr>`});h+='</tbody></table></div></div>'}
    const mostActive=[...players].sort((a,b)=>((b.wins||0)+(b.losses||0))-((a.wins||0)+(a.losses||0))).slice(0,5);
    h+='<div class="table-card"><h3><span class="table-icon">🔥</span> Самые активные</h3><div class="table-container"><table><thead><tr><th>#</th><th>Игрок</th><th>Боёв</th></tr></thead><tbody>';
    mostActive.forEach((p,i)=>h+=`<tr class="${getRankClass(i)}"><td>${i+1}</td><td>${p.display}</td><td class="number">${(p.wins||0)+(p.losses||0)}</td></tr>`);
    h+='</tbody></table></div></div>';
    const topShards=[...players].sort((a,b)=>(b.shards||0)-(a.shards||0)).slice(0,5);
    h+='<div class="table-card"><h3><span class="table-icon">💎</span> Коллекционеры осколков</h3><div class="table-container"><table><thead><tr><th>#</th><th>Игрок</th><th>Осколков</th></tr></thead><tbody>';
    topShards.forEach((p,i)=>h+=`<tr class="${getRankClass(i)}"><td>${i+1}</td><td>${p.display}</td><td class="number">${p.shards||0}</td></tr>`);
    h+='</tbody></table></div></div>';
    const topStreaks=[...players].sort((a,b)=>(b.best||0)-(a.best||0)).slice(0,5);
    h+='<div class="table-card"><h3><span class="table-icon">🔥</span> Лучшие серии побед</h3><div class="table-container"><table><thead><tr><th>#</th><th>Игрок</th><th>Побед</th></tr></thead><tbody>';
    topStreaks.forEach((p,i)=>h+=`<tr class="${getRankClass(i)}"><td>${i+1}</td><td>${p.display}</td><td class="number">${p.best||0}</td></tr>`);
    h+='</tbody></table></div></div>';
    h+='<div class="table-card"><h3><span class="table-icon">📈</span> Винрейт (30+ боёв)</h3><div class="table-container"><table><thead><tr><th>#</th><th>Игрок</th><th>WR</th><th>W/L</th></tr></thead><tbody>';
    topWR.slice(0,5).forEach((p,i)=>{h+=`<tr class="${getRankClass(i)}"><td>${i+1}</td><td>${p.display||p.name||''}</td><td class="number">${((p.wins||0)*100/((p.wins||0)+(p.losses||0)||1)).toFixed(1)}%</td><td class="number">${p.wins||0}-${p.losses||0}</td></tr>`});
    h+='</tbody></table></div></div>';
    if(topDungeon.length>0){h+='<div class="table-card"><h3><span class="table-icon">🏔</span> Рекордсмены данжа</h3><div class="table-container"><table><thead><tr><th>#</th><th>Игрок</th><th>Волн</th></tr></thead><tbody>';topDungeon.slice(0,5).forEach((p,i)=>h+=`<tr class="${getRankClass(i)}"><td>${i+1}</td><td>${p.display}</td><td class="number">${p.record}</td></tr>`);h+='</tbody></table></div></div>';h+='<div class="table-card"><h3><span class="table-icon">🐉</span> Охотники на боссов</h3><div class="table-container"><table><thead><tr><th>#</th><th>Игрок</th><th>Трофеев</th></tr></thead><tbody>';[...topDungeon].sort((a,b)=>(b.trophies||0)-(a.trophies||0)).slice(0,5).forEach((p,i)=>{h+=`<tr class="${getRankClass(i)}"><td>${i+1}</td><td>${p.display}</td><td class="number">${p.trophies||0}</td></tr>`});h+='</tbody></table></div></div>'}
    h+='</div></div>';
    return h;
}

async function loadTotalStats(){
    const tbody=document.getElementById('total-table-body'),summary=document.getElementById('total-summary');
    if(!tbody)return;
    const agg={};
    function add(p,dp){
        const k=p.display;if(!k)return;
        if(!agg[k])agg[k]={display:k,emoji:p.emoji||'',name:p.name||'',wins:0,losses:0,best:0,shards:0,tournaments:0,dungeonRecord:0,dungeonWaves:0,dungeonBosses:0,fights:0,winrate:0};
        const a=agg[k];a.wins+=p.wins||0;a.losses+=p.losses||0;a.best=Math.max(a.best,p.best||0);a.shards+=p.shards||0;a.tournaments+=p.tournamentWins||0;a.emoji=p.emoji||a.emoji;a.name=p.name||a.name;
        if(dp){a.dungeonRecord=Math.max(a.dungeonRecord,dp.record||0);a.dungeonWaves+=dp.totalWaves||0;a.dungeonBosses+=dp.bosses||0}
    }
    try{const d=await fetch(`${STATS_URL}?v=${Date.now()}`).then(r=>r.json());(d.players||[]).forEach(p=>{const dp=d.dungeon?.players?.[p.display];add(p,dp)})}catch(e){}
    for(let n=0;n<20;n++){try{const r=await fetch(`${ARCHIVE_BASE}${n}.json`);if(!r.ok)break;const d=await r.json();(d.players||[]).forEach(p=>{const dp=d.dungeon?.players?.[p.display];add(p,dp)})}catch(e){break}}
    totalPlayersData=Object.values(agg).map(p=>{p.fights=p.wins+p.losses;p.winrate=p.fights>0?parseFloat((p.wins*100/p.fights).toFixed(1)):0;return p});
    if(!totalPlayersData.length){tbody.innerHTML='<tr><td colspan="11" style="text-align:center;color:var(--muted);padding:20px">Нет данных</td></tr>';return}
    totalPlayersData.sort((a,b)=>b.wins-a.wins);
    const tw=totalPlayersData.reduce((s,p)=>s+p.wins,0),tl=totalPlayersData.reduce((s,p)=>s+p.losses,0),tf=Math.floor((tw+tl)/2),ts=totalPlayersData.reduce((s,p)=>s+p.shards,0),tt=totalPlayersData.reduce((s,p)=>s+p.tournaments,0),tdw=totalPlayersData.reduce((s,p)=>s+p.dungeonWaves,0),tdb=totalPlayersData.reduce((s,p)=>s+p.dungeonBosses,0);
    summary.innerHTML=`<div style="background:var(--elevated);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 16px;text-align:center;flex:1;min-width:100px"><div style="font-size:1.2rem;font-weight:800;color:var(--gold)">${totalPlayersData.length}</div><div style="font-size:0.6rem;color:var(--muted)">👥 Игроков</div></div><div style="background:var(--elevated);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 16px;text-align:center;flex:1;min-width:100px"><div style="font-size:1.2rem;font-weight:800;color:var(--gold)">${tf}</div><div style="font-size:0.6rem;color:var(--muted)">⚔️ Боёв</div></div><div style="background:var(--elevated);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 16px;text-align:center;flex:1;min-width:100px"><div style="font-size:1.2rem;font-weight:800;color:var(--gold)">${ts.toLocaleString()}</div><div style="font-size:0.6rem;color:var(--muted)">💎 Осколков</div></div><div style="background:var(--elevated);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 16px;text-align:center;flex:1;min-width:100px"><div style="font-size:1.2rem;font-weight:800;color:var(--gold)">${tt}</div><div style="font-size:0.6rem;color:var(--muted)">👑 Турниров</div></div><div style="background:var(--elevated);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 16px;text-align:center;flex:1;min-width:100px"><div style="font-size:1.2rem;font-weight:800;color:var(--gold)">${tdw.toLocaleString()}</div><div style="font-size:0.6rem;color:var(--muted)">🌊 Волн данжа</div></div><div style="background:var(--elevated);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 16px;text-align:center;flex:1;min-width:100px"><div style="font-size:1.2rem;font-weight:800;color:var(--gold)">${tdb.toLocaleString()}</div><div style="font-size:0.6rem;color:var(--muted)">🐉 Боссов</div></div>`;
    renderTotalTableFromSorted();initTotalSortable();
}

function filterTotalTable(){
    const query=document.getElementById('totalSearch').value.toLowerCase().trim();
    const tbody=document.getElementById('total-table-body');
    if(!tbody||!totalPlayersData.length)return;
    if(!query){renderTotalTableFromSorted();return}
    const filtered=totalPlayersData.filter(p=>p.display.toLowerCase().includes(query));
    if(!filtered.length){tbody.innerHTML='<tr><td colspan="11" style="text-align:center;color:var(--muted);padding:20px">Никого не найдено</td></tr>';return}
    tbody.innerHTML=filtered.map((p,i)=>{const c=p.winrate>=55?'var(--green)':p.winrate>=45?'var(--gold)':'var(--red)';return`<tr class="${i===0?'row-gold':i===1?'row-silver':i===2?'row-bronze':''}"><td>${p.display}</td><td class="number">${p.wins}</td><td class="number">${p.losses}</td><td class="number" style="color:${c};font-weight:700">${p.winrate}%</td><td class="number">${p.fights}</td><td class="number">${p.best}</td><td class="number">${p.shards}</td><td class="number">${p.tournaments}</td><td class="number">${p.dungeonRecord||'—'}</td><td class="number">${p.dungeonWaves||'—'}</td><td class="number">${p.dungeonBosses||'—'}</td></tr>`}).join('');
}

function initTotalSortable(){
    const table=document.getElementById('total-table');if(!table)return;
    const headers=table.querySelectorAll('.sortable-header');let cs='wins',cd='desc';
    headers.forEach(th=>{th.addEventListener('click',()=>{const sb=th.dataset.sort;headers.forEach(h=>h.classList.remove('asc','desc'));if(cs===sb){cd=cd==='asc'?'desc':'asc'}else{cs=sb;cd='desc'}th.classList.add(cd);if(sb==='display'){totalPlayersData.sort((a,b)=>cd==='asc'?a.display.localeCompare(b.display):b.display.localeCompare(a.display))}else if(sb==='winrate'){totalPlayersData.sort((a,b)=>cd==='asc'?a.winrate-b.winrate:b.winrate-a.winrate)}else{totalPlayersData.sort((a,b)=>cd==='asc'?(a[sb]||0)-(b[sb]||0):(b[sb]||0)-(a[sb]||0))}filterTotalTable()})});
    const dh=table.querySelector('[data-sort="wins"]');if(dh)dh.classList.add('desc');
}

function renderTotalTableFromSorted(){
    const tbody=document.getElementById('total-table-body');if(!tbody||!totalPlayersData.length)return;
    const query=document.getElementById('totalSearch').value.toLowerCase().trim();
    const data=query?totalPlayersData.filter(p=>p.display.toLowerCase().includes(query)):totalPlayersData;
    if(!data.length){tbody.innerHTML='<tr><td colspan="11" style="text-align:center;color:var(--muted);padding:20px">Никого не найдено</td></tr>';return}
    tbody.innerHTML=data.map((p,i)=>{const c=p.winrate>=55?'var(--green)':p.winrate>=45?'var(--gold)':'var(--red)';return`<tr class="${i===0?'row-gold':i===1?'row-silver':i===2?'row-bronze':''}"><td>${p.display}</td><td class="number">${p.wins}</td><td class="number">${p.losses}</td><td class="number" style="color:${c};font-weight:700">${p.winrate}%</td><td class="number">${p.fights}</td><td class="number">${p.best}</td><td class="number">${p.shards}</td><td class="number">${p.tournaments}</td><td class="number">${p.dungeonRecord||'—'}</td><td class="number">${p.dungeonWaves||'—'}</td><td class="number">${p.dungeonBosses||'—'}</td></tr>`}).join('');
}

function renderTimeline(){const c=document.getElementById('season-tabs');c.innerHTML=seasonTabs.map(sn=>{const ia=sn===activeSeason,ip=sn<activeSeason;return`<div class="tl-item${ia?' active':''}${ip?' passed':''}" onclick="switchSeason(${sn})"><div class="tl-dot">${sn}</div><div class="tl-label">Сезон ${sn}</div></div>`}).join('')}
function switchSeason(sn){if(sn===activeSeason)return;activeSeason=sn;renderTimeline();document.querySelectorAll('#hall-tab-seasons .tab-content').forEach(t=>t.classList.remove('active'));document.getElementById(`tab-s${sn}`).classList.add('active')}

async function detectSeasons(){
    const fs=[];for(let n=0;n<20;n++){try{const r=await fetch(`${ARCHIVE_BASE}${n}.json`);if(!r.ok)break;fs.push(n)}catch(e){break}}
    currentSeasonNum=fs.length;seasonTabs=[...fs,currentSeasonNum];
    const cc=document.getElementById('tab-content-container');cc.innerHTML='';
    seasonTabs.forEach((sn,idx)=>{const ic=sn===currentSeasonNum,il=idx===seasonTabs.length-1,tabId=`tab-s${sn}`,div=document.createElement('div');div.id=tabId;div.className=`tab-content${il?' active':''}`;div.innerHTML='<div class="status-message"><div class="spinner"></div><p>Загрузка...</p></div>';cc.appendChild(div);if(ic)loadCurrentSeason(sn,tabId);else loadArchiveSeason(sn,tabId)});
    activeSeason=currentSeasonNum;renderTimeline();
}

async function loadCurrentSeason(sn,tabId){const c=document.getElementById(tabId);try{const d=await fetch(`${STATS_URL}?v=${Date.now()}`).then(r=>r.json());c.innerHTML=renderSeason(d,sn,true)}catch{c.innerHTML=`<div class="season-frame live"><div class="season-title">${SEASON_ICONS[sn]||'📋'} Сезон ${sn}</div><div class="status-message">❌ Не удалось загрузить данные</div></div>`}}
async function loadArchiveSeason(sn,tabId){const c=document.getElementById(tabId);try{const d=await fetch(`${ARCHIVE_BASE}${sn}.json`).then(r=>r.json());if(sn===0)d.dungeon={players:{}};c.innerHTML=renderSeason(d,sn,false)}catch{c.innerHTML=`<div class="season-frame ended"><div class="season-title">${SEASON_ICONS[sn]||'📋'} Сезон ${sn}</div><div class="status-message">❌ Архив недоступен</div></div>`}}

document.querySelectorAll('.nav-label').forEach(label=>{label.addEventListener('click',function(e){if(window.innerWidth>768)return;e.preventDefault();const dd=this.nextElementSibling;if(dd&&dd.classList.contains('nav-dropdown')){const io=dd.style.display==='block';document.querySelectorAll('.nav-dropdown').forEach(d=>d.style.display='none');dd.style.display=io?'none':'block'}})});

detectSeasons();
loadTotalStats();
</script>
</body>
</html>
