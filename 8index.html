<style>
    .container { max-width: 1200px; }
    .stats-grid { grid-template-columns: repeat(6, 1fr); margin-bottom: 24px; }
	.stat-card { padding: 20px 14px; transition: 0.2s; position: relative; overflow: hidden; display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 110px; }
    .stat-card::after { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, transparent, var(--gold), transparent); opacity: 0.4; }
    .stat-card:hover { transform: translateY(-2px); border-color: rgba(240,185,11,0.3); }
    .stat-value { font-size: 2rem; }
    .stat-label { margin-top: 6px; }
    .faction-light { color: var(--gold); }
    .faction-dark { color: var(--purple); }

    .tw-active-card { background: var(--card); border: 1px solid rgba(240,185,11,0.2); border-radius: var(--radius); padding: 20px 24px; margin-bottom: 20px; }
    .tw-active-header { display: flex; justify-content: center; align-items: center; margin-bottom: 16px; flex-wrap: wrap; gap: 8px; }
    .tw-active-name { font-size: 1.1rem; font-weight: 800; color: var(--text); text-align: center; }
    .tw-active-name span { color: var(--gold); }
    .tw-active-points { font-size: 0.72rem; color: var(--muted); }

    .tw-labels { display: flex; justify-content: space-between; font-size: 0.85rem; font-weight: 700; margin-bottom: 8px; padding: 0 4px; }
    .tw-labels .light { color: var(--gold); display: flex; align-items: center; gap: 6px; }
    .tw-labels .dark { color: var(--purple); display: flex; align-items: center; gap: 6px; }

    .tw-bar { height: 36px; border-radius: 18px; background: var(--bg); border: 2px solid var(--border); display: flex; overflow: hidden; margin-bottom: 20px; }
    .tw-bar-light { background: linear-gradient(135deg, #c49600, #ffd700); color: #000; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 0.9rem; transition: width 0.6s; }
    .tw-bar-dark { background: linear-gradient(135deg, #3d1060, #a371f7); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 0.9rem; transition: width 0.6s; }

    .tw-finished-bar { height: 36px; border-radius: 18px; overflow: hidden; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 0.85rem; margin-bottom: 8px; border: 2px solid var(--border); gap: 6px; }
    .tw-finished-bar.light { background: linear-gradient(135deg, #c49600, #ffd700); color: #000; }
    .tw-finished-bar.dark { background: linear-gradient(135deg, #3d1060, #a371f7); color: #fff; }
    .tw-finished-bar.draw { background: linear-gradient(135deg, #4a4a4a, #8a8a8a); color: #fff; }

    .tw-history { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 18px; margin-bottom: 20px; }
    .tw-history-title { font-size: 0.85rem; font-weight: 700; color: var(--gold); margin-bottom: 10px; }
    .tw-history-list { display: flex; flex-direction: column; gap: 6px; max-height: 250px; overflow-y: auto; scrollbar-width: thin; padding-right: 4px; }
    .tw-history-item { display: grid; grid-template-columns: 32px 1fr auto auto auto; gap: 10px; align-items: center; padding: 6px 10px; border-radius: var(--radius-sm); background: var(--elevated); font-size: 0.72rem; border-left: 3px solid var(--border); }
    .tw-history-item.light { border-left-color: var(--gold); }
    .tw-history-item.dark { border-left-color: var(--purple); }
    .tw-hist-num { color: var(--muted); font-weight: 700; }
    .tw-hist-name { color: var(--text); }
    .tw-hist-owner { color: var(--sub); white-space: nowrap; display: inline-flex; align-items: center; gap: 4px; }
    .tw-hist-score { color: var(--muted); font-variant-numeric: tabular-nums; }
    .tw-hist-points { color: var(--gold); font-weight: 700; }
    .tw-history-empty { color: var(--muted); font-size: 0.78rem; padding: 6px 0; }

    .tw-actions { display: flex; gap: 12px; justify-content: center; }
    .tw-btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; background: var(--elevated); border: 1px solid var(--border); color: var(--text); font-weight: 600; border-radius: var(--radius-sm); cursor: pointer; font-size: 0.8rem; transition: 0.2s; }
    .tw-btn:hover { border-color: var(--gold); background: rgba(240,185,11,0.1); }

    .nav-tabs { display: flex; gap: 14px; margin: 20px 0; padding: 4px; background: var(--card); border-radius: var(--radius); border: 1px solid var(--border); flex-wrap: nowrap; overflow-x: auto; }
    .tab-btn { padding: 10px 16px; font-size: 0.75rem; white-space: nowrap; flex-shrink: 0; background: none; border: none; color: var(--muted); border-radius: var(--radius-sm); cursor: pointer; }
    .tab-btn:hover { background: var(--elevated); color: var(--text); }
    .tab-btn.active { background: linear-gradient(135deg, var(--ice), var(--gold)); color: #000; font-weight: 700; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .tables-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); gap: 16px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 18px; position: relative; overflow: hidden; margin-bottom: 16px; animation: fadeSlideIn 0.4s ease; }
    .card::after { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, transparent, var(--gold), transparent); opacity: 0.5; }
    .card-title { font-size: 0.95rem; font-weight: 700; color: var(--gold); margin-bottom: 12px; }

    table { min-width: auto; }
    td:first-child { font-weight: 600; color: var(--gold); }

    .hunters-top { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 24px; padding: 20px 16px 16px; background: var(--elevated); border-radius: var(--radius-sm); border: 1px solid rgba(240,185,11,0.15); position: relative; }
    .hunters-top::before { content: '🏆 ЛИДЕРЫ'; position: absolute; top: -10px; left: 50%; transform: translateX(-50%); background: var(--gold); color: #000; padding: 2px 12px; border-radius: 10px; font-size: 0.6rem; font-weight: 700; letter-spacing: 1px; }
    .hunter-card { background: var(--elevated); border: 1px solid rgba(240,185,11,0.2); border-radius: var(--radius-sm); padding: 18px 12px; text-align: center; animation: fadeSlideIn 0.4s ease; }
    .hunter-medal { font-size: 1.8rem; }
    .hunter-name { font-size: 1rem; color: var(--gold); font-weight: 700; }
    .hunter-count { color: var(--muted); font-size: 0.78rem; margin: 4px 0; }

    .titles-gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; margin-bottom: 24px; }
    .title-card { background: var(--elevated); border-radius: var(--radius-sm); padding: 14px; border: 1px solid var(--border); transition: 0.2s; animation: fadeSlideIn 0.3s ease; }
    .title-card:hover { transform: translateY(-2px); border-color: var(--gold); }
    .title-emoji { font-size: 1.3rem; }
    .title-name { color: var(--gold); font-weight: 700; margin: 4px 0; font-size: 0.85rem; }
    .title-cond { color: var(--muted); font-size: 0.68rem; margin-bottom: 8px; }
    .title-progress { background: var(--bg); height: 5px; border-radius: 3px; margin: 6px 0; }
    .title-progress-fill { background: var(--gold); height: 5px; border-radius: 3px; }
    .title-holders { color: var(--muted); font-size: 0.7rem; }

    .champion-block { background: var(--elevated); border: 1px solid rgba(240,185,11,0.2); border-radius: var(--radius-sm); padding: 22px; text-align: center; margin-bottom: 16px; animation: cardGlow 3s ease-in-out infinite; }
    @keyframes cardGlow { 0%,100%{box-shadow:0 0 0 rgba(240,185,11,0)} 50%{box-shadow:0 0 20px rgba(240,185,11,0.15)} }
    .champion-emoji { font-size: 2.5rem; }
    .champion-name { font-size: 1.3rem; color: var(--gold); font-weight: 800; }
    .champion-class { font-size: 0.85rem; color: var(--muted); }

    @keyframes fadeSlideIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    tbody tr:nth-child(1) { animation-delay: 0.02s; } tbody tr:nth-child(2) { animation-delay: 0.04s; } tbody tr:nth-child(3) { animation-delay: 0.06s; }
    tbody tr:nth-child(4) { animation-delay: 0.08s; } tbody tr:nth-child(5) { animation-delay: 0.10s; } tbody tr:nth-child(6) { animation-delay: 0.12s; }
    tbody tr:nth-child(7) { animation-delay: 0.14s; } tbody tr:nth-child(8) { animation-delay: 0.16s; } tbody tr:nth-child(9) { animation-delay: 0.18s; }
    tbody tr:nth-child(10) { animation-delay: 0.20s; }

    .modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.85); z-index:2000; align-items:center; justify-content:center; padding:20px; }
    .modal-overlay.visible { display:flex; }
    .modal-content { background:var(--card); border:1px solid var(--gold); border-radius:var(--radius); max-width:1100px; width:100%; max-height:92vh; display:flex; flex-direction:column; overflow:hidden; box-shadow:0 0 40px rgba(240,185,11,.2); }
    .modal-header { display:flex; justify-content:space-between; align-items:center; padding:16px 20px; border-bottom:1px solid var(--border); gap:12px; flex-wrap:wrap; position:relative; }
    .modal-title { font-size:1.1rem; font-weight:800; color:var(--gold); text-transform: uppercase; letter-spacing: 1px; }
    .modal-close { background:none; border:none; color:var(--muted); font-size:1.5rem; cursor:pointer; padding:4px 8px; line-height:1; position:absolute; right:20px; top:50%; transform:translateY(-50%); transition:0.2s; }
    .modal-close:hover { color:var(--red); transform:translateY(-50%) scale(1.1); }
    .modal-body { padding:16px; overflow-y: auto; overflow-x: hidden; scrollbar-width: none; -ms-overflow-style: none; }
    .modal-body::-webkit-scrollbar { display: none; }

    .modal-score-center { position: absolute; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 8px; background: var(--bg); padding: 6px 16px; border-radius: 20px; border: 1px solid var(--border); }
    .map-score-num { font-size: 1.2rem; font-weight: 900; }
    .map-score-num.light { color: var(--gold); }
    .map-score-num.dark { color: var(--purple); }
    .map-score-vs { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }

    .map-inline-wrap { position: relative; width: 100%; border-radius: var(--radius-sm); overflow: hidden; border: 1px solid var(--border); background: #0d1117; }
    .map-inline-wrap img.map-bg { display: block; width: 100%; height: auto; pointer-events: none; }
    .map-inline-wrap svg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 6; }
    .map-inline-wrap img.map-borders { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 3; transition: opacity 0.3s; opacity: 0; }
    .map-inline-wrap img.map-labels { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 20; transition: opacity 0.3s; }
    .tw-zone-poly { fill: transparent; stroke: transparent; stroke-width: 0; cursor: pointer; transition: fill 0.2s; pointer-events: auto; }
    .tw-zone-poly:hover { fill: rgba(255,255,255,0.15); }
    .tw-zone-poly.owner-light { fill: url(#pattern-light); }
    .tw-zone-poly.owner-dark { fill: url(#pattern-dark); }
    .tw-zone-poly.active-zone { fill: rgba(255,255,255,0.2) !important; stroke: #fff !important; stroke-width: 4; stroke-dasharray: 10 6; animation: dashPulse 2s linear infinite; }
    @keyframes dashPulse { to { stroke-dashoffset: -32; } }

    /* Тултипы */
    .map-tooltip { position:fixed; background: linear-gradient(135deg, var(--card), var(--bg)); border:1px solid var(--gold); border-radius:var(--radius); padding:12px 16px; font-size:.85rem; color:var(--text); pointer-events:none; box-shadow: 0 8px 24px rgba(0,0,0,.8), 0 0 12px rgba(240,185,11,.2); z-index:3000; display:none; min-width:180px; backdrop-filter: blur(4px); }
    .map-tooltip.visible { display:block; }
    
    .map-tooltip-title { font-weight: 800; color: var(--gold); font-size: 0.95rem; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; text-shadow: 0 0 8px rgba(240,185,11,0.4); }
    .map-tooltip-status { font-size: 0.8rem; color: var(--sub); margin-bottom: 4px; }
    .map-tooltip-points { font-size: 0.7rem; color: var(--muted); font-style: italic; }
    
    .map-tooltip-divider { height: 1px; background: linear-gradient(90deg, transparent, var(--border), transparent); margin: 8px 0; }
    
    .map-tooltip-score-row { display: flex; justify-content: space-between; font-size: 0.75rem; font-weight: 700; margin-bottom: 4px; }
    .map-tooltip-score-row .light { color: var(--gold); }
    .map-tooltip-score-row .dark { color: var(--purple); }
    
    .map-tooltip-progress { display: flex; width: 100%; height: 10px; background: rgba(0,0,0,0.5); border-radius: 5px; overflow: hidden; border: 1px solid rgba(255,255,255,0.1); box-shadow: inset 0 1px 3px rgba(0,0,0,0.5); }
    .map-tooltip-light { background: linear-gradient(90deg, #c49600, #ffd700); height: 100%; transition: width 0.3s ease; }
    .map-tooltip-dark { background: linear-gradient(90deg, #3d1060, #a371f7); height: 100%; transition: width 0.3s ease; }

    .map-controls { display: flex; gap: 16px; justify-content: center; margin-top: 16px; flex-wrap: wrap; background: var(--bg); padding: 12px 20px; border-radius: var(--radius-sm); border: 1px solid var(--border); }
    .map-toggle-group { display: flex; gap: 4px; background: var(--card); border-radius: 20px; padding: 4px; border: 1px solid var(--border); }
    .map-toggle-btn { padding: 6px 14px; background: none; border: none; color: var(--muted); border-radius: 16px; cursor: pointer; font-size: 0.75rem; font-weight: 600; transition: 0.2s; }
    .map-toggle-btn:hover { color: var(--text); }
    .map-toggle-btn.active { background: var(--gold); color: #000; font-weight: 800; }

    .history-list { display:flex; flex-direction:column; gap:8px; }
    .history-item { display:grid; grid-template-columns:32px 1fr auto auto auto; gap:12px; align-items:center; padding:10px 14px; border-radius:var(--radius-sm); background:var(--elevated); font-size:.85rem; border-left:4px solid var(--border); }
    .history-item.light { border-left-color:var(--gold); }
    .history-item.dark { border-left-color:var(--purple); }
    .hist-num { color:var(--muted); font-weight:800; }
    .hist-owner { color:var(--sub); white-space:nowrap; display:inline-flex; align-items:center; gap:6px; text-transform: uppercase; font-size: 0.75rem; font-weight: 700; }
    .hist-score { color:var(--muted); font-variant-numeric: tabular-nums; font-weight: 600; }
    .hist-points { color:var(--gold); font-weight:800; }

    .search-box { margin-bottom: 12px; display: flex; gap: 8px; align-items: center; flex-wrap: nowrap; }
    .search-input { width: 100%; max-width: 300px; padding: 10px 14px; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--text); font-size: 0.9rem; }
    .search-clear { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 1.2rem; padding: 0 10px; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
    .search-clear:hover { color: var(--red); transform: scale(1.1); }

    @media (max-width: 768px) {
        .stats-grid { grid-template-columns: repeat(2, 1fr); gap: 8px; }
        .stat-card { padding: 14px 10px; }
        .stat-value { font-size: 1.5rem; }
        .tables-grid { grid-template-columns: 1fr; }
        .nav-tabs { display: grid; grid-template-columns: repeat(2, 1fr); gap: 4px; padding: 6px; }
        .tab-btn { text-align: center; padding: 8px 6px; font-size: 0.75rem; }
        .table-container { overflow-x: auto; -webkit-overflow-scrolling: touch; }
        table { font-size: 0.72rem; }
        th, td { padding: 6px 8px; white-space: nowrap; word-break: normal; overflow-wrap: normal; hyphens: none; }

        #tab-tops table { min-width: auto; font-size: 0.7rem; }
        #tab-tops td:first-child, #tab-tops th:first-child { width: 28px; min-width: 28px; }
        #tab-tops td:nth-child(2), #tab-tops th:nth-child(2) { min-width: 100px; }
        #tab-tops td:nth-child(3), #tab-tops th:nth-child(3) { min-width: 90px; }

        #champions-table, #shards-table, #rating-table, #players-table { min-width: 480px; font-size: 0.7rem; }
        #classes-table, #races-table, #combos-table { min-width: 520px; font-size: 0.7rem; }
        #classes-table td:first-child, #races-table td:first-child, #combos-table td:first-child { min-width: 120px; }

        .tw-bar { height: 28px; }
        .tw-bar-light, .tw-bar-dark { font-size: 0.75rem; }
        .tw-finished-bar { height: 28px; font-size: 0.7rem; }
        .tw-actions { flex-direction: column; }
        .tw-btn { width: 100%; justify-content: center; }
        .tw-history-item { grid-template-columns: 28px 1fr auto; gap: 6px; }
        .tw-history-item img { width: 12px !important; height: 12px !important; }
        .tw-hist-score, .tw-hist-points { display: none; }
        .tw-labels img { width: 12px !important; height: 12px !important; }

        .modal-body { padding: 8px; }
        .history-item { grid-template-columns:24px 1fr auto; gap:8px; font-size:.75rem; }
        .hist-score, .hist-points { display:none; }
        .map-controls { padding: 8px; gap: 8px; }
        .map-toggle-btn { padding: 4px 10px; font-size: 0.7rem; }
        .hunters-top { grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 16px 8px 12px; }
        .hunter-card { padding: 12px 6px; }
        .hunter-name { font-size: 0.8rem; }
        .hunter-medal { font-size: 1.4rem; }
        .hunter-count { font-size: 0.65rem; }
        .titles-gallery { grid-template-columns: repeat(2, 1fr) !important; }
        .champion-block { padding: 16px 12px; }
        .champion-name { font-size: 1.1rem; }
        .champion-emoji { font-size: 2rem; }
        .champion-block > div:last-child { display: flex !important; justify-content: space-around; gap: 8px; margin-top: 12px; flex-wrap: nowrap; }
        .champion-block > div:last-child > div { flex: 1; text-align: center; display: flex; flex-direction: column; justify-content: space-between; min-height: 52px; }
        .champion-block > div:last-child span[style*="font-size: 1.5rem"] { font-size: 1.2rem !important; white-space: nowrap; }
        .champion-block > div:last-child span[style*="color: var(--text-muted)"] { font-size: 0.6rem !important; line-height: 1.3; }
        .search-input { width: 100%; max-width: none; }
        .search-box { flex-wrap: wrap; }
        .search-box #search-result { width: 100%; text-align: right; margin-left: 0 !important; font-size: 0.7rem; }
        .card { padding: 14px; }
        .card-title { font-size: 0.85rem; }
        .title-card { padding: 10px 8px; }
        .title-name { font-size: 0.75rem; }
        .title-cond { font-size: 0.62rem; }
        .title-holders { font-size: 0.62rem; }
        
        .hide-mobile { display: none !important; }
    }
</style>
</head>

        function getRaceIcon(name) {
            const map = {'Человек': 'human', 'Орк': 'orc', 'Дворф': 'dwarf', 'Эльф': 'elf', 'Нежить': 'undead', 'Табакси': 'tabaxi', 'Тифлинг': 'tiefling'};
            const file = map[name];
            return file ? `icons/${file}.png` : null;
        }
        function getClassIcon(name) {
            const map = {'Воин': 'warrior', 'Паладин': 'paladin', 'Плут': 'rogue', 'Монах': 'monk', 'Следопыт': 'ranger', 'Чародей': 'sorcerer', 'Бард': 'bard', 'Друид': 'druid', 'Изобретатель': 'artificer', 'Варвар': 'barbarian', 'Волшебница': 'wizard', 'Некромант': 'necromancer', 'Жрец': 'cleric', 'Колдун': 'warlock', 'Алхимик': 'alchemist'};
            const file = map[name];
            return file ? `icons/${file}.png` : null;
        }
        function getFactionIcon(factionName) {
            if (factionName === 'Орден Света') return 'icons/faction_light.png';
            if (factionName === 'Культ Тьмы') return 'icons/faction_dark.png';
            return null;
        }
        function getHeroIcon(playerName, emojiFallback, size = 32) {
            const img = (src, alt) => `<img src="${src}" alt="${alt}" style="width:${size}px;height:${size}px;object-fit:contain;vertical-align:middle;" onerror="this.style.display='none'">`;
            const emoji = (char) => `<span style="display:inline-block; width:${size}px; height:${size}px; text-align:center; line-height:${size}px; font-size:${size * 0.8}px; vertical-align:middle;">${char}</span>`;
            const gap = Math.floor(size * 0.2);
            const spacer = `<span style="display:inline-block; width:${gap}px;"></span>`;
            if (!playerName || typeof playerName !== 'string' || !playerName.includes('-')) return emoji(emojiFallback);
            const parts = playerName.split('-');
            const raceName = parts[0], className = parts[1];
            const raceIcon = getRaceIcon(raceName), classIcon = getClassIcon(className);
            if (raceIcon && classIcon) return `${img(raceIcon, raceName)}${spacer}${img(classIcon, className)}`;
            if (raceIcon) return `${img(raceIcon, raceName)}${spacer}${emoji(classEmojis[className] || '')}`;
            if (classIcon) return `${emoji(raceEmojis[raceName] || '')}${spacer}${img(classIcon, className)}`;
            return `${emoji(raceEmojis[raceName] || '')}${spacer}${emoji(classEmojis[className] || '')}`;
        }
        function factionImg(factionName, size = 20) {
            const src = getFactionIcon(factionName);
            if (src) return `<img src="${src}" alt="${factionName}" style="width:${size}px;height:${size}px;object-fit:contain;vertical-align:middle;" onerror="this.style.display='none'">`;
            return factionName === 'Орден Света' ? '🌝' : factionName === 'Культ Тьмы' ? '🌚' : '';
        }
        function factionPng(size = 16) {
            return {
                light: `<img src="icons/faction_light.png" alt="Свет" style="width:${size}px;height:${size}px;object-fit:contain;vertical-align:middle;" onerror="this.style.display='none'">`,
                dark:  `<img src="icons/faction_dark.png"  alt="Тьма" style="width:${size}px;height:${size}px;object-fit:contain;vertical-align:middle;" onerror="this.style.display='none'">`
            };
        }

        fetchWithTimeout(DATA_URL_RAW).catch(()=>fetch(DATA_URL_CDN)).then(r=>r.json()).then(data=>{classesData=data.classes;racesData=data.races;achievements=data.achievements||[];classEmojis=Object.fromEntries(classesData.map(c=>[c.Name,c.Emoji]));raceEmojis=Object.fromEntries(racesData.map(r=>[r.Name,r.Emoji]));return fetchWithTimeout(JSON_URL_RAW).catch(()=>fetch(JSON_URL_CDN));}).then(r=>r.json()).then(data=>{players=data.players.filter(p=>p.name&&p.name!=='Unknown');globalData=data;if(data.dungeon?.players){window._dungeonPlayers={};Object.values(data.dungeon.players).forEach(dp=>{window._dungeonPlayers[dp.display]=dp;});}renderFullStats(data);}).catch(err=>{document.getElementById('content').innerHTML=`<div style="text-align:center;padding:48px 20px;color:var(--red);">❌ Ошибка загрузки данных<br>${err.message}</div>`;});

		function applyMapState() {
			const labels = document.getElementById('map-labels-img');
			const borders = document.getElementById('map-borders-img');
			const svg = document.getElementById('map-svg-layer');
			const polys = document.querySelectorAll('.tw-zone-poly');
			
			if (!svg || !borders || !labels) return;

			// 1. ФОН — только territories_clean (базовая карта)
			if (currentMapMode === 'clean') {
				labels.style.opacity = '0';
				borders.style.opacity = '0';
				svg.style.opacity = '0';
			} 
			// 2. ЗАХВАТЫ — territories_borders + SVG (пунктиры, заливки), БЕЗ надписей
			else if (currentMapMode === 'captures') {
				labels.style.opacity = '0';   // Надписи выключены
				borders.style.opacity = '1';  // Границы включены
				svg.style.opacity = '1';      // Заливки и пунктиры включены
				
				polys.forEach(p => {

				borders.style.opacity = '1';  // Границы остаются
				svg.style.opacity = '1';      // Захваты остаются

				const MAX_PTS = 150;
				const lightW = Math.min(100, (activeScore.light / MAX_PTS) * 100);
				const darkW = Math.min(100, (activeScore.dark / MAX_PTS) * 100);
				
				html += `
					<div style="margin-top: 6px; border-top: 1px solid var(--border); padding-top: 6px;">
						<div style="display: flex; justify-content: space-between; font-size: 0.7rem; margin-bottom: 2px;">
							<span style="color: var(--gold);">🌝 ${activeScore.light}</span>
							<span style="color: var(--purple);">${activeScore.dark} 🌚</span>
						</div>
						<div class="map-tooltip-progress">
							<div class="map-tooltip-light" style="width: ${lightW}%;"></div>
							<div class="map-tooltip-dark" style="width: ${darkW}%;"></div>
						</div>
					</div>
				`;
			}

			tip.innerHTML = html;
			tip.style.left = (e.clientX + 15) + 'px';
			tip.style.top  = (e.clientY + 15) + 'px';
			tip.classList.add('visible');
		});
</script>
</body>
</html>
