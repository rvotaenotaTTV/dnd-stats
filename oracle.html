<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,600;14..32,800;14..32,900&display=swap" rel="stylesheet">
<style>
    /* ============ ФИОЛЕТОВЫЙ ВАЙБ ============ */
    body {
        background-image:
            radial-gradient(ellipse at 20% 0%, rgba(163,113,247,0.10) 0%, transparent 45%),
            radial-gradient(ellipse at 80% 100%, rgba(163,113,247,0.08) 0%, transparent 45%),
            radial-gradient(ellipse at 50% 50%, rgba(163,113,247,0.04) 0%, transparent 60%);
    }
    .container { position: relative; }
    .container::before {
        content: '';
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        background:
            radial-gradient(circle at 15% 20%, rgba(163,113,247,0.06) 0%, transparent 30%),
            radial-gradient(circle at 85% 80%, rgba(163,113,247,0.05) 0%, transparent 30%);
        pointer-events: none;
        z-index: 0;
    }
    .header-title {
        background: linear-gradient(135deg, var(--purple) 0%, #c4a5ff 30%, var(--gold) 70%, var(--purple) 100%);
        background-size: 200% auto;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        animation: shimmer 4s linear infinite;
    }
    @keyframes shimmer {
        0% { background-position: 0% center; }
        100% { background-position: 200% center; }
    }

    /* ============ ПОИСК ============ */
    .search-row { max-width: 620px; margin: 0 auto 28px; position: relative; }
    .search-input-wrap { display: flex; gap: 10px; }
    .search-input {
        flex: 1; padding: 15px 22px;
        background: linear-gradient(135deg, rgba(163,113,247,0.08), rgba(163,113,247,0.03));
        border: 1px solid rgba(163,113,247,0.3);
        border-radius: 26px;
        color: var(--text);
        font-size: 0.95rem;
        font-family: inherit;
        transition: 0.25s;
        width: 100%;
        box-shadow: 0 0 0 0 rgba(163,113,247,0);
    }
    .search-input:focus {
        outline: none;
        border-color: var(--purple);
        background: linear-gradient(135deg, rgba(163,113,247,0.12), rgba(163,113,247,0.05));
        box-shadow: 0 0 0 4px rgba(163,113,247,0.15), 0 0 24px rgba(163,113,247,0.2);
    }
    .search-input::placeholder { color: var(--muted); }
    .search-btn {
        padding: 15px 26px;
        background: linear-gradient(135deg, var(--purple), #8b5cf6, #a371f7);
        background-size: 200% auto;
        border: none;
        border-radius: 26px;
        color: #fff;
        font-weight: 700;
        font-size: 0.9rem;
        font-family: inherit;
        cursor: pointer;
        transition: 0.25s;
        white-space: nowrap;
        box-shadow: 0 4px 16px rgba(163,113,247,0.3);
    }
    .search-btn:hover {
        transform: translateY(-2px);
        background-position: right center;
        box-shadow: 0 8px 28px rgba(163,113,247,0.5);
    }

    .autocomplete-list {
        position: absolute;
        top: calc(100% + 6px);
        left: 0; right: 0;
        background: linear-gradient(180deg, var(--card), rgba(163,113,247,0.04));
        border: 1px solid rgba(163,113,247,0.3);
        border-radius: 14px;
        max-height: 340px;
        overflow-y: auto;
        z-index: 50;
        box-shadow: 0 12px 40px rgba(0,0,0,0.5), 0 0 0 1px rgba(163,113,247,0.1), 0 0 30px rgba(163,113,247,0.15);
        display: none;
        backdrop-filter: blur(8px);
    }
    .autocomplete-list.show { display: block; animation: fadeSlideIn 0.2s ease; }
    .autocomplete-list::-webkit-scrollbar { width: 6px; }
    .autocomplete-list::-webkit-scrollbar-thumb { background: rgba(163,113,247,0.4); border-radius: 3px; }
    .autocomplete-item {
        padding: 12px 18px;
        cursor: pointer;
        font-size: 0.9rem;
        display: flex;
        align-items: center;
        gap: 12px;
        transition: 0.15s;
        border-bottom: 1px solid rgba(163,113,247,0.08);
    }
    .autocomplete-item:last-child { border-bottom: none; }
    .autocomplete-item:hover, .autocomplete-item.active {
        background: linear-gradient(90deg, rgba(163,113,247,0.18), rgba(163,113,247,0.05));
        border-left: 3px solid var(--purple);
        padding-left: 15px;
    }
    .autocomplete-item .ac-emoji { font-size: 1.3rem; }
    .autocomplete-item .ac-name { color: var(--text); flex: 1; font-weight: 500; }
    .autocomplete-item .ac-name strong { color: var(--purple); font-weight: 800; text-shadow: 0 0 8px rgba(163,113,247,0.5); }
    .autocomplete-item .ac-class { color: var(--muted); font-size: 0.72rem; }
    .autocomplete-empty { padding: 18px; color: var(--muted); font-size: 0.85rem; text-align: center; }

    /* ============ ПРОФИЛЬ ============ */
    .player-header {
        background: linear-gradient(135deg, rgba(163,113,247,0.16), rgba(163,113,247,0.06));
        border: 1px solid rgba(163,113,247,0.35);
        border-radius: var(--radius);
        padding: 26px 20px;
        text-align: center;
        margin-bottom: 24px;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(163,113,247,0.1), inset 0 1px 0 rgba(163,113,247,0.2);
    }
    .player-header::after {
        content: '';
        position: absolute; top: 0; left: 0; right: 0; height: 2px;
        background: linear-gradient(90deg, transparent, var(--purple), #c4a5ff, var(--purple), transparent);
        animation: shimmer 3s linear infinite;
        background-size: 200% auto;
    }
    .player-emoji { font-size: 3rem; margin-bottom: 4px; filter: drop-shadow(0 0 16px rgba(163,113,247,0.5)); }
    .player-name { font-size: 1.6rem; font-weight: 900; color: var(--gold); margin-bottom: 4px; text-shadow: 0 0 20px rgba(240,185,11,0.3); }
    .player-class { color: var(--sub); font-size: 0.9rem; }
    .player-faction { display: inline-block; margin-top: 10px; padding: 5px 16px; border-radius: 20px; font-size: 0.75rem; font-weight: 700; background: var(--elevated); border: 1px solid var(--border); }
    .player-faction.light { color: var(--gold); border-color: rgba(240,185,11,0.4); box-shadow: 0 0 12px rgba(240,185,11,0.15); }
    .player-faction.dark { color: var(--purple); border-color: rgba(163,113,247,0.4); box-shadow: 0 0 12px rgba(163,113,247,0.15); }

    /* ============ БЛОКИ ============ */
    .oracle-block {
        background: linear-gradient(180deg, var(--card), rgba(163,113,247,0.03));
        border: 1px solid rgba(163,113,247,0.2);
        border-radius: var(--radius);
        padding: 20px 18px;
        margin-bottom: 16px;
        position: relative;
        overflow: hidden;
        animation: fadeSlideIn 0.4s ease;
        box-shadow: 0 4px 20px rgba(0,0,0,0.15);
    }
    .oracle-block::after {
        content: '';
        position: absolute; top: 0; left: 0; right: 0; height: 2px;
        background: linear-gradient(90deg, transparent, var(--purple), transparent);
        opacity: 0.6;
    }
    .oracle-block.gold::after { background: linear-gradient(90deg, transparent, var(--gold), transparent); }
    .oracle-block.gold {
        background: linear-gradient(180deg, var(--card), rgba(240,185,11,0.03));
        border-color: rgba(240,185,11,0.2);
    }
    .oracle-block.ice::after { background: linear-gradient(90deg, transparent, var(--ice), transparent); }
    .oracle-block.ice {
        background: linear-gradient(180deg, var(--card), rgba(91,192,235,0.03));
        border-color: rgba(91,192,235,0.2);
    }
    .oracle-block.green::after { background: linear-gradient(90deg, transparent, var(--green), transparent); }
    .oracle-block.green {
        background: linear-gradient(180deg, var(--card), rgba(16,185,129,0.03));
        border-color: rgba(16,185,129,0.2);
    }
    .oracle-block-title {
        font-size: 0.95rem; font-weight: 800;
        color: var(--purple);
        margin-bottom: 14px;
        display: flex; align-items: center; gap: 8px;
        text-transform: uppercase; letter-spacing: 1px;
        text-shadow: 0 0 12px rgba(163,113,247,0.3);
    }
    .oracle-block.gold .oracle-block-title { color: var(--gold); text-shadow: 0 0 12px rgba(240,185,11,0.3); }
    .oracle-block.ice .oracle-block-title { color: var(--ice); }
    .oracle-block.green .oracle-block-title { color: var(--green); }

    .oracle-voice {
        background: linear-gradient(90deg, rgba(163,113,247,0.10), rgba(163,113,247,0.03));
        border-left: 3px solid var(--purple);
        border-radius: 0 12px 12px 0;
        padding: 14px 18px;
        margin-bottom: 12px;
        font-size: 0.9rem;
        line-height: 1.7;
        color: var(--text);
        font-style: italic;
    }
    .oracle-voice:last-child { margin-bottom: 0; }
    .oracle-voice strong { color: var(--gold); font-style: normal; font-weight: 700; }
    .oracle-voice .accent { color: #c4a5ff; font-weight: 700; font-style: normal; text-shadow: 0 0 8px rgba(163,113,247,0.4); }

    /* ============ ТАБЛИЦА ============ */
    .history-table { width: 100%; font-size: 0.82rem; border-collapse: collapse; }
    .history-table th {
        background: linear-gradient(180deg, var(--elevated), rgba(163,113,247,0.05));
        color: var(--purple); font-size: 0.65rem; text-transform: uppercase;
        letter-spacing: 1px; padding: 10px; text-align: left; font-weight: 700;
    }
    .history-table td { padding: 10px; border-bottom: 1px solid rgba(163,113,247,0.08); }
    .history-table tr:last-child td { border-bottom: none; }
    .history-table tr.current td { background: rgba(163,113,247,0.08); font-weight: 600; }
    .history-table .season-num { color: var(--purple); font-weight: 800; }
    .history-table .wr-cell { font-weight: 700; }

    /* ============ ТРЕНДЫ ============ */
    .trend-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
    .trend-item {
        background: linear-gradient(135deg, rgba(163,113,247,0.08), rgba(163,113,247,0.02));
        border-radius: var(--radius-sm); padding: 14px 12px;
        text-align: center; border: 1px solid rgba(163,113,247,0.2);
    }
    .trend-icon { font-size: 1.5rem; margin-bottom: 4px; filter: drop-shadow(0 0 6px rgba(163,113,247,0.4)); }
    .trend-value { font-size: 1.2rem; font-weight: 800; color: var(--gold); }
    .trend-label { font-size: 0.65rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-top: 2px; }

    /* ============ ПРОГНОЗ ============ */
    .forecast-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
    .forecast-card {
        background: linear-gradient(145deg, rgba(163,113,247,0.12), rgba(163,113,247,0.03));
        border-radius: var(--radius-sm); padding: 18px 14px; text-align: center;
        border: 1px solid rgba(163,113,247,0.3);
        position: relative; overflow: hidden;
        box-shadow: inset 0 1px 0 rgba(163,113,247,0.15);
    }
    .forecast-card::before {
        content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
        background: linear-gradient(90deg, transparent, var(--purple), transparent);
    }
    .forecast-icon { font-size: 1.8rem; margin-bottom: 6px; }
    .forecast-value { font-size: 1.5rem; font-weight: 900; color: #c4a5ff; text-shadow: 0 0 12px rgba(163,113,247,0.4); }
    .forecast-label { font-size: 0.7rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-top: 4px; }
    .forecast-range { font-size: 0.7rem; color: var(--sub); margin-top: 4px; }

    /* ============ ГЕРОИ ============ */
    .archive-hero {
        display: flex; justify-content: space-between; align-items: center;
        padding: 10px 14px;
        background: linear-gradient(90deg, rgba(163,113,247,0.05), transparent);
        border-radius: var(--radius-sm); margin-bottom: 6px; font-size: 0.85rem;
        border-left: 3px solid rgba(163,113,247,0.3);
        transition: 0.2s;
    }
    .archive-hero:hover { background: linear-gradient(90deg, rgba(163,113,247,0.12), transparent); }
    .archive-hero.current { border-left-color: var(--gold); background: linear-gradient(90deg, rgba(240,185,11,0.1), transparent); }
    .archive-hero.best { border-left-color: var(--green); background: linear-gradient(90deg, rgba(16,185,129,0.08), transparent); }
    .archive-hero .hero-info { display: flex; align-items: center; gap: 8px; }
    .archive-hero .hero-wr { font-weight: 700; }

    /* ============ СТИЛЬ ============ */
    .style-row {
        display: flex; justify-content: space-between; align-items: center;
        padding: 10px 14px;
        background: linear-gradient(90deg, rgba(163,113,247,0.05), transparent);
        border-radius: var(--radius-sm); margin-bottom: 6px; font-size: 0.85rem;
        transition: 0.2s;
    }
    .style-row:hover { background: linear-gradient(90deg, rgba(163,113,247,0.12), transparent); }
    .style-row.best { border-left: 3px solid var(--green); }
    .style-row .style-name { display: flex; align-items: center; gap: 8px; }
    .style-row .style-val { color: var(--gold); font-weight: 700; }

    /* ============ СЕЗОНЫ ============ */
    .season-highlight { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
    .season-card {
        background: linear-gradient(135deg, rgba(163,113,247,0.08), rgba(163,113,247,0.02));
        border-radius: var(--radius-sm); padding: 14px 12px; text-align: center;
        border: 1px solid rgba(163,113,247,0.2);
    }
    .season-card .season-icon { font-size: 1.6rem; margin-bottom: 4px; }
    .season-card .season-title { font-size: 0.65rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
    .season-card .season-value { font-size: 1.2rem; font-weight: 800; color: var(--gold); margin: 4px 0; }
    .season-card .season-detail { font-size: 0.75rem; color: var(--sub); }

    /* ============ СРАВНЕНИЕ ============ */
    .compare-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; font-size: 0.85rem; }
    .compare-label { min-width: 100px; color: var(--muted); font-size: 0.8rem; }
    .compare-bar-wrap { flex: 1; height: 24px; background: rgba(163,113,247,0.08); border-radius: 12px; overflow: hidden; position: relative; }
    .compare-bar { height: 100%; border-radius: 12px; transition: width 0.6s; display: flex; align-items: center; justify-content: flex-end; padding-right: 8px; font-size: 0.7rem; font-weight: 700; }
    .compare-bar.you { background: linear-gradient(90deg, #8b5cf6, #a371f7, #c4a5ff); color: #fff; box-shadow: 0 0 16px rgba(163,113,247,0.4); }
    .compare-bar.avg { background: linear-gradient(90deg, var(--muted), var(--sub)); color: #fff; }

    /* ============ СОВЕТ ============ */
    .advice-block {
        background: linear-gradient(135deg, rgba(163,113,247,0.15), rgba(163,113,247,0.05));
        border: 1px solid rgba(163,113,247,0.35);
        border-radius: var(--radius); padding: 22px;
        text-align: center; margin-top: 20px;
        box-shadow: 0 0 32px rgba(163,113,247,0.15), inset 0 1px 0 rgba(163,113,247,0.2);
    }
    .advice-block .advice-icon { font-size: 2rem; margin-bottom: 8px; filter: drop-shadow(0 0 12px rgba(163,113,247,0.5)); }
    .advice-block .advice-text { font-size: 0.95rem; line-height: 1.7; color: var(--text); font-style: italic; }
    .advice-block .advice-text strong { color: var(--gold); font-style: normal; }

    /* ============ ГРАФИК ============ */
    .chart-wrap {
        background: linear-gradient(180deg, rgba(163,113,247,0.05), rgba(163,113,247,0.02));
        border-radius: var(--radius-sm);
        padding: 16px;
        border: 1px solid rgba(163,113,247,0.2);
    }

    .loading-block { text-align: center; padding: 60px 20px; color: var(--sub); }
    .loading-block .spinner { margin: 0 auto 16px; }

    .not-found { text-align: center; padding: 40px 20px; color: var(--muted); }
    .not-found .nf-icon { font-size: 3rem; margin-bottom: 12px; opacity: 0.5; }

    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    @keyframes fadeSlideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    @media (max-width: 768px) {
        .search-input-wrap { flex-direction: column; }
        .search-btn { width: 100%; }
        .player-name { font-size: 1.3rem; }
        .oracle-block { padding: 16px 14px; }
        .oracle-voice { padding: 12px 14px; font-size: 0.85rem; }
        .trend-grid { grid-template-columns: repeat(2, 1fr); }
        .forecast-grid { grid-template-columns: repeat(2, 1fr); }
        .season-highlight { grid-template-columns: repeat(2, 1fr); }
        .history-table { font-size: 0.75rem; }
        .history-table th, .history-table td { padding: 6px 8px; white-space: nowrap; }
        .table-container { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    }

    .reading-progress { position: fixed; top: 0; left: 0; width: 100%; height: 3px; background: linear-gradient(90deg, var(--purple), #c4a5ff, var(--gold), var(--purple)); transform-origin: 0 50%; transform: scaleX(0); z-index: 1000; }
    .scroll-top {
        position: fixed; bottom: 80px; right: 20px; width: 44px; height: 44px;
        background: linear-gradient(135deg, var(--card), rgba(163,113,247,0.15));
        border: 1px solid var(--purple);
        border-radius: 50%; color: var(--purple);
        display: flex; align-items: center; justify-content: center;
        cursor: pointer; opacity: 0; pointer-events: none;
        transition: all 0.3s ease; z-index: 98; font-size: 1.1rem;
        box-shadow: 0 4px 12px rgba(163,113,247,0.2);
    }
    .scroll-top.visible { opacity: 1; pointer-events: all; }
    .scroll-top:hover { background: var(--purple); color: #000; transform: translateY(-3px); box-shadow: 0 6px 20px rgba(163,113,247,0.5); }
    @media (max-width: 768px) { .scroll-top { bottom: 70px; right: 16px; width: 40px; height: 40px; font-size: 1rem; } }
</style>
</head>

<script>
// ============ КОНСТАНТЫ ============
const STATS_URL = 'https://raw.githubusercontent.com/rvotaenotaTTV/dnd-stats/main/stats_data.json';
const SEASON_BASE = 'https://raw.githubusercontent.com/rvotaenotaTTV/dnd-stats/main/seasons/season_';
const MAX_SEASONS = 15;

// ============ ТЕМА И НАВИГАЦИЯ ============
function toggleTheme() {
    const h = document.documentElement;
    const c = h.getAttribute('data-theme');
    const n = c === 'dark' ? 'light' : 'dark';
    h.setAttribute('data-theme', n);
    localStorage.setItem('eternis-theme', n);
}
(function() {
    const s = localStorage.getItem('eternis-theme');
    if (s) document.documentElement.setAttribute('data-theme', s);
})();
function toggleNav() {
    const nav = document.getElementById('pageNav');
    const btn = document.querySelector('.nav-toggle');
    nav.classList.toggle('show');

// ============ КЕШ СЕЗОНОВ ============
async function getSeasonData(n) {
    const KEY = 'eternis-oracle-season-' + n;
    const TTL = 10 * 60 * 1000;
    try {
        const cached = JSON.parse(sessionStorage.getItem(KEY) || 'null');
        if (cached && (Date.now() - cached.ts < TTL)) return cached.data;
    } catch (e) {}
    const r = await fetch(`${SEASON_BASE}${n}.json`);
    if (!r.ok) throw new Error('404');
    const data = await r.json();
    try { sessionStorage.setItem(KEY, JSON.stringify({ ts: Date.now(), data })); } catch (e) {}
    return data;
}

// ============ НОРМАЛИЗАЦИЯ ============
function normalizeFaction(f) {
    if (!f) return '';
    if (f === 'Свет' || f === 'Орден Света') return 'Орден Света';
    if (f === 'Тьма' || f === 'Культ Тьмы') return 'Культ Тьмы';
    return f;
}

// ============ ЗАГРУЗКА ВСЕХ СЕЗОНОВ ============
async function loadAllSeasons() {
    const seasons = [];
    for (let n = 0; n <= MAX_SEASONS; n++) {
        try {
            const d = await getSeasonData(n);
            seasons.push({ num: n, data: d, isCurrent: false });
        } catch (e) { break; }
    }
    try {
        const r = await fetch(`${STATS_URL}?v=${Date.now()}`);
        const d = await r.json();
        seasons.push({ num: seasons.length, data: d, isCurrent: true });
    } catch (e) {
        console.error('Не удалось загрузить текущий сезон:', e);
    }
    return seasons;
}

function getAllPlayers(seasons) {
    const players = new Map();
    seasons.forEach(s => {
        (s.data.players || []).forEach(p => {
            if (!p.display) return;
            const key = p.display.toLowerCase();
            if (!players.has(key)) {
                players.set(key, { display: p.display, emoji: p.emoji || '⚔️', name: p.name || '' });

        });

}

        items.forEach((it, i) => it.classList.toggle('active', i === autocompleteIndex));

// ============ ИСТОРИЯ ИГРОКА ============
function getPlayerHistory(nickname, seasons) {
    const history = [];
    seasons.forEach(s => {
        const players = s.data.players || [];
        const p = players.find(pl => pl.display && pl.display.toLowerCase() === nickname.toLowerCase());
        if (!p) return;
        const total = (p.wins || 0) + (p.losses || 0);
        if (total === 0) return;
        history.push({
            season: s.num,
            isCurrent: s.isCurrent,
            display: p.display,
            emoji: p.emoji || '⚔️',
            name: p.name || '',
            wins: p.wins || 0,
            losses: p.losses || 0,
            total,
            wr: total > 0 ? p.wins / total : 0,
            level: p.level || 0,
            skill: p.skill || 0,
            shards: p.shards || 0,
            faction: normalizeFaction(p.faction),
            factionWins: p.factionWins || 0,
            best: p.best || 0,
            worst: p.worst || 0,
            tournamentWins: p.tournamentWins || 0,
            dungeon: s.data.dungeon?.players?.[p.display] ||
                     Object.values(s.data.dungeon?.players || {}).find(dp => dp.display && dp.display.toLowerCase() === p.display.toLowerCase()) || null,
            heroArchive: s.data.heroArchive || {}
        });
    });
    return history;
}

// ============ АНАЛИЗ ТРЕНДОВ ============
function analyzeTrend(history) {
    if (history.length === 0) return { trend: 'none' };
    if (history.length === 1) {
        return {
            trend: 'first', firstWR: history[0].wr, lastWR: history[0].wr,
            delta: 0, avg: history[0].wr, peak: history[0].wr,
            peakSeason: history[0].season, form: 1, seasonsCount: 1, stdDev: 0
        };
    }
    const wrs = history.map(h => h.wr);
    const n = wrs.length;
    const avg = wrs.reduce((s, w) => s + w, 0) / n;
    const peak = Math.max(...wrs);
    const peakSeason = history[wrs.indexOf(peak)].season;
    const firstWR = wrs[0];
    const lastWR = wrs[n - 1];
    const delta = lastWR - firstWR;
    let sumXY = 0, sumX = 0, sumY = 0, sumXX = 0;
    for (let i = 0; i < n; i++) {
        sumX += i; sumY += wrs[i]; sumXY += i * wrs[i]; sumXX += i * i;
    }
    const denom = n * sumXX - sumX * sumX;
    const slope = denom !== 0 ? (n * sumXY - sumX * sumY) / denom : 0;
    const variance = wrs.reduce((s, w) => s + Math.pow(w - avg, 2), 0) / n;
    const stdDev = Math.sqrt(variance);
    const form = peak > 0 ? lastWR / peak : 1;
    return {
        trend: slope > 0.005 ? 'growth' : slope < -0.005 ? 'fall' : 'stable',
        slope, delta, avg, peak, peakSeason, firstWR, lastWR, form, stdDev, seasonsCount: n
    };
}

// ============ АНАЛИЗ ГЕРОЕВ ============
function analyzeHeroArchive(nickname, seasons) {
    const heroes = [];
    const seen = new Set();

    const lastSeason = seasons[seasons.length - 1];
    if (lastSeason) {
        const players = lastSeason.data.players || [];
        const p = players.find(pl => pl.display && pl.display.toLowerCase() === nickname.toLowerCase());
        if (p) {
            const total = (p.wins || 0) + (p.losses || 0);
            if (total > 0) {
                seen.add((p.name || '') + '|' + (p.emoji || ''));
                heroes.push({
                    name: p.name || '', emoji: p.emoji || '⚔️',
                    wins: p.wins || 0, losses: p.losses || 0, wr: p.wins / total,
                    season: lastSeason.num, isCurrent: true, faction: normalizeFaction(p.faction)
                });
            }
        }
    }

    seasons.forEach(s => {
        if (s.isCurrent) return;
        const players = s.data.players || [];
        const p = players.find(pl => pl.display && pl.display.toLowerCase() === nickname.toLowerCase());
        if (!p) return;
        const total = (p.wins || 0) + (p.losses || 0);
        if (total === 0) return;
        const key = (p.name || '') + '|' + (p.emoji || '');
        if (seen.has(key)) return;
        seen.add(key);
        heroes.push({
            name: p.name || '', emoji: p.emoji || '⚔️',
            wins: p.wins || 0, losses: p.losses || 0, wr: p.wins / total,
            season: s.num, isCurrent: false, faction: normalizeFaction(p.faction)
        });
    });

    seasons.forEach(s => {
        const archive = s.data.heroArchive || {};
        Object.entries(archive).forEach(([key, list]) => {
            if (key.toLowerCase() !== nickname.toLowerCase()) return;
            list.forEach(h => {
                const total = (h.wins || 0) + (h.losses || 0);
                if (total === 0) return;
                const hKey = (h.name || '') + '|' + (h.emoji || '');
                if (seen.has(hKey)) return;
                seen.add(hKey);
                heroes.push({
                    name: h.name || '', emoji: h.emoji || '⚔️',
                    wins: h.wins || 0, losses: h.losses || 0, wr: (h.wins || 0) / total,
                    season: s.num, isCurrent: false, faction: normalizeFaction(h.faction)
                });
            });
        });
    });

    const totalWins = heroes.reduce((s, h) => s + h.wins, 0);
    const totalLosses = heroes.reduce((s, h) => s + h.losses, 0);
    const totalFights = totalWins + totalLosses;
    const eligible = heroes.filter(h => (h.wins + h.losses) >= 10);
    const best = eligible.length > 0 ? eligible.reduce((m, h) => h.wr > m.wr ? h : m) : null;

    const classStats = {};
    const raceStats = {};
    const comboStats = {};
    heroes.forEach(h => {
        if (!h.name) return;
        const parts = h.name.split('-');
        if (parts.length < 2) {
            const cls = parts[0];
            if (!classStats[cls]) classStats[cls] = { wins: 0, losses: 0 };
            classStats[cls].wins += h.wins;
            classStats[cls].losses += h.losses;
            return;
        }
        const race = parts[0];
        const cls = parts[1];
        if (!classStats[cls]) classStats[cls] = { wins: 0, losses: 0 };
        if (!raceStats[race]) raceStats[race] = { wins: 0, losses: 0 };
        if (!comboStats[h.name]) comboStats[h.name] = { wins: 0, losses: 0, emoji: h.emoji };
        classStats[cls].wins += h.wins;
        classStats[cls].losses += h.losses;
        raceStats[race].wins += h.wins;
        raceStats[race].losses += h.losses;
        comboStats[h.name].wins += h.wins;
        comboStats[h.name].losses += h.losses;
    });

    return {
        heroes, count: heroes.length, totalWins, totalLosses, totalFights,
        trueWR: totalFights > 0 ? totalWins / totalFights : 0,
        best, classStats, raceStats, comboStats
    };
}

// ============ АНАЛИЗ ДАНЖА ============
function analyzeDungeon(nickname, seasons) {
    let totalWaves = 0, maxRecord = 0, totalBosses = 0, totalTrophies = 0, seasonsWithDungeon = 0;
    seasons.forEach(s => {
        const dp = s.data.dungeon?.players?.[nickname] ||
                   Object.values(s.data.dungeon?.players || {}).find(p => p.display && p.display.toLowerCase() === nickname.toLowerCase());
        if (!dp) return;
        seasonsWithDungeon++;
        totalWaves += dp.totalWaves || 0;
        totalBosses += dp.bosses || 0;
        totalTrophies += dp.trophies || 0;
        if ((dp.record || 0) > maxRecord) maxRecord = dp.record;
    });
    return { totalWaves, maxRecord, totalBosses, totalTrophies, seasonsWithDungeon };
}

// ============ МЕСТО В ЛИГЕ ============
function getLeaguePlace(nickname, seasons) {
    const last = seasons[seasons.length - 1];
    if (!last) return null;
    const players = (last.data.players || [])
        .map(p => ({ ...p, faction: normalizeFaction(p.faction) }))
        .filter(p => (p.skill || 0) > 0 && p.faction);
    const light = players.filter(p => p.faction === 'Орден Света').sort((a, b) => (b.skill || 0) - (a.skill || 0));
    const dark = players.filter(p => p.faction === 'Культ Тьмы').sort((a, b) => (b.skill || 0) - (a.skill || 0));
    const me = players.find(p => p.display && p.display.toLowerCase() === nickname.toLowerCase());
    if (!me) return null;
    const list = me.faction === 'Орден Света' ? light : dark;
    const place = list.findIndex(p => p.display === me.display) + 1;
    const top8Skill = list.length >= 8 ? (list[7].skill || 0) : 0;
    const gap = Math.max(0, top8Skill - (me.skill || 0));
    return { place, total: list.length, skill: me.skill || 0, faction: me.faction, inTop8: place <= 8, gapToTop8: gap };
}

// ============ АНАЛИЗ СЕЗОНОВ ============
function analyzeSeasons(history) {
    if (history.length === 0) return null;
    return {
        bestWR: history.reduce((m, h) => h.wr > m.wr ? h : m),
        worstWR: history.reduce((m, h) => h.wr < m.wr ? h : m),
        mostWins: history.reduce((m, h) => h.wins > m.wins ? h : m),
        mostFights: history.reduce((m, h) => h.total > m.total ? h : m),
        seasonsCount: history.length
    };
}

// ============ ФРАКЦИИ ============
function analyzeFactions(history) {
    const light = history.filter(h => h.faction === 'Орден Света');
    const dark = history.filter(h => h.faction === 'Культ Тьмы');
    const calc = (arr) => {
        if (arr.length === 0) return { count: 0, wins: 0, losses: 0, wr: 0 };
        const w = arr.reduce((s, h) => s + h.wins, 0);
        const l = arr.reduce((s, h) => s + h.losses, 0);
        return { count: arr.length, wins: w, losses: l, wr: (w + l) > 0 ? w / (w + l) : 0 };
    };
    return { light: calc(light), dark: calc(dark) };
}

// ============ СРАВНЕНИЕ ============
function compareWithAverage(nickname, seasons) {
    const last = seasons[seasons.length - 1];
    if (!last) return null;
    const players = (last.data.players || []).filter(p => (p.wins || 0) + (p.losses || 0) >= 10);
    if (players.length === 0) return null;
    const totalWR = players.reduce((s, p) => s + p.wins / (p.wins + p.losses), 0) / players.length;
    const me = players.find(p => p.display && p.display.toLowerCase() === nickname.toLowerCase());
    if (!me) return null;
    return { myWR: me.wins / (me.wins + me.losses), avgWR: totalWR };
}

// ============ ПРОГНОЗ X ============
function predictMilestones(history, trend) {
    if (history.length < 3) return null;
    const last = history[history.length - 1];
    const avgWinsPerSeason = history.reduce((s, h) => s + h.wins, 0) / history.length;

    const shardDelta = [];
    for (let i = 1; i < history.length; i++) {
        const delta = history[i].shards - history[i-1].shards;
        if (delta > 0) shardDelta.push(delta);
    }
    const avgShardsPerSeason = shardDelta.length > 0 ? shardDelta.reduce((s, d) => s + d, 0) / shardDelta.length : 0;

    const levelDelta = [];
    for (let i = 1; i < history.length; i++) {
        const delta = history[i].level - history[i-1].level;
        if (delta > 0) levelDelta.push(delta);
    }
    const avgLevelPerSeason = levelDelta.length > 0 ? levelDelta.reduce((s, d) => s + d, 0) / levelDelta.length : 0;

    const currentWins = last.wins;
    const currentLevel = last.level;
    const currentShards = last.shards;
    const predictions = [];

    if (currentWins < 200 && avgWinsPerSeason > 0) {
        const winsToGo = 200 - currentWins;
        const seasonsToGo = winsToGo / avgWinsPerSeason;
        if (seasonsToGo < 50) predictions.push({
            icon: '⚔️', label: '200 побед',
            value: seasonsToGo < 1 ? '< 1 сез.' : `~${Math.ceil(seasonsToGo)} сез.`,
            detail: `${winsToGo} побед · ~${avgWinsPerSeason.toFixed(0)}/сезон`
        });
    }

    if (currentLevel < 50 && avgLevelPerSeason > 0) {
        const levelToGo = 50 - currentLevel;
        const seasonsToGo = levelToGo / avgLevelPerSeason;
        if (seasonsToGo < 50) predictions.push({
            icon: '👑', label: '50 уровень',
            value: seasonsToGo < 1 ? '< 1 сез.' : `~${Math.ceil(seasonsToGo)} сез.`,
            detail: `${levelToGo} ур. · ~+${avgLevelPerSeason.toFixed(0)}/сезон`
        });
    }

    if (currentLevel < 100 && currentLevel >= 30 && avgLevelPerSeason > 0) {
        const levelToGo = 100 - currentLevel;
        const seasonsToGo = levelToGo / avgLevelPerSeason;
        if (seasonsToGo < 50) predictions.push({
            icon: '💫', label: '100 уровень',
            value: seasonsToGo < 1 ? '< 1 сез.' : `~${Math.ceil(seasonsToGo)} сез.`,
            detail: `${levelToGo} ур. · ~+${avgLevelPerSeason.toFixed(0)}/сезон`
        });
    }

    if (trend.lastWR < 0.60 && trend.trend === 'growth' && Math.abs(trend.slope) > 0.005) {
        const wrToGo = 0.60 - trend.lastWR;
        const seasonsToGo = wrToGo / Math.abs(trend.slope);
        if (seasonsToGo < 20) predictions.push({
            icon: '📈', label: '60% винрейт',
            value: seasonsToGo < 1 ? '< 1 сез.' : `~${Math.ceil(seasonsToGo)} сез.`,
            detail: `+${(wrToGo * 100).toFixed(1)}% · рост ${(trend.slope * 100).toFixed(1)}%/сезон`
        });
    }

    if (currentShards < 1000 && avgShardsPerSeason > 0) {
        const shardsToGo = 1000 - currentShards;
        const seasonsToGo = shardsToGo / avgShardsPerSeason;
        if (seasonsToGo < 50) predictions.push({
            icon: '💎', label: '1000 осколков',
            value: seasonsToGo < 1 ? '< 1 сез.' : `~${Math.ceil(seasonsToGo)} сез.`,
            detail: `${shardsToGo} 💎 · ~+${avgShardsPerSeason.toFixed(0)}/сезон`
        });
    }

    return predictions;
}

// ============ ПРОГНОЗ ============
function buildForecast(trend, leaguePlace) {
    let wrForecast = trend.lastWR;
    if (trend.trend === 'growth') wrForecast = Math.min(0.85, trend.lastWR + Math.abs(trend.slope) * 2);
    else if (trend.trend === 'fall') wrForecast = Math.max(0.20, trend.lastWR - Math.abs(trend.slope) * 2);
    const wrMin = Math.max(0.20, wrForecast - 0.04);
    const wrMax = Math.min(0.85, wrForecast + 0.04);
    let placeForecast = null;
    if (leaguePlace) {
        if (trend.trend === 'growth' && leaguePlace.place > 8) {
            placeForecast = { min: Math.max(1, leaguePlace.place - 3), max: leaguePlace.place };
        } else if (trend.trend === 'growth') {
            placeForecast = { min: Math.max(1, leaguePlace.place - 2), max: leaguePlace.place };
        } else if (trend.trend === 'fall') {
            placeForecast = { min: leaguePlace.place, max: leaguePlace.place + 3 };
        } else {
            placeForecast = { min: Math.max(1, leaguePlace.place - 1), max: leaguePlace.place + 1 };
        }
    }
    return { wrForecast, wrMin, wrMax, placeForecast };
}

// ============ НАРРАТИВ ============
function generateNarrative(history, trend, heroAnalysis, dungeon, leaguePlace) {
    const lines = [];
    if (history.length === 0) return ['Я не вижу твоей нити. Ты ещё не начинал свой путь.'];
    const last = history[history.length - 1];

    if (history.length === 1) {
        lines.push(`<strong>Твоя повесть только начинается.</strong> Я вижу тебя впервые — сезон ${last.season}. ${last.wins} побед, ${last.losses} поражений. Нить ещё коротка, но первые узлы уже завязаны.`);
    } else {
        const s = trend.seasonsCount;
        if (trend.trend === 'growth') {
            lines.push(`<strong>Твоя нить набирает силу.</strong> Я вижу тебя <span class="accent">${s} сезонов</span>. С ${(trend.firstWR * 100).toFixed(0)}% до ${(trend.lastWR * 100).toFixed(0)}% — это <strong>+${(trend.delta * 100).toFixed(0)}%</strong> за ${s - 1} сезонов. Ты прибавлял с каждым сезоном.`);
        } else if (trend.trend === 'fall') {
            lines.push(`<strong>Твоя нить истончилась.</strong> Я вижу тебя <span class="accent">${s} сезонов</span>. С ${(trend.firstWR * 100).toFixed(0)}% до ${(trend.lastWR * 100).toFixed(0)}% — это <strong>${(trend.delta * 100).toFixed(0)}%</strong>. Твой огонь угасает. Пора его раздуть.`);
        } else {
            lines.push(`<strong>Твоя нить ровна.</strong> Я вижу тебя <span class="accent">${s} сезонов</span>. Твой винрейт держится около ${(trend.avg * 100).toFixed(0)}%. Это надёжность — но не рост.`);
        }
    }

    if (trend.peakSeason !== undefined && trend.form < 0.98 && trend.seasonsCount > 1) {
        lines.push(`Твоя ярчайшая глава — <strong>сезон ${trend.peakSeason}</strong> (${(trend.peak * 100).toFixed(0)}%). Сейчас ты на <span class="accent">${(trend.form * 100).toFixed(0)}%</span> от той формы. ${trend.form > 0.9 ? 'Это не падение — это передышка.' : trend.form > 0.75 ? 'Ты ощутимо ниже своей лучшей главы. Пора вернуться.' : 'Ты далеко от своей лучшей формы. Соберись.'}`);
    } else if (trend.form >= 0.98 && trend.peakSeason !== undefined && trend.seasonsCount > 1) {
        lines.push(`<strong>Ты на пике!</strong> Сезон ${trend.peakSeason} — твоя лучшая глава. Винрейт ${(trend.peak * 100).toFixed(0)}%. Не отпускай нить.`);
    }

    if (trend.stdDev !== undefined && trend.seasonsCount > 1) {
        if (trend.stdDev < 0.03) {
            lines.push(`Ты <strong>ровен</strong>. Разброс винрейта — всего ${(trend.stdDev * 100).toFixed(1)}%. Ты не рискуешь — ты играешь наверняка.`);
        } else if (trend.stdDev > 0.08) {
            lines.push(`Ты <strong>непредсказуем</strong>. Разброс — ${(trend.stdDev * 100).toFixed(1)}%. Ты то взлетаешь, то падаешь. Найди свой ритм.`);
        }
    }

    if (heroAnalysis.count > 1) {
        lines.push(`За твоей спиной — <span class="accent">${heroAnalysis.count}</span> героев. Их общая летопись: истинный винрейт <strong>${(heroAnalysis.trueWR * 100).toFixed(1)}%</strong>.`);
        if (heroAnalysis.best && heroAnalysis.best.wr > trend.lastWR + 0.05) {
            lines.push(`Твоим лучшим героем был <strong>${heroAnalysis.best.emoji} ${heroAnalysis.best.name}</strong> — ${(heroAnalysis.best.wr * 100).toFixed(0)}% (${heroAnalysis.best.wins}-${heroAnalysis.best.losses}). Нынешний герой уступает ему. Стоит задуматься о возвращении.`);
        }
    } else if (heroAnalysis.count === 1) {
        lines.push(`Ты верен одному герою — <strong>${heroAnalysis.heroes[0].emoji} ${heroAnalysis.heroes[0].name}</strong>. Это редкость.`);
    }

    if (dungeon.totalWaves > 0) {
        lines.push(`В Бездне ты оставил <strong>${dungeon.totalWaves}</strong> волн. Твой рекорд — ${dungeon.maxRecord}. ${dungeon.maxRecord >= 30 ? 'О тебе будут рассказывать в тавернах.' : dungeon.maxRecord >= 20 ? 'Ты — опытный ныряльщик.' : 'Ты только начал спускаться.'}`);
    }

    if (leaguePlace) {
        const f = leaguePlace.faction === 'Орден Света' ? '🌝 Света' : '🌚 Тьмы';
        if (leaguePlace.inTop8) {
            lines.push(`В Лиге ${f} ты <strong>${leaguePlace.place}-й</strong> из ${leaguePlace.total}. Ты среди сильнейших. Держи позицию.`);
        } else {
            lines.push(`В Лиге ${f} ты <strong>${leaguePlace.place}-й</strong> из ${leaguePlace.total}. До восьмёрки не хватает <strong>${leaguePlace.gapToTop8}</strong> SKILL.`);
        }
    }

    return lines;
}

// ============ ГРЯДУЩАЯ ГЛАВА ============
function generateForecastText(forecast, trend, leaguePlace) {
    const lines = [];
    lines.push(`Я вижу, как разворачивается <strong>следующая глава</strong> твоей повести:`);
    lines.push(`Винрейт — <strong>${(forecast.wrForecast * 100).toFixed(0)}%</strong> (от ${(forecast.wrMin * 100).toFixed(0)}% до ${(forecast.wrMax * 100).toFixed(0)}%)`);
    if (forecast.placeForecast) {
        lines.push(`Место в Лиге — <strong>с ${forecast.placeForecast.min}-го по ${forecast.placeForecast.max}-е</strong>`);
    }
    if (trend.trend === 'growth') lines.push(`Условие: не сбавлять шаг. Если замедлишься — откатишься.`);
    else if (trend.trend === 'fall') lines.push(`Условие: переломить падение. Тебе нужна серия побед.`);
    else lines.push(`Условие: сделать рывок. Ровность — это хорошо, но ты можешь больше.`);
    return lines;
}

// ============ СОВЕТ ============
function generateAdvice(trend, heroAnalysis, leaguePlace) {
    if (trend.trend === 'growth' && (!leaguePlace || leaguePlace.inTop8)) {
        return `Твоя нить натянута, как тетива. <strong>Не отпускай.</strong> Два-три боя в день, и стрик не порвётся. Следующая глава — твоя.`;
    }
    if (trend.trend === 'growth') {
        return `Ты растёшь, но ещё не среди сильнейших. До цели — <strong>${leaguePlace?.gapToTop8 || '?'} SKILL</strong>. Это близко. Ещё немного — и ты в Лиге.`;
    }
    if (trend.trend === 'fall') {
        return `Твой огонь угасает. <strong>Смени путь.</strong> ${heroAnalysis.best && heroAnalysis.best.wr > trend.lastWR + 0.05 ? `Вернись к ${heroAnalysis.best.emoji} ${heroAnalysis.best.name} — у него ${(heroAnalysis.best.wr * 100).toFixed(0)}% винрейта.` : 'Попробуй нового героя. Или отдохни.'}`;
    }
    if (heroAnalysis.best && heroAnalysis.best.wr > trend.lastWR + 0.08) {
        return `Ты ровен, но не растёшь. <strong>Твой архивный ${heroAnalysis.best.emoji} ${heroAnalysis.best.name} сильнее</strong> — ${(heroAnalysis.best.wr * 100).toFixed(0)}% против ${(trend.lastWR * 100).toFixed(0)}%. Возможно, стоит вернуться.`;
    }
    return `Ты идёшь ровно. <strong>Пора сделать рывок.</strong> Поставь цель — восьмёрка Лиги. И работай над её достижением.`;
}

// ============ РЕНДЕР ============
function renderPlayerInfo(player) {
    const fc = player.faction === 'Орден Света' ? 'light' : player.faction === 'Культ Тьмы' ? 'dark' : '';
    const fe = player.faction === 'Орден Света' ? '🌝' : player.faction === 'Культ Тьмы' ? '🌚' : '';
    return `<div class="player-header">
        <div class="player-emoji">${player.emoji || '⚔️'}</div>
        <div class="player-name">${player.display}</div>
        <div class="player-class">${player.name || '—'}</div>
        ${player.faction ? `<div class="player-faction ${fc}">${fe} ${player.faction}</div>` : ''}
    </div>`;
}

function renderHistory(history) {
    if (history.length === 0) return '';
    let html = '<div class="oracle-block"><div class="oracle-block-title">📜 Твоя летопись</div><div class="table-container"><table class="history-table"><thead><tr><th>Сезон</th><th>W/L</th><th>WR</th><th>Ур.</th><th>Фракция</th></tr></thead><tbody>';
    history.forEach(h => {
        const wrColor = h.wr >= 0.55 ? 'var(--gold)' : h.wr >= 0.45 ? 'var(--green)' : 'var(--red)';
        const fi = h.faction === 'Орден Света' ? '🌝' : h.faction === 'Культ Тьмы' ? '🌚' : '';
        html += `<tr class="${h.isCurrent ? 'current' : ''}">
            <td class="season-num">S${h.season}${h.isCurrent ? ' ⚡' : ''}</td>
            <td>${h.wins}-${h.losses}</td>
            <td class="wr-cell" style="color:${wrColor};">${(h.wr * 100).toFixed(1)}%</td>
            <td>${h.level}</td>
            <td>${fi}</td>
        </tr>`;
    });
    html += '</tbody></table></div>';
    const totalWins = history.reduce((s, h) => s + h.wins, 0);
    const totalLosses = history.reduce((s, h) => s + h.losses, 0);
    const totalFights = totalWins + totalLosses;
    const totalWR = totalFights > 0 ? totalWins / totalFights : 0;
    const maxLevel = Math.max(...history.map(h => h.level || 0));
    const wrColor = totalWR >= 0.55 ? 'var(--gold)' : totalWR >= 0.45 ? 'var(--green)' : 'var(--red)';
    html += `<div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--border);text-align:center;color:var(--sub);font-size:0.85rem;">
        <div>Всего: <strong style="color:var(--text);">${totalWins}-${totalLosses}</strong> · <strong style="color:${wrColor};">${(totalWR * 100).toFixed(1)}%</strong></div>
        <div style="margin-top:4px;">${history.length} ${history.length === 1 ? 'сезон' : history.length < 5 ? 'сезона' : 'сезонов'} · Макс. уровень: <strong style="color:var(--gold);">${maxLevel}</strong></div>
    </div></div>`;
    return html;
}

function renderChart(history) {
    if (history.length < 2) return '';
    const points = history.map(h => h.wr * 100);
    const labels = history.map(h => `S${h.season}`);
    const W = 600, H = 200, P = 50;
    const minW = Math.min(...points) - 2;
    const maxW = Math.max(...points) + 2;
    const range = maxW - minW || 1;
    const gX = (i) => P + (W - P * 2) * i / (points.length - 1);
    const gY = (v) => H - P - ((v - minW) / range) * (H - P * 2);
    const svgPoints = points.map((p, i) => `${gX(i)},${gY(p)}`).join(' ');
    const circles = points.map((p, i) => {
        const color = i === points.length - 1 ? (p >= points[0] ? '#10b981' : '#ef4444') : '#a371f7';
        return `<circle cx="${gX(i)}" cy="${gY(p)}" r="6" fill="var(--card)" stroke="${color}" stroke-width="2.5"/>`;
    }).join('');
    const texts = points.map((p, i) =>
        `<text x="${gX(i)}" y="${gY(p) - 14}" text-anchor="middle" fill="#c4a5ff" font-size="11" font-weight="700">${p.toFixed(1)}%</text>`
    ).join('');
    const bottomLabels = labels.map((l, i) =>
        `<text x="${gX(i)}" y="${H - 8}" text-anchor="middle" fill="#8a94a8" font-size="10">${l}</text>`
    ).join('');
    const diff = points[points.length - 1] - points[0];
    const diffText = diff >= 0 ? `+${diff.toFixed(1)}%` : `${diff.toFixed(1)}%`;
    const diffColor = diff >= 0 ? 'var(--green)' : 'var(--red)';
    return `<div class="oracle-block gold">
        <div class="oracle-block-title" style="margin-bottom:8px;">📈 Динамика винрейта</div>
        <div style="text-align:center;margin-bottom:4px;font-size:.85rem;color:var(--sub)">
            ${points[0].toFixed(1)}% → <span style="color:${diffColor};font-weight:700">${points[points.length - 1].toFixed(1)}% (${diffText})</span>
        </div>
        <div class="chart-wrap">
            <svg width="100%" height="${H}" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" style="display:block;max-width:100%">
                <defs>
                    <linearGradient id="chartArea" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0%" stop-color="#a371f7" stop-opacity="0.25"/>
                        <stop offset="100%" stop-color="#a371f7" stop-opacity="0"/>
                    </linearGradient>
                    <linearGradient id="chartLine" x1="0" y1="0" x2="1" y2="0">
                        <stop offset="0%" stop-color="#8b5cf6"/>
                        <stop offset="50%" stop-color="#c4a5ff"/>
                        <stop offset="100%" stop-color="#f0b90b"/>
                    </linearGradient>
                </defs>
                <polygon points="${gX(0)},${H - P} ${svgPoints} ${gX(points.length - 1)},${H - P}" fill="url(#chartArea)"/>
                <polyline points="${svgPoints}" fill="none" stroke="url(#chartLine)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
                ${circles}${texts}${bottomLabels}
            </svg>
        </div>
    </div>`;
}

function renderTrends(trend) {
    if (trend.trend === 'none' || trend.trend === 'first') return '';
    let trendIcon, trendText;
    if (trend.trend === 'growth') { trendIcon = '↗'; trendText = 'Рост'; }
    else if (trend.trend === 'fall') { trendIcon = '↘'; trendText = 'Угасание'; }
    else { trendIcon = '→'; trendText = 'Ровно'; }
    const formPct = (trend.form * 100).toFixed(0);
    const formIcon = trend.form >= 0.98 ? '🔥' : trend.form >= 0.9 ? '💪' : trend.form >= 0.75 ? '⚠️' : '🔻';
    return `<div class="oracle-block gold"><div class="oracle-block-title">📈 Твои тренды</div><div class="trend-grid">
        <div class="trend-item"><div class="trend-icon">${trendIcon}</div><div class="trend-value">${trendText}</div><div class="trend-label">Нить</div></div>
        <div class="trend-item"><div class="trend-icon">${formIcon}</div><div class="trend-value">${formPct}%</div><div class="trend-label">Форма</div></div>
        <div class="trend-item"><div class="trend-icon">🏔</div><div class="trend-value">S${trend.peakSeason}</div><div class="trend-label">Пик</div></div>
        <div class="trend-item"><div class="trend-icon">📊</div><div class="trend-value">${(trend.stdDev * 100).toFixed(1)}%</div><div class="trend-label">Разброс</div></div>
    </div></div>`;
}

function renderSeasonHighlights(sa) {
    if (!sa || sa.seasonsCount < 2) return '';
    return `<div class="oracle-block green"><div class="oracle-block-title">🏆 Лучшие и худшие главы</div><div class="season-highlight">
        <div class="season-card"><div class="season-icon">🏆</div><div class="season-title">Лучший WR</div><div class="season-value">${(sa.bestWR.wr * 100).toFixed(1)}%</div><div class="season-detail">S${sa.bestWR.season} · ${sa.bestWR.wins}-${sa.bestWR.losses}</div></div>
        <div class="season-card"><div class="season-icon">💀</div><div class="season-title">Худший WR</div><div class="season-value">${(sa.worstWR.wr * 100).toFixed(1)}%</div><div class="season-detail">S${sa.worstWR.season} · ${sa.worstWR.wins}-${sa.worstWR.losses}</div></div>
        <div class="season-card"><div class="season-icon">⚔️</div><div class="season-title">Больше побед</div><div class="season-value">${sa.mostWins.wins}</div><div class="season-detail">S${sa.mostWins.season}</div></div>
        <div class="season-card"><div class="season-icon">🔥</div><div class="season-title">Больше боёв</div><div class="season-value">${sa.mostFights.total}</div><div class="season-detail">S${sa.mostFights.season}</div></div>
    </div></div>`;
}

function renderStyle(heroAnalysis) {
    if (!heroAnalysis || heroAnalysis.count === 0) return '';
    const classArr = Object.entries(heroAnalysis.classStats)
        .map(([n, s]) => ({ name: n, wins: s.wins, losses: s.losses, total: s.wins + s.losses, wr: s.wins / (s.wins + s.losses) }))
        .filter(c => c.total >= 5).sort((a, b) => b.total - a.total);
    const raceArr = Object.entries(heroAnalysis.raceStats)
        .map(([n, s]) => ({ name: n, wins: s.wins, losses: s.losses, total: s.wins + s.losses, wr: s.wins / (s.wins + s.losses) }))
        .filter(c => c.total >= 5).sort((a, b) => b.total - a.total);
    const comboArr = Object.entries(heroAnalysis.comboStats)
        .map(([n, s]) => ({ name: n, wins: s.wins, losses: s.losses, total: s.wins + s.losses, wr: s.wins / (s.wins + s.losses), emoji: s.emoji }))
        .filter(c => c.total >= 10).sort((a, b) => b.wr - a.wr);

    const bestClassByWR = classArr.length > 0 ? [...classArr].sort((a, b) => b.wr - a.wr)[0] : null;
    const mostClassByFreq = classArr.length > 0 ? classArr[0] : null;
    const bestRaceByWR = raceArr.length > 0 ? [...raceArr].sort((a, b) => b.wr - a.wr)[0] : null;
    const mostRaceByFreq = raceArr.length > 0 ? raceArr[0] : null;
    const bestCombo = comboArr.length > 0 ? comboArr[0] : null;

    const getTag = (item, bestWR, mostFreq) => {
        const isBest = bestWR && item.name === bestWR.name;
        const isFreq = mostFreq && item.name === mostFreq.name;
        if (isBest && isFreq) return { tag: '🏆🔥', cls: 'best' };
        if (isBest) return { tag: '🏆', cls: 'best' };
        if (isFreq) return { tag: '🔥', cls: '' };
        return { tag: '', cls: '' };
    };

    let html = '<div class="oracle-block ice"><div class="oracle-block-title">🎭 Твой стиль</div>';
    if (classArr.length > 0) {
        html += '<div style="font-size:0.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;">Классы <span style="text-transform:none;font-weight:400;">(🏆 лучший WR · 🔥 самый частый)</span></div>';
        classArr.slice(0, 3).forEach(c => {
            const { tag, cls } = getTag(c, bestClassByWR, mostClassByFreq);
            html += `<div class="style-row ${cls}"><div class="style-name"><span>${tag || '⚔️'}</span> ${c.name}</div><div class="style-val">${c.wins}-${c.losses} (${(c.wr * 100).toFixed(1)}%)</div></div>`;
        });
    }
    if (raceArr.length > 0) {
        html += '<div style="font-size:0.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin:14px 0 8px;">Расы <span style="text-transform:none;font-weight:400;">(🏆 лучший WR · 🔥 самый частый)</span></div>';
        raceArr.slice(0, 3).forEach(r => {
            const { tag, cls } = getTag(r, bestRaceByWR, mostRaceByFreq);
            html += `<div class="style-row ${cls}"><div class="style-name"><span>${tag || '🌍'}</span> ${r.name}</div><div class="style-val">${r.wins}-${r.losses} (${(r.wr * 100).toFixed(1)}%)</div></div>`;
        });
    }
    if (bestCombo) {
        html += `<div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--border);text-align:center;font-size:0.85rem;">
            🏆 Лучшее комбо: <strong style="color:var(--green);">${bestCombo.emoji} ${bestCombo.name}</strong> — ${bestCombo.wins}-${bestCombo.losses} (${(bestCombo.wr * 100).toFixed(1)}%)
        </div>`;
    }
    html += '</div>';
    return html;
}

function renderFactions(factions) {
    if (!factions || (factions.light.count === 0 && factions.dark.count === 0)) return '';
    let html = '<div class="oracle-block"><div class="oracle-block-title">⚔️ Твои фракции</div>';
    if (factions.light.count > 0) {
        const wrColor = factions.light.wr >= 0.55 ? 'var(--gold)' : factions.light.wr >= 0.45 ? 'var(--green)' : 'var(--red)';
        html += `<div class="style-row"><div class="style-name"><span>🌝</span> Орден Света</div><div class="style-val">${factions.light.count} сез. · <span style="color:${wrColor};">${(factions.light.wr * 100).toFixed(1)}%</span></div></div>`;
    }
    if (factions.dark.count > 0) {
        const wrColor = factions.dark.wr >= 0.55 ? 'var(--gold)' : factions.dark.wr >= 0.45 ? 'var(--green)' : 'var(--red)';
        html += `<div class="style-row"><div class="style-name"><span>🌚</span> Культ Тьмы</div><div class="style-val">${factions.dark.count} сез. · <span style="color:${wrColor};">${(factions.dark.wr * 100).toFixed(1)}%</span></div></div>`;
    }
    html += '</div>';
    return html;
}

function renderCompare(cmp) {
    if (!cmp) return '';
    const maxWR = Math.max(cmp.myWR, cmp.avgWR, 0.01);
    const myPct = (cmp.myWR / maxWR) * 100;
    const avgPct = (cmp.avgWR / maxWR) * 100;
    return `<div class="oracle-block"><div class="oracle-block-title">📊 Ты vs Средний игрок</div>
        <div class="compare-row"><div class="compare-label">Твой WR</div><div class="compare-bar-wrap"><div class="compare-bar you" style="width:${myPct}%">${(cmp.myWR * 100).toFixed(1)}%</div></div></div>
        <div class="compare-row"><div class="compare-label">Средний WR</div><div class="compare-bar-wrap"><div class="compare-bar avg" style="width:${avgPct}%">${(cmp.avgWR * 100).toFixed(1)}%</div></div></div>
        <div style="margin-top:12px;text-align:center;font-size:0.85rem;color:var(--sub);">
            ${cmp.myWR > cmp.avgWR ? `Ты <strong style="color:var(--green);">выше</strong> среднего на ${((cmp.myWR - cmp.avgWR) * 100).toFixed(1)}%` : cmp.myWR < cmp.avgWR ? `Ты <strong style="color:var(--red);">ниже</strong> среднего на ${((cmp.avgWR - cmp.myWR) * 100).toFixed(1)}%` : 'Ты точно на среднем уровне'}
        </div>
    </div>`;
}

function renderPredictions(predictions) {
    if (!predictions || predictions.length === 0) return '';
    let html = '<div class="oracle-block gold"><div class="oracle-block-title">🔮 Когда достигнешь X</div><div class="season-highlight">';
    predictions.forEach(p => {
        html += `<div class="season-card"><div class="season-icon">${p.icon}</div><div class="season-title">${p.label}</div><div class="season-value">${p.value}</div><div class="season-detail">${p.detail}</div></div>`;
    });
    html += '</div></div>';
    return html;
}

function renderHeroArchive(heroAnalysis) {
    if (heroAnalysis.count === 0) return '';
    let html = '<div class="oracle-block ice"><div class="oracle-block-title">🎭 Твои герои</div>';
    const sorted = [...heroAnalysis.heroes].sort((a, b) => {
        if (a.isCurrent) return -1;
        if (b.isCurrent) return 1;
        return b.wr - a.wr;
    });
    sorted.forEach(h => {
        const isBest = heroAnalysis.best && h.name === heroAnalysis.best.name && h.season === heroAnalysis.best.season;
        const cls = h.isCurrent ? 'current' : isBest ? 'best' : '';
        const wrColor = h.wr >= 0.55 ? 'var(--gold)' : h.wr >= 0.45 ? 'var(--green)' : 'var(--red)';
        const tag = h.isCurrent ? '⚡ Текущий' : isBest ? '🏆 Лучший' : `S${h.season}`;
        html += `<div class="archive-hero ${cls}">
            <div class="hero-info"><span>${h.emoji} ${h.name}</span></div>
            <div><span class="hero-wr" style="color:${wrColor};">${h.wins}-${h.losses} (${(h.wr * 100).toFixed(0)}%)</span> <span style="color:var(--muted);font-size:0.75rem;margin-left:8px;">${tag}</span></div>
        </div>`;
    });
    const wrColor = heroAnalysis.trueWR >= 0.55 ? 'var(--gold)' : heroAnalysis.trueWR >= 0.45 ? 'var(--green)' : 'var(--red)';
    html += `<div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--border);text-align:center;color:var(--sub);font-size:0.85rem;">
        <div>Всего героев: <strong style="color:var(--purple);">${heroAnalysis.count}</strong></div>
        <div style="margin-top:4px;">Суммарно: <strong style="color:var(--text);">${heroAnalysis.totalWins}-${heroAnalysis.totalLosses}</strong></div>
        <div style="margin-top:4px;">Истинный винрейт: <strong style="color:${wrColor};">${(heroAnalysis.trueWR * 100).toFixed(1)}%</strong></div>
        ${heroAnalysis.best ? `<div style="margin-top:4px;">Лучший герой: <strong style="color:var(--green);">${heroAnalysis.best.emoji} ${heroAnalysis.best.name}</strong> (${(heroAnalysis.best.wr * 100).toFixed(1)}%)</div>` : ''}
    </div></div>`;
    return html;
}

function renderDungeon(dungeon) {
    if (!dungeon || dungeon.totalWaves === 0) return '';
    return `<div class="oracle-block ice"><div class="oracle-block-title">🏔 Бездна Разлома</div><div class="trend-grid">
        <div class="trend-item"><div class="trend-icon">🌊</div><div class="trend-value">${dungeon.totalWaves}</div><div class="trend-label">Всего волн</div></div>
        <div class="trend-item"><div class="trend-icon">🏆</div><div class="trend-value">${dungeon.maxRecord}</div><div class="trend-label">Рекорд</div></div>
        <div class="trend-item"><div class="trend-icon">🐉</div><div class="trend-value">${dungeon.totalBosses}</div><div class="trend-label">Боссов</div></div>
        <div class="trend-item"><div class="trend-icon">👑</div><div class="trend-value">${dungeon.totalTrophies}</div><div class="trend-label">Трофеев</div></div>
    </div></div>`;
}

function renderVoice(lines) {
    if (!lines.length) return '';
    return `<div class="oracle-block"><div class="oracle-block-title">📜 Что я вижу в твоей нити</div>${lines.map(l => `<div class="oracle-voice">${l}</div>`).join('')}</div>`;
}

function renderForecast(forecast, trend) {
    if (!forecast) return '';
    return `<div class="oracle-block"><div class="oracle-block-title">🎯 Грядущая глава</div><div class="forecast-grid">
        <div class="forecast-card"><div class="forecast-icon">📈</div><div class="forecast-value">${(forecast.wrForecast * 100).toFixed(0)}%</div><div class="forecast-label">Винрейт</div><div class="forecast-range">${(forecast.wrMin * 100).toFixed(0)}–${(forecast.wrMax * 100).toFixed(0)}%</div></div>
        ${forecast.placeForecast ? `<div class="forecast-card"><div class="forecast-icon">🏆</div><div class="forecast-value">${forecast.placeForecast.min}–${forecast.placeForecast.max}</div><div class="forecast-label">Место в Лиге</div></div>` : ''}
    </div></div>`;
}

function renderAdvice(advice) {
    if (!advice) return '';
    return `<div class="advice-block"><div class="advice-icon">🖋️</div><div class="advice-text">${advice}</div></div>`;
}

// ============ ГЛАВНАЯ ФУНКЦИЯ ============
async function analyzePlayer() {
    const nickname = document.getElementById('oracleSearch').value.trim();
    const result = document.getElementById('oracleResult');
    autocompleteList.classList.remove('show');
    if (!nickname) {
        result.innerHTML = '<div class="not-found"><div class="nf-icon">📜</div><div>Назови имя героя</div></div>';
        return;
    }
    result.innerHTML = '<div class="loading-block"><div class="spinner"></div><p>Повествовательница листает страницы...</p></div>';

    try {
        if (!allSeasonsCache) {
            allSeasonsCache = await loadAllSeasons();
            allPlayersCache = getAllPlayers(allSeasonsCache);
        }
        const seasons = allSeasonsCache;
        const history = getPlayerHistory(nickname, seasons);

        if (history.length === 0) {
            result.innerHTML = `<div class="not-found"><div class="nf-icon">👻</div><div>Я не вижу <strong>${nickname}</strong> ни в одном сезоне.</div><div style="margin-top:12px;font-size:0.85rem;">Возможно, имя написано с ошибкой, или герой ещё не начинал свой путь.</div></div>`;
            return;
        }

        const last = history[history.length - 1];
        const trend = analyzeTrend(history);
        const heroAnalysis = analyzeHeroArchive(nickname, seasons);
        const dungeon = analyzeDungeon(nickname, seasons);
        const leaguePlace = getLeaguePlace(nickname, seasons);
        const seasonAnalysis = analyzeSeasons(history);
        const factions = analyzeFactions(history);
        const comparison = compareWithAverage(nickname, seasons);
        const predictions = predictMilestones(history, trend);
        const forecast = buildForecast(trend, leaguePlace);
        const narrative = generateNarrative(history, trend, heroAnalysis, dungeon, leaguePlace);
        const forecastText = generateForecastText(forecast, trend, leaguePlace);
        const advice = generateAdvice(trend, heroAnalysis, leaguePlace);

        let html = '';
        html += renderPlayerInfo(last);
        html += renderHistory(history);
        html += renderVoice(narrative);
        html += renderChart(history);
        html += renderTrends(trend);
        html += renderSeasonHighlights(seasonAnalysis);
        html += renderForecast(forecast, trend);
        html += renderPredictions(predictions);
        html += renderHeroArchive(heroAnalysis);
        html += renderStyle(heroAnalysis);
        html += renderFactions(factions);
        html += renderCompare(comparison);
        html += renderDungeon(dungeon);
        html += `<div class="oracle-block gold"><div class="oracle-block-title">🖋️ Слово Повествовательницы</div>${forecastText.map(l => `<div class="oracle-voice">${l}</div>`).join('')}</div>`;
        html += renderAdvice(advice);

        result.innerHTML = html;
    } catch (e) {
        console.error(e);
        result.innerHTML = `<div class="not-found"><div class="nf-icon">💀</div><div>Повествовательница не может прочесть. Ошибка: ${e.message}</div></div>`;
    }
}

// ============ ПРЕДЗАГРУЗКА ============
(async function preload() {
    try {
        allSeasonsCache = await loadAllSeasons();
        allPlayersCache = getAllPlayers(allSeasonsCache);
        console.log('Повествовательница: игроков —', allPlayersCache.length);
    } catch (e) {
        console.error('Ошибка предзагрузки:', e);
    }
    const params = new URLSearchParams(window.location.search);
    const name = params.get('name');
    if (name) {
        document.getElementById('oracleSearch').value = name;
        setTimeout(() => analyzePlayer(), 300);
    }
})();

// ============ SCROLL UI ============
(function() {
    const progressBar = document.getElementById('readingProgress');
    const scrollTopBtn = document.getElementById('scrollTop');
    if (!progressBar || !scrollTopBtn) return;
    window.addEventListener('scroll', () => {
        const scrollTop = window.scrollY;
        const docHeight = document.documentElement.scrollHeight - window.innerHeight;
        const progress = docHeight > 0 ? (scrollTop / docHeight) * 100 : 0;
        progressBar.style.transform = `scaleX(${progress / 100})`;
        if (scrollTop > 300) scrollTopBtn.classList.add('visible');
        else scrollTopBtn.classList.remove('visible');
    });
})();
</script>
