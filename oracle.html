<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <title>Арена Этерниса — Повествовательница</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="theme.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,600;14..32,800;14..32,900&display=swap" rel="stylesheet">
<style>
/* ============================================================================
   ПОВЕСТВОВАТЕЛЬНИЦА — стили страницы oracle.html
   Базируется на theme.css. Использует его переменные.
   ========================================================================= */

/* ----------------------------------------------------------------------------
   1. ФОН И ШАПКА (дополнение к базовой теме)
   ---------------------------------------------------------------------------- */
body {
    background-image:
        radial-gradient(ellipse at 20% 0%, rgba(163,113,247,0.10) 0%, transparent 45%),
        radial-gradient(ellipse at 80% 100%, rgba(163,113,247,0.08) 0%, transparent 45%);
}

/* ----------------------------------------------------------------------------
   2. ПОИСК
   ---------------------------------------------------------------------------- */
.search-row {
    max-width: 620px;
    margin: 0 auto 28px;
    position: relative;
}
.search-input-wrap { display: flex; gap: 10px; }

.search-input.oracle-input {
    flex: 1;
    padding: 15px 22px;
    background: linear-gradient(135deg, rgba(163,113,247,0.08), rgba(163,113,247,0.03));
    border: 1px solid var(--border);
    border-radius: 26px;
    color: var(--text);
    font-size: 0.95rem;
    font-family: inherit;
    transition: 0.25s;
    width: 100%;
    box-sizing: border-box;
}
.search-input.oracle-input:focus {
    outline: none;
    border-color: var(--purple);
    background: linear-gradient(135deg, rgba(163,113,247,0.12), rgba(163,113,247,0.05));
    box-shadow: 0 0 0 4px rgba(163,113,247,0.15);
}
.search-input.oracle-input::placeholder { color: var(--muted); }

.search-btn {
    padding: 15px 26px;
    background: linear-gradient(135deg, var(--purple), #8b5cf6, var(--purple));
    background-size: 200% auto;
    border: none;
    border-radius: 26px;
    color: #fff;
    font-weight: 700;
    font-size: 0.9rem;
    font-family: inherit;
    cursor: pointer;
    transition: 0.25s;
    white-space: nowrap;
    box-shadow: 0 4px 16px rgba(163,113,247,0.3);
}
.search-btn:hover {
    transform: translateY(-2px);
    background-position: right center;
    box-shadow: 0 8px 28px rgba(163,113,247,0.5);
}

/* Автокомплит */
.autocomplete-list {
    position: absolute;
    top: calc(100% + 6px);
    left: 0; right: 0;
    background: var(--elevated);
    border: 1px solid var(--border);
    border-radius: 14px;
    max-height: 340px;
    overflow-y: auto;
    z-index: 50;
    box-shadow: 0 12px 40px rgba(0,0,0,0.5);
    display: none;
}
.autocomplete-list.show { display: block; animation: fadeSlideIn 0.2s ease; }
.autocomplete-item {
    padding: 12px 18px;
    cursor: pointer;
    font-size: 0.9rem;
    display: flex;
    align-items: center;
    gap: 12px;
    transition: 0.15s;
    border-bottom: 1px solid rgba(163,113,247,0.08);
}
.autocomplete-item:last-child { border-bottom: none; }
.autocomplete-item:hover,
.autocomplete-item.active {
    background: linear-gradient(90deg, rgba(163,113,247,0.18), rgba(163,113,247,0.05));
    border-left: 3px solid var(--purple);
    padding-left: 15px;
}
.autocomplete-item .ac-emoji { font-size: 1.3rem; }
.autocomplete-item .ac-name { color: var(--text); flex: 1; font-weight: 500; }
.autocomplete-item .ac-name strong { color: var(--purple); font-weight: 800; }
.autocomplete-item .ac-class { color: var(--muted); font-size: 0.72rem; }
.autocomplete-empty {
    padding: 18px;
    color: var(--muted);
    font-size: 0.85rem;
    text-align: center;
}

@media (max-width: 768px) {
    .search-input-wrap { flex-direction: column; }
    .search-btn { width: 100%; }
}

/* ----------------------------------------------------------------------------
   3. КАРТОЧКА ИГРОКА
   ---------------------------------------------------------------------------- */
.player-header {
    background: linear-gradient(135deg, rgba(163,113,247,0.16), rgba(163,113,247,0.06));
    border: 1px solid rgba(163,113,247,0.35);
    border-radius: var(--radius);
    padding: 26px 20px;
    text-align: center;
    margin-bottom: 24px;
    position: relative;
    overflow: hidden;
}
.player-header::after {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--purple), #c4a5ff, var(--purple), transparent);
    background-size: 200% auto;
    animation: shimmer 3s linear infinite;
}
.player-emoji { font-size: 3rem; margin-bottom: 4px; }
.player-name {
    font-size: 1.6rem;
    font-weight: 900;
    color: var(--gold);
    margin-bottom: 4px;
}
.player-class { color: var(--sub); font-size: 0.9rem; }
.player-faction {
    display: inline-block;
    margin-top: 10px;
    padding: 5px 16px;
    border-radius: 20px;
    font-size: 0.75rem;
    font-weight: 700;
    background: var(--elevated);
    border: 1px solid var(--border);
}
.player-faction.light { color: var(--gold); border-color: rgba(240,185,11,0.4); }
.player-faction.dark { color: var(--purple); border-color: rgba(163,113,247,0.4); }

@media (max-width: 768px) {
    .player-name { font-size: 1.3rem; }
    .player-emoji { font-size: 2.4rem; }
}

/* ----------------------------------------------------------------------------
   4. ТАБЫ ORACLE
   ---------------------------------------------------------------------------- */
.oracle-tabs {
    display: flex;
    gap: 6px;
    margin: 0 auto 20px;
    padding: 6px;
    background: var(--card);
    border-radius: var(--radius);
    border: 1px solid var(--border);
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    justify-content: flex-start;
    max-width: 100%;
    width: fit-content;
}
.oracle-tabs::-webkit-scrollbar { display: none; }
.oracle-tab {
    padding: 10px 16px;
    border: none;
    background: transparent;
    color: var(--sub);
    border-radius: 12px;
    cursor: pointer;
    font-size: 0.78rem;
    font-weight: 700;
    font-family: inherit;
    transition: 0.2s;
    white-space: nowrap;
    flex: 0 0 auto;
}
.oracle-tab:hover { background: var(--elevated); color: var(--text); }
.oracle-tab.active {
    background: linear-gradient(135deg, var(--purple), #8b5cf6);
    color: #fff;
    box-shadow: 0 4px 12px rgba(163,113,247,0.3);
}
.oracle-tab-content { display: none; animation: fadeSlideIn 0.3s ease; }
.oracle-tab-content.active { display: block; }

@media (max-width: 768px) {
    .oracle-tab { padding: 8px 12px; font-size: 0.72rem; }
}

/* ----------------------------------------------------------------------------
   5. БЛОКИ ORACLE
   ---------------------------------------------------------------------------- */
.oracle-block {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px 18px;
    margin-bottom: 16px;
    position: relative;
    overflow: hidden;
    animation: fadeSlideIn 0.4s ease;
}
.oracle-block::after {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--purple), transparent);
    opacity: 0.6;
}
.oracle-block.gold::after { background: linear-gradient(90deg, transparent, var(--gold), transparent); }
.oracle-block.gold {
    background: linear-gradient(180deg, var(--card), rgba(240,185,11,0.03));
    border-color: rgba(240,185,11,0.2);
}
.oracle-block.ice::after { background: linear-gradient(90deg, transparent, var(--ice), transparent); }
.oracle-block.ice { border-color: rgba(91,192,235,0.2); }
.oracle-block.green::after { background: linear-gradient(90deg, transparent, var(--green), transparent); }
.oracle-block.green { border-color: rgba(16,185,129,0.2); }
.oracle-block.pink::after { background: linear-gradient(90deg, transparent, #ec4899, transparent); }
.oracle-block.pink { border-color: rgba(236,72,153,0.2); }

.oracle-block-title {
    font-size: 0.95rem;
    font-weight: 800;
    color: var(--purple);
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
    text-transform: uppercase;
    letter-spacing: 1px;
}
.oracle-block.gold .oracle-block-title { color: var(--gold); }
.oracle-block.ice .oracle-block-title { color: var(--ice); }
.oracle-block.green .oracle-block-title { color: var(--green); }
.oracle-block.pink .oracle-block-title { color: #ec4899; }

@media (max-width: 768px) {
    .oracle-block { padding: 16px 12px; }
    .oracle-block-title { font-size: 0.85rem; }
}

/* ----------------------------------------------------------------------------
   6. ТАБЛИЦЫ ИСТОРИИ (уточнение к базовой table из theme.css)
   ---------------------------------------------------------------------------- */
.history-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.78rem;
    table-layout: auto;
}
.history-table th {
    background: var(--elevated);
    color: var(--gold);
    padding: 10px 8px;
    text-align: left;
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    white-space: nowrap;
    border-bottom: 2px solid var(--border);
}
.history-table th.num { text-align: right; }
.history-table td {
    padding: 9px 8px;
    border-bottom: 1px solid var(--border);
    color: var(--text);
    font-size: 0.78rem;
    vertical-align: middle;
    white-space: nowrap;
}
.history-table tr.current td {
    background: rgba(163,113,247,0.08);
    font-weight: 600;
}
.history-table tr.current td.season-num { color: var(--gold); }
.history-table .season-num { color: var(--purple); font-weight: 800; }
.history-table .wr-cell { font-weight: 700; }
.history-table .num { text-align: right; font-variant-numeric: tabular-nums; }

/* Итоговая строка «ВСЕГО» */
.history-table tr.total-row td {
    background: rgba(163,113,247,0.10);
    font-weight: 800;
    border-bottom: none;
}
.history-table tr.total-row td.season-num { color: var(--gold); }

/* Полная летопись */
.history-table.full { font-size: 0.72rem; }
.history-table.full th {
    padding: 8px 6px;
    font-size: 0.6rem;
    line-height: 1.3;
    text-align: center;
}
.history-table.full th .th-sub {
    display: block;
    font-size: 0.5rem;
    color: var(--muted);
    font-weight: 400;
    text-transform: none;
    letter-spacing: 0;
    margin-top: 2px;
}
.history-table.full td {
    padding: 8px 6px;
    font-size: 0.72rem;
}
.history-table.full td:nth-child(2) {
    max-width: 140px;
    overflow: hidden;
    text-overflow: ellipsis;
}
.history-table.full th:nth-child(4),
.history-table.full td:nth-child(4),
.history-table.full th:nth-child(6),
.history-table.full td:nth-child(6),
.history-table.full th:nth-child(8),
.history-table.full td:nth-child(8) {
    border-right: 1px solid var(--border);
}

/* Мобильные карточки для полной летописи */
@media (max-width: 768px) {
    .history-table.full,
    .history-table.full thead,
    .history-table.full tbody,
    .history-table.full th,
    .history-table.full td,
    .history-table.full tr {
        display: block;
    }
    .history-table.full thead { display: none; }
    .history-table.full tr {
        background: var(--elevated);
        border-radius: var(--radius-sm);
        margin-bottom: 8px;
        padding: 10px 12px;
        border-left: 3px solid var(--purple);
        border-bottom: none;
    }
    .history-table.full tr.current {
        border-left-color: var(--gold);
        background: linear-gradient(135deg, rgba(240,185,11,0.1), rgba(240,185,11,0.02));
    }
    .history-table.full td {
        display: flex;
        justify-content: space-between;
        padding: 4px 0;
        border: none;
        font-size: 0.75rem;
        white-space: normal;
        text-align: right;
    }
    .history-table.full td::before {
        content: attr(data-label);
        color: var(--muted);
        font-size: 0.65rem;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-right: 8px;
        text-align: left;
    }
    .history-table.full td:nth-child(2) {
        max-width: none;
        overflow: visible;
        text-overflow: clip;
        white-space: normal;
    }
}

/* ----------------------------------------------------------------------------
   7. ГОЛОС / НАРРАТИВ
   ---------------------------------------------------------------------------- */
.oracle-voice {
    background: linear-gradient(90deg, rgba(163,113,247,0.10), rgba(163,113,247,0.03));
    border-left: 3px solid var(--purple);
    border-radius: 0 12px 12px 0;
    padding: 14px 18px;
    margin-bottom: 12px;
    font-size: 0.9rem;
    line-height: 1.7;
    color: var(--text);
    font-style: italic;
}
.oracle-voice:last-child { margin-bottom: 0; }
.oracle-voice strong { color: var(--gold); font-style: normal; font-weight: 700; }
.oracle-voice .accent { color: #c4a5ff; font-weight: 700; font-style: normal; }

/* ----------------------------------------------------------------------------
   8. ТРЕНДЫ / РЕКОРДЫ / СЕЗОНЫ
   ---------------------------------------------------------------------------- */
.trend-grid,
.season-highlight {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 10px;
}
.season-highlight { grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); }

.trend-item,
.season-card {
    background: var(--elevated);
    border-radius: var(--radius-sm);
    padding: 14px 12px;
    text-align: center;
    border: 1px solid var(--border);
}
.season-card { padding: 14px 10px; }

.trend-icon { font-size: 1.5rem; margin-bottom: 4px; }
.trend-value { font-size: 1.2rem; font-weight: 800; color: var(--gold); }
.trend-label,
.season-title {
    font-size: 0.6rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-top: 2px;
}
.season-icon { font-size: 1.6rem; margin-bottom: 4px; }
.season-value {
    font-size: 1.1rem;
    font-weight: 800;
    color: var(--gold);
    margin: 4px 0;
}
.season-detail { font-size: 0.7rem; color: var(--sub); }

@media (max-width: 768px) {
    .trend-grid,
    .season-highlight { grid-template-columns: repeat(2, 1fr); }
}

/* ----------------------------------------------------------------------------
   9. МЕТА
   ---------------------------------------------------------------------------- */
.meta-rank {
    display: inline-block;
    width: 20px;
    height: 20px;
    line-height: 20px;
    text-align: center;
    border-radius: 50%;
    font-size: 0.65rem;
    font-weight: 800;
    margin-right: 6px;
}
.meta-rank.r1 { background: var(--gold); color: #000; }
.meta-rank.r2 { background: var(--silver); color: #000; }
.meta-rank.r3 { background: var(--bronze); color: #fff; }
.meta-rank.r4,
.meta-rank.r5,
.meta-rank.r-out {
    background: var(--elevated);
    color: var(--muted);
    border: 1px solid var(--border);
}

/* ----------------------------------------------------------------------------
   10. МЕМЫ
   ---------------------------------------------------------------------------- */
.meme-block {
    background: linear-gradient(135deg, rgba(236,72,153,0.12), rgba(163,113,247,0.06));
    border: 1px solid rgba(236,72,153,0.3);
    border-radius: var(--radius);
    padding: 18px;
    margin-bottom: 12px;
}
.meme-block-title {
    color: #ec4899;
    font-size: 0.8rem;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    margin-bottom: 10px;
}
.meme-line {
    font-size: 0.9rem;
    line-height: 1.7;
    margin-bottom: 8px;
    color: var(--text);
}
.meme-line:last-child { margin-bottom: 0; }
.meme-line strong { color: #ec4899; }
.meme-line .meme { color: #ec4899; font-weight: 700; }

/* ----------------------------------------------------------------------------
   11. АРХИВ ГЕРОЕВ И СТИЛЬ
   ---------------------------------------------------------------------------- */
.archive-hero {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 14px;
    background: linear-gradient(90deg, rgba(163,113,247,0.05), transparent);
    border-radius: var(--radius-sm);
    margin-bottom: 6px;
    font-size: 0.85rem;
    border-left: 3px solid rgba(163,113,247,0.3);
    gap: 8px;
}
.archive-hero.current {
    border-left-color: var(--gold);
    background: linear-gradient(90deg, rgba(240,185,11,0.1), transparent);
}
.archive-hero.best { border-left-color: var(--green); }
.archive-hero .hero-info {
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
    flex: 1;
}
.archive-hero .hero-info span {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}
.archive-hero .hero-wr { font-weight: 700; }

.style-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 14px;
    background: linear-gradient(90deg, rgba(163,113,247,0.05), transparent);
    border-radius: var(--radius-sm);
    margin-bottom: 6px;
    font-size: 0.85rem;
    gap: 8px;
}
.style-row.best { border-left: 3px solid var(--green); }
.style-row .style-name {
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
    flex: 1;
}
.style-row .style-name span {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}
.style-row .style-val {
    color: var(--gold);
    font-weight: 700;
    white-space: nowrap;
}

/* ----------------------------------------------------------------------------
   12. СРАВНЕНИЕ
   ---------------------------------------------------------------------------- */
.compare-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 8px;
    font-size: 0.85rem;
}
.compare-label {
    min-width: 100px;
    color: var(--muted);
    font-size: 0.8rem;
}
.compare-bar-wrap {
    flex: 1;
    height: 22px;
    background: rgba(163,113,247,0.08);
    border-radius: 11px;
    overflow: hidden;
    position: relative;
}
.compare-bar {
    height: 100%;
    border-radius: 11px;
    transition: width 0.6s;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    padding-right: 8px;
    font-size: 0.7rem;
    font-weight: 700;
    box-sizing: border-box;
}
.compare-bar.you { background: linear-gradient(90deg, #8b5cf6, var(--purple), #c4a5ff); color: #fff; }
.compare-bar.avg { background: linear-gradient(90deg, var(--muted), var(--sub)); color: #fff; }

/* ----------------------------------------------------------------------------
   13. ТЕМП КАРЬЕРЫ
   ---------------------------------------------------------------------------- */
.pace-grid {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
}
.pace-item {
    background: var(--elevated);
    border-radius: var(--radius-sm);
    padding: 12px 6px;
    text-align: center;
    border: 1px solid var(--border);
}
.pace-icon { font-size: 1.3rem; margin-bottom: 4px; }
.pace-value { font-size: 1.1rem; font-weight: 800; color: var(--gold); }
.pace-label {
    font-size: 0.6rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-top: 2px;
}
@media (max-width: 768px) {
    .pace-grid { grid-template-columns: repeat(3, 1fr); gap: 6px; }
    .pace-item { padding: 10px 4px; }
    .pace-icon { font-size: 1.1rem; }
    .pace-value { font-size: 0.95rem; }
    .pace-label { font-size: 0.55rem; }
}

/* ----------------------------------------------------------------------------
   14. СОВЕТ
   ---------------------------------------------------------------------------- */
.advice-block {
    background: linear-gradient(135deg, rgba(163,113,247,0.15), rgba(163,113,247,0.05));
    border: 1px solid rgba(163,113,247,0.35);
    border-radius: var(--radius);
    padding: 22px;
    text-align: center;
    margin-top: 20px;
}
.advice-block .advice-icon { font-size: 2rem; margin-bottom: 8px; }
.advice-block .advice-text {
    font-size: 0.95rem;
    line-height: 1.7;
    color: var(--text);
    font-style: italic;
}
.advice-block .advice-text strong { color: var(--gold); font-style: normal; }

/* ----------------------------------------------------------------------------
   15. СОСТОЯНИЯ ЗАГРУЗКИ
   ---------------------------------------------------------------------------- */
.loading-block {
    text-align: center;
    padding: 60px 20px;
    color: var(--sub);
}
.loading-block .spinner { margin: 0 auto 16px; }

.not-found {
    text-align: center;
    padding: 40px 20px;
    color: var(--muted);
}
.not-found .nf-icon { font-size: 3rem; margin-bottom: 12px; opacity: 0.5; }

/* ----------------------------------------------------------------------------
   16. ПРОГРЕСС И SCROLL-TOP
   ---------------------------------------------------------------------------- */
.reading-progress {
    position: fixed;
    top: 0; left: 0;
    width: 100%;
    height: 3px;
    background: linear-gradient(90deg, var(--purple), #c4a5ff, var(--gold), var(--purple));
    transform-origin: 0 50%;
    transform: scaleX(0);
    z-index: 1000;
}
.scroll-top {
    position: fixed;
    bottom: 80px;
    right: 20px;
    width: 44px;
    height: 44px;
    background: var(--card);
    border: 1px solid var(--purple);
    border-radius: 50%;
    color: var(--purple);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    opacity: 0;
    pointer-events: none;
    transition: all 0.3s ease;
    z-index: 98;
    font-size: 1.1rem;

<script>
/* ============================================================================
   СЕКЦИЯ 1. КОНСТАНТЫ
   ========================================================================= */
const STATS_URL = 'https://cdn.jsdelivr.net/gh/rvotaenotaTTV/dnd-stats@main/stats_data.json';
const SEASON_BASE = 'https://cdn.jsdelivr.net/gh/rvotaenotaTTV/dnd-stats@main/seasons/season_';
const STATS_URL_FALLBACK = 'https://raw.githubusercontent.com/rvotaenotaTTV/dnd-stats/main/stats_data.json';
const SEASON_BASE_FALLBACK = 'https://raw.githubusercontent.com/rvotaenotaTTV/dnd-stats/main/seasons/season_';

const MAX_SEASONS = 15;
const META_TOP = 5;
const META_MIN_FIGHTS = 30;

const WR_GOOD = 0.55;
const WR_BAD = 0.45;
const MIN_FIGHTS_FOR_BEST = 10;
const MIN_FIGHTS_FOR_RECORD = 15;

const CACHE_TTL = 10 * 60 * 1000;
const CACHE_KEY_PREFIX = 'eternis-oracle-season-';
const PLAYERS_CACHE_KEY = 'eternis-oracle-players';

/* ============================================================================
   СЕКЦИЯ 2. УТИЛИТЫ
   ========================================================================= */
function normalizeFaction(f) {
    if (!f) return '';
    if (f === 'Свет' || f === 'Орден Света') return 'Орден Света';
    if (f === 'Тьма' || f === 'Культ Тьмы') return 'Культ Тьмы';
    return f;
}

function wrColor(wr) {
    return wr >= WR_GOOD ? 'var(--gold)' : wr >= WR_BAD ? 'var(--green)' : 'var(--red)';
}

function getAllPlayers(seasons) {
    const players = new Map();
    const sortedSeasons = [...seasons].sort((a, b) => {
        if (a.isCurrent) return -1;
        if (b.isCurrent) return 1;
        return b.num - a.num;
    });
    sortedSeasons.forEach(s => {
        (s.data.players || []).forEach(p => {
            if (!p.display) return;
            const key = p.display.toLowerCase();
            if (!players.has(key)) players.set(key, {
                display: p.display,
                emoji: p.emoji || '⚔️',
                name: p.name || ''
            });
        });
    });
    return [...players.values()].sort((a, b) => a.display.localeCompare(b.display));
}

/* ============================================================================
   СЕКЦИЯ 3. API — загрузка данных
   ========================================================================= */
async function getSeasonData(n) {
    const KEY = CACHE_KEY_PREFIX + n;
    try {
        const c = JSON.parse(sessionStorage.getItem(KEY) || 'null');
        if (c && (Date.now() - c.ts < CACHE_TTL)) return c.data;
    } catch (e) {}
    let r = await fetch(`${SEASON_BASE}${n}.json`);
    if (!r.ok) r = await fetch(`${SEASON_BASE_FALLBACK}${n}.json`);
    if (!r.ok) throw new Error('404');
    const data = await r.json();
    try { sessionStorage.setItem(KEY, JSON.stringify({ ts: Date.now(), data })); } catch (e) {}
    return data;
}

async function loadAllSeasons() {
    const archived = [];
    const promises = [];
    for (let n = 0; n <= MAX_SEASONS; n++) {
        promises.push(
            getSeasonData(n)
                .then(d => ({ num: n, data: d, isCurrent: false }))
                .catch(() => null)
        );
    }
    const results = await Promise.all(promises);
    results.forEach(r => { if (r) archived.push(r); });
    archived.sort((a, b) => a.num - b.num);

    let current = null;
    try {
        let r = await fetch(`${STATS_URL}?v=${Date.now()}`);
        if (!r.ok) r = await fetch(`${STATS_URL_FALLBACK}?v=${Date.now()}`);
        const d = await r.json();
        current = { num: archived.length, data: d, isCurrent: true };
    } catch (e) { console.error(e); }

    return current ? [...archived, current] : archived;
}

/* ============================================================================
   СЕКЦИЯ 4. АНАЛИЗАТОРЫ
   ========================================================================= */

// --- 4.1 История игрока ---
// --- 4.1 История игрока (с учётом удалённых) ---
function getPlayerHistory(nickname, seasons) {
    const history = [];
    const playerKey = nickname.toLowerCase();

    seasons.forEach(s => {
        // Основной герой сезона
        const p = (s.data.players || []).find(pl =>
            pl.display && pl.display.toLowerCase() === playerKey
        );
        if (p) {
            const total = (p.wins || 0) + (p.losses || 0);
            if (total > 0) {
                history.push({
                    season: s.num,
                    isCurrent: s.isCurrent,
                    era: s.num === 0 ? 'classic' : 'races',
                    display: p.display,
                    emoji: p.emoji || '⚔️',
                    name: p.name || '',
                    wins: p.wins || 0,
                    losses: p.losses || 0,
                    total,
                    wr: total > 0 ? p.wins / total : 0,
                    level: p.level || 0,
                    skill: p.skill || 0,
                    shards: p.shards || 0,
                    faction: normalizeFaction(p.faction),
                    factionWins: p.factionWins || 0,
                    best: p.best || 0,
                    worst: p.worst || 0,
                    tournamentWins: p.tournamentWins || 0,
                    champion: p.champion === true,
                    isDeleted: false,
                    dungeon: s.data.dungeon?.players?.[p.display] || null
                });
            }
        }

		// Удалённые герои этого сезона
		const archive = s.data.heroArchive?.[playerKey] || [];
		archive.forEach(h => {
			const wins = h.wins || 0;
			const losses = h.losses || 0;
			const total = wins + losses;
			if (total === 0) return;
			history.push({
				season: s.num,
				isCurrent: s.isCurrent,
				era: s.num === 0 ? 'classic' : 'races',
				display: nickname,
				emoji: h.emoji || '⚔️',
				name: h.name || '',
				wins,
				losses,
				total,
				wr: wins / total,
				level: h.level || 0,
				skill: 0,
				shards: 0,
				faction: normalizeFaction(h.faction),
				factionWins: h.factionWins || 0,
				best: h.best || 0,
				worst: h.worst || 0,
				tournamentWins: h.tournamentWins || 0,
				champion: false,
				isDeleted: true,
				dungeon: null
			});
		});
    });

    return history;
}

// --- 4.2 Тренды ---
function analyzeTrend(history) {
    if (history.length === 0) return { trend: 'none' };
    if (history.length === 1) return { trend: 'first', firstWR: history[0].wr, lastWR: history[0].wr, delta: 0, avg: history[0].wr, peak: history[0].wr, peakSeason: history[0].season, form: 1, seasonsCount: 1, stdDev: 0 };
    const wrs = history.map(h => h.wr);
    const n = wrs.length;
    const avg = wrs.reduce((s, w) => s + w, 0) / n;
    const peak = Math.max(...wrs);
    const peakSeason = history[wrs.indexOf(peak)].season;
    const firstWR = wrs[0], lastWR = wrs[n - 1];
    const delta = lastWR - firstWR;
    let sumXY = 0, sumX = 0, sumY = 0, sumXX = 0;
    for (let i = 0; i < n; i++) { sumX += i; sumY += wrs[i]; sumXY += i * wrs[i]; sumXX += i * i; }
    const denom = n * sumXX - sumX * sumX;
    const slope = denom !== 0 ? (n * sumXY - sumX * sumY) / denom : 0;
    const variance = wrs.reduce((s, w) => s + Math.pow(w - avg, 2), 0) / n;
    const stdDev = Math.sqrt(variance);
    const form = peak > 0 ? lastWR / peak : 1;
    return { trend: slope > 0.005 ? 'growth' : slope < -0.005 ? 'fall' : 'stable', slope, delta, avg, peak, peakSeason, firstWR, lastWR, form, stdDev, seasonsCount: n };
}

// --- 4.3 Герои (с учётом удалённых) ---
function analyzeHeroArchive(nickname, seasons) {
    const allHeroes = [];
    const playerKey = nickname.toLowerCase();
    const currentSeason = seasons[seasons.length - 1];

    // 1. Текущий
    const currentPlayer = currentSeason?.data?.players?.find(p =>
        p.display && p.display.toLowerCase() === playerKey
    );
    if (currentPlayer?.name && (currentPlayer.wins + currentPlayer.losses) > 0) {
        allHeroes.push({
            name: currentPlayer.name,
            emoji: currentPlayer.emoji || '⚔️',
            wins: currentPlayer.wins || 0,
            losses: currentPlayer.losses || 0,
            best: currentPlayer.best || 0,
            worst: currentPlayer.worst || 0,
            isCurrent: true,
            season: currentSeason.num
        });
    }

    // 2. heroArchive текущего (удалённые в текущем)
    const currentArchive = currentSeason?.data?.heroArchive?.[playerKey] || [];
    currentArchive.forEach(h => {
        allHeroes.push({
            name: h.name || '',
            emoji: h.emoji || '⚔️',
            wins: h.wins || 0,
            losses: h.losses || 0,
            best: h.best || 0,
            worst: h.worst || 0,
            isCurrent: false,
            season: currentSeason.num
        });
    });

    // 3. Прошлые сезоны (players + heroArchive)
    seasons.forEach(s => {
        if (s.isCurrent) return;
        const p = s.data.players?.find(pl =>
            pl.display && pl.display.toLowerCase() === playerKey
        );
        if (p?.name && p.name !== 'Unknown' && ((p.wins || 0) + (p.losses || 0)) > 0) {
            allHeroes.push({
                name: p.name,
                emoji: p.emoji || '⚔️',
                wins: p.wins || 0,
                losses: p.losses || 0,
                best: p.best || 0,
                worst: p.worst || 0,
                isCurrent: false,
                season: s.num
            });
        }
        const archive = s.data.heroArchive?.[playerKey] || [];
        archive.forEach(h => {
            allHeroes.push({
                name: h.name || '',
                emoji: h.emoji || '⚔️',
                wins: h.wins || 0,
                losses: h.losses || 0,
                best: h.best || 0,
                worst: h.worst || 0,
                isCurrent: false,
                season: s.num
            });
        });
    });

    // Агрегация по классу, расе, комбо
    const classStats = {};
    const raceStats = {};
    const comboStats = {};

    allHeroes.forEach(h => {
        if (!h.name) return;
        const parts = h.name.split('-');
        let race = null, cls = null;
        if (parts.length < 2) {
            cls = parts[0];
        } else {
            race = parts[0];
            cls = parts[1];
        }

        if (cls) {
            if (!classStats[cls]) classStats[cls] = { wins: 0, losses: 0 };
            classStats[cls].wins += h.wins;
            classStats[cls].losses += h.losses;
        }
        if (race) {
            if (!raceStats[race]) raceStats[race] = { wins: 0, losses: 0 };
            raceStats[race].wins += h.wins;
            raceStats[race].losses += h.losses;
        }
        if (!comboStats[h.name]) comboStats[h.name] = { wins: 0, losses: 0, emoji: h.emoji };
        comboStats[h.name].wins += h.wins;
        comboStats[h.name].losses += h.losses;
    });

    const totalWins = allHeroes.reduce((s, h) => s + h.wins, 0);
    const totalLosses = allHeroes.reduce((s, h) => s + h.losses, 0);
    const trueWR = (totalWins + totalLosses) > 0 ? totalWins / (totalWins + totalLosses) : 0;

    // Лучшее комбо (мин. 10 боёв)
    const comboArr = Object.entries(comboStats)
        .map(([n, s]) => ({ name: n, wins: s.wins, losses: s.losses, total: s.wins + s.losses, wr: s.wins / (s.wins + s.losses), emoji: s.emoji }))
        .filter(c => c.total >= 10)
        .sort((a, b) => b.wr - a.wr);
    const bestCombo = comboArr.length > 0 ? comboArr[0] : null;

    // Лучший герой (мин. 10 боёв)
    const heroArr = allHeroes
        .map(h => ({ ...h, total: h.wins + h.losses, wr: (h.wins + h.losses) > 0 ? h.wins / (h.wins + h.losses) : 0 }))
        .filter(h => h.total >= MIN_FIGHTS_FOR_BEST)
        .sort((a, b) => b.wr - a.wr);
    const best = heroArr.length > 0 ? heroArr[0] : null;

    return {
        heroes: allHeroes,
        classStats,
        raceStats,
        comboStats,
        bestCombo,
        best,
        totalWins,
        totalLosses,
        trueWR
    };
}

// --- 4.3.1 Удалённые герои по сезонам ---
function getDeletedHeroesBySeason(nickname, seasons) {
    const playerKey = nickname.toLowerCase();
    const result = [];
    seasons.forEach(s => {
        const archive = s.data.heroArchive?.[playerKey] || [];
        archive.forEach(h => {
            const total = (h.wins || 0) + (h.losses || 0);
            if (total === 0) return;
            result.push({
                season: s.num,
                isCurrent: s.isCurrent,
                emoji: h.emoji || '⚔️',
                name: h.name || '',
                wins: h.wins || 0,
                losses: h.losses || 0,
                total,
                wr: total > 0 ? (h.wins || 0) / total : 0,
                best: h.best || 0,
                worst: h.worst || 0,
                tournamentWins: h.tournamentWins || 0,
                faction: normalizeFaction(h.faction),
                factionWins: h.factionWins || 0
            });
        });
    });
    return result;
}

// --- 4.4 Данж ---
function analyzeDungeon(nickname, seasons) {
    let totalWaves = 0, maxRecord = 0, totalBosses = 0, totalTrophies = 0, totalDamage = 0;
    let seasonsWithDungeon = 0;
    const bySeason = [];
    seasons.forEach(s => {
        const dp = s.data.dungeon?.players?.[nickname] ||
                   Object.values(s.data.dungeon?.players || {}).find(p => p.display && p.display.toLowerCase() === nickname.toLowerCase());
        if (!dp) return;
        seasonsWithDungeon++;
        const rec = dp.record || 0;
        const waves = dp.totalWaves || 0;
        const bosses = dp.bosses || 0;
        const trophies = dp.trophies || 0;
        const damage = dp.damage || 0;
        totalWaves += waves; totalBosses += bosses; totalTrophies += trophies; totalDamage += damage;
        if (rec > maxRecord) maxRecord = rec;
        bySeason.push({ season: s.num, isCurrent: s.isCurrent, record: rec, waves, bosses, trophies, damage, crits: dp.crits || 0, misses: dp.misses || 0, blocks: dp.blocks || 0, swings: dp.swings || 0, hits: dp.hits || 0, passive: dp.passive || '' });
    });
    const records = {
        bestRecord: bySeason.reduce((m, h) => h.record > (m.record || 0) ? h : m, { record: 0, season: null }),
        bestWaves: bySeason.reduce((m, h) => h.waves > (m.waves || 0) ? h : m, { waves: 0, season: null }),
        bestBosses: bySeason.reduce((m, h) => h.bosses > (m.bosses || 0) ? h : m, { bosses: 0, season: null }),
        bestTrophies: bySeason.reduce((m, h) => h.trophies > (m.trophies || 0) ? h : m, { trophies: 0, season: null }),
        bestDamage: bySeason.reduce((m, h) => h.damage > (m.damage || 0) ? h : m, { damage: 0, season: null })
    };
    return { totalWaves, maxRecord, totalBosses, totalTrophies, totalDamage, seasonsWithDungeon, bySeason, records };
}

// --- 4.5 Лига ---
function getLeaguePlace(nickname, seasons) {
    const last = seasons[seasons.length - 1];
    if (!last) return null;
    const players = (last.data.players || []).map(p => ({ ...p, faction: normalizeFaction(p.faction) })).filter(p => (p.skill || 0) > 0 && p.faction);
    const light = players.filter(p => p.faction === 'Орден Света').sort((a, b) => (b.skill || 0) - (a.skill || 0));
    const dark = players.filter(p => p.faction === 'Культ Тьмы').sort((a, b) => (b.skill || 0) - (a.skill || 0));
    const me = players.find(p => p.display && p.display.toLowerCase() === nickname.toLowerCase());
    if (!me) return null;
    const list = me.faction === 'Орден Света' ? light : dark;
    const place = list.findIndex(p => p.display === me.display) + 1;
    const top8Skill = list.length >= 8 ? (list[7].skill || 0) : 0;
    return { place, total: list.length, skill: me.skill || 0, faction: me.faction, inTop8: place <= 8, gapToTop8: Math.max(0, top8Skill - (me.skill || 0)) };
}

// --- 4.6 Мета ---
function analyzeMeta(seasons) {
    const metaBySeason = [];
    seasons.forEach(s => {
        const classStats = {}, raceStats = {};
        (s.data.players || []).forEach(p => {
            if (!p.name || p.name === 'Unknown' || !p.name.includes('-')) return;
            const [race, cls] = p.name.split('-');
            const w = p.wins || 0, l = p.losses || 0, t = w + l;
            if (t < 5) return;
            if (!classStats[cls]) classStats[cls] = { w: 0, l: 0 };
            if (!raceStats[race]) raceStats[race] = { w: 0, l: 0 };
            classStats[cls].w += w; classStats[cls].l += l;
            raceStats[race].w += w; raceStats[race].l += l;
        });
        const allClasses = Object.entries(classStats).map(([n, s]) => ({ name: n, w: s.w, l: s.l, total: s.w + s.l, wr: s.w / (s.w + s.l) })).filter(c => c.total >= META_MIN_FIGHTS).sort((a, b) => b.wr - a.wr);
        const topClasses = allClasses.slice(0, META_TOP);
        const allRaces = Object.entries(raceStats).map(([n, s]) => ({ name: n, w: s.w, l: s.l, total: s.w + s.l, wr: s.w / (s.w + s.l) })).filter(c => c.total >= META_MIN_FIGHTS).sort((a, b) => b.wr - a.wr);
        const topRaces = allRaces.slice(0, META_TOP);
        metaBySeason.push({ season: s.num, isCurrent: s.isCurrent, topClasses, topRaces, allClasses, allRaces });
    });
    return metaBySeason;
}

function isInMeta(className, metaBySeason, seasonNum, kind = 'class') {
    const meta = metaBySeason.find(m => m.season === seasonNum);
    if (!meta) return null;
    const list = kind === 'race' ? meta.topRaces : meta.topClasses;
    return list.some(c => c.name === className);
}

// --- 4.7 Сезоны ---
function analyzeSeasons(history) {
    if (history.length === 0) return null;
    return {
        bestWR: history.reduce((m, h) => h.wr > m.wr ? h : m),
        worstWR: history.reduce((m, h) => h.wr < m.wr ? h : m),
        mostWins: history.reduce((m, h) => h.wins > m.wins ? h : m),
        mostFights: history.reduce((m, h) => h.total > m.total ? h : m),
        mostTournaments: history.reduce((m, h) => (h.tournamentWins || 0) > (m.tournamentWins || 0) ? h : m, { tournamentWins: 0 }),
        seasonsCount: history.length
    };
}

function findLegendSeason(history) {
    if (history.length === 0) return null;
    let best = null, bestScore = -1;
    history.forEach(h => {
        const wrScore = h.wr * 40;
        const tourScore = Math.min(30, (h.tournamentWins || 0) * 5);
        const levelScore = Math.min(20, (h.level || 0) / 10);
        const factionScore = Math.min(10, (h.factionWins || 0) / 20);
        const score = wrScore + tourScore + levelScore + factionScore;
        if (score > bestScore) { bestScore = score; best = { ...h, score: score.toFixed(1) }; }
    });
    return best;
}

function findPeakForm(history) {
    if (history.length === 0) return [];
    return [...history].filter(h => h.total >= MIN_FIGHTS_FOR_RECORD).sort((a, b) => b.wr - a.wr).slice(0, 3);
}

function findSwings(history) {
    if (history.length < 2) return { ups: [], downs: [] };
    const changes = [];
    for (let i = 1; i < history.length; i++) {
        const prev = history[i-1], cur = history[i];
        changes.push({ from: prev.season, to: cur.season, delta: cur.wr - prev.wr, fromWR: prev.wr, toWR: cur.wr });
    }
    const ups = changes.filter(c => c.delta > 0).sort((a, b) => b.delta - a.delta).slice(0, 3);
    const downs = changes.filter(c => c.delta < 0).sort((a, b) => a.delta - b.delta).slice(0, 3);
    return { ups, downs };
}

function findPace(history) {
    if (history.length === 0) return null;
    const n = history.length;
    return {
        avgFights: Math.round(history.reduce((s, h) => s + h.total, 0) / n),
        avgWins: Math.round(history.reduce((s, h) => s + h.wins, 0) / n),
        avgLevel: Math.round(history.reduce((s, h) => s + h.level, 0) / n),
        avgShards: Math.round(history.reduce((s, h) => s + h.shards, 0) / n),
        avgTournaments: (history.reduce((s, h) => s + (h.tournamentWins || 0), 0) / n).toFixed(1),
        seasonsCount: n
    };
}

function findPersonalRecords(history) {
    if (history.length === 0) return null;
    return {
        bestStreak: history.reduce((m, h) => h.best > m.best ? h : m),
        worstStreak: history.reduce((m, h) => h.worst > m.worst ? h : m),
        mostWins: history.reduce((m, h) => h.wins > m.wins ? h : m),
        bestWR: history.reduce((m, h) => h.wr > m.wr ? h : m),
        mostTournaments: history.reduce((m, h) => (h.tournamentWins || 0) > (m.tournamentWins || 0) ? h : m, { tournamentWins: 0 }),
        maxLevel: history.reduce((m, h) => h.level > m.level ? h : m),
        maxShards: history.reduce((m, h) => h.shards > m.shards ? h : m),
        maxFactionWins: history.reduce((m, h) => (h.factionWins || 0) > (m.factionWins || 0) ? h : m, { factionWins: 0 })
    };
}

// --- 4.8 Сравнение с топ-10 ---
function compareWithTop10(nickname, seasons) {
    const last = seasons[seasons.length - 1];
    if (!last) return null;
    const allPlayers = (last.data.players || []).filter(p => (p.skill || 0) > 0);
    const top10 = [...allPlayers].sort((a, b) => (b.skill || 0) - (a.skill || 0)).slice(0, 10);
    if (top10.length === 0) return null;
    const me = allPlayers.find(p => p.display && p.display.toLowerCase() === nickname.toLowerCase());
    if (!me) return null;
    const avgSkill = top10.reduce((s, p) => s + (p.skill || 0), 0) / top10.length;
    const avgWR = top10.reduce((s, p) => s + (p.wins / (p.wins + p.losses || 1)), 0) / top10.length;
    const myWR = me.wins / (me.wins + me.losses || 1);
    return {
        mySkill: me.skill || 0, avgSkill: Math.round(avgSkill), skillDiff: Math.round((me.skill || 0) - avgSkill),
        myWR, avgWR, wrDiff: myWR - avgWR
    };
}

// --- 4.9 Фракции ---
function analyzeFactions(history) {
    const calc = (arr) => {
        if (arr.length === 0) return { count: 0, wins: 0, losses: 0, wr: 0, factionWins: 0 };
        const w = arr.reduce((s, h) => s + h.wins, 0);
        const l = arr.reduce((s, h) => s + h.losses, 0);
        const fw = arr.reduce((s, h) => s + (h.factionWins || 0), 0);
        return { count: arr.length, wins: w, losses: l, wr: (w + l) > 0 ? w / (w + l) : 0, factionWins: fw };
    };
    return { light: calc(history.filter(h => h.faction === 'Орден Света')), dark: calc(history.filter(h => h.faction === 'Культ Тьмы')) };
}

// --- 4.10 Прогноз ---
function buildForecast(trend, leaguePlace) {
    let wrF = trend.lastWR;
    if (trend.trend === 'growth') wrF = Math.min(0.85, trend.lastWR + Math.abs(trend.slope) * 2);
    else if (trend.trend === 'fall') wrF = Math.max(0.20, trend.lastWR - Math.abs(trend.slope) * 2);
    const wrMin = Math.max(0.20, wrF - 0.04), wrMax = Math.min(0.85, wrF + 0.04);
    let placeForecast = null;
    if (leaguePlace) {
        if (trend.trend === 'growth' && leaguePlace.place > 8) placeForecast = { min: Math.max(1, leaguePlace.place - 3), max: leaguePlace.place };
        else if (trend.trend === 'growth') placeForecast = { min: Math.max(1, leaguePlace.place - 2), max: leaguePlace.place };
        else if (trend.trend === 'fall') placeForecast = { min: leaguePlace.place, max: leaguePlace.place + 3 };
        else placeForecast = { min: Math.max(1, leaguePlace.place - 1), max: leaguePlace.place + 1 };
    }
    return { wrForecast: wrF, wrMin, wrMax, placeForecast };
}

// --- 5.1 Мемы (переписано под новую структуру) ---
function generateMemeAnalysis(history, trend, heroAnalysis, metaBySeason, leaguePlace) {
    const memes = [];
    const last = history[history.length - 1];
    const currentSeason = last.season;
    const currentClass = last.name?.split('-')[1];
    const currentRace = last.name?.split('-')[0];

    // ---------- ТУРНИРЫ ----------
    const totalTournaments = history.reduce((s, h) => s + (h.tournamentWins || 0), 0);
    const mostTournaments = history.reduce((m, h) => (h.tournamentWins || 0) > (m.tournamentWins || 0) ? h : m, { tournamentWins: 0 });
    if (totalTournaments === 0) memes.push(`<strong>${totalTournaments} турниров.</strong> Ты как тот чувак из мема «я не проиграл — я просто не участвовал». Может, пора?`);
    else if (totalTournaments >= 20) memes.push(`<strong>${totalTournaments} турниров.</strong> Это не хобби — это <span class="meme">турнирная зависимость</span>. Продай одну корону, купи куртку.`);
    else if (totalTournaments >= 10) memes.push(`<strong>${totalTournaments} турниров.</strong> Ты не просто игрок — ты <span class="meme">турнирный волк</span>. Лучший сезон: S${mostTournaments.season} (${mostTournaments.tournamentWins}).`);
    else if (totalTournaments >= 5) memes.push(`<strong>${totalTournaments} турниров.</strong> Уже не случайность — <span class="meme">система</span>. Но до легенды ещё пилить и пилить.`);
    else memes.push(`<strong>${totalTournaments} турниров.</strong> Это как выиграть в лотерею один раз — приятно, но статистикой не считается.`);

    // ---------- МЕТА (таб «Мета») ----------
    if (currentClass && metaBySeason.length) {
        const isInMetaNow = isInMeta(currentClass, metaBySeason, currentSeason);
        const currentMeta = metaBySeason.find(m => m.season === currentSeason);
        const metaTopN = currentMeta?.topClasses.map(c => c.name).join(', ') || '—';
        if (isInMetaNow) memes.push(`Ты играешь <strong>${currentClass}</strong> — а это <span class="meme">мета S${currentSeason}</span> (${metaTopN}). Поздравляю, ты <span class="meme">мета-дрочер</span>.`);
        else memes.push(`Ты играешь <strong>${currentClass}</strong>, а мета S${currentSeason} — это ${metaTopN}. <span class="meme">Ты играешь не в мете</span>. Уважение. Или глупость.`);
    }

    const seasonsWithMeta = history.filter(h => h.name?.includes('-') && metaBySeason.find(m => m.season === h.season));
    const inMetaCount = seasonsWithMeta.filter(h => { const cls = h.name.split('-')[1]; return isInMeta(cls, metaBySeason, h.season); }).length;
    const outsideMetaCount = seasonsWithMeta.length - inMetaCount;
    if (seasonsWithMeta.length >= 3) {
        if (inMetaCount > outsideMetaCount) memes.push(`<strong>${inMetaCount} из ${seasonsWithMeta.length} сезонов</strong> ты играл в мете. Ты <span class="meme">следуешь за трендом</span>. Не стыдно, но предсказуемо.`);
        else if (outsideMetaCount > inMetaCount) memes.push(`<strong>${outsideMetaCount} из ${seasonsWithMeta.length} сезонов</strong> ты играл <span class="meme">вне меты</span>. Ты или гений, или упрямец.`);
        else memes.push(`Ты <span class="meme">ровно на грани</span>: половину сезонов в мете, половину — вне. Как <span class="meme">двуликий Янус</span>, только с мечом.`);
    }

    // ---------- СТАБИЛЬНОСТЬ (таб «Анализ» → Тренды) ----------
    if (trend.stdDev > 0.12) memes.push(`Разброс WR <strong>${(trend.stdDev * 100).toFixed(1)}%</strong>. Это не стабильность, это <span class="meme">американские горки</span>.`);
    else if (trend.stdDev > 0.08) memes.push(`Разброс WR <strong>${(trend.stdDev * 100).toFixed(1)}%</strong>. Ты как <span class="meme">криптовалюта</span> — то луна, то дно.`);
    else if (trend.stdDev < 0.03 && trend.seasonsCount > 2) memes.push(`Разброс WR <strong>${(trend.stdDev * 100).toFixed(1)}%</strong>. Ты стабилен, как <span class="meme">бабушкин телевизор</span>. Надёжно, но без искры.`);
    else if (trend.stdDev >= 0.05) memes.push(`Разброс WR <strong>${(trend.stdDev * 100).toFixed(1)}%</strong>. Тебя <span class="meme">кидает из стороны в сторону</span>, как в том самом меме с автобусом.`);

    // ---------- ФОРМА (таб «Анализ» → Тренды) ----------
    if (trend.form > 1.1) memes.push(`Форма <strong>${(trend.form * 100).toFixed(0)}%</strong> — ты <span class="meme">превзошёл свой пик</span>. Это новый уровень. Запомни это чувство.`);
    else if (trend.form < 0.75) memes.push(`Ты на <strong>${(trend.form * 100).toFixed(0)}%</strong> от пика. Это уже не «передышка» — это <span class="meme">отпуск в Турции</span>. Пора возвращаться.`);
    else if (trend.form < 0.9) memes.push(`Ты на <strong>${(trend.form * 100).toFixed(0)}%</strong> от пика. <span class="meme">Почти как раньше</span>, но ностальгия уже щекочет.`);
    else if (trend.form >= 1) memes.push(`Ты на <strong>100%+ от пика</strong> — то есть <span class="meme">прямо сейчас творишь историю</span>. Не сбавляй.`);
    else memes.push(`Форма — <strong>${(trend.form * 100).toFixed(0)}%</strong> от пика. <span class="meme">Держишь марку</span>, но до рекорда чуть-чуть.`);

    // ---------- ГЕРОИ (таб «Стиль») ----------
    if (heroAnalysis.count === 1) memes.push(`Один герой за всю карьеру. Ты — <span class="meme">моногамный</span>. Уважение.`);
    else if (heroAnalysis.count === 2) memes.push(`Два героя. Это как <span class="meme">две жены</span> — и обе ревнуют.`);
    else if (heroAnalysis.count >= 8) memes.push(`<strong>${heroAnalysis.count} героев</strong>. Это уже <span class="meme">зоопарк</span>. Ты вообще помнишь их всех?`);
    else if (heroAnalysis.count >= 6) memes.push(`<strong>${heroAnalysis.count} героев</strong>. Ты меняешь героев чаще, чем носки. <span class="meme">Найди себя уже</span>.`);
    else if (heroAnalysis.count >= 4) memes.push(`<strong>${heroAnalysis.count} героев</strong>. <span class="meme">Полигамия в мире мечей</span>. Главное — чтобы все были довольны.`);
    else memes.push(`<strong>${heroAnalysis.count} героя</strong>. Нормальный <span class="meme">гарем</span>, без излишеств.`);

    // ---------- ЛУЧШИЙ ГЕРОЙ (таб «Стиль») ----------
    if (heroAnalysis.best) {
        const bestWR = heroAnalysis.best.wr;
        if (bestWR > 0.7) memes.push(`WR <strong>${(bestWR * 100).toFixed(0)}%</strong> на лучшем герое. <span class="meme">Ты машина</span>. Либо соперники просто не умеют готовиться.`);
        else if (bestWR > 0.65) memes.push(`Лучший герой — <strong>${heroAnalysis.best.emoji} ${heroAnalysis.best.name}</strong> с WR <strong>${(bestWR * 100).toFixed(0)}%</strong>. Это не герой — это <span class="meme">имба</span>. Нерфите.`);
        else if (bestWR > 0.55) memes.push(`Лучший герой — <strong>${heroAnalysis.best.emoji} ${heroAnalysis.best.name}</strong> (${(bestWR * 100).toFixed(0)}%). <span class="meme">Надёжен, как швейцарские часы</span>.`);
        else memes.push(`Лучший герой — <strong>${heroAnalysis.best.emoji} ${heroAnalysis.best.name}</strong> (${(bestWR * 100).toFixed(0)}%). <span class="meme">Лучший среди равных</span>, но звёзд с неба не хватает.`);
    }

    // ---------- ЛИГА ----------
    if (leaguePlace && !leaguePlace.inTop8) {
        const gamesToGo = Math.ceil(leaguePlace.gapToTop8 / 15);
        memes.push(`До топ-8 Лиги — <strong>${leaguePlace.gapToTop8} SKILL</strong>. Это <span class="meme">${gamesToGo} хороших вечеров</span>. Не так уж и много.`);
        if (leaguePlace.gapToTop8 > 200) memes.push(`Разрыв до топ-8 — <strong>${leaguePlace.gapToTop8} SKILL</strong>. Это не разрыв, это <span class="meme">пропасть</span>. Но кто не рискует...`);
    } else if (leaguePlace && leaguePlace.inTop8) memes.push(`Ты в <strong>топ-8 Лиги</strong>. Это как <span class="meme">VIP-ложа</span>. Не позорь.`);
    if (leaguePlace && leaguePlace.place <= 3) memes.push(`Ты <strong>топ-${leaguePlace.place}</strong> в своей фракции. <span class="meme">Не смотри свысока</span> — на арене все равны.`);
    if (leaguePlace && leaguePlace.place > 30) memes.push(`Ты <strong>${leaguePlace.place}-й</strong> в Лиге. <span class="meme">Там внизу воздух чище</span>, да?`);

    // ---------- СЕЗОН-ЛЕГЕНДА (таб «Анализ») ----------
    const legend = findLegendSeason(history);
    if (legend && parseFloat(legend.score) > 50) memes.push(`Твой <span class="meme">сезон-легенда</span> — <strong>S${legend.season}</strong> (оценка ${legend.score}/100). Там ты был на коне. Может, стоит <span class="meme">вернуться в эту форму</span>?`);
    else if (legend && parseFloat(legend.score) < 30) memes.push(`Твой лучший сезон — <strong>S${legend.season}</strong> с оценкой <strong>${legend.score}/100</strong>. <span class="meme">Это не легенда, это черновик</span>.`);

    // ---------- ТЕМП (таб «Анализ») ----------
    const paceLocal = findPace(history);
    if (paceLocal) {
        if (paceLocal.avgFights > 200) memes.push(`Ты играешь <strong>${paceLocal.avgFights} боёв за сезон</strong>. Это как <span class="meme">работа без зарплаты</span>. Хотя, если платят осколками...`);
        else if (paceLocal.avgFights < 30) memes.push(`Всего <strong>${paceLocal.avgFights} боёв за сезон</strong>. Это как <span class="meme">зайти в бар и не выпить</span>. Может, активнее?`);
        else if (paceLocal.avgFights > 120) memes.push(`<strong>${paceLocal.avgFights} боёв за сезон</strong>. <span class="meme">Ты живёшь на арене</span>. Скажи честно, ты там уже прописан?`);
        else memes.push(`<strong>${paceLocal.avgFights} боёв за сезон</strong>. <span class="meme">Здоровый темп</span>. Не выгораешь, но и не прохлаждаешься.`);
    }

    // ---------- СТРИКИ (таб «Анализ» → Рекорды) ----------
    const records = findPersonalRecords(history);
    if (records) {
        if (records.bestStreak.best >= 15) memes.push(`Лучший стрик — <strong>${records.bestStreak.best} побед</strong> (S${records.bestStreak.season}). Это не стрик, это <span class="meme">конвейер</span>.`);
        else if (records.bestStreak.best >= 8) memes.push(`Лучший стрик — <strong>${records.bestStreak.best} побед</strong>. <span class="meme">Неплохая серия</span>, но до бессмертия не дотягивает.`);
        if (records.worstStreak.worst >= 10) memes.push(`Худший стрик — <strong>${records.worstStreak.worst} поражений</strong> (S${records.worstStreak.season}). Это <span class="meme">не полоса, это чёрная дыра</span>.`);
        else if (records.worstStreak.worst >= 6) memes.push(`Худший стрик — <strong>${records.worstStreak.worst} поражений</strong>. <span class="meme">Бывает</span>. Главное — выбрался.`);
    }

    // ---------- УРОВЕНЬ ----------
    const lastLevel = last.level || 0;
    if (lastLevel >= 80) memes.push(`Уровень <strong>${lastLevel}</strong>. Ты <span class="meme">легенда арены</span>. Тебе уже можно открывать школу.`);
    else if (lastLevel >= 50) memes.push(`Уровень <strong>${lastLevel}</strong>. Это <span class="meme">элита</span>. Но до максималки ещё есть куда расти.`);
    else if (lastLevel >= 30) memes.push(`Уровень <strong>${lastLevel}</strong>. <span class="meme">Середина пути</span>. Не новичок, но и не ветеран.`);
    else if (lastLevel >= 15) memes.push(`Уровень <strong>${lastLevel}</strong>. Ты <span class="meme">подрастающее поколение</span>. Пока что.`);
    else memes.push(`Уровень <strong>${lastLevel}</strong>. <span class="meme">Юнец</span>. Вся арена ещё впереди.`);

    // ---------- ОСКОЛКИ ----------
    const lastShards = last.shards || 0;
    if (lastShards >= 5000) memes.push(`<strong>${lastShards} осколков</strong>. Ты <span class="meme">олигарх арены</span>. Купи уже остров.`);
    else if (lastShards >= 2000) memes.push(`<strong>${lastShards} осколков</strong>. <span class="meme">Богатенький</span>. Но жадность — не порок, если это осколки.`);
    else if (lastShards >= 500) memes.push(`<strong>${lastShards} осколков</strong>. <span class="meme">Средний класс</span>. Копишь на что-то серьёзное?`);
    else memes.push(`<strong>${lastShards} осколков</strong>. <span class="meme">Нищий</span>. Но это временно. Надеюсь.`);

    // ---------- СЕЗОННЫЕ ----------
    const seasonsWithWRAbove50 = history.filter(h => h.wr > 0.5).length;
    const seasonsWithWRBelow50 = history.filter(h => h.wr < 0.5).length;
    if (history.length >= 5) {
        if (seasonsWithWRAbove50 === history.length) memes.push(`<strong>Все ${history.length} сезонов с WR >50%</strong>. Ты <span class="meme">машина</span>. Или просто играешь с ботами.`);
        else if (seasonsWithWRBelow50 === history.length) memes.push(`<strong>Все ${history.length} сезонов с WR <50%</strong>. Это <span class="meme">не баг, это фича</span>. Ты упорный. Или мазохист.`);
        else if (seasonsWithWRAbove50 > seasonsWithWRBelow50 * 2) memes.push(`<strong>${seasonsWithWRAbove50} из ${history.length} сезонов</strong> с положительным WR. <span class="meme">Стабильно хорошо</span>. Скучно, но эффективно.`);
        else if (seasonsWithWRBelow50 > seasonsWithWRAbove50 * 2) memes.push(`<strong>${seasonsWithWRBelow50} из ${history.length} сезонов</strong> с отрицательным WR. <span class="meme">Полоса невезения</span>. Или руки.`);
    }

    // ---------- ТУРНИРНЫЕ ----------
    const bestTournamentSeason = history.reduce((m, h) => (h.tournamentWins || 0) > (m.tournamentWins || 0) ? h : m, { tournamentWins: 0 });
    if (bestTournamentSeason.tournamentWins >= 10) memes.push(`<strong>${bestTournamentSeason.tournamentWins} турниров за S${bestTournamentSeason.season}</strong>. Это <span class="meme">доминация</span>. Или просто не было конкурентов.`);
    else if (bestTournamentSeason.tournamentWins >= 5) memes.push(`<strong>${bestTournamentSeason.tournamentWins} турниров за S${bestTournamentSeason.season}</strong>. <span class="meme">Хороший урожай</span>.`);
    else if (bestTournamentSeason.tournamentWins > 0) memes.push(`Лучший турнирный сезон — S${bestTournamentSeason.season} с ${bestTournamentSeason.tournamentWins} победами. <span class="meme">Скромно, но со вкусом</span>.`);

    // ---------- ФРАКЦИИ ----------
    const lightSeasons = history.filter(h => h.faction === 'Орден Света').length;
    const darkSeasons = history.filter(h => h.faction === 'Культ Тьмы').length;
    if (lightSeasons > 0 && darkSeasons > 0) {
        if (lightSeasons > darkSeasons * 2) memes.push(`Ты <strong>${lightSeasons} сезонов за Свет</strong> и только ${darkSeasons} за Тьму. <span class="meme">Светлый до мозга костей</span>. Или просто боишься темноты?`);
        else if (darkSeasons > lightSeasons * 2) memes.push(`Ты <strong>${darkSeasons} сезонов за Тьму</strong> и только ${lightSeasons} за Свет. <span class="meme">Тёмная сторона</span> явно сильнее притягивает.`);
        else memes.push(`Свет: ${lightSeasons}, Тьма: ${darkSeasons}. Ты <span class="meme">перебежчик</span> или просто ищешь, где лучше кормят?`);
    } else if (lightSeasons > 0) {
        memes.push(`Все ${lightSeasons} сезонов — за <strong>Орден Света</strong>. <span class="meme">Фанатик света</span>. Не пробовал тёмную сторону? Там печеньки.`);
    } else if (darkSeasons > 0) {
        memes.push(`Все ${darkSeasons} сезонов — за <strong>Культ Тьмы</strong>. <span class="meme">Служитель тьмы</span>. Свет — не твой путь, и это честно.`);
    }

    // ---------- СРАВНЕНИЕ С СОБОЙ ----------
    if (history.length >= 3) {
        const firstWR = history[0].wr;
        const lastWR = history[history.length - 1].wr;
        if (lastWR > firstWR + 0.1) memes.push(`Ты <strong>вырос на ${((lastWR - firstWR) * 100).toFixed(0)}%</strong> с первого сезона. <span class="meme">Прогресс налицо</span>.`);
        else if (lastWR < firstWR - 0.1) memes.push(`Ты <strong>упал на ${((firstWR - lastWR) * 100).toFixed(0)}%</strong> с первого сезона. <span class="meme">Куда катишься?</span>`);
        else memes.push(`Твой WR почти не изменился с первого сезона. <span class="meme">Стабильность</span>. Или застой.`);
    }

    // ---------- РАЗНОЕ ----------
    if (history.length >= 10) memes.push(`<strong>${history.length} сезонов</strong> на арене. Ты <span class="meme">старожил</span>. Тебе уже можно экскурсии водить.`);
    if (history.some(h => h.champion)) {
        const champCount = history.filter(h => h.champion).length;
        if (champCount >= 3) memes.push(`<strong>${champCount} раз чемпион</strong>. <span class="meme">Династия</span>. Оставь корону кому-нибудь ещё.`);
        else memes.push(`Ты был <strong>чемпионом</strong>. <span class="meme">Корона жмёт?</span> Или уже продал?`);
    }
    if (heroAnalysis.count >= 5 && heroAnalysis.trueWR > 0.55) memes.push(`${heroAnalysis.count} героев, но истинный WR <strong>${(heroAnalysis.trueWR * 100).toFixed(1)}%</strong>. Ты <span class="meme">мастер на все руки</span>. Или просто везунчик.`);
    if (heroAnalysis.trueWR > 0.6) memes.push(`Истинный WR <strong>${(heroAnalysis.trueWR * 100).toFixed(1)}%</strong>. <span class="meme">Это не винрейт, это диагноз</span> — талант.`);
    else if (heroAnalysis.trueWR < 0.4) memes.push(`Истинный WR <strong>${(heroAnalysis.trueWR * 100).toFixed(1)}%</strong>. <span class="meme">Боль</span>. Но мы всё равно тебя любим.`);
    if (history.length >= 2) {
        const firstSeason = history[0], lastSeason = history[history.length - 1];
        if (firstSeason.season === 0 && lastSeason.season >= 10) memes.push(`Ты с <strong>S0 по S${lastSeason.season}</strong>. Это <span class="meme">ветеран</span>. Тебе уже можно памятник ставить.`);
    }
    if (totalTournaments > 0 && totalTournaments < 3) memes.push(`Турнирных побед — <strong>${totalTournaments}</strong>. <span class="meme">Попробовал, но не втянулся</span>. Как спортзал в январе.`);
    if (history.length >= 3 && history.every(h => h.wr > 0.5)) memes.push(`Все сезоны с WR <strong>>50%</strong>. <span class="meme">Стабильность — признак мастерства</span>. Или везения.`);
    if (history.length >= 3 && history.every(h => h.wr < 0.5)) memes.push(`Все сезоны с WR <strong><50%</strong>. <span class="meme">Упорство — тоже талант</span>. Но, может, что-то поменять?`);
    if (currentRace) memes.push(`Ты играешь <strong>${currentRace}</strong>. <span class="meme">${currentRace === 'Человек' ? 'Классика. Скучно, но надёжно.' : currentRace === 'Эльф' ? 'Типичный эльф. Наверное, ещё и лук в руках.' : currentRace === 'Орк' ? 'ОРК! БЬЁМ! СИЛЬНО! ЛЮБИМ!' : currentRace === 'Гном' ? 'Гном. Маленький, но гордый.' : 'Интересный выбор.'}</span>`);
    if (history.length >= 5 && trend.trend === 'stable' && Math.abs(trend.delta) < 0.02) memes.push(`Ты <span class="meme">застыл во времени</span>. Ни роста, ни падения. Как <span class="meme">статуя в парке</span>.`);
    if (history.length >= 3 && trend.trend === 'growth' && trend.delta > 0.1) memes.push(`Рост <strong>+${(trend.delta * 100).toFixed(0)}%</strong> за карьеру. Ты <span class="meme">ракета</span>. Или просто поздно начал.`);
    if (history.length >= 3 && trend.trend === 'fall' && trend.delta < -0.1) memes.push(`Падение <strong>${(trend.delta * 100).toFixed(0)}%</strong>. <span class="meme">Сгорел на работе</span>? Или просто арена надоела.`);

    // ---------- ПРОРОЧЕСТВА (таб «Пророчества») ----------
    if (trend.trend === 'growth' && leaguePlace && !leaguePlace.inTop8 && leaguePlace.gapToTop8 < 100) {
        memes.push(`До топ-8 осталось <strong>${leaguePlace.gapToTop8} SKILL</strong>. Это уже не мечта — это <span class="meme">план на следующий сезон</span>.`);
    }
    if (heroAnalysis.best && heroAnalysis.best.wr > 0.6 && heroAnalysis.best.name !== last?.name) {
        const bestSeason = heroAnalysis.best.season ?? '?';
        memes.push(`Твой лучший герой — <strong>${heroAnalysis.best.emoji} ${heroAnalysis.best.name}</strong> (S${bestSeason}) — не в текущем сезоне. <span class="meme">Пророчество гласит</span>: верни его, и будет тебе счастье.`);
    }

    return memes;
}

// --- 5.2 Нарратив ---
function generateNarrative(history, trend, heroAnalysis, dungeon, leaguePlace) {
    const lines = [];
    if (history.length === 0) return ['Я не вижу твоей нити.'];
    const last = history[history.length - 1];
    if (history.length === 1) {
        lines.push(`<strong>Твоя повесть только начинается.</strong> Сезон ${last.season}. ${last.wins} побед, ${last.losses} поражений. Первая глава всегда самая волнительная.`);
    } else {
        const s = trend.seasonsCount;
        if (trend.trend === 'growth') {
            const speed = trend.delta > 0.15 ? 'стремительно' : trend.delta > 0.05 ? 'уверенно' : 'медленно, но верно';
            lines.push(`<strong>Твоя нить набирает силу.</strong> ${s} сезонов. С ${(trend.firstWR * 100).toFixed(0)}% до ${(trend.lastWR * 100).toFixed(0)}% — <strong>+${(trend.delta * 100).toFixed(0)}%</strong>. Ты растёшь ${speed}.`);
        } else if (trend.trend === 'fall') {
            const speed = trend.delta < -0.15 ? 'обвалом' : trend.delta < -0.05 ? 'заметным спадом' : 'лёгким снижением';
            lines.push(`<strong>Твоя нить истончилась.</strong> ${s} сезонов. С ${(trend.firstWR * 100).toFixed(0)}% до ${(trend.lastWR * 100).toFixed(0)}% — <strong>${(trend.delta * 100).toFixed(0)}%</strong>. Это не приговор, но ${speed} — тревожный знак.`);
        } else {
            lines.push(`<strong>Твоя нить ровна.</strong> ${s} сезонов. Винрейт около ${(trend.avg * 100).toFixed(0)}%. Ты — скала. Или застой. Решать тебе.`);
        }
    }
    if (trend.peakSeason !== undefined && trend.form < 0.98 && trend.seasonsCount > 1) {
        const formDesc = trend.form < 0.6 ? 'глубоко в тени' : trend.form < 0.8 ? 'заметно ниже' : 'чуть ниже';
        lines.push(`Пик — <strong>сезон ${trend.peakSeason}</strong> (${(trend.peak * 100).toFixed(0)}%). Сейчас — ${(trend.form * 100).toFixed(0)}% от той формы. Ты ${formDesc} былого величия.`);
    } else if (trend.form >= 0.98 && trend.seasonsCount > 1) {
        lines.push(`<strong>Ты на пике!</strong> Сезон ${trend.peakSeason} — лучшая глава. Ты не просто вспоминаешь — ты <strong>творишь</strong>.`);
    }
    if (heroAnalysis.count > 1) {
        lines.push(`За твоей спиной — ${heroAnalysis.count} героев. Истинный WR — <strong>${(heroAnalysis.trueWR * 100).toFixed(1)}%</strong>. Каждый из них — часть твоей истории.`);
        if (heroAnalysis.best && heroAnalysis.best.wr > trend.lastWR + 0.05) {
            lines.push(`Лучший герой — <strong>${heroAnalysis.best.emoji} ${heroAnalysis.best.name}</strong> (${(heroAnalysis.best.wr * 100).toFixed(0)}%). Текущий слабее. Возможно, пора <strong>вернуться к истокам</strong>?`);
        } else if (heroAnalysis.best && heroAnalysis.best.wr < trend.lastWR - 0.05) {
            lines.push(`Твой текущий герой <strong>сильнее</strong> лучшего в архиве. Ты <strong>превзошёл себя</strong>. Это ли не рост?`);
        }
    } else if (heroAnalysis.count === 1) {
        lines.push(`Один герой. <strong>${heroAnalysis.heroes[0]?.emoji} ${heroAnalysis.heroes[0]?.name}</strong>. Ты верен ему. Или боишься перемен.`);
    }
    if (leaguePlace) {
        const f = leaguePlace.faction === 'Орден Света' ? '🌝' : '🌚';
        if (leaguePlace.inTop8) {
            const pos = leaguePlace.place <= 3 ? 'на пьедестале' : 'в топ-8';
            lines.push(`${f} В Лиге ты <strong>${leaguePlace.place}-й</strong> из ${leaguePlace.total}. Ты ${pos}. Держи позицию — или иди выше.`);
        } else {
            const gapDesc = leaguePlace.gapToTop8 > 200 ? 'пропасть' : leaguePlace.gapToTop8 > 100 ? 'серьёзный разрыв' : 'досадный разрыв';
            lines.push(`${f} В Лиге <strong>${leaguePlace.place}-й</strong>. До топ-8 — <strong>${leaguePlace.gapToTop8} SKILL</strong>. Это ${gapDesc}. Но каждый шаг начинается с первого удара.`);
        }
    }
    if (dungeon && dungeon.totalWaves > 0) {
        if (dungeon.maxRecord >= 50) lines.push(`🏔 В Бездне твой рекорд — <strong>${dungeon.maxRecord} волн</strong>. Там, внизу, ты чувствуешь себя как дома.`);
        else if (dungeon.maxRecord >= 25) lines.push(`🏔 В Бездне ты дошёл до <strong>${dungeon.maxRecord} волн</strong>. Глубина манит, но пока не покоряется.`);
        else lines.push(`🏔 Бездна помнит тебя: <strong>${dungeon.totalWaves} волн</strong>, ${dungeon.totalBosses} боссов. Ты только начинаешь спуск.`);
    }
    if (trend.seasonsCount >= 3) {
        const records = findPersonalRecords(history);
        if (records.bestStreak.best >= 10) lines.push(`Твоя лучшая серия — <strong>${records.bestStreak.best} побед подряд</strong> (S${records.bestStreak.season}). Это не просто цифра — это <strong>момент абсолютной силы</strong>.`);
        if (records.worstStreak.worst >= 8) lines.push(`Но помни и о <strong>${records.worstStreak.worst} поражениях</strong> (S${records.worstStreak.season}). Ты выбрался. Это делает тебя сильнее.`);
    }
    return lines;
}

function generateForecastText(forecast, trend) {
    const lines = [];
    lines.push(`Я вижу <strong>следующую главу</strong> твоей повести:`);
    lines.push(`Винрейт — <strong>${(forecast.wrForecast * 100).toFixed(0)}%</strong> (от ${(forecast.wrMin * 100).toFixed(0)}% до ${(forecast.wrMax * 100).toFixed(0)}%)`);
    if (forecast.placeForecast) lines.push(`Место в Лиге — <strong>${forecast.placeForecast.min}–${forecast.placeForecast.max}</strong>`);
    if (trend.trend === 'growth') lines.push(`Условие: не сбавлять шаг.`);
    else if (trend.trend === 'fall') lines.push(`Условие: переломить падение.`);
    else lines.push(`Условие: сделать рывок.`);
    return lines;
}

// --- 5.3 Совет ---
function generateAdvice(trend, heroAnalysis, leaguePlace, metaBySeason, history) {
    const currentSeason = history[history.length - 1]?.season;
    const currentClass = history[history.length - 1]?.name?.split('-')[1];

    // Защита от undefined
    if (!history || history.length === 0) return `Продолжай свой путь. <strong>Каждый бой — шаг вперёд.</strong>`;

    const records = findPersonalRecords(history);
    if (records && records.worstStreak.worst >= 7 && history[history.length - 1].season === records.worstStreak.season) {
        return `Проигрышная серия <strong>${records.worstStreak.worst}</strong> — это не конец. Это <strong>глава, которую нужно переписать</strong>. Смени героя, смени тактику, смени настроение.`;
    }
    const lastLevel = history[history.length - 1]?.level || 0;
    if (lastLevel < 30 && history.length > 3) return `Уровень <strong>${lastLevel}</strong>. Ты только в начале пути. <strong>Не гонись за WR — гонись за опытом</strong>.`;
    const lastShards = history[history.length - 1]?.shards || 0;
    if (lastShards < 200 && history.length > 3) return `Осколков мало. <strong>Играй на результат, а не на количество</strong>. Иногда лучше меньше боёв, но с умом.`;
    const lightSeasons = history.filter(h => h.faction === 'Орден Света').length;
    const darkSeasons = history.filter(h => h.faction === 'Культ Тьмы').length;
    if (lightSeasons > 0 && darkSeasons > 0 && Math.abs(lightSeasons - darkSeasons) <= 1) return `Ты мечешься между Светом и Тьмой. <strong>Определись</strong>. Или хотя бы выбери ту, где WR выше.`;
    const totalTournaments = history.reduce((s, h) => s + (h.tournamentWins || 0), 0);
    if (totalTournaments === 0 && history.length > 5) return `${history.length} сезонов, а турниров — <strong>ноль</strong>. Может, <strong>попробовать</strong>? Хотя бы ради интереса.`;

    if (!heroAnalysis.best || !metaBySeason.length) {
        if (trend.trend === 'growth' && (!leaguePlace || leaguePlace.inTop8)) return `Твоя нить натянута, как тетива. <strong>Не отпускай.</strong>`;
        if (trend.trend === 'growth') return `Ты растёшь. До топ-8 — <strong>${leaguePlace?.gapToTop8 || '?'} SKILL</strong>.`;
        if (trend.trend === 'fall') return `Огонь угасает. <strong>Смени путь.</strong>`;
        return `Ты идёшь ровно. <strong>Пора сделать рывок.</strong>`;
    }

    const best = heroAnalysis.best;
    const bestClass = best.name.split('-')[1] || '';
    const bestSeason = best.season ?? '?';
    const wasInMeta = isInMeta(bestClass, metaBySeason, bestSeason, 'class');
    const isInMetaNow = isInMeta(bestClass, metaBySeason, currentSeason, 'class');
    const bestMetaS = metaBySeason.find(m => m.season === bestSeason);
    const currentMetaS = metaBySeason.find(m => m.season === currentSeason);
    const bestMetaTop = bestMetaS?.topClasses.map(c => c.name).join(', ') || '—';
    const currentMetaTop = currentMetaS?.topClasses.map(c => c.name).join(', ') || '—';

    if (best.name === history[history.length - 1].name && best.season === currentSeason) {
        if (isInMetaNow) return `Ты играешь в мете (<strong>${currentClass}</strong>) и показываешь <strong>${(best.wr * 100).toFixed(0)}%</strong>. Не сбавляй.`;
        return `Ты играешь <strong>${currentClass}</strong> — вне меты. Но WR <strong>${(best.wr * 100).toFixed(0)}%</strong> — сильно. Продолжай.`;
    }
    if (wasInMeta && isInMetaNow) return `Твой лучший герой — <strong>${best.emoji} ${best.name}</strong> (S${bestSeason}, ${(best.wr * 100).toFixed(0)}%). Тогда мета: <strong>${bestMetaTop}</strong> — и он в ней. Сейчас мета: <strong>${currentMetaTop}</strong> — и он снова в ней. Возвращение <strong>оправдано</strong>.`;
    if (wasInMeta && !isInMetaNow) return `Твой лучший герой — <strong>${best.emoji} ${best.name}</strong> (S${bestSeason}, ${(best.wr * 100).toFixed(0)}%). Тогда он был в мете: <strong>${bestMetaTop}</strong>. Сейчас мета другая: <strong>${currentMetaTop}</strong> — <strong>${bestClass} вне меты</strong>. Возвращение <strong>рискованно</strong>.`;
    if (!wasInMeta && isInMetaNow) return `Твой лучший герой — <strong>${best.emoji} ${best.name}</strong> (S${bestSeason}, ${(best.wr * 100).toFixed(0)}%). Тогда он был <strong>вне меты</strong> (<strong>${bestMetaTop}</strong>), но ты выигрывал. Сейчас <strong>${bestClass} в мете</strong> (<strong>${currentMetaTop}</strong>). Момент — <strong>вернуться</strong>.`;
    if (!wasInMeta && !isInMetaNow) return `Твой лучший герой — <strong>${best.emoji} ${best.name}</strong> (S${bestSeason}, ${(best.wr * 100).toFixed(0)}%). Тогда он был <strong>вне меты</strong> (<strong>${bestMetaTop}</strong>) — и сейчас тоже. Но ты играл сильно <strong>вопреки мете</strong>. Возвращение — <strong>риск</strong>, но ты сам знаешь.`;
    return `Ты идёшь ровно. <strong>Пора сделать рывок.</strong>`;
}
