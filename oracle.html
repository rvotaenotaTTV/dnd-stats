// --- 6.1 Игрок ---
function renderPlayerInfo(player) {
    const fc = player.faction === 'Орден Света' ? 'light' : player.faction === 'Культ Тьмы' ? 'dark' : '';
    const fe = player.faction === 'Орден Света' ? '🌝' : player.faction === 'Культ Тьмы' ? '🌚' : '';
    return `<div class="player-header">
        <div class="player-emoji">${player.emoji || '⚔️'}</div>
        <div class="player-name">${player.display}${player.champion ? ' 👑' : ''}</div>
        <div class="player-class">${player.name || '—'}</div>
        ${player.faction ? `<div class="player-faction ${fc}">${fe} ${player.faction}</div>` : ''}
    </div>`;
}

// --- 6.2 История (краткая и полная) ---
function renderHistory(history, limit = null, fullHistory = null) {
    if (history.length === 0) return '';
    const list = limit ? history.slice(-limit) : history;
    const totalSource = fullHistory || history;

    let html = '<div class="oracle-block"><div class="oracle-block-title">📜 Твоя летопись' + (limit ? ' (последние ' + limit + ')' : '') + '</div><div class="table-container"><table class="history-table"><thead><tr><th>Сезон</th><th class="num">W/L</th><th class="num">WR</th><th class="num">Ур.</th><th class="num">🏆</th></tr></thead><tbody>';

    list.forEach(h => {
        const wrC = wrColor(h.wr);
        const tourColor = h.tournamentWins > 0 ? 'var(--gold)' : 'var(--muted)';
        const tourIcon = h.tournamentWins >= 5 ? '🔥' : (h.tournamentWins > 0 ? '🏆' : '');
        const eraIcon = h.era === 'classic' ? ' 📜' : '';
        html += `<tr class="${h.isCurrent ? 'current' : ''}">
            <td class="season-num" data-label="Сезон">S${h.season}${h.isCurrent ? ' ⚡' : ''}${eraIcon}</td>
            <td class="num" data-label="W/L">${h.wins}-${h.losses}</td>
            <td class="num wr-cell" data-label="WR" style="color:${wrC};">${(h.wr * 100).toFixed(1)}%</td>
            <td class="num" data-label="Ур.">${h.level}</td>
            <td class="num" data-label="🏆" style="color:${tourColor};font-weight:${h.tournamentWins > 0 ? '700' : '400'};">${h.tournamentWins ? h.tournamentWins + ' ' + tourIcon : '—'}</td>
        </tr>`;
    });

    const totalWins = totalSource.reduce((s, h) => s + h.wins, 0);
    const totalLosses = totalSource.reduce((s, h) => s + h.losses, 0);
    const totalFights = totalWins + totalLosses;
    const totalWR = totalFights > 0 ? totalWins / totalFights : 0;
    const totalTournaments = totalSource.reduce((s, h) => s + (h.tournamentWins || 0), 0);
    const maxLevel = Math.max(...totalSource.map(h => h.level || 0));

    html += `<tr style="background:linear-gradient(90deg,rgba(163,113,247,0.12),rgba(163,113,247,0.04));font-weight:800;">
        <td class="season-num" style="color:var(--gold);">ВСЕГО</td>
        <td class="num" style="color:var(--text);">${totalWins}-${totalLosses}</td>
        <td class="num" style="color:${wrColor(totalWR)};">${(totalWR * 100).toFixed(1)}%</td>
        <td class="num" style="color:var(--gold);">${maxLevel}</td>
        <td class="num" style="color:var(--gold);">${totalTournaments} ${totalTournaments >= 10 ? '🔥' : '🏆'}</td>
    </tr>`;
    html += '</tbody></table></div></div>';
    return html;
}

function renderFullHistory(history) {
    if (history.length < 2) return '';
    let html = '<div class="oracle-block"><div class="oracle-block-title">📜 Полная летопись</div>';
    html += '<div class="table-container"><table class="history-table full">';
    html += '<thead><tr>' +
        '<th>Сезон</th>' +
        '<th>Герой</th>' +
        '<th class="num">W/L</th>' +
        '<th class="num">WR</th>' +
        '<th class="num">🔥<span class="th-sub">стрик</span></th>' +
        '<th class="num">💀<span class="th-sub">лузстрик</span></th>' +
        '<th class="num">🎯<span class="th-sub">скилл</span></th>' +
        '<th class="num">⚔️<span class="th-sub">фракция</span></th>' +
        '<th class="num">Ур.</th>' +
        '<th class="num">💎</th>' +
    '</tr></thead><tbody>';

    history.forEach(h => {
        const eraIcon = h.era === 'classic' ? ' 📜' : '';
        const deletedIcon = h.isDeleted ? ' 🗑️' : '';
        const rowStyle = h.isDeleted ? 'opacity:0.7;' : '';
        const seasonExtra = h.isDeleted ? '🗑️' : (h.isCurrent ? ' ⚡' : '');

        html += `<tr class="${h.isCurrent && !h.isDeleted ? 'current' : ''}" style="${rowStyle}">
            <td class="season-num" data-label="Сезон">S${h.season}${seasonExtra}${eraIcon}</td>
            <td data-label="Герой" style="color:var(--sub);">${h.emoji} ${h.name || '—'}${deletedIcon}</td>
            <td class="num" data-label="W/L">${h.wins}-${h.losses}</td>
            <td class="num" data-label="WR" style="color:${wrColor(h.wr)};font-weight:700;">${(h.wr * 100).toFixed(1)}%</td>
            <td class="num" data-label="Стрик" style="color:var(--green);font-weight:600;">${h.best || '—'}</td>
            <td class="num" data-label="Лузстрик" style="color:var(--red);font-weight:600;">${h.worst || '—'}</td>
            <td class="num" data-label="Скилл" style="color:var(--purple);font-weight:600;">${h.skill || '—'}</td>
            <td class="num" data-label="Фракция" style="color:var(--ice);font-weight:600;">${h.factionWins || '—'}</td>
            <td class="num" data-label="Ур.">${h.level}</td>
            <td class="num" data-label="Осколки">${h.shards}</td>
        </tr>`;
    });

    html += '</tbody></table></div></div>';
    return html;
}

// --- 6.2.1 Удалённые герои (блок для Архива) ---
function renderDeletedHeroes(deletedHeroes) {
    if (!deletedHeroes || !deletedHeroes.length) return '';

    let html = '<div class="oracle-block" style="border-color:rgba(232,93,58,0.25);">';
    html += '<div class="oracle-block-title" style="color:var(--red);">🗑️ Удалённые герои</div>';
    html += '<div style="font-size:0.75rem;color:var(--muted);margin-bottom:10px;">Герои, которых ты убрал из ростера</div>';
    html += '<div class="table-container"><table class="history-table full" style="font-size:0.75rem;">';
    html += '<thead><tr>' +
        '<th>Сезон</th>' +
        '<th>Герой</th>' +
        '<th class="num">W/L</th>' +
        '<th class="num">WR</th>' +
        '<th class="num">🔥</th>' +
        '<th class="num">💀</th>' +
        '<th class="num">👑</th>' +
        '<th class="num">⚔️</th>' +
    '</tr></thead><tbody>';

    deletedHeroes
        .sort((a, b) => b.season - a.season || b.wr - a.wr)
        .forEach(h => {
            html += `<tr style="opacity:0.75;">
                <td class="season-num" data-label="Сезон">S${h.season}${h.isCurrent ? ' ⚡' : ''}</td>
                <td data-label="Герой" style="color:var(--sub);">${h.emoji} ${h.name || '—'}</td>
                <td class="num" data-label="W/L">${h.wins}-${h.losses}</td>
                <td class="num" data-label="WR" style="color:${wrColor(h.wr)};font-weight:700;">${(h.wr * 100).toFixed(1)}%</td>
                <td class="num" data-label="Стрик" style="color:var(--green);">${h.best || '—'}</td>
                <td class="num" data-label="Лузстрик" style="color:var(--red);">${h.worst || '—'}</td>
                <td class="num" data-label="Турниры" style="color:var(--gold);">${h.tournamentWins || '—'}</td>
                <td class="num" data-label="Фракция" style="color:var(--ice);">${h.factionWins || '—'}</td>
            </tr>`;
        });

    html += '</tbody></table></div></div>';
    return html;
}

// --- 6.3 График ---
function renderChart(history) {
    if (history.length < 2) return '';
    const points = history.map(h => h.wr * 100);
    const labels = history.map(h => `S${h.season}`);
    const W = 600, H = 200, P = 50;
    const minW = Math.min(...points) - 2, maxW = Math.max(...points) + 2;
    const range = maxW - minW || 1;
    const gX = (i) => P + (W - P * 2) * i / (points.length - 1);
    const gY = (v) => H - P - ((v - minW) / range) * (H - P * 2);
    const svgPoints = points.map((p, i) => `${gX(i)},${gY(p)}`).join(' ');
    const circles = points.map((p, i) => {
        const color = i === points.length - 1 ? (p >= points[0] ? '#10b981' : '#ef4444') : '#a371f7';
        return `<circle cx="${gX(i)}" cy="${gY(p)}" r="6" fill="var(--card)" stroke="${color}" stroke-width="2.5"/>`;
    }).join('');
    const texts = points.map((p, i) => `<text x="${gX(i)}" y="${gY(p) - 14}" text-anchor="middle" fill="#c4a5ff" font-size="11" font-weight="700">${p.toFixed(1)}%</text>`).join('');
    const bottomLabels = labels.map((l, i) => `<text x="${gX(i)}" y="${H - 8}" text-anchor="middle" fill="#8a94a8" font-size="10">${l}</text>`).join('');
    const diff = points[points.length - 1] - points[0];
    const diffText = diff >= 0 ? `+${diff.toFixed(1)}%` : `${diff.toFixed(1)}%`;
    const diffColor = diff >= 0 ? 'var(--green)' : 'var(--red)';
    return `<div class="oracle-block gold">
        <div class="oracle-block-title" style="margin-bottom:8px;">📈 Динамика винрейта</div>
        <div style="text-align:center;margin-bottom:4px;font-size:.85rem;color:var(--sub)">${points[0].toFixed(1)}% → <span style="color:${diffColor};font-weight:700">${points[points.length - 1].toFixed(1)}% (${diffText})</span></div>
        <svg width="100%" height="${H}" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" style="display:block;max-width:100%">
            <defs><linearGradient id="cg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#a371f7" stop-opacity="0.25"/><stop offset="100%" stop-color="#a371f7" stop-opacity="0"/></linearGradient><linearGradient id="cl" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#8b5cf6"/><stop offset="50%" stop-color="#c4a5ff"/><stop offset="100%" stop-color="#f0b90b"/></linearGradient></defs>
            <polygon points="${gX(0)},${H - P} ${svgPoints} ${gX(points.length - 1)},${H - P}" fill="url(#cg)"/>
            <polyline points="${svgPoints}" fill="none" stroke="url(#cl)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
            ${circles}${texts}${bottomLabels}
        </svg>
    </div>`;
}

// --- 6.4 Тренды (без плитки «Пик» — она в renderPeakForm) ---
function renderTrends(trend) {
    if (trend.trend === 'none' || trend.trend === 'first') return '';
    let ti, tt;
    if (trend.trend === 'growth') { ti = '↗'; tt = 'Рост'; }
    else if (trend.trend === 'fall') { ti = '↘'; tt = 'Угасание'; }
    else { ti = '→'; tt = 'Ровно'; }
    const formPct = (trend.form * 100).toFixed(0);
    const fi = trend.form >= 0.98 ? '🔥' : trend.form >= 0.9 ? '💪' : trend.form >= 0.75 ? '⚠️' : '🔻';
    return `<div class="oracle-block gold"><div class="oracle-block-title">📈 Тренды</div><div class="trend-grid">
        <div class="trend-item"><div class="trend-icon">${ti}</div><div class="trend-value">${tt}</div><div class="trend-label">Нить</div></div>
        <div class="trend-item"><div class="trend-icon">${fi}</div><div class="trend-value">${formPct}%</div><div class="trend-label">Форма</div></div>
        <div class="trend-item"><div class="trend-icon">📊</div><div class="trend-value">${(trend.stdDev * 100).toFixed(1)}%</div><div class="trend-label">Разброс</div></div>
    </div></div>`;
}

// --- 6.5 Рекорды (10 карточек) ---
function renderRecords(history) {
    if (history.length === 0) return '';
    const sa = analyzeSeasons(history);
    const rec = findPersonalRecords(history);
    if (!sa || !rec) return '';

    // Турниры
    const tourValue = sa.mostTournaments.tournamentWins || 0;
    const tourSeason = tourValue > 0 && sa.mostTournaments.season !== undefined
        ? `S${sa.mostTournaments.season}`
        : '—';

    // Фракционные победы
    const factionValue = rec.maxFactionWins.factionWins || 0;
    const factionSeason = factionValue > 0 && rec.maxFactionWins.season !== undefined
        ? `S${rec.maxFactionWins.season}`
        : '—';

    let html = '<div class="oracle-block green"><div class="oracle-block-title">🏅 Рекорды</div><div class="season-highlight">';

    html += `<div class="season-card"><div class="season-icon">🏆</div><div class="season-title">Лучший WR</div><div class="season-value">${(sa.bestWR.wr * 100).toFixed(1)}%</div><div class="season-detail">S${sa.bestWR.season}</div></div>`;
    html += `<div class="season-card"><div class="season-icon">💀</div><div class="season-title">Худший WR</div><div class="season-value">${(sa.worstWR.wr * 100).toFixed(1)}%</div><div class="season-detail">S${sa.worstWR.season}</div></div>`;
    html += `<div class="season-card"><div class="season-icon">⚔️</div><div class="season-title">Больше побед</div><div class="season-value">${sa.mostWins.wins}</div><div class="season-detail">S${sa.mostWins.season}</div></div>`;
    html += `<div class="season-card"><div class="season-icon">🔥</div><div class="season-title">Больше боёв</div><div class="season-value">${sa.mostFights.total}</div><div class="season-detail">S${sa.mostFights.season}</div></div>`;
    html += `<div class="season-card"><div class="season-icon">👑</div><div class="season-title">Больше турниров</div><div class="season-value">${tourValue}</div><div class="season-detail">${tourSeason}</div></div>`;
    html += `<div class="season-card"><div class="season-icon">📈</div><div class="season-title">Лучший стрик</div><div class="season-value">${rec.bestStreak.best}</div><div class="season-detail">S${rec.bestStreak.season}</div></div>`;
    html += `<div class="season-card"><div class="season-icon">💀</div><div class="season-title">Худший стрик</div><div class="season-value">${rec.worstStreak.worst}</div><div class="season-detail">S${rec.worstStreak.season}</div></div>`;
    html += `<div class="season-card"><div class="season-icon">👑</div><div class="season-title">Макс. уровень</div><div class="season-value">${rec.maxLevel.level}</div><div class="season-detail">S${rec.maxLevel.season}</div></div>`;
    html += `<div class="season-card"><div class="season-icon">💎</div><div class="season-title">Макс. осколков</div><div class="season-value">${rec.maxShards.shards}</div><div class="season-detail">S${rec.maxShards.season}</div></div>`;
    html += `<div class="season-card"><div class="season-icon">⚔️</div><div class="season-title">Макс. фракц. побед</div><div class="season-value">${factionValue}</div><div class="season-detail">${factionSeason}</div></div>`;

    html += '</div></div>';
    return html;
}

// --- 6.6 Сезон-легенда (с разбивкой по компонентам) ---
function renderLegendSeason(legend) {
    if (!legend) return '';

    const wrScore = legend.wr * 40;
    const tourScore = Math.min(30, (legend.tournamentWins || 0) * 5);
    const levelScore = Math.min(20, (legend.level || 0) / 10);
    const factionScore = Math.min(10, (legend.factionWins || 0) / 20);

    const components = [
        { icon: '📊', name: 'Винрейт',   value: wrScore,      max: 40, detail: `${(legend.wr * 100).toFixed(1)}%`,  color: 'var(--gold)' },
        { icon: '🏆', name: 'Турниры',   value: tourScore,    max: 30, detail: `${legend.tournamentWins || 0} побед`, color: 'var(--purple)' },
        { icon: '📈', name: 'Уровень',   value: levelScore,   max: 20, detail: `${legend.level} ур.`,                color: 'var(--green)' },
        { icon: '⚔️', name: 'Фракция',   value: factionScore, max: 10, detail: `${legend.factionWins || 0} побед`,   color: 'var(--ice)' }
    ];

    let html = '<div class="oracle-block gold"><div class="oracle-block-title">🏆 Сезон-легенда</div>';

    // Заголовок
    html += `<div class="season-card" style="margin-bottom:14px;border-color:rgba(240,185,11,0.5);box-shadow:0 0 24px rgba(240,185,11,0.15);">
        <div class="season-icon">👑</div>
        <div class="season-title">Лучший интегральный сезон</div>
        <div class="season-value">S${legend.season}</div>
        <div style="font-size:0.75rem;color:var(--muted);margin-top:4px;">Оценка: <strong style="color:var(--gold);">${legend.score}</strong> / 100</div>
    </div>`;

    // Разбивка по компонентам
    html += '<div style="font-size:0.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;">📊 Разбивка оценки</div>';

    components.forEach(c => {
        const percent = c.max > 0 ? (c.value / c.max) * 100 : 0;
        html += `<div style="background:var(--elevated);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 12px;margin-bottom:6px;border-left:3px solid ${c.color};">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
                <span style="font-size:0.82rem;color:var(--text);font-weight:600;">${c.icon} ${c.name}</span>
                <span style="font-size:0.78rem;color:${c.color};font-weight:700;">${c.value.toFixed(1)} / ${c.max}</span>
            </div>
            <div style="display:flex;justify-content:space-between;font-size:0.7rem;color:var(--muted);margin-bottom:6px;">
                <span>${c.detail}</span>
                <span>${percent.toFixed(0)}%</span>
            </div>
            <div style="background:var(--bg);height:4px;border-radius:2px;overflow:hidden;">
                <div style="width:${percent}%;height:4px;background:${c.color};border-radius:2px;"></div>
            </div>
        </div>`;
    });

    html += '</div>';
    return html;
}

// --- 6.7 Пик формы ---
function renderPeakForm(peaks) {
    if (!peaks.length) return '';
    const medals = ['🥇', '🥈', '🥉'];
    let html = '<div class="oracle-block green"><div class="oracle-block-title">📈 Пик формы</div>';
    peaks.forEach((p, i) => {

        </div>`;

// --- 6.8 Взлёты и падения ---
function renderSwings(swings) {
    if (!swings.ups.length && !swings.downs.length) return '';
    let html = '<div class="oracle-block"><div class="oracle-block-title">📉 Взлёты и падения</div>';
    if (swings.ups.length) {
        html += '<div style="font-size:0.7rem;color:var(--green);margin-bottom:6px;text-transform:uppercase;letter-spacing:1px;">📈 Взлёты</div>';
        swings.ups.forEach(s => {
            html += `<div class="style-row" style="border-left:3px solid var(--green);"><div class="style-name"><span>S${s.from} → S${s.to}</span></div><div class="style-val" style="color:var(--green);">+${(s.delta * 100).toFixed(1)}% <span style="color:var(--muted);font-size:0.75rem;">(${(s.fromWR * 100).toFixed(0)}→${(s.toWR * 100).toFixed(0)})</span></div></div>`;
        });
    }
    if (swings.downs.length) {
        html += '<div style="font-size:0.7rem;color:var(--red);margin:14px 0 6px;text-transform:uppercase;letter-spacing:1px;">📉 Падения</div>';
        swings.downs.forEach(s => {
            html += `<div class="style-row" style="border-left:3px solid var(--red);"><div class="style-name"><span>S${s.from} → S${s.to}</span></div><div class="style-val" style="color:var(--red);">${(s.delta * 100).toFixed(1)}% <span style="color:var(--muted);font-size:0.75rem;">(${(s.fromWR * 100).toFixed(0)}→${(s.toWR * 100).toFixed(0)})</span></div></div>`;
        });
    }
    html += '</div>';
    return html;
}

// --- 6.10 Сравнение с топ-10 ---

// --- 6.11 Мета ---
function renderMeta(metaBySeason, history) {
    if (!metaBySeason.length) return '';

    const rowTopHtml = (c, rank, isMine) => {
        const rankClass = rank <= 5 ? `r${rank}` : 'r-out';
        const mineStyle = isMine ? 'background:rgba(240,185,11,0.12);margin:0 -6px;padding:4px 6px;border-radius:4px;border-left:3px solid var(--gold);' : '';
        const nameColor = isMine ? 'color:var(--gold);font-weight:800;' : 'color:var(--text);';
        return `<div style="display:flex;justify-content:space-between;font-size:0.82rem;padding:4px 0;${mineStyle}">
            <span><span class="meta-rank ${rankClass}">${rank}</span><span style="${nameColor}">${c.name}</span>${isMine ? ' <span style="color:var(--gold);font-size:0.7rem;">← твой</span>' : ''}</span>
            <span style="color:var(--gold);font-weight:700;">${(c.wr * 100).toFixed(1)}% · ${c.total}</span>
        </div>`;
    };

    const rowCompactHtml = (m, historyItem) => {
        if (!historyItem || !historyItem.name?.includes('-')) return '';
        const myClass = historyItem.name.split('-')[1];
        const myRank = m.allClasses.findIndex(c => c.name === myClass) + 1;
        const myObj = m.allClasses.find(c => c.name === myClass);
        if (!myObj) return '';
        const isInMetaNow = myRank <= META_TOP && myRank > 0;
        const statusIcon = isInMetaNow ? '🎯' : '⚔️';
        const rankColor = isInMetaNow ? 'var(--gold)' : 'var(--muted)';
        return `<div style="display:grid;grid-template-columns:50px 1fr auto auto;gap:10px;align-items:center;padding:6px 10px;font-size:0.78rem;border-bottom:1px solid rgba(163,113,247,0.08);">
            <span style="color:var(--purple);font-weight:800;">S${m.season}</span>
            <span>${statusIcon} <strong style="color:${isInMetaNow ? 'var(--gold)' : 'var(--text)'};">${myClass}</strong></span>
            <span style="color:${rankColor};font-size:0.7rem;white-space:nowrap;">${myRank} из ${m.allClasses.length}</span>
            <span style="color:${wrColor(myObj.wr)};font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;">${(myObj.wr * 100).toFixed(1)}%</span>
        </div>`;
    };

    const currentMeta = metaBySeason.find(m => m.isCurrent);
    const archivedMeta = metaBySeason.filter(m => !m.isCurrent);

    let html = '<div class="oracle-block ice"><div class="oracle-block-title">📊 Мета по сезонам</div>';

    if (currentMeta && currentMeta.topClasses.length > 0) {
        const m = currentMeta;
        const historyItem = history.find(h => h.season === m.season);
        const myClass = historyItem?.name?.split('-')[1] || null;
        const myRank = myClass ? m.allClasses.findIndex(c => c.name === myClass) + 1 : 0;
        const myObj = myClass ? m.allClasses.find(c => c.name === myClass) : null;
        const myInMeta = myClass ? isInMeta(myClass, metaBySeason, m.season) : false;
        const posText = myRank > 0 ? ` · 📍 ${myRank} из ${m.allClasses.length}` : '';
        const statusText = myClass ? (myInMeta ? ' 🎯 в мете' : ' ⚔️ вне меты') : '';

        html += `<div style="margin-bottom:14px;padding:12px 14px;background:linear-gradient(90deg,rgba(163,113,247,0.1),rgba(163,113,247,0.02));border-radius:var(--radius-sm);border-left:3px solid ${myInMeta ? 'var(--gold)' : 'var(--purple)'};">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:4px;">
                <div style="font-size:0.82rem;color:var(--purple);font-weight:800;">S${m.season} ⚡ <span style="color:var(--muted);font-weight:600;font-size:0.7rem;text-transform:uppercase;letter-spacing:1px;">текущий</span></div>
                ${myClass ? `<div style="font-size:0.7rem;color:var(--muted);">твой класс: <strong style="color:${myInMeta ? 'var(--gold)' : 'var(--text)'};">${myClass}${posText}${statusText}</strong></div>` : ''}
            </div>`;
        m.topClasses.forEach((c, i) => { html += rowTopHtml(c, i + 1, c.name === myClass); });
        if (myObj && !myInMeta && myRank > META_TOP) {
            html += `<div style="text-align:center;color:var(--muted);font-size:0.75rem;padding:4px 0;letter-spacing:2px;">···</div>`;
            if (myRank - 2 >= META_TOP) html += rowTopHtml(m.allClasses[myRank - 2], myRank - 1, false);
            html += rowTopHtml(myObj, myRank, true);
            if (myRank < m.allClasses.length) html += rowTopHtml(m.allClasses[myRank], myRank + 1, false);
        }
        html += '</div>';
    }

    const archivedWithHistory = archivedMeta
        .map(m => ({ m, h: history.find(h => h.season === m.season) }))
        .filter(x => x.h && x.h.name?.includes('-'))
        .sort((a, b) => b.m.season - a.m.season);

    if (archivedWithHistory.length > 0) {
        html += `<div style="font-size:0.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin:14px 0 8px;">📜 Твой класс по прошлым сезонам</div>`;
        html += `<div style="background:rgba(163,113,247,0.03);border-radius:var(--radius-sm);padding:4px 0;">`;
        archivedWithHistory.forEach(({ m, h }) => { html += rowCompactHtml(m, h); });
        html += `</div>`;
    }
    html += '</div>';
    return html;
}

// --- 6.13 Стиль ---
function renderStyle(heroAnalysis, metaBySeason, history) {
    if (!heroAnalysis) return '';

    // Классы — сортируем по частоте (total)
    const classArr = Object.entries(heroAnalysis.classStats)
        .map(([n, s]) => ({ name: n, wins: s.wins, losses: s.losses, total: s.wins + s.losses, wr: s.wins / (s.wins + s.losses) }))
        .filter(c => c.total >= 5)
        .sort((a, b) => b.total - a.total);

    // Расы
    const raceArr = Object.entries(heroAnalysis.raceStats)
        .map(([n, s]) => ({ name: n, wins: s.wins, losses: s.losses, total: s.wins + s.losses, wr: s.wins / (s.wins + s.losses) }))
        .filter(c => c.total >= 5)
        .sort((a, b) => b.total - a.total);

    const bestClassByWR = classArr.length > 0 ? [...classArr].sort((a, b) => b.wr - a.wr)[0] : null;
    const mostClassByFreq = classArr.length > 0 ? classArr[0] : null;
    const bestRaceByWR = raceArr.length > 0 ? [...raceArr].sort((a, b) => b.wr - a.wr)[0] : null;
    const mostRaceByFreq = raceArr.length > 0 ? raceArr[0] : null;
    const bestCombo = heroAnalysis.bestCombo;

    const getTag = (item, bestWR, mostFreq) => {
        const isBest = bestWR && item.name === bestWR.name;
        const isFreq = mostFreq && item.name === mostFreq.name;
        if (isBest && isFreq) return { tag: '🏆🔥', cls: 'best' };
        if (isBest) return { tag: '🏆', cls: 'best' };
        if (isFreq) return { tag: '🔥', cls: '' };
        return { tag: '', cls: '' };
    };

    const currentSeason = history[history.length - 1]?.season;
    const getMetaTag = (className, kind = 'class') => {
        if (!metaBySeason || !metaBySeason.length) return '';
        const inMeta = isInMeta(className, metaBySeason, currentSeason, kind);
        if (inMeta === true) return ' 🎯';
        if (inMeta === false) return ' ⚔️';
        return '';
    };

    let html = '<div class="oracle-block ice"><div class="oracle-block-title">🎨 Твой стиль</div>';
    html += '<div style="font-size:0.75rem;color:var(--muted);margin-bottom:14px;">По всей карьере: текущие, удалённые и архивные герои</div>';

    if (classArr.length > 0) {
        html += '<div style="font-size:0.7rem;color:var(--muted);margin-bottom:8px;text-transform:uppercase;letter-spacing:1px;">⚔️ Классы <span style="opacity:0.7;text-transform:none;letter-spacing:0;">(🎯 в мете · ⚔️ вне меты · 🏆 лучший WR · 🔥 самый частый)</span></div>';
        classArr.slice(0, 5).forEach(c => {
            const { tag, cls } = getTag(c, bestClassByWR, mostClassByFreq);
            html += `<div class="style-row ${cls}">
                <div class="style-name"><span>${tag || '⚔️'}</span> ${c.name}${getMetaTag(c.name)}</div>
                <div class="style-val">${c.wins}-${c.losses} (${(c.wr * 100).toFixed(1)}%)</div>
            </div>`;
        });
    }

    if (raceArr.length > 0) {
        html += '<div style="font-size:0.7rem;color:var(--muted);margin:18px 0 8px;text-transform:uppercase;letter-spacing:1px;">🌍 Расы</div>';
        raceArr.slice(0, 5).forEach(r => {
            const { tag, cls } = getTag(r, bestRaceByWR, mostRaceByFreq);
            html += `<div class="style-row ${cls}">
                <div class="style-name"><span>${tag || '🌍'}</span> ${r.name}${getMetaTag(r.name, 'race')}</div>
                <div class="style-val">${r.wins}-${r.losses} (${(r.wr * 100).toFixed(1)}%)</div>
            </div>`;
        });
    }

    if (bestCombo) {
        html += `<div style="margin-top:18px;padding-top:14px;border-top:1px solid var(--border);text-align:center;font-size:0.85rem;">
            🏆 Лучшее комбо: <strong style="color:var(--green);">${bestCombo.emoji} ${bestCombo.name}</strong> — ${(bestCombo.wr * 100).toFixed(1)}%
            <div style="font-size:0.7rem;color:var(--muted);margin-top:4px;">${bestCombo.wins}-${bestCombo.losses} боёв</div>
        </div>`;
    }

    html += '</div>';
    return html;
}

// --- 6.15 Герои (с группировкой по статусам) ---
function renderHeroArchive(heroAnalysis) {
    if (!heroAnalysis || !heroAnalysis.heroes || heroAnalysis.heroes.length === 0) return '';

    // Группируем по имени
    const byName = new Map();
    heroAnalysis.heroes.forEach(h => {
        if (!h.name) return;
        if (!byName.has(h.name)) {
            byName.set(h.name, {
                name: h.name,
                emoji: h.emoji,
                wins: 0,
                losses: 0,
                isCurrent: false
            });
        }
        const u = byName.get(h.name);
        u.wins += h.wins || 0;
        u.losses += h.losses || 0;
        if (h.isCurrent) u.isCurrent = true;
    });

    const allUnique = [...byName.values()].map(h => ({
        ...h,
        wr: (h.wins + h.losses) > 0 ? h.wins / (h.wins + h.losses) : 0,
        total: h.wins + h.losses
    }));

    const currentHeroes = allUnique.filter(h => h.isCurrent);
    const deletedHeroes = allUnique.filter(h => !h.isCurrent && h.name !== currentHeroes[0]?.name);

    let html = '<div class="oracle-block ice"><div class="oracle-block-title">🎭 Твои герои</div>';

    if (currentHeroes.length) {
        html += '<div style="font-size:0.7rem;color:var(--gold);margin-bottom:6px;text-transform:uppercase;letter-spacing:1px;">⚡ Текущий</div>';
        currentHeroes.forEach(h => {
            html += `<div class="archive-hero current">
                <div class="hero-info"><span>${h.emoji} ${h.name}</span></div>
                <div><span class="hero-wr" style="color:${wrColor(h.wr)};">${h.wins}-${h.losses} (${(h.wr * 100).toFixed(0)}%)</span></div>
            </div>`;
        });
    }

    if (deletedHeroes.length) {
        html += '<div style="font-size:0.7rem;color:var(--red);margin:14px 0 6px;text-transform:uppercase;letter-spacing:1px;">🗑️ Удалённые</div>';
        deletedHeroes.forEach(h => {
            html += `<div class="archive-hero" style="border-left-color:var(--red);opacity:0.85;">
                <div class="hero-info"><span>${h.emoji} ${h.name}</span></div>
                <div><span class="hero-wr" style="color:${wrColor(h.wr)};">${h.wins}-${h.losses} (${(h.wr * 100).toFixed(0)}%)</span></div>
            </div>`;
        });
    }

    html += `<div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--border);text-align:center;color:var(--sub);font-size:0.85rem;">
        <div>Всего героев: <strong style="color:var(--purple);">${allUnique.length}</strong></div>
        <div style="margin-top:4px;">Суммарно: <strong style="color:var(--text);">${heroAnalysis.totalWins}-${heroAnalysis.totalLosses}</strong></div>
        <div style="margin-top:4px;">Истинный WR: <strong style="color:${wrColor(heroAnalysis.trueWR)};">${(heroAnalysis.trueWR * 100).toFixed(1)}%</strong></div>
        ${heroAnalysis.best ? `<div style="margin-top:4px;">Лучший: <strong style="color:var(--green);">${heroAnalysis.best.emoji} ${heroAnalysis.best.name}</strong> (${(heroAnalysis.best.wr * 100).toFixed(1)}%)</div>` : ''}
    </div></div>`;
    return html;
}

            <td class="num" style="color:var(--text);">${dungeon.totalTrophies}</td>

}

// --- 6.21 Пророчества ---
function renderProphecies(history, trend, heroAnalysis, leaguePlace, dungeon) {
    const prophecies = [];
    if (trend.trend === 'growth') prophecies.push(`📜 <strong>Следующий сезон</strong> станет для тебя <strong>испытанием огнём</strong>. Ты близок к пику. Один неверный шаг — и падение. Один верный — и <strong>новая высота</strong>.`);
    else if (trend.trend === 'fall') prophecies.push(`📜 <strong>Следующий сезон</strong> — это <strong>развилка</strong>. Или ты найдёшь в себе силы переломить падение, или нить окончательно истончится.`);
    else prophecies.push(`📜 <strong>Следующий сезон</strong> — это <strong>возможность</strong>. Ты застрял в равновесии. Пора сделать рывок. Или смириться.`);
    if (heroAnalysis.best && heroAnalysis.best.wr > 0.6) prophecies.push(`📜 Герой <strong>${heroAnalysis.best.emoji} ${heroAnalysis.best.name}</strong> ещё не сказал своего последнего слова. <strong>Вернись к нему</strong> — и он отблагодарит.`);
    if (leaguePlace && !leaguePlace.inTop8 && leaguePlace.gapToTop8 < 100) prophecies.push(`📜 До топ-8 — <strong>${leaguePlace.gapToTop8} SKILL</strong>. Это <strong>рядом</strong>. Один хороший вечер — и ты там.`);
    if (dungeon && dungeon.maxRecord < 20 && dungeon.totalWaves > 0) prophecies.push(`📜 Бездна ждёт. Твой рекорд — <strong>${dungeon.maxRecord} волн</strong>. Там, глубже, есть <strong>то, что ты ищешь</strong>.`);
    const totalTournaments = history.reduce((s, h) => s + (h.tournamentWins || 0), 0);
    if (totalTournaments === 0) prophecies.push(`📜 Ты ещё не брал <strong>турнирную корону</strong>. Но когда возьмёшь — это изменит всё.`);
    else if (totalTournaments >= 10) prophecies.push(`📜 <strong>${totalTournaments} турниров</strong> — это не предел. Следующая корона будет <strong>сладкой</strong>.`);
    if (prophecies.length === 0) return '';
    let html = '<div class="oracle-block"><div class="oracle-block-title">🔮 Пророчества</div>';
    prophecies.forEach(p => html += `<div class="oracle-voice" style="border-left-color: var(--gold);">${p}</div>`);
    html += '</div>';
    return html;
}

// --- 6.22 Эхо сезонов ---
function renderSeasonEcho(history) {
    if (history.length < 3) return '';
    const echoes = [];
    const last = history[history.length - 1];
    const prev = history[history.length - 2];
    const wrDiff = last.wr - prev.wr;
    if (Math.abs(wrDiff) > 0.1) {
        if (wrDiff > 0) echoes.push(`📖 <strong>Сезон ${prev.season} → ${last.season}</strong>: рывок на <strong>+${(wrDiff * 100).toFixed(0)}%</strong>. Ты <strong>переписал свою историю</strong>.`);
        else echoes.push(`📖 <strong>Сезон ${prev.season} → ${last.season}</strong>: падение на <strong>${(wrDiff * 100).toFixed(0)}%</strong>. Это <strong>рана</strong>, но не смерть.`);
    }
    const best = history.reduce((m, h) => h.wr > m.wr ? h : m);
    if (best.season !== last.season && best.wr > last.wr + 0.1) echoes.push(`📖 <strong>Эхо S${best.season}</strong>: тогда ты показывал <strong>${(best.wr * 100).toFixed(0)}%</strong>. Сейчас — ${(last.wr * 100).toFixed(0)}%. <strong>Верни эту форму</strong>.`);
    if (history.length >= 5) {
        const first = history[0];
        if (last.wr > first.wr + 0.1) echoes.push(`📖 <strong>С S${first.season} по S${last.season}</strong>: ты вырос с ${(first.wr * 100).toFixed(0)}% до ${(last.wr * 100).toFixed(0)}%. <strong>Это путь воина</strong>.`);
        else if (last.wr < first.wr - 0.1) echoes.push(`📖 <strong>С S${first.season} по S${last.season}</strong>: ты упал с ${(first.wr * 100).toFixed(0)}% до ${(last.wr * 100).toFixed(0)}%. <strong>Вернись к истокам</strong>.`);
    }
    if (echoes.length === 0) {
        if (history.length >= 3) {
            echoes.push(`📖 Ты идёшь <strong>ровно</strong>. Ни взлётов, ни падений — редкий случай. Или скучный. Решать тебе.`);
        } else {
            return '';
        }
    }
    let html = '<div class="oracle-block"><div class="oracle-block-title">📖 Эхо прошлых сезонов</div>';
    echoes.forEach(e => html += `<div class="oracle-voice" style="border-left-color: var(--ice);">${e}</div>`);
    html += '</div>';
    return html;
}

// --- 6.23 История фракций ---
function renderFactionHistory(history) {
    if (history.length < 2) return '';
    const hasLight = history.some(h => h.faction === 'Орден Света');
    const hasDark = history.some(h => h.faction === 'Культ Тьмы');
    if (!hasLight && !hasDark) return '';

    let html = '<div class="oracle-block"><div class="oracle-block-title">⚔️ История фракций</div>';
    history.forEach(h => {
        if (!h.faction) return;
        const isLight = h.faction === 'Орден Света';
        const icon = isLight ? '🌝' : '🌚';
        const color = isLight ? 'var(--gold)' : 'var(--purple)';
        html += `<div class="archive-hero" style="border-left-color:${color};">
            <div class="hero-info"><span>${icon}</span> <span style="color:var(--purple);font-weight:800;">S${h.season}</span> <span style="color:var(--sub);font-size:0.8rem;">${h.faction}</span></div>
            <div><span style="color:${color};font-weight:700;">${h.factionWins || 0} ⚔️</span> <span style="color:var(--muted);font-size:0.72rem;">${h.wins}-${h.losses} (${(h.wr * 100).toFixed(0)}%)</span></div>
        </div>`;
    });

    // Если только одна фракция — подпись
    if (!hasLight || !hasDark) {
        html += `<div style="text-align:center;font-size:0.75rem;color:var(--muted);margin-top:8px;font-style:italic;">
            Все сезоны — за <strong>${hasLight ? 'Орден Света' : 'Культ Тьмы'}</strong>
        </div>`;
    }

    html += '</div>';
    return html;
}

// --- 6.24 Лучшие сезоны ---
function renderArchiveBest(history) {
    if (history.length < 3) return '';

    // Группируем по сезону
    const bySeason = new Map();
    history.forEach(h => {
        if (!bySeason.has(h.season)) bySeason.set(h.season, []);
        bySeason.get(h.season).push(h);
    });

    // Для каждого сезона — лучший герой по WR (мин. боёв)
    const seasonBest = [...bySeason.entries()].map(([season, rows]) => {
        const eligible = rows.filter(r => r.total >= MIN_FIGHTS_FOR_RECORD);
        if (eligible.length === 0) return null;
        const best = eligible.sort((a, b) => b.wr - a.wr)[0];
        return { ...best, season };
    }).filter(Boolean);

    const top = seasonBest.sort((a, b) => b.wr - a.wr).slice(0, 5);
    if (top.length === 0) return '';

    const medals = ['🥇', '🥈', '🥉', '4️⃣', '5️⃣'];
    let html = '<div class="oracle-block green"><div class="oracle-block-title">🏆 Лучшие сезоны по WR</div>';
    top.forEach((h, i) => {
        const deletedIcon = h.isDeleted ? ' 🗑️' : '';
        html += `<div class="archive-hero" style="border-left-color:${i === 0 ? 'var(--gold)' : i === 1 ? 'var(--silver)' : i === 2 ? 'var(--bronze)' : 'var(--border)'};">
            <div class="hero-info"><span>${medals[i]}</span> <span style="color:var(--purple);font-weight:800;">S${h.season}</span> <span style="color:var(--sub);font-size:0.8rem;">${h.emoji} ${h.name || ''}${deletedIcon}</span></div>
            <div><span style="color:${wrColor(h.wr)};font-weight:800;">${(h.wr * 100).toFixed(1)}%</span> <span style="color:var(--muted);font-size:0.72rem;">(${h.wins}-${h.losses})</span></div>
        </div>`;
    });
    html += '</div>';
    return html;
}

/* ============================================================================
   СЕКЦИЯ 7. ГЛАВНАЯ — оркестратор
   ========================================================================= */
async function analyzePlayer() {
    const nickname = document.getElementById('oracleSearch').value.trim();
    const result = document.getElementById('oracleResult');
    autocompleteList.classList.remove('show');
    if (!nickname) { result.innerHTML = '<div class="not-found"><div class="nf-icon">📜</div><div>Назови имя героя</div></div>'; return; }
    result.innerHTML = '<div class="loading-block"><div class="spinner"></div><p>Повествовательница листает страницы...</p></div>';
    try {
        if (!allSeasonsCache) { allSeasonsCache = await loadAllSeasons(); allPlayersCache = getAllPlayers(allSeasonsCache); }
        const seasons = allSeasonsCache;
        const history = getPlayerHistory(nickname, seasons);          // все
        if (history.length === 0) { result.innerHTML = `<div class="not-found"><div class="nf-icon">👻</div><div>Я не вижу <strong>${nickname}</strong>.</div></div>`; return; }

        const mainHistory = history.filter(h => !h.isDeleted);        // только основные
        const last = mainHistory[mainHistory.length - 1] || history[history.length - 1];

        // Аналитика — по основным
        const trend = analyzeTrend(mainHistory);
        const heroAnalysis = analyzeHeroArchive(nickname, seasons);
        const dungeon = analyzeDungeon(nickname, seasons);
        const leaguePlace = getLeaguePlace(nickname, seasons);
        const factions = analyzeFactions(mainHistory);
        const metaBySeason = analyzeMeta(seasons);
        const legendSeason = findLegendSeason(mainHistory);
        const peakForm = findPeakForm(mainHistory);
        const swings = findSwings(mainHistory);
        const pace = findPace(mainHistory);
        const top10Compare = compareWithTop10(nickname, seasons);
        const forecast = buildForecast(trend, leaguePlace);
        const narrative = generateNarrative(mainHistory, trend, heroAnalysis, dungeon, leaguePlace);
        const forecastText = generateForecastText(forecast, trend);
        const advice = generateAdvice(trend, heroAnalysis, leaguePlace, metaBySeason, mainHistory);
        const memes = generateMemeAnalysis(mainHistory, trend, heroAnalysis, metaBySeason, leaguePlace);

        let html = '';
        html += renderPlayerInfo(last);
        html += renderTabs();

        // 👤 ОБЗОР
        html += '<div id="oracle-tab-overview" class="oracle-tab-content active">';
        html += renderHistory(mainHistory, 5, history);
        html += renderVoice(narrative);
        html += '</div>';

        // 📊 АНАЛИЗ
        html += '<div id="oracle-tab-analysis" class="oracle-tab-content">';
        html += renderMemeAnalysis(memes);
        html += renderChart(mainHistory);
        html += renderTrends(trend);
        html += renderSwings(swings);
        html += renderPace(pace);
        html += renderRecords(history);
        html += renderLegendSeason(legendSeason);
        html += renderPeakForm(peakForm);
        html += renderCompareTop10(top10Compare);
        html += '</div>';

        // 📊 МЕТА
        html += '<div id="oracle-tab-meta" class="oracle-tab-content">';
        html += renderMeta(metaBySeason, mainHistory);
        html += '</div>';

        // ⚔️ СТИЛЬ
        html += '<div id="oracle-tab-style" class="oracle-tab-content">';
        html += renderStyle(heroAnalysis, metaBySeason, mainHistory);
        html += renderFactions(factions, mainHistory);
        html += '</div>';

        // 🏔 ДАНЖ
        html += '<div id="oracle-tab-dungeon" class="oracle-tab-content">';
        html += renderDungeon(dungeon);
        html += '</div>';

        // 📜 АРХИВ — полная летопись СО ВСЕМИ
        html += '<div id="oracle-tab-archive" class="oracle-tab-content">';
        html += renderArchiveBest(history);
        html += renderFullHistory(history);
        html += renderFactionHistory(mainHistory);
        html += renderSeasonEcho(mainHistory);
        html += '</div>';

        // 🔮 ПРОРОЧЕСТВА
        html += '<div id="oracle-tab-oracle" class="oracle-tab-content">';
        html += renderProphecies(mainHistory, trend, heroAnalysis, leaguePlace, dungeon);
        html += `<div class="oracle-block gold"><div class="oracle-block-title">🖋️ Слово Повествовательницы</div>${forecastText.map(l => `<div class="oracle-voice">${l}</div>`).join('')}</div>`;
        html += renderAdvice(advice);
        html += '</div>';

        result.innerHTML = html;
    } catch (e) {
        console.error(e);
        result.innerHTML = `<div class="not-found"><div class="nf-icon">💀</div><div>Ошибка: ${e.message}</div></div>`;
    }
}

/* ============================================================================
   СЕКЦИЯ 8. UI — тема, навигация, поиск, прогресс
   ========================================================================= */
function toggleTheme() {
    const h = document.documentElement;
    const n = h.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    h.setAttribute('data-theme', n);
    localStorage.setItem('eternis-theme', n);
}
(function() { const s = localStorage.getItem('eternis-theme'); if (s) document.documentElement.setAttribute('data-theme', s); })();

function toggleNav() {
    const nav = document.getElementById('pageNav');
    const btn = document.querySelector('.nav-toggle');
    nav.classList.toggle('show');
    btn.textContent = nav.classList.contains('show') ? '✕ Закрыть' : '☰ Меню';
}
document.querySelectorAll('.nav-link').forEach(l => { l.addEventListener('click', () => { document.getElementById('pageNav').classList.remove('show'); document.querySelector('.nav-toggle').textContent = '☰ Меню'; }); });
document.querySelectorAll('.nav-label').forEach(label => {
    label.addEventListener('click', function(e) {
        if (window.innerWidth > 768) return;
        e.preventDefault();
        const dd = this.nextElementSibling;
        if (dd && dd.classList.contains('nav-dropdown')) {
            const isOpen = dd.style.display === 'block';
            document.querySelectorAll('.nav-dropdown').forEach(d => d.style.display = 'none');
            dd.style.display = isOpen ? 'none' : 'block';
        }
    });
});

// --- Поиск ---
let allSeasonsCache = null;
let allPlayersCache = null;
let autocompleteIndex = -1;
let autocompleteTimer = null;

const searchInput = document.getElementById('oracleSearch');
const autocompleteList = document.getElementById('autocompleteList');

searchInput.addEventListener('input', function() {
    clearTimeout(autocompleteTimer);
    const query = this.value.trim().toLowerCase();
    if (query.length < 1) { autocompleteList.classList.remove('show'); return; }
    autocompleteTimer = setTimeout(() => {
        if (!allPlayersCache || allPlayersCache.length === 0) { autocompleteList.innerHTML = '<div class="autocomplete-empty">⏳ Загрузка базы игроков...</div>'; autocompleteList.classList.add('show'); return; }
        const matches = allPlayersCache.filter(p => p.display.toLowerCase().includes(query)).slice(0, 10);
        if (matches.length === 0) { autocompleteList.innerHTML = '<div class="autocomplete-empty">Никого не найдено</div>'; autocompleteList.classList.add('show'); return; }
        autocompleteList.innerHTML = matches.map(p => {
            const idx = p.display.toLowerCase().indexOf(query);
            const before = p.display.slice(0, idx);
            const match = p.display.slice(idx, idx + query.length);
            const after = p.display.slice(idx + query.length);
            return `<div class="autocomplete-item" data-name="${p.display}"><span class="ac-emoji">${p.emoji}</span><span class="ac-name">${before}<strong>${match}</strong>${after}</span><span class="ac-class">${p.name}</span></div>`;
        }).join('');
        autocompleteList.classList.add('show');
        autocompleteIndex = -1;
        document.querySelectorAll('.autocomplete-item').forEach(item => {
            item.addEventListener('click', () => { searchInput.value = item.dataset.name; autocompleteList.classList.remove('show'); analyzePlayer(); });
        });
    }, 50);
});

searchInput.addEventListener('keydown', function(e) {
    const items = autocompleteList.querySelectorAll('.autocomplete-item');
    if (e.key === 'ArrowDown') { e.preventDefault(); autocompleteIndex = Math.min(autocompleteIndex + 1, items.length - 1); items.forEach((it, i) => it.classList.toggle('active', i === autocompleteIndex)); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); autocompleteIndex = Math.max(autocompleteIndex - 1, -1); items.forEach((it, i) => it.classList.toggle('active', i === autocompleteIndex)); }
    else if (e.key === 'Enter') { if (autocompleteIndex >= 0 && items[autocompleteIndex]) { e.preventDefault(); searchInput.value = items[autocompleteIndex].dataset.name; autocompleteList.classList.remove('show'); analyzePlayer(); } else { autocompleteList.classList.remove('show'); analyzePlayer(); } }
    else if (e.key === 'Escape') autocompleteList.classList.remove('show');
});

document.addEventListener('click', function(e) { if (!e.target.closest('.search-row')) autocompleteList.classList.remove('show'); });

// --- Прогресс и scroll-top ---
(function() {
    const pb = document.getElementById('readingProgress'), st = document.getElementById('scrollTop');
    if (!pb || !st) return;
    window.addEventListener('scroll', () => {
        const s = window.scrollY, dh = document.documentElement.scrollHeight - window.innerHeight;
        pb.style.transform = `scaleX(${dh > 0 ? s / dh : 0})`;
        if (s > 300) st.classList.add('visible'); else st.classList.remove('visible');
    });
})();

/* ============================================================================
   СЕКЦИЯ 9. ПРЕДЗАГРУЗКА
   ========================================================================= */
(async function preload() {
    try {
        const cached = JSON.parse(localStorage.getItem(PLAYERS_CACHE_KEY) || 'null');
        if (cached && cached.length > 0) {
            allPlayersCache = cached;
            console.log('Повествовательница: игроки из кеша —', cached.length);
        }
    } catch (e) {}
    try {
        let r = await fetch(`${STATS_URL}?v=${Date.now()}`);
        if (!r.ok) r = await fetch(`${STATS_URL_FALLBACK}?v=${Date.now()}`);
        const d = await r.json();
        const currentPlayers = getAllPlayers([{ num: 0, data: d, isCurrent: true }]);
        const map = new Map();
        currentPlayers.forEach(p => map.set(p.display.toLowerCase(), p));
        if (allPlayersCache) {
            allPlayersCache.forEach(p => {
                if (!map.has(p.display.toLowerCase())) map.set(p.display.toLowerCase(), p);
            });
        }
        allPlayersCache = [...map.values()].sort((a, b) => a.display.localeCompare(b.display));
        console.log('Повествовательница: после текущего —', allPlayersCache.length);
    } catch (e) { console.error('Текущий:', e); }
    loadAllSeasons().then(seasons => {
        allSeasonsCache = seasons;
        allPlayersCache = getAllPlayers(seasons);
        try { localStorage.setItem(PLAYERS_CACHE_KEY, JSON.stringify(allPlayersCache)); } catch (e) {}
        console.log('Повествовательница: полная загрузка —', allPlayersCache.length);
    }).catch(e => console.error('Фон:', e));
    const params = new URLSearchParams(window.location.search);
    const name = params.get('name');
    if (name) {
        document.getElementById('oracleSearch').value = name;
        setTimeout(() => analyzePlayer(), 500);
    }
})();
</script>
