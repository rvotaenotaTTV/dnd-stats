<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Форма</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,600;14..32,800;14..32,900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #06040a; --card: #0e0a14; --elevated: #140c1a;
            --text: #e8ddf0; --sub: #8a7d94; --muted: #5e5268;
            --border: rgba(180,100,140,0.15);
            --gold: #f0b90b; --red: #e85d3a; --purple: #a371f7; --green: #10b981;
            --radius: 16px; --radius-sm: 10px;
        }
        [data-theme="light"] {
            --bg: #f7f2eb; --card: #fefcf8; --elevated: #fbf8f3;
            --text: #2d1a1a; --sub: #6b4e4e; --muted: #8b6b6b;
            --border: rgba(180,80,60,0.12);
            --gold: #b8860b; --red: #a03020; --purple: #7b5ea7; --green: #27ae60;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; scroll-padding-top: 100px; }
        body { font-family: 'Inter',system-ui,sans-serif; background: var(--bg); background-image: radial-gradient(ellipse at 50% 0%, rgba(200,40,40,0.06) 0%, transparent 60%), radial-gradient(ellipse at 20% 80%, rgba(163,113,247,0.04) 0%, transparent 50%); color: var(--text); min-height: 100vh; line-height: 1.5; }
        .container { max-width: 1300px; margin: 0 auto; padding: 24px 20px 60px; }

        .header { text-align: center; padding: 32px 0 8px; position: relative; }
        .header-title { font-size: clamp(2.2rem,6vw,3.2rem); font-weight: 900; letter-spacing: -0.03em; background: linear-gradient(135deg,#8b0000 0%,#e85d3a 40%,#ffd700 70%,#e85d3a 100%); background-size: 200% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; filter: drop-shadow(0 0 30px rgba(232,93,58,0.5)); animation: shimmer 3s linear infinite; margin-bottom: 4px; }
        @keyframes shimmer { 0%{background-position:0% center} 100%{background-position:200% center} }
        .header-subtitle { font-size: 0.9rem; color: var(--red); font-weight: 500; letter-spacing: 0.04em; }
        .theme-toggle { position: absolute; right: 0; top: 50%; transform: translateY(-50%); background: var(--elevated); border: 1px solid var(--border); color: var(--sub); padding: 8px 12px; border-radius: 20px; cursor: pointer; font-size: 0.85rem; font-family: inherit; transition: 0.2s; }
        .theme-toggle:hover { background: var(--card); color: var(--red); border-color: var(--red); }

        .nav-wrapper { margin-bottom: 28px; position: sticky; top: 12px; z-index: 100; }
        .nav-toggle { display: none; width: 100%; padding: 13px 18px; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); color: var(--gold); font-size: 0.95rem; font-weight: 700; cursor: pointer; text-align: left; }
        .nav-bar { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; padding: 6px; background: var(--card); border-radius: var(--radius); border: 1px solid var(--border); }
        .nav-link { padding: 8px 14px; border-radius: 20px; color: var(--sub); text-decoration: none; font-size: 0.78rem; font-weight: 500; transition: 0.2s; }
        .nav-link:hover { color: var(--text); background: var(--elevated); }
        .nav-link.active { background: linear-gradient(135deg,var(--red),var(--gold)); color: #000; font-weight: 700; }

        .section { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px 22px; margin-bottom: 20px; position: relative; overflow: hidden; }
        .section::after { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; opacity: 0.6; }
        .section.gold::after { background: linear-gradient(90deg,transparent,var(--gold),transparent); }
        .section-title { font-size: 1.15rem; font-weight: 800; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
        .section.gold .section-title { color: var(--gold); }

        .tabs { display: flex; gap: 8px; margin-bottom: 24px; }
        .tab-btn { padding: 10px 24px; border: 1px solid var(--border); background: var(--elevated); color: var(--sub); border-radius: 20px; cursor: pointer; font-weight: 600; font-size: 0.85rem; font-family: inherit; transition: 0.2s; }
        .tab-btn:hover { border-color: var(--gold); color: var(--gold); }
        .tab-btn.active { background: linear-gradient(135deg,var(--red),var(--gold)); color: #000; border-color: transparent; font-weight: 700; }

        .info-bar { display: flex; gap: 16px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }
        .info-pill { padding: 6px 14px; border-radius: 20px; font-size: 0.72rem; font-weight: 600; background: var(--elevated); border: 1px solid var(--border); color: var(--sub); display: flex; align-items: center; gap: 6px; }
        .info-pill strong { color: var(--gold); }

        .search-wrapper { margin-bottom: 16px; position: relative; }
        .search-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 0.9rem; }
        .search-input { padding: 10px 16px 10px 40px; background: var(--elevated); border: 1px solid var(--border); border-radius: 20px; color: var(--text); font-size: 0.85rem; font-family: inherit; transition: 0.2s; width: 100%; }
        .search-input:focus { outline: none; border-color: var(--gold); }
        .search-input::placeholder { color: var(--muted); }

        .table-wrapper { overflow-x: auto; -webkit-overflow-scrolling: touch; border-radius: var(--radius-sm); border: 1px solid var(--border); }
        table { width: 100%; border-collapse: collapse; font-size: 0.78rem; min-width: 750px; }
        th { background: var(--elevated); color: var(--gold); font-weight: 700; padding: 10px 12px; text-align: left; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.06em; cursor: pointer; user-select: none; white-space: nowrap; transition: 0.2s; }
        th:hover { background: rgba(240,185,11,0.1); }
        th .sort-icon { margin-left: 4px; font-size: 0.6rem; opacity: 0.5; }
        th.sort-active .sort-icon { opacity: 1; color: var(--gold); }
        td { padding: 8px 12px; border-bottom: 1px solid var(--border); transition: background 0.2s; }
        tbody tr { animation: fadeInRow 0.3s ease forwards; opacity: 0; }
        @keyframes fadeInRow { to{opacity:1} }
        tbody tr:hover { background: rgba(255,255,255,0.03); }
        td:first-child { font-weight: 600; color: var(--gold); }
        .number { text-align: right; font-variant-numeric: tabular-nums; }
        .up { color: var(--green); font-weight: 700; }
        .down { color: var(--red); font-weight: 700; }

        .beer-btn { position: fixed; bottom: 20px; right: 20px; width: 48px; height: 48px; background: var(--gold); color: #000; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.3rem; text-decoration: none; box-shadow: 0 4px 16px rgba(240,185,11,0.3); z-index: 99; transition: transform 0.2s; animation: float 3s ease-in-out infinite; }
        .beer-btn:hover { transform: scale(1.1); }
        @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }

        .spinner { display: inline-block; width: 32px; height: 32px; border: 3px solid var(--border); border-top: 3px solid var(--gold); border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 12px; }
        @keyframes spin { to{transform:rotate(360deg)} }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: var(--gold); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #ffd700; }
        * { scrollbar-width: thin; scrollbar-color: var(--gold) transparent; }

        @media (max-width: 768px) {
            .container { padding: 12px 14px 80px; }
            .header { padding: 20px 0 8px; }
            .header-title { font-size: 1.6rem; }
            .theme-toggle { position: static; transform: none; margin: 12px auto 0; display: block; width: fit-content; }
            .nav-toggle { display: block; }
            .nav-bar { display: none; flex-direction: column; margin-top: 8px; }
            .nav-bar.show { display: flex; }
            .nav-link { padding: 12px 16px; border-radius: var(--radius-sm); justify-content: center; }
            .tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
            .tab-btn { text-align: center; padding: 8px 10px; font-size: 0.75rem; }
            .section { padding: 18px 14px; }
            table { font-size: 0.68rem; min-width: 600px; }
            th, td { padding: 6px 8px; }
            .beer-btn { bottom: 16px; right: 16px; width: 42px; height: 42px; font-size: 1.1rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1 class="header-title">ФОРМА</h1>
            <p class="header-subtitle">Изменение винрейтов за последние часы</p>
            <button class="theme-toggle" onclick="toggleTheme()">🌓</button>
        </header>

        <div class="nav-wrapper">
            <button class="nav-toggle" onclick="toggleNav()">☰ Меню</button>
            <nav class="nav-bar" id="pageNav">
                <a href="index.html" class="nav-link">📊 Статистика</a>
                <a href="logs.html" class="nav-link">📜 Логи</a>
                <a href="calc.html" class="nav-link">🎲 Калькулятор</a>
                <a href="balance.html" class="nav-link">⚖️ Баланс</a>
                <a href="simulator.html" class="nav-link">🧪 Симулятор</a>
                <a href="gradient.html" class="nav-link">📈 Градиент</a>
                <a href="guide.html" class="nav-link">⚔️ Гайд</a>
                <a href="hall.html" class="nav-link">🏆 Зал Славы</a>
                <a href="lore.html" class="nav-link">📜 Лор</a>
                <a href="tavern.html" class="nav-link">🍺 Таверна</a>
                <a href="dungeon.html" class="nav-link">🏔 Подземелье</a>
                <a href="league.html" class="nav-link">🏟 Лига</a>
                <a href="form.html" class="nav-link active">🔥 Форма</a>
                <a href="player.html" class="nav-link">👤 Профиль</a>
            </nav>
        </div>

        <div id="content">
            <div style="text-align:center;padding:48px 20px;color:var(--sub);"><div class="spinner"></div><p>Загрузка формы...</p></div>
        </div>
    </div>

    <a href="https://www.donationalerts.com/r/rvotaenota" target="_blank" class="beer-btn" title="Угостить пивом 🍺">🍺</a>

<script>
    function toggleTheme(){const html=document.documentElement;const current=html.getAttribute('data-theme');const next=current==='dark'?'light':'dark';html.setAttribute('data-theme',next);localStorage.setItem('eternis-theme',next);}
    (function(){const saved=localStorage.getItem('eternis-theme');if(saved)document.documentElement.setAttribute('data-theme',saved);})();
    function toggleNav(){const nav=document.getElementById('pageNav'),btn=document.querySelector('.nav-toggle');nav.classList.toggle('show');btn.textContent=nav.classList.contains('show')?'✕ Закрыть':'☰ Меню';}
    document.addEventListener('DOMContentLoaded',()=>{document.querySelectorAll('.nav-link').forEach(link=>{link.addEventListener('click',()=>{document.getElementById('pageNav').classList.remove('show');document.querySelector('.nav-toggle').textContent='☰ Меню';});});});

    const REPO = 'rvotaenotaTTV/dnd-stats';
    const FILE = 'stats_data.json';
    const CACHE_KEY = 'eternis-form-commits';
    let allChanges = [], currentTab = 'players', currentSort = { key: 'diff', dir: 'desc' }, searchQuery = '';

    async function loadForm() {
        const container = document.getElementById('content');
        try {
            let commits;
            const cached = JSON.parse(localStorage.getItem(CACHE_KEY) || '{}');
            if (cached.ts && (Date.now() - cached.ts < 60 * 60 * 1000)) {
                commits = cached.data;
            } else {
                const [p1, p2] = await Promise.all([
                    fetch(`https://api.github.com/repos/${REPO}/commits?path=${FILE}&per_page=30&page=1`).then(r => r.json()),
                    fetch(`https://api.github.com/repos/${REPO}/commits?path=${FILE}&per_page=30&page=2`).then(r => r.json())
                ]);
                commits = [...(Array.isArray(p1) ? p1 : []), ...(Array.isArray(p2) ? p2 : [])];
                localStorage.setItem(CACHE_KEY, JSON.stringify({ ts: Date.now(), data: commits }));
            }
            
            if (!commits.length) { container.innerHTML = '<div style="text-align:center;padding:48px 20px;color:var(--sub);">❌ Коммиты не найдены</div>'; return; }
            
            const target = commits[commits.length - 1];
            const commitDate = new Date(target.commit.committer.date);
            const hoursAgo = ((new Date() - commitDate) / (60 * 60 * 1000)).toFixed(1);
            const sha = target.sha.substring(0, 7);
            
            const oldUrl = `https://raw.githubusercontent.com/${REPO}/${target.sha}/${FILE}`;
            const [oldResp, newResp] = await Promise.all([fetch(oldUrl), fetch(`https://raw.githubusercontent.com/${REPO}/main/${FILE}`)]);
            const oldData = await oldResp.json();
            const newData = await newResp.json();
            const oldPlayers = (oldData.players || []).filter(p => p.name && p.name !== 'Unknown');
            const newPlayers = (newData.players || []).filter(p => p.name && p.name !== 'Unknown');
            
            window._oldArchive = oldData.heroArchive || {};
            window._newArchive = newData.heroArchive || {};
            
            allChanges = [];
            newPlayers.forEach(p => {
                const old = oldPlayers.find(x => x.display === p.display);
                if (!old) return;
                if (old.wins === p.wins && old.losses === p.losses) return;
                const oldTotal = old.wins + old.losses;
                const newTotal = p.wins + p.losses;
                const oldWr = oldTotal > 0 ? old.wins / oldTotal * 100 : 0;
                const newWr = newTotal > 0 ? p.wins / newTotal * 100 : 0;
                allChanges.push({ ...p, oldWr, newWr, diff: newWr - oldWr, oldW: old.wins, oldL: old.losses });
            });
            
            window._commitInfo = { commitDate, hoursAgo, sha };
            renderAll();
        } catch(e) {
            container.innerHTML = `<div style="text-align:center;padding:48px 20px;color:var(--red);">❌ Ошибка загрузки: ${e.message}</div>`;
        }
    }

    function renderAll() {
        const info = window._commitInfo;
        const changesCount = allChanges.length;
        
        let html = '';
        
        html += '<div class="info-bar">';
        html += `<div class="info-pill">📅 <strong>${info.commitDate.toLocaleString()}</strong></div>`;
        html += `<div class="info-pill">⏱ <strong>${info.hoursAgo}ч</strong> назад</div>`;
        html += `<div class="info-pill">🔗 <strong>${info.sha}</strong></div>`;
        html += `<div class="info-pill">👥 <strong>${changesCount}</strong> изменений</div>`;
        html += '</div>';
        
        html += '<div class="tabs">';
        html += `<button class="tab-btn${currentTab==='players'?' active':''}" onclick="switchTab('players')">👥 Игроки</button>`;
        html += `<button class="tab-btn${currentTab==='classes'?' active':''}" onclick="switchTab('classes')">⚔️ Классы</button>`;
        html += `<button class="tab-btn${currentTab==='races'?' active':''}" onclick="switchTab('races')">🌍 Расы</button>`;
        html += '</div>';
        
        html += '<div class="search-wrapper">';
        html += '<span class="search-icon">🔍</span>';
        html += `<input type="text" class="search-input" id="formSearch" placeholder="Поиск по имени..." oninput="filterTable()" value="${searchQuery}">`;
        html += '</div>';
        
        html += '<div class="section gold"><div class="table-wrapper"><table id="formTable"><thead><tr>';
        html += `<th data-sort="display" onclick="sortBy('display')">${currentTab==='players'?'Игрок':currentTab==='classes'?'Класс':'Раса'} <span class="sort-icon">⇅</span></th>`;
        html += '<th class="number" data-sort="oldW" onclick="sortBy(\'oldW\')">Было <span class="sort-icon">⇅</span></th>';
        html += '<th class="number" data-sort="wins" onclick="sortBy(\'wins\')">Стало <span class="sort-icon">⇅</span></th>';
        html += '<th class="number" data-sort="oldWr" onclick="sortBy(\'oldWr\')">WR было <span class="sort-icon">⇅</span></th>';
        html += '<th class="number" data-sort="newWr" onclick="sortBy(\'newWr\')">WR стало <span class="sort-icon">⇅</span></th>';
        html += '<th class="number" data-sort="diff" onclick="sortBy(\'diff\')">Δ <span class="sort-icon">⇅</span></th>';
        html += '</tr></thead><tbody id="formTbody"></tbody></table></div></div>';
        
        document.getElementById('content').innerHTML = html;
        renderTable();
    }

    function renderTable() {
        let data = [];
        
        if (currentTab === 'players') {
            data = [...allChanges];
        } else if (currentTab === 'classes') {
            const map = {};
            allChanges.forEach(c => {
                const cn = c.name.split('-')[1] || c.name;
                if (!map[cn]) map[cn] = { display: cn, emoji: c.emoji, oldW: 0, oldL: 0, wins: 0, losses: 0 };
                map[cn].oldW += c.oldW; map[cn].oldL += c.oldL;
                map[cn].wins += c.wins; map[cn].losses += c.losses;
            });
            Object.values(window._oldArchive || {}).forEach(heroes => {
                heroes.forEach(h => {
                    const cn = (h.name || '').split('-')[1] || h.name || '';
                    if (!cn) return;
                    if (!map[cn]) map[cn] = { display: cn, emoji: h.emoji || '', oldW: 0, oldL: 0, wins: 0, losses: 0 };
                    map[cn].oldW += h.wins || 0;
                    map[cn].oldL += h.losses || 0;
                });
            });
            Object.values(window._newArchive || {}).forEach(heroes => {
                heroes.forEach(h => {
                    const cn = (h.name || '').split('-')[1] || h.name || '';
                    if (!cn) return;
                    if (!map[cn]) map[cn] = { display: cn, emoji: h.emoji || '', oldW: 0, oldL: 0, wins: 0, losses: 0 };
                    map[cn].wins += h.wins || 0;
                    map[cn].losses += h.losses || 0;
                });
            });
            data = Object.values(map).map(c => ({
                ...c,
                oldWr: c.oldW + c.oldL > 0 ? c.oldW / (c.oldW + c.oldL) * 100 : 0,
                newWr: c.wins + c.losses > 0 ? c.wins / (c.wins + c.losses) * 100 : 0
            })).map(c => ({ ...c, diff: c.newWr - c.oldWr }));
        } else if (currentTab === 'races') {
            const map = {};
            allChanges.forEach(c => {
                const rn = c.name.split('-')[0];
                if (!rn) return;
                if (!map[rn]) map[rn] = { display: rn, emoji: c.emoji, oldW: 0, oldL: 0, wins: 0, losses: 0 };
                map[rn].oldW += c.oldW; map[rn].oldL += c.oldL;
                map[rn].wins += c.wins; map[rn].losses += c.losses;
            });
            Object.values(window._oldArchive || {}).forEach(heroes => {
                heroes.forEach(h => {
                    const rn = (h.name || '').split('-')[0];
                    if (!rn) return;
                    if (!map[rn]) map[rn] = { display: rn, emoji: h.emoji || '', oldW: 0, oldL: 0, wins: 0, losses: 0 };
                    map[rn].oldW += h.wins || 0;
                    map[rn].oldL += h.losses || 0;
                });
            });
            Object.values(window._newArchive || {}).forEach(heroes => {
                heroes.forEach(h => {
                    const rn = (h.name || '').split('-')[0];
                    if (!rn) return;
                    if (!map[rn]) map[rn] = { display: rn, emoji: h.emoji || '', oldW: 0, oldL: 0, wins: 0, losses: 0 };
                    map[rn].wins += h.wins || 0;
                    map[rn].losses += h.losses || 0;
                });
            });
            data = Object.values(map).map(c => ({
                ...c,
                oldWr: c.oldW + c.oldL > 0 ? c.oldW / (c.oldW + c.oldL) * 100 : 0,
                newWr: c.wins + c.losses > 0 ? c.wins / (c.wins + c.losses) * 100 : 0
            })).map(c => ({ ...c, diff: c.newWr - c.oldWr }));
        }
        
        if (searchQuery) data = data.filter(d => (d.display || '').toLowerCase().includes(searchQuery));
        
        data.sort((a, b) => {
            let va = a[currentSort.key], vb = b[currentSort.key];
            if (typeof va === 'string') { va = va.toLowerCase(); vb = vb.toLowerCase(); return currentSort.dir === 'asc' ? va.localeCompare(vb) : vb.localeCompare(va); }
            va = va || 0; vb = vb || 0;
            return currentSort.dir === 'asc' ? va - vb : vb - va;
        });
        
        const tbody = document.getElementById('formTbody');
        if (!tbody) return;
        
        tbody.innerHTML = data.length === 0
            ? '<tr><td colspan="6" style="text-align:center;padding:20px;color:var(--muted);">Нет изменений за этот период</td></tr>'
            : data.map((c, i) => {
                const cls = c.diff > 0.5 ? 'up' : c.diff < -0.5 ? 'down' : '';
                const arrow = c.diff > 0.5 ? '📈' : c.diff < -0.5 ? '📉' : '';
                return `<tr style="animation-delay:${i*0.02}s">
                    <td>${c.emoji || '⚔️'} ${c.display || c.name}</td>
                    <td class="number">${c.oldW}-${c.oldL}</td>
                    <td class="number">${c.wins}-${c.losses}</td>
                    <td class="number">${c.oldWr.toFixed(1)}%</td>
                    <td class="number">${c.newWr.toFixed(1)}%</td>
                    <td class="number ${cls}">${arrow} ${c.diff > 0 ? '+' : ''}${c.diff.toFixed(1)}%</td>
                </tr>`;
            }).join('');
        
        document.querySelectorAll('#formTable th').forEach(th => {
            th.classList.remove('sort-active');
            if (th.dataset.sort === currentSort.key) th.classList.add('sort-active');
        });
    }

    function sortBy(key) {
        if (currentSort.key === key) currentSort.dir = currentSort.dir === 'asc' ? 'desc' : 'asc';
        else { currentSort.key = key; currentSort.dir = 'desc'; }
        renderTable();
    }
    function filterTable() { searchQuery = document.getElementById('formSearch')?.value.toLowerCase() || ''; renderTable(); }
    function switchTab(tab) { currentTab = tab; document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active')); event.target.classList.add('active'); renderTable(); }
    window.sortBy = sortBy;
    window.filterTable = filterTable;
    window.switchTab = switchTab;

    loadForm();
</script>
</body>
</html>
