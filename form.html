<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Форма</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="theme.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,600;14..32,800;14..32,900&display=swap" rel="stylesheet">
<style>
    html{overflow-y:scroll}
    .container{max-width:1300px}
    .top-bar{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:20px;flex-wrap:wrap}
    .meta-row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
    .meta-badge{padding:5px 10px;border-radius:6px;font-size:.68rem;font-weight:600;background:var(--elevated);border:1px solid var(--border);color:var(--sub);display:flex;align-items:center;gap:5px;white-space:nowrap}
    .meta-badge strong{color:var(--gold);font-weight:700}
    .tabs-segment{display:inline-flex;gap:0;flex-shrink:0;background:var(--card);border-radius:var(--radius-sm);border:1px solid var(--border);padding:3px}
    .tab-btn{padding:8px 18px;text-align:center;font-size:.76rem;font-weight:700;background:transparent;border:none;color:var(--sub);cursor:pointer;border-radius:calc(var(--radius-sm) - 2px);transition:all .2s;font-family:inherit;display:flex;align-items:center;gap:6px;white-space:nowrap}
    .tab-btn:hover{color:var(--text);background:var(--elevated)}
    .tab-btn.active{background:var(--gold);color:#0a0e17}
    .summary-row{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;margin-bottom:20px;border-radius:var(--radius-sm);overflow:hidden;background:var(--border)}
    .summary-item{background:var(--card);padding:16px 14px;text-align:center}
    .summary-item .value{font-size:1.4rem;font-weight:900;color:var(--gold);letter-spacing:-.02em}
    .summary-item .label{font-size:.62rem;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-top:2px;font-weight:700}
    .controls-row{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
    .search-box{flex:1;min-width:200px;position:relative}
    .search-box input{width:100%;padding:8px 14px 8px 36px;background:var(--elevated);border:1px solid var(--border);color:var(--text);border-radius:8px;font-family:inherit;font-size:.8rem;transition:all .2s}
    .search-box input:focus{outline:none;border-color:var(--gold)}
    .search-box .icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:.78rem;pointer-events:none}
    .chip{padding:7px 13px;border-radius:8px;font-size:.7rem;font-weight:600;background:var(--elevated);border:1px solid var(--border);color:var(--sub);cursor:pointer;white-space:nowrap;transition:all .15s;font-family:inherit}
    .chip:hover{border-color:var(--ice);color:var(--text)}
    .chip.active{background:rgba(91,192,235,0.12);border-color:var(--ice);color:var(--ice)}
    .table-shell{border-radius:var(--radius-sm);border:1px solid var(--border);overflow:hidden;background:var(--card)}
    .scroll-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
    table{width:100%;border-collapse:collapse;font-size:.76rem;min-width:650px}
    thead th{background:var(--bg);padding:11px 14px;text-align:left;font-size:.66rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);border-bottom:2px solid var(--border);white-space:nowrap;cursor:pointer;user-select:none;transition:color .15s}
    thead th:hover{color:var(--text)}
    thead th.sort-key{color:var(--gold)}
    thead th .arr{margin-left:3px;font-size:.5rem;opacity:0;transition:opacity .15s}
    thead th.sort-key .arr{opacity:1}
    thead th.num{text-align:right}
    tbody td{padding:9px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
    tbody tr:last-child td{border-bottom:none}
    tbody tr{transition:background .12s}
    tbody tr:hover td{background:rgba(255,255,255,0.012)}
    td.name-cell{font-weight:700}
    td.name-cell a{color:var(--text);text-decoration:none;transition:color .15s;display:flex;align-items:center;gap:7px}
    td.name-cell a:hover{color:var(--gold)}
    td.name-cell .em{font-size:1rem;flex-shrink:0}
    td.name-cell span{display:flex;align-items:center;gap:7px}
    td.num{text-align:right;font-variant-numeric:tabular-nums}
    td.wr-cell{font-weight:600}
    td.diff-cell{font-weight:700}
    td.diff-cell.up{color:var(--green)}
    td.diff-cell.down{color:var(--red)}
    tbody tr{animation:rowIn .25s ease forwards;opacity:0}
    @keyframes rowIn{to{opacity:1}}
    .empty-state{text-align:center;padding:44px 20px;color:var(--muted);font-size:.82rem}
    @media(max-width:768px){.top-bar{flex-direction:column;align-items:stretch;gap:10px}.tabs-segment{display:grid;grid-template-columns:repeat(3,1fr);width:100%}.tab-btn{justify-content:center;padding:9px 6px;font-size:.7rem}.summary-row{grid-template-columns:repeat(2,1fr)}.controls-row{flex-direction:column}.search-box{width:100%}table{font-size:.66rem;min-width:550px}thead th,tbody td{padding:7px 8px}}
</style>
</head>
<body>
<div class="container">
<header class="header"><h1 class="header-title">ФОРМА</h1><p class="header-subtitle">Динамика винрейтов за последние часы</p><button class="theme-toggle" onclick="toggleTheme()">🌓</button></header>
<div class="nav-wrapper"><button class="nav-toggle" onclick="toggleNav()">☰ Меню</button><nav class="nav-bar" id="pageNav"><div class="nav-group"><span class="nav-label">⚔️ Арена ▾</span><div class="nav-dropdown"><a href="index.html" class="nav-link">📊 Статистика</a><a href="dungeon.html" class="nav-link">🏔 Подземелье</a><a href="league.html" class="nav-link">🏟 Лига</a><a href="logs.html" class="nav-link">📜 Логи</a><a href="player.html" class="nav-link">👤 Профиль</a></div></div><div class="nav-group"><span class="nav-label">📐 Аналитика ▾</span><div class="nav-dropdown"><a href="balance.html" class="nav-link">⚖️ Баланс</a><a href="calc.html" class="nav-link">🎲 Калькулятор</a><a href="simulator.html" class="nav-link">🧪 Симулятор</a><a href="gradient.html" class="nav-link">📈 Градиент</a><a href="form.html" class="nav-link active">🔥 Форма</a></div></div><div class="nav-group"><span class="nav-label">🌍 Мир ▾</span><div class="nav-dropdown"><a href="guide.html" class="nav-link">⚔️ Гайд</a><a href="lore.html" class="nav-link">📜 Лор</a><a href="hall.html" class="nav-link">🏆 Зал Славы</a><a href="tavern.html" class="nav-link">🍺 Таверна</a></div></div></nav></div>
<main id="content"><div class="empty-state"><div class="spinner"></div><p style="margin-top:12px">Загрузка данных...</p></div></main>
</div>
<a href="https://www.donationalerts.com/r/rvotaenota" target="_blank" class="beer-btn" title="Поддержать">🍺</a>
<script>
function toggleTheme(){const h=document.documentElement,c=h.getAttribute('data-theme'),n=c==='dark'?'light':'dark';h.setAttribute('data-theme',n);localStorage.setItem('eternis-theme',n)}
(function(){const s=localStorage.getItem('eternis-theme');if(s)document.documentElement.setAttribute('data-theme',s)})()
function toggleNav(){const n=document.getElementById('pageNav'),b=document.querySelector('.nav-toggle');n.classList.toggle('show');b.textContent=n.classList.contains('show')?'✕ Закрыть':'☰ Меню'}
document.addEventListener('DOMContentLoaded',()=>{document.querySelectorAll('.nav-link').forEach(l=>l.addEventListener('click',()=>{document.getElementById('pageNav').classList.remove('show');document.querySelector('.nav-toggle').textContent='☰ Меню'}));document.querySelectorAll('.nav-label').forEach(l=>{l.addEventListener('click',function(e){if(window.innerWidth>768)return;e.preventDefault();const d=this.nextElementSibling;if(d&&d.classList.contains('nav-dropdown')){const o=d.style.display==='block';document.querySelectorAll('.nav-dropdown').forEach(x=>x.style.display='none');d.style.display=o?'none':'block'}})});})

const REPO='rvotaenotaTTV/dnd-stats',FILE='stats_data.json',CACHE_KEY='eternis-form-commits';
let allChanges=[],currentTab='players',currentSort={key:'diff',dir:'desc'},searchQuery='',filterMode='all';
let classEmojis={},raceEmojis={};

async function loadForm(){
    const c=document.getElementById('content');
    try{
        const dr=await fetch('https://cdn.jsdelivr.net/gh/rvotaenotaTTV/dnd-stats@main/data.json');
        if(dr.ok){const dd=await dr.json();(dd.classes||[]).forEach(x=>classEmojis[x.Name]=x.Emoji);(dd.races||[]).forEach(x=>raceEmojis[x.Name]=x.Emoji);}
    }catch(e){}
    try{
        let commits;const cached=JSON.parse(localStorage.getItem(CACHE_KEY)||'{}');
        if(cached.ts&&(Date.now()-cached.ts<3600000)){commits=cached.data}
        else{const[p1,p2]=await Promise.all([fetch(`https://api.github.com/repos/${REPO}/commits?path=${FILE}&per_page=30&page=1`).then(r=>r.json()),fetch(`https://api.github.com/repos/${REPO}/commits?path=${FILE}&per_page=30&page=2`).then(r=>r.json())]);commits=[...(Array.isArray(p1)?p1:[]),...(Array.isArray(p2)?p2:[])];localStorage.setItem(CACHE_KEY,JSON.stringify({ts:Date.now(),data:commits}));}
        if(!commits.length){c.innerHTML='<div class="empty-state">❌ Коммиты не найдены</div>';return;}
        const target=commits[commits.length-1];window._commitDate=new Date(target.commit.committer.date);window._hoursAgo=((new Date()-window._commitDate)/3600000).toFixed(1);window._sha=target.sha.substring(0,7);
        const[oldData,newData]=await Promise.all([fetch(`https://raw.githubusercontent.com/${REPO}/${target.sha}/${FILE}`).then(r=>r.json()),fetch(`https://raw.githubusercontent.com/${REPO}/main/${FILE}`).then(r=>r.json())]);
        const oldPlayers=(oldData.players||[]).filter(p=>p.name&&p.name!=='Unknown'),newPlayers=(newData.players||[]).filter(p=>p.name&&p.name!=='Unknown');
        window._oldArchive=oldData.heroArchive||{};window._newArchive=newData.heroArchive||{};
        allChanges=[];newPlayers.forEach(p=>{const old=oldPlayers.find(x=>x.display===p.display);if(!old||(old.wins===p.wins&&old.losses===p.losses))return;const ot=old.wins+old.losses,nt=p.wins+p.losses;allChanges.push({...p,oldWr:ot>0?old.wins/ot*100:0,newWr:nt>0?p.wins/nt*100:0,diff:(nt>0?p.wins/nt*100:0)-(ot>0?old.wins/ot*100:0),oldW:old.wins,oldL:old.losses,gamesAdded:nt-ot});});
        renderAll();
    }catch(e){c.innerHTML='<div class="empty-state">❌ Ошибка загрузки</div>';}
}

function getData(){
    let data=[];
    if(currentTab==='players'){data=[...allChanges];}
    else{
        const partIdx=currentTab==='classes'?1:0;const map={};
        const add=(name,ow,ol,w,l)=>{const key=(name||'').split('-')[partIdx];if(!key)return;if(!map[key])map[key]={display:key,oldW:0,oldL:0,wins:0,losses:0};map[key].oldW+=ow||0;map[key].oldL+=ol||0;map[key].wins+=w||0;map[key].losses+=l||0;};
        allChanges.forEach(c=>add(c.name,c.oldW,c.oldL,c.wins,c.losses));
        Object.values(window._oldArchive||{}).forEach(hh=>hh.forEach(h=>add(h.name,h.wins||0,h.losses||0,0,0)));
        Object.values(window._newArchive||{}).forEach(hh=>hh.forEach(h=>add(h.name,0,0,h.wins||0,h.losses||0)));
        data=Object.values(map).map(c=>{const ot=c.oldW+c.oldL,nt=c.wins+c.losses;const em=currentTab==='classes'?(classEmojis[c.display]||''):(raceEmojis[c.display]||'');return{...c,emoji:em,oldWr:ot>0?c.oldW/ot*100:0,newWr:nt>0?c.wins/nt*100:0,diff:(nt>0?c.wins/nt*100:0)-(ot>0?c.oldW/ot*100:0),gamesAdded:nt-ot};});
    }
    if(searchQuery)data=data.filter(d=>(d.display||'').toLowerCase().includes(searchQuery));
    if(filterMode==='up')data=data.filter(d=>d.diff>0.5);
    if(filterMode==='down')data=data.filter(d=>d.diff<-0.5);
    if(filterMode==='big')data=data.filter(d=>Math.abs(d.diff)>1);
    data.sort((a,b)=>{let va=a[currentSort.key],vb=b[currentSort.key];if(typeof va==='string'){va=va.toLowerCase();vb=vb.toLowerCase();return currentSort.dir==='asc'?va.localeCompare(vb):vb.localeCompare(va);}va=va||0;vb=vb||0;return currentSort.dir==='asc'?va-vb:vb-va;});
    return data;
}

function wrColor(v){return v>=55?'var(--green)':v>=48?'var(--gold)':v>=40?'var(--orange)':'var(--red)';}

function renderAll(){
    const info={date:window._commitDate,hours:window._hoursAgo,sha:window._sha};
    const gainers=allChanges.filter(c=>c.diff>0.5).length,losers=allChanges.filter(c=>c.diff<-0.5).length;
    const avgDiff=allChanges.length?allChanges.reduce((s,c)=>s+c.diff,0)/allChanges.length:0;
    const totalGames=allChanges.reduce((s,c)=>s+c.gamesAdded,0);
    const label=currentTab==='players'?'Игрок':currentTab==='classes'?'Класс':'Раса';
    let h='';
    h+='<div class="top-bar">';
    h+='<div class="tabs-segment">';
    h+=`<button class="tab-btn${currentTab==='players'?' active':''}" data-tab="players">👥 Игроки</button>`;
    h+=`<button class="tab-btn${currentTab==='classes'?' active':''}" data-tab="classes">⚔️ Классы</button>`;
    h+=`<button class="tab-btn${currentTab==='races'?' active':''}" data-tab="races">🌍 Расы</button>`;
    h+='</div>';
    h+='<div class="meta-row">';
    h+=`<div class="meta-badge">📅 <strong>${info.date.toLocaleString('ru-RU',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}</strong></div>`;
    h+=`<div class="meta-badge">⏱ <strong>${info.hours}ч</strong> назад</div>`;
    h+=`<div class="meta-badge">🔗 <strong>${info.sha}</strong></div>`;
    h+=`<div class="meta-badge">👥 <strong>${allChanges.length}</strong> изм.</div>`;
    h+='</div>';
    h+='</div>';
    h+='<div class="summary-row">';
    h+=`<div class="summary-item"><div class="value">${gainers}</div><div class="label">Растут</div></div>`;
    h+=`<div class="summary-item"><div class="value">${losers}</div><div class="label">Падают</div></div>`;
    h+=`<div class="summary-item"><div class="value">${avgDiff>0?'+':''}${avgDiff.toFixed(1)}%</div><div class="label">Средний Δ</div></div>`;
    h+=`<div class="summary-item"><div class="value">${totalGames}</div><div class="label">Новых игр</div></div>`;
    h+='</div>';
    h+='<div class="controls-row"><div class="search-box"><span class="icon">🔍</span><input type="text" id="formSearch" placeholder="Поиск..." autocomplete="off"></div>';
    h+=`<button class="chip${filterMode==='all'?' active':''}" data-filter="all">Все</button>`;
    h+=`<button class="chip${filterMode==='up'?' active':''}" data-filter="up">Растут</button>`;
    h+=`<button class="chip${filterMode==='down'?' active':''}" data-filter="down">Падают</button>`;
    h+=`<button class="chip${filterMode==='big'?' active':''}" data-filter="big">Значимые</button>`;
    h+='</div>';
    h+='<div class="section gold"><div class="table-shell"><div class="scroll-wrap"><table><thead><tr>';
    h+=`<th data-sort="display">${label}<span class="arr"> ▾</span></th>`;
    h+='<th data-sort="oldW" class="num">Было<span class="arr"> ▾</span></th>';
    h+='<th data-sort="wins" class="num">Стало<span class="arr"> ▾</span></th>';
    h+='<th data-sort="gamesAdded" class="num">Игр<span class="arr"> ▾</span></th>';
    h+='<th data-sort="oldWr" class="num">WR было<span class="arr"> ▾</span></th>';
    h+='<th data-sort="newWr" class="num">WR стало<span class="arr"> ▾</span></th>';
    h+='<th data-sort="diff" class="num">Δ<span class="arr"> ▾</span></th>';
    h+='</tr></thead><tbody id="formTbody"></tbody></table></div></div></div>';
    document.getElementById('content').innerHTML=h;
    document.getElementById('formSearch').value=searchQuery;
    document.getElementById('formSearch').addEventListener('input',function(){searchQuery=this.value.toLowerCase();renderTable();});
    document.querySelectorAll('.tab-btn').forEach(b=>b.addEventListener('click',function(){currentTab=this.dataset.tab;renderAll();}));
    document.querySelectorAll('.chip').forEach(b=>b.addEventListener('click',function(){filterMode=this.dataset.filter;renderAll();}));
    document.querySelectorAll('thead th[data-sort]').forEach(th=>{th.addEventListener('click',function(){const key=this.dataset.sort;if(currentSort.key===key)currentSort.dir=currentSort.dir==='asc'?'desc':'asc';else{currentSort.key=key;currentSort.dir='desc';}renderTable();});});
    renderTable();
}

function renderTable(){
    const data=getData(),tbody=document.getElementById('formTbody');
    if(!tbody)return;
    if(!data.length){tbody.innerHTML='<tr><td colspan="7" class="empty-state">Нет данных</td></tr>';return;}

    tbody.innerHTML=data.map((c,i)=>{
        const cls=c.diff>0.5?'up':c.diff<-0.5?'down':'';
        const arr=c.diff>0.5?'▲':c.diff<-0.5?'▼':'●';
        const em=c.emoji||'';
        const name=c.display||c.name;
        const nameHTML=currentTab==='players'&&c.display
            ?`<a href="player.html?name=${encodeURIComponent(c.display)}"><span class="em">${em}</span>${name}</a>`
            :`<span><span class="em">${em}</span>${name}</span>`;
        return`<tr style="animation-delay:${i*0.01}s">
            <td class="name-cell">${nameHTML}</td>
            <td class="num">${c.oldW}−${c.oldL}</td>
            <td class="num">${c.wins}−${c.losses}</td>
            <td class="num">${c.gamesAdded>0?'+':''}${c.gamesAdded}</td>
            <td class="num wr-cell" style="color:${wrColor(c.oldWr)}">${c.oldWr.toFixed(1)}%</td>
            <td class="num wr-cell" style="color:${wrColor(c.newWr)}">${c.newWr.toFixed(1)}%</td>
            <td class="num diff-cell ${cls}">${arr} ${c.diff>0?'+':''}${c.diff.toFixed(1)}%</td>
        </tr>`;
    }).join('');
    document.querySelectorAll('thead th').forEach(th=>th.classList.toggle('sort-key',th.dataset.sort===currentSort.key));
}

loadForm();
</script>
</body>
</html>
