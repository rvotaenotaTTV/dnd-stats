<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Профиль игрока</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="theme.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,600;14..32,800;14..32,900&display=swap" rel="stylesheet">
<style>
    .search-row{display:flex;gap:10px;margin-bottom:24px;align-items:center;flex-wrap:wrap}
    .search-input{padding:10px 16px;background:var(--elevated);border:1px solid var(--border);border-radius:20px;color:var(--text);font-size:.85rem;font-family:inherit;transition:.2s;width:100%}
    .search-input:focus{outline:none;border-color:var(--gold)}
    .search-input::placeholder{color:var(--muted)}
    .dropdown-wrap{position:relative;flex:1}
    .dropdown-list{display:none;position:absolute;top:100%;left:0;right:0;background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);max-height:200px;overflow-y:auto;z-index:10;margin-top:4px}
    .dropdown-item{padding:10px 16px;cursor:pointer;color:var(--text);font-size:.85rem;border-bottom:1px solid var(--border);transition:.2s}
    .dropdown-item:last-child{border-bottom:none}
    .dropdown-item:hover{background:var(--elevated);color:var(--gold)}
    .profile-hero{text-align:center;padding:20px 28px;margin-bottom:16px;animation:fadeSlideIn .4s ease}
    .profile-emoji{font-size:3rem;margin-bottom:4px}
    .profile-name{font-size:1.4rem;font-weight:800;color:var(--gold)}
    .profile-class{color:var(--sub);font-size:.85rem;margin-bottom:2px}
    .profile-badges{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:8px 0}
    .badge{padding:3px 10px;border-radius:15px;font-size:.65rem;font-weight:700}
    .badge-gold{background:var(--gold);color:#000}
    .badge-light{background:rgba(240,185,11,.15);color:var(--gold)}
    .badge-dark{background:rgba(163,113,247,.2);color:var(--purple)}
    .player-tabs{display:flex;gap:4px;margin:16px 0;padding:4px;background:var(--card);border-radius:var(--radius);border:1px solid var(--border)}
    .player-tab{padding:8px 14px;border:none;background:transparent;color:var(--sub);border-radius:14px;cursor:pointer;font-size:.78rem;font-weight:600;font-family:inherit;transition:.2s;white-space:nowrap;flex:1;text-align:center}
    .player-tab:hover{background:var(--elevated);color:var(--text)}
    .player-tab.active{background:var(--tab-active-bg);color:#000;font-weight:700}
    .player-tab-content{display:none}
    .player-tab-content.active{display:block}
    .stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px}
    .stat-card{background:var(--elevated);border-radius:var(--radius-sm);padding:12px 8px;text-align:center;border:1px solid var(--border);animation:fadeSlideIn .3s ease}
    .stat-num{font-size:1.3rem;font-weight:800;color:var(--gold)}
    .stat-label{font-size:.6rem;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-top:2px}
    .ranks-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px}
    .rank-card{background:var(--elevated);border-radius:var(--radius-sm);padding:12px 8px;text-align:center;border:1px solid var(--border);animation:fadeSlideIn .3s ease}
    .rank-pos{font-size:1.4rem;font-weight:800}
    .rank-label{font-size:.6rem;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-top:2px}
    .season-tabs{display:flex;gap:4px;margin:16px 0;flex-wrap:wrap;justify-content:center;background:var(--elevated);padding:3px;border-radius:20px;border:1px solid var(--border)}
    .season-tab{padding:6px 14px;border-radius:18px;font-size:.72rem;font-weight:600;cursor:pointer;border:none;background:transparent;color:var(--sub);font-family:inherit;transition:.2s;white-space:nowrap}
    .season-tab:hover{color:var(--text)}
    .season-tab.active{background:var(--gold);color:#000;font-weight:700;box-shadow:0 2px 6px rgba(240,185,11,.25)}
    .compare-bar{display:flex;gap:10px;align-items:center;margin-bottom:20px;padding:14px;background:var(--elevated);border-radius:var(--radius-sm);border:1px solid var(--border);flex-wrap:wrap}
    .compare-bar span{color:var(--sub);font-size:.85rem;white-space:nowrap}
    th,td{text-align:center}
    tr.best-hero td{background:rgba(240,185,11,.06)}
    tr.best-hero td:first-child::before{content:'⭐';margin-right:4px;font-size:.6rem}
    .td-better{color:var(--green)!important;font-weight:700}
    .td-worse{color:var(--red)!important}
    .compare-table th:first-child,.compare-table td:first-child{text-align:left;color:var(--muted);font-weight:500}
    #allFormerHeroes table{min-width:750px}
    #allFormerHeroes td{white-space:nowrap}
    .chart-placeholder{text-align:center;padding:20px;background:var(--elevated);border-radius:var(--radius-sm);border:1px dashed var(--border);margin-top:12px}
    .chart-loader{display:inline-block;width:24px;height:24px;border:2px solid var(--border);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite;margin-right:8px;vertical-align:middle}
    .ach-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
    .ach-card{background:var(--elevated);border-radius:var(--radius-sm);padding:12px 10px;text-align:center;border:1px solid var(--border)}
    .ach-card.earned{border-color:var(--gold)}
    .ach-card.locked{opacity:.6}
    .ach-emoji{font-size:1.8rem}
    .ach-name{color:var(--gold);font-weight:700;font-size:.8rem;margin:4px 0}
    .ach-progress{height:4px;background:var(--bg);border-radius:2px;margin-top:6px}
    .ach-fill{height:4px;background:var(--gold);border-radius:2px}
    tbody tr:nth-child(1){animation-delay:.02s}tbody tr:nth-child(2){animation-delay:.04s}tbody tr:nth-child(3){animation-delay:.06s}
    tbody tr:nth-child(4){animation-delay:.08s}tbody tr:nth-child(5){animation-delay:.1s}tbody tr:nth-child(6){animation-delay:.12s}
    tbody tr:nth-child(7){animation-delay:.14s}tbody tr:nth-child(8){animation-delay:.16s}tbody tr:nth-child(9){animation-delay:.18s}
    tbody tr:nth-child(10){animation-delay:.2s}tbody tr:nth-child(11){animation-delay:.22s}tbody tr:nth-child(12){animation-delay:.24s}
    tbody tr:nth-child(13){animation-delay:.26s}
    @media(max-width:768px){.stats-grid{grid-template-columns:repeat(2,1fr)}.ranks-grid{grid-template-columns:repeat(2,1fr)}.player-tabs{flex-wrap:wrap}.player-tab{font-size:.7rem;padding:6px 8px}.ach-grid{grid-template-columns:repeat(2,1fr)}}
</style>

<script>

function toggleTheme() {
    const h = document.documentElement;
    const c = h.getAttribute('data-theme');
    const n = c === 'dark' ? 'light' : 'dark';
    h.setAttribute('data-theme', n);
    localStorage.setItem('eternis-theme', n);
}
(function() {
    const s = localStorage.getItem('eternis-theme');
    if (s) document.documentElement.setAttribute('data-theme', s);
})();

function toggleNav() {
    const nav = document.getElementById('pageNav');
    const btn = document.querySelector('.nav-toggle');
    nav.classList.toggle('show');
    btn.textContent = nav.classList.contains('show') ? '✕ Закрыть' : '☰ Меню';
}
document.querySelectorAll('.nav-link').forEach(l => {
    l.addEventListener('click', () => {
        document.getElementById('pageNav').classList.remove('show');

});

// ==========================================

let seasonTop = [];

// ==========================================
// ЗАГРУЗКА ДАННЫХ
// ==========================================
async function loadData() {
    const urls = [
        'https://raw.githubusercontent.com/rvotaenotaTTV/dnd-stats/main/stats_data.json',
        'https://cdn.jsdelivr.net/gh/rvotaenotaTTV/dnd-stats@main/stats_data.json'
    ];
    for (const url of urls) {
        try {
            const r = await fetch(url);
            if (r.ok) {
                const d = await r.json();
                allPlayers = (d.players || []).filter(p => p.name && p.name !== 'Unknown');
                if (d.dungeon?.players) dungeonPlayers = d.dungeon.players;
                seasonTop = (d.players || []).filter(p => p.skill > 0).sort((a, b) => b.skill - a.skill).slice(0, 10);
                heroArchive = d.heroArchive || {};
                return;
            }
        } catch (e) {}
    }
}

// ==========================================
// ПОИСК ИГРОКА
// ==========================================
function findPlayer(name) {
    if (!name || !allPlayers.length) return null;
    const l = name.toLowerCase().trim();
    return allPlayers.find(p => p.display && p.display.toLowerCase() === l)
        || allPlayers.find(p => p.display && p.display.toLowerCase().includes(l))
        || null;
}

function filterPlayerList() {
    const i = document.getElementById('playerSearch');
    const d = document.getElementById('playerDropdown');
    const v = i.value.toLowerCase().trim();
    if (!v || !allPlayers.length) { d.style.display = 'none'; return; }
    const f = allPlayers.filter(x => x.display && x.display.toLowerCase().includes(v)).slice(0, 8);
    if (!f.length) { d.style.display = 'none'; return; }
    d.innerHTML = f.map(x => `<div class="dropdown-item" onclick="selectPlayer('${x.display.replace(/'/g,"\\'")}')">${x.emoji || '⚔️'} ${x.display}</div>`).join('');
    d.style.display = 'block';
}

function selectPlayer(n) {
    document.getElementById('playerSearch').value = n;
    document.getElementById('playerDropdown').style.display = 'none';
    loadProfile();
}

// ==========================================
// ПЕРЕКЛЮЧЕНИЕ ВКЛАДОК
// ==========================================
function switchTab(t) {
    document.querySelectorAll('.player-tab').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.player-tab-content').forEach(c => c.classList.remove('active'));
    const tabs = document.querySelectorAll('.player-tab');
    const labels = {
        current: '👤 Обзор',
        winrate: '📈 Винрейт',
        achievements: '🏅 Достижения',
        former: '👻 Бывшие',
        compare: '⚔️ Сравнить'
    };
    tabs.forEach(b => {
        if (b.textContent.trim() === labels[t]) b.classList.add('active');
    });
    const el = document.getElementById('ptab-' + t);
    if (el) el.classList.add('active');
    if (t === 'achievements') renderAchievements();
}

// ==========================================
// РЕНДЕР ПРОФИЛЯ
// ==========================================
function renderProfile(p) {
    if (!p) return '<div class="status-message">Игрок не найден</div>';
    currentProfileName = p.display;

    const total = (p.wins || 0) + (p.losses || 0);
    const wr = total > 0 ? (p.wins * 100 / total).toFixed(1) : '0.0';
    const faction = p.faction || '';
    const fi = faction === 'Орден Света' ? '🌝' : (faction === 'Культ Тьмы' ? '🌚' : '');
    const dungeon = dungeonPlayers[p.display];
    const col = n => n <= 3 ? 'var(--gold)' : n <= 10 ? 'var(--green)' : 'var(--muted)';

    // Ранги
    const sR = seasonTop.findIndex(s => s.display === p.display) + 1;
    const byWins = [...allPlayers].sort((a, b) => (b.wins || 0) - (a.wins || 0));
    const rW = byWins.findIndex(x => x.display === p.display) + 1;
    const byWR = [...allPlayers].filter(x => ((x.wins || 0) + (x.losses || 0)) >= 20).sort((a, b) => {
        const wa = (a.wins || 0) / ((a.wins || 0) + (a.losses || 0));
        const wb = (b.wins || 0) / ((b.wins || 0) + (b.losses || 0));
        return wb - wa;
    });
    const rWR = byWR.findIndex(x => x.display === p.display) + 1;
    const byShards = [...allPlayers].sort((a, b) => (b.shards || 0) - (a.shards || 0));
    const rS = byShards.findIndex(x => x.display === p.display) + 1;
    const byDungeon = allPlayers.map(x => ({display: x.display, record: dungeonPlayers[x.display]?.record || 0})).sort((a, b) => b.record - a.record);
    const rD = byDungeon.findIndex(x => x.display === p.display && x.record > 0) + 1;
    const byFaction = [...allPlayers].sort((a, b) => (b.factionWins || 0) - (a.factionWins || 0));
    const rF = byFaction.findIndex(x => x.display === p.display) + 1;

    let h = '';

    // Герой
    h += `<div class="section gold"><div class="profile-hero">`;
    h += `<div class="profile-emoji">${p.emoji || '⚔️'}</div>`;
    h += `<div class="profile-name">${p.display}${p.champion ? ' 👑' : ''}</div>`;
    h += `<div class="profile-class">${p.name || ''} · SKILL ${p.skill || 0} · Ур. ${p.level || 0}</div>`;
    h += `<div class="profile-badges">`;
    if (p.champion) h += '<span class="badge badge-gold">👑 Хранитель</span>';
    if (faction) h += `<span class="badge ${faction === 'Орден Света' ? 'badge-light' : 'badge-dark'}">${fi} ${faction}</span>`;
    if (sR > 0) h += `<span class="badge badge-light">🏆 Топ-${sR} сезона</span>`;
    h += `</div>`;
    h += `<button class="btn btn-secondary" onclick="copyProfileLink()">🔗 Копировать ссылку</button>`;
    h += `</div></div>`;

    // Вкладки
    h += '<div class="player-tabs">';
    h += '<button class="player-tab active" onclick="switchTab(\'current\')">👤 Обзор</button>';
    h += '<button class="player-tab" onclick="switchTab(\'winrate\')">📈 Винрейт</button>';
    h += '<button class="player-tab" onclick="switchTab(\'achievements\')">🏅 Достижения</button>';
    h += '<button class="player-tab" onclick="switchTab(\'former\')">👻 Бывшие</button>';
    h += '<button class="player-tab" onclick="switchTab(\'compare\')">⚔️ Сравнить</button>';
    h += '</div>';

    // Статистика
    h += '<div id="ptab-current" class="player-tab-content active"><div class="stats-grid">';
    h += `<div class="stat-card"><div class="stat-num">${p.wins || 0}</div><div class="stat-label">⚔️ Победы</div></div>`;
    h += `<div class="stat-card"><div class="stat-num">${p.losses || 0}</div><div class="stat-label">💀 Поражения</div></div>`;

    h += `<div class="rank-card"><div class="rank-pos" style="color:${col(rWR)}">#${rWR || '-'}</div><div class="rank-label">По винрейту</div></div>`;

    h += `<div class="rank-card"><div class="rank-pos" style="color:${col(rD)}">#${rD || '-'}</div><div class="rank-label">По данжу</div></div>`;
    h += `<div class="rank-card"><div class="rank-pos" style="color:${col(sR)}">#${sR || '-'}</div><div class="rank-label">Сезонный топ</div></div>`;
    h += `<div class="rank-card"><div class="rank-pos" style="color:${col(rF)}">#${rF || '-'}</div><div class="rank-label">По фракции</div></div>`;

    h += `<button class="btn btn-chart" onclick="drawWinrateChart('${p.display.replace(/'/g,"\\'")}')">📈 Показать график винрейта</button>`;
    h += '<div style="color:var(--muted);font-size:.7rem;margin-top:6px">Загружает историю из GitHub</div>';
    h += '</div></div>';

    // Достижения
    h += '<div id="ptab-achievements" class="player-tab-content">';
    h += '<div style="text-align:center;padding:40px;color:var(--sub)">Открой вкладку для загрузки</div>';
    h += '</div>';

    // Бывшие герои
    h += '<div id="ptab-former" class="player-tab-content">';
    h += '<div id="allFormerHeroes" style="min-height:200px"></div>';
    h += '</div>';

    // Сравнение
    h += '<div id="ptab-compare" class="player-tab-content">';
    h += '<div class="compare-bar"><span>⚔️ Сравнить с:</span>';
    h += '<div class="dropdown-wrap" style="flex:1;min-width:150px">';
    h += '<input type="text" class="search-input" id="compareInput" placeholder="Введи ник..." oninput="filterCompareList()" onkeydown="if(event.key===\'Enter\'){const n=document.getElementById(\'compareInput\').value.trim();if(n)compareWith(n)}">';
    h += '<div class="dropdown-list" id="compareDropdown"></div>';
    h += '</div></div><div id="compareResult"></div></div>';

    return h;
}

function renderAchievements() {
    const p = findPlayer(document.getElementById('playerSearch').value.trim());
    if (!p) return;

    const dp = dungeonPlayers[p.display];
    if (dp) { p.dr = dp.record; p.dt = dp.trophies; p.db = dp.bosses; p.dw = dp.totalWaves; }
    const total = p.wins + p.losses;

    const check = a => {
        if (a.m && total < a.m) return false;
        switch (a.t) {
            case "level": return p.level >= a.v;
            case "wins": return p.wins >= a.v;
            case "losses": return p.losses >= a.v;
            case "best": return p.best >= a.v;
            case "worst": return p.worst >= a.v;
            case "fights": return total >= a.v;
            case "tournament": return p.tournamentWins >= a.v;
            case "faction": return p.faction === a.f && p.factionWins >= a.v;
            case "winrate": return total > 0 && (p.wins * 100 / total) >= a.v;
            case "balance": return p.wins === p.losses && total >= (a.m || 20);
            case "champion": return p.champion === true;
            case "dungeon_record": return (p.dr || 0) >= a.v;
            case "dungeon_trophies": return (p.dt || 0) >= a.v;
            case "dungeon_bosses": return (p.db || 0) >= a.v;
            case "dungeon_waves": return (p.dw || 0) >= a.v;
            default: return false;
        }
    };

    const earned = ACH.filter(a => check(a));
    const locked = ACH.filter(a => !check(a));

    let h = `<div style="text-align:center;margin-bottom:16px">`;
    h += `<span style="font-size:2rem">🏅</span>`;
    h += `<div style="color:var(--gold);font-weight:700;font-size:1.1rem">${earned.length} / ${ACH.length} титулов</div>`;
    h += `<div style="background:var(--bg);height:8px;border-radius:4px;margin:8px 0">`;
    h += `<div style="background:var(--gold);height:8px;border-radius:4px;width:${(earned.length / ACH.length) * 100}%"></div>`;
    h += `</div></div>`;

    // Полученные
    if (earned.length) {
        h += `<div class="section gold"><div class="section-title">✅ Полученные (${earned.length})</div><div class="ach-grid">`;
        earned.forEach(a => {
            let condText = '';
            switch (a.t) {
                case "level": condText = a.v + ' уровень'; break;
                case "wins": condText = a.v + ' побед'; break;
                case "losses": condText = a.v + ' поражений'; break;
                case "best": condText = 'Стрик ' + a.v; break;
                case "worst": condText = 'Лузстрик ' + a.v; break;
                case "fights": condText = a.v + ' боёв'; break;
                case "tournament": condText = a.v + ' турнирных побед'; break;
                case "faction": condText = a.v + ' побед за ' + a.f; break;
                case "winrate": condText = 'Винрейт ' + a.v + '%'; break;
                case "dungeon_record": condText = a.v + ' волн в данже'; break;
                case "dungeon_trophies": condText = a.v + ' трофеев'; break;
                case "dungeon_bosses": condText = a.v + ' боссов'; break;
                case "dungeon_waves": condText = a.v + ' волн всего'; break;
                case "champion": condText = 'Текущий чемпион'; break;
                case "balance": condText = 'Побед = Поражений (20+ боёв)'; break;
            }
            h += `<div class="ach-card earned"><div class="ach-emoji">${a.e}</div><div class="ach-name">${a.n}</div><div style="font-size:.6rem;color:var(--muted)">${condText}</div></div>`;
        });
        h += '</div></div>';
    }

    // Не полученные
    if (locked.length) {
        h += `<div class="section"><div class="section-title">🔒 Не получены (${locked.length})</div><div class="ach-grid">`;
        locked.forEach(a => {
            let cur = 0, max = a.v || 0;
            let condText = '';
            switch (a.t) {
                case "level": cur = p.level; max = a.v; condText = a.v + ' уровень'; break;
                case "wins": cur = p.wins; max = a.v; condText = a.v + ' побед'; break;
                case "losses": cur = p.losses; max = a.v; condText = a.v + ' поражений'; break;
                case "best": cur = p.best; max = a.v; condText = 'Стрик ' + a.v; break;
                case "worst": cur = p.worst; max = a.v; condText = 'Лузстрик ' + a.v; break;
                case "fights": cur = total; max = a.v; condText = a.v + ' боёв'; break;
                case "tournament": cur = p.tournamentWins; max = a.v; condText = a.v + ' турнирных побед'; break;
                case "faction": cur = p.faction === a.f ? p.factionWins : 0; max = a.v; condText = a.v + ' побед за ' + a.f; break;
                case "winrate": cur = total > 0 ? parseFloat((p.wins * 100 / total).toFixed(1)) : 0; max = a.v; condText = 'Винрейт ' + a.v + '%'; break;
                case "dungeon_record": cur = p.dr || 0; max = a.v; condText = a.v + ' волн в данже'; break;
                case "dungeon_trophies": cur = p.dt || 0; max = a.v; condText = a.v + ' трофеев'; break;
                case "dungeon_bosses": cur = p.db || 0; max = a.v; condText = a.v + ' боссов'; break;
                case "dungeon_waves": cur = p.dw || 0; max = a.v; condText = a.v + ' волн всего'; break;
                case "champion": max = 1; condText = 'Текущий чемпион'; break;
                case "balance":
                    cur = total >= 20 ? 1 : 0;
                    max = 1;
                    condText = 'Побед = Поражений (20+ боёв) — ' + (p.wins || 0) + '/' + (p.losses || 0);
                    break;
            }
            const pct = Math.min(100, (cur / max) * 100);
            h += `<div class="ach-card locked">`;
            h += `<div class="ach-emoji">${a.e}</div>`;
            h += `<div class="ach-name">${a.n}</div>`;
            h += `<div style="font-size:.65rem;color:var(--muted)">${condText}</div>`;
            if (a.t !== 'balance' && a.t !== 'champion') {
                h += `<div style="font-size:.65rem;color:var(--muted)">${cur}/${max}</div>`;
                h += `<div class="ach-progress"><div class="ach-fill" style="width:${pct}%"></div></div>`;
            }
            h += `</div>`;
        });
        h += '</div></div>';
    }

    document.getElementById('ptab-achievements').innerHTML = h;
}

// ==========================================
// ГРАФИК ВИНРЕЙТА
// ==========================================
function drawWinrateChart(playerName) {
    const container = document.getElementById('ptab-winrate');
    if (!container) return;
    container.innerHTML = '<div class="chart-placeholder"><span class="chart-loader"></span> Загрузка...</div>';

    (async () => {
        try {
            const player = allPlayers.find(p => p.display === playerName);
            if (!player) { container.innerHTML = ''; return; }

            const pages = await Promise.all([1, 2, 3, 4, 5, 6].map(p =>
                fetch(`https://api.github.com/repos/rvotaenotaTTV/dnd-stats/commits?path=stats_data.json&per_page=30&page=${p}`).then(r => r.json())
            ));
            const allCommits = pages.flat().filter(c => c && c.sha);
            if (allCommits.length < 5) {
                container.innerHTML = '<div class="chart-placeholder">⚠️ Недостаточно истории</div>';
                return;
            }

            const now = Date.now();
            const step = Math.floor(allCommits.length / 4);
            const sc = [allCommits[allCommits.length - 1], allCommits[allCommits.length - 1 - step], allCommits[Math.floor(allCommits.length / 2)], allCommits[step], null];
            const oldSlices = await Promise.all(sc.slice(0, 4).map(c =>
                fetch(`https://raw.githubusercontent.com/rvotaenotaTTV/dnd-stats/${c.sha}/stats_data.json`).then(r => r.json())
            ));

            const points = [], labels = [];
            oldSlices.forEach((data, i) => {
                const p = (data.players || []).find(x => x.display === playerName);
                if (p) {
                    const t = (p.wins || 0) + (p.losses || 0);
                    const wr = t > 0 ? (p.wins / t * 100) : 0;
                    points.push(wr);
                    labels.push(`${Math.round((now - new Date(sc[i].commit.committer.date).getTime()) / 3600000)}ч`);
                }
            });
            const t = (player.wins || 0) + (player.losses || 0);
            const wr = t > 0 ? (player.wins / t * 100) : 0;
            points.push(wr);
            labels.push('Сейчас');

            if (points.length < 3) {
                container.innerHTML = '<div class="chart-placeholder">⚠️ Недостаточно данных</div>';
                return;
            }

            const W = 600, H = 200, P = 50;
            const minW = Math.min(...points) - 2;
            const maxW = Math.max(...points) + 2;
            const range = maxW - minW || 1;
            const gX = i => P + (W - P * 2) * i / (points.length - 1);
            const gY = v => H - P - ((v - minW) / range) * (H - P * 2);

            let svgP = points.map((p, i) => `${gX(i)},${gY(p)}`).join(' ');
            let circ = points.map((p, i) => {
                const col = i === points.length - 1 ? (p >= points[0] ? '#10b981' : '#ef4444') : '#f0b90b';
                return `<circle cx="${gX(i)}" cy="${gY(p)}" r="6" fill="var(--card)" stroke="${col}" stroke-width="2.5"/>`;
            }).join('');
            let txt = points.map((p, i) => `<text x="${gX(i)}" y="${gY(p) - 14}" text-anchor="middle" fill="#f0b90b" font-size="11" font-weight="700">${p.toFixed(1)}%</text>`).join('');
            let bl = labels.map((l, i) => `<text x="${gX(i)}" y="${H - 8}" text-anchor="middle" fill="#8a94a8" font-size="10">${l}</text>`).join('');
            const diff = points[points.length - 1] - points[0];
            const ds = diff >= 0 ? `+${diff.toFixed(1)}%` : `${diff.toFixed(1)}%`;
            const dc = diff >= 0 ? 'var(--green)' : 'var(--red)';

            container.innerHTML = `<div class="section gold" style="padding:18px">
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
                    <div class="section-title" style="font-size:.9rem;margin:0">📈 Динамика винрейта</div>
                    <button class="btn btn-secondary" style="font-size:.7rem;padding:4px 10px" onclick="this.closest('#ptab-winrate').innerHTML='<div class=\\'chart-placeholder\\'><button class=\\'btn btn-chart\\' onclick=\\'drawWinrateChart(\\'${playerName.replace(/'/g,"\\\\'")}\\')\\'>📈 Показать график винрейта</button></div>'">✕ Скрыть</button>
                </div>
                <div style="text-align:center;margin-bottom:4px;font-size:.8rem;color:var(--sub)">
                    ${points[0].toFixed(1)}% → <span style="color:${dc};font-weight:700">${points[points.length - 1].toFixed(1)}% (${ds})</span>
                </div>
                <svg width="100%" height="${H}" viewBox="0 0 ${W} ${H}" style="display:block">
                    <polygon points="${gX(0)},${H - P} ${svgP} ${gX(points.length - 1)},${H - P}" fill="rgba(240,185,11,0.06)"/>
                    <polyline points="${svgP}" fill="none" stroke="#f0b90b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                    ${circ}${txt}${bl}
                </svg>
            </div>`;
        } catch (e) {
            container.innerHTML = '<div class="chart-placeholder" style="color:var(--red)">❌ Ошибка</div>';
        }
    })();
}

// СРАВНЕНИЕ
// ==========================================
function renderCompare(p1, p2) {
    if (!p1 || !p2) return '';
    const d1 = dungeonPlayers[p1.display];
    const d2 = dungeonPlayers[p2.display];
    const rows = [
        ['Победы', p1.wins || 0, p2.wins || 0, true],
        ['Поражения', p1.losses || 0, p2.losses || 0, false],
        ['Винрейт', ((p1.wins || 0) / ((p1.wins || 0) + (p1.losses || 0) || 1) * 100).toFixed(1) + '%', ((p2.wins || 0) / ((p2.wins || 0) + (p2.losses || 0) || 1) * 100).toFixed(1) + '%', true],
        ['SKILL', p1.skill || 0, p2.skill || 0, true],
        ['Всего боёв', (p1.wins || 0) + (p1.losses || 0), (p2.wins || 0) + (p2.losses || 0), true],
        ['Лучший стрик', p1.best || 0, p2.best || 0, true],
        ['Осколки', p1.shards || 0, p2.shards || 0, true],
        ['Уровень', p1.level || 0, p2.level || 0, true],
        ['Турниры', p1.tournamentWins || 0, p2.tournamentWins || 0, true],
        ['Рекорд данжа', d1 ? d1.record : '-', d2 ? d2.record : '-', true]
    ];
    let tbl = '<div class="table-container"><table class="compare-table"><thead><tr><th>Стат</th><th>' + p1.display + '</th><th>' + p2.display + '</th></tr></thead><tbody>';
    rows.forEach(([l, v1, v2, hb]) => {
        let c1 = '', c2 = '';
        if (typeof v1 === 'number' && typeof v2 === 'number') {
            if (v1 > v2) { c1 = hb ? 'td-better' : 'td-worse'; c2 = hb ? 'td-worse' : 'td-better'; }
            else if (v2 > v1) { c1 = hb ? 'td-worse' : 'td-better'; c2 = hb ? 'td-better' : 'td-worse'; }
        }
        tbl += `<tr><td>${l}</td><td class="${c1}">${v1}</td><td class="${c2}">${v2}</td></tr>`;
    });
    tbl += '</tbody></table></div>';
    return tbl;
}

function compareWith(n) {
    const p1 = findPlayer(document.getElementById('playerSearch').value.trim());
    const p2 = findPlayer(n);
    document.getElementById('compareResult').innerHTML = p2 ? renderCompare(p1, p2) : '';
}

function filterCompareList() {
    const i = document.getElementById('compareInput');
    const d = document.getElementById('compareDropdown');
    if (!i) return;
    const v = i.value.toLowerCase().trim();
    if (!v || !allPlayers.length) { d.style.display = 'none'; return; }
    const f = allPlayers.filter(x => x.display && x.display.toLowerCase().includes(v)).slice(0, 8);
    if (!f.length) { d.style.display = 'none'; return; }
    d.innerHTML = f.map(x => `<div class="dropdown-item" onclick="selectCompare('${x.display.replace(/'/g,"\\'")}')">${x.emoji || '⚔️'} ${x.display}</div>`).join('');
    d.style.display = 'block';
}

function selectCompare(n) {
    document.getElementById('compareInput').value = n;
    document.getElementById('compareDropdown').style.display = 'none';
    compareWith(n);
}

function copyProfileLink() {
    const n = document.getElementById('playerSearch').value.trim();
    if (!n) return;
    const url = `${window.location.origin}${window.location.pathname}?name=${encodeURIComponent(n)}`;
    navigator.clipboard.writeText(url).then(() => {
        const btn = document.querySelector('.btn-secondary');
        if (!btn) return;
        btn.innerHTML = '✅ Скопировано!';
        btn.style.background = 'var(--green)';
        btn.style.color = '#fff';
        btn.style.borderColor = 'var(--green)';
        setTimeout(() => {
            btn.innerHTML = '🔗 Копировать ссылку';
            btn.style.background = '';
            btn.style.color = '';
            btn.style.borderColor = '';
        }, 2000);
    });
}

async function loadProfile() {
    if (!allPlayers.length) await loadData();
    const p = findPlayer(document.getElementById('playerSearch').value.trim());
    document.getElementById('profileContent').innerHTML = p ? renderProfile(p) : '<div class="status-message">Игрок не найден</div>';
    if (p) {
        renderAchievements();
        setTimeout(() => loadAllSeasons(p.display), 200);
    }
}

loadData().then(() => {
    const p = new URLSearchParams(window.location.search);
    const n = p.get('name');
    if (n) {
        document.getElementById('playerSearch').value = n;
        loadProfile();
    }
});

// БЫВШИЕ ГЕРОИ
// ==========================================
let cachedAllHeroes = [];
let currentSeasonFilter = 'all';
window._seasonNames = [];

// Иконки для сезонов
const SEASON_ICONS = ['🏁','🔥','💫','🩸','🕯️','⚡','💀','👑'];

async function loadAllSeasons(playerName) {
    const container = document.getElementById('allFormerHeroes');
    if (!container) return;

    const archive = heroArchive || {};
    cachedAllHeroes = [];
    const seen = new Set();
    const pk = playerName.toLowerCase();

    // Текущие бывшие герои из heroArchive
    const ca = archive[pk] || [];
    const cdp = dungeonPlayers[pk] || null;
    const cpd = allPlayers.find(p => p.display?.toLowerCase() === pk);

    ca.forEach(h => {
        const id = `c-${h.name}-${h.wins}-${h.losses}`;
        if (!seen.has(id)) {
            seen.add(id);
            cachedAllHeroes.push({
                ...h,
                level: cpd?.level || h.level || 0,
                record: cdp?.record || h.record || 0,
                season: `${SEASON_ICONS[999] || '📋'} Текущий`,
                seasonIndex: 999,
                isCurrent: true
            });
        }
    });

    // Архивные сезоны
    const sn = [];
    let sii = 0;

    while (sii < 20) {
        const fn = `season_${sii}.json`;
        let data = null;
        try {
            const r = await fetch(`https://raw.githubusercontent.com/rvotaenotaTTV/dnd-stats/main/seasons/${fn}`);
            if (!r.ok) break;
            data = await r.json();
        } catch (e) {
            break;
        }

        const icon = SEASON_ICONS[sii] || '📋';
        sn[sii] = `${icon} Сезон ${sii}`;

        // Игрок в players этого сезона
        const player = data.players?.find(p => p.display?.toLowerCase() === pk);
        if (player && player.name && player.name !== 'Unknown') {
            const id = `s${sii}-${player.name}`;
            if (!seen.has(id)) {
                seen.add(id);
                const sd = data.dungeon?.players?.[pk] || null;
                cachedAllHeroes.push({
                    name: player.name,
                    emoji: player.emoji || '',
                    wins: player.wins || 0,
                    losses: player.losses || 0,
                    best: player.best || 0,
                    worst: player.worst || 0,
                    tournamentWins: player.tournamentWins || 0,
                    level: player.level || 0,
                    record: sd?.record || 0,
                    season: sn[sii],
                    seasonIndex: sii,
                    isCurrent: false
                });
            }
        }

        // Игрок в heroArchive этого сезона
        const arch = data.heroArchive?.[pk];
        if (arch) {
            arch.forEach(h => {
                const id = `s${sii}-a-${h.name}-${h.wins}-${h.losses}`;
                if (!seen.has(id)) {
                    seen.add(id);
                    cachedAllHeroes.push({
                        ...h,
                        level: h.level || 0,
                        record: h.record || 0,
                        season: sn[sii],
                        seasonIndex: sii,
                        isCurrent: false
                    });
                }
            });
        }

        sii++;
    }

    // Обновляем текущий сезон: теперь sii = количество архивных сезонов = номер текущего
    const currentIcon = SEASON_ICONS[sii] || '📋';
    const currentSeasonName = `${currentIcon} Сезон ${sii}`;
    sn[sii] = currentSeasonName;

    cachedAllHeroes.forEach(h => {
        if (h.isCurrent) {
            h.seasonIndex = sii;
            h.season = currentSeasonName;
        }
    });

    if (cachedAllHeroes.length === 0) {
        container.innerHTML = '';
        return;
    }

    // Лучший герой в каждом сезоне
    const MFB = 10;
    const bps = {};
    cachedAllHeroes.forEach(h => {
        const t = h.wins + h.losses;
        if (t < MFB) return;
        const wr = t > 0 ? h.wins / t : 0;
        if (!bps[h.seasonIndex]) {
            bps[h.seasonIndex] = { wr, t, name: h.name };
        } else {
            const c = bps[h.seasonIndex];
            if (wr > c.wr || (wr === c.wr && t > c.t)) {
                bps[h.seasonIndex] = { wr, t, name: h.name };
            }
        }
    });

    const bns = {};
    for (const [si, data] of Object.entries(bps)) {
        bns[si] = data.name;
    }

    cachedAllHeroes.forEach(h => {
        h.isBest = (bns[h.seasonIndex] === h.name) && ((h.wins + h.losses) >= MFB);
    });

    window._seasonNames = sn;
    currentSeasonFilter = 'all';
    renderSeasonView(playerName);
}

function renderSeasonView(playerName) {
    const container = document.getElementById('allFormerHeroes');
    if (!container || cachedAllHeroes.length === 0) return;

    const sn = window._seasonNames || [];
    const asi = [...new Set(cachedAllHeroes.map(h => h.seasonIndex))].sort((a, b) => a - b);
    let filtered = cachedAllHeroes;
    if (currentSeasonFilter !== 'all') {
        filtered = cachedAllHeroes.filter(h => h.seasonIndex === parseInt(currentSeasonFilter));
    }

    const totals = { wins: 0, losses: 0, best: 0, worst: 0, tournaments: 0, maxLevel: 0, maxRecord: 0 };
    filtered.forEach(h => {
        totals.wins += h.wins || 0;
        totals.losses += h.losses || 0;
        if ((h.best || 0) > totals.best) totals.best = h.best || 0;
        if ((h.worst || 0) > totals.worst) totals.worst = h.worst || 0;
        totals.tournaments += h.tournamentWins || 0;
        if ((h.level || 0) > totals.maxLevel) totals.maxLevel = h.level || 0;
        if ((h.record || 0) > totals.maxRecord) totals.maxRecord = h.record || 0;
    });
    const tf = totals.wins + totals.losses;
    const twr = tf > 0 ? (totals.wins * 100 / tf).toFixed(1) : '0';
    const hc = filtered.length;

    let h = '';
    h += `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">`;
    h += `<h3 style="color:var(--gold);margin:0;">👻 Бывшие герои</h3>`;
    h += `<span style="color:var(--muted);font-size:0.75rem;">${cachedAllHeroes.length} всего</span>`;
    h += `</div>`;

    // Сводка
    h += '<div style="display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;">';
    h += `<div style="flex:1;min-width:60px;background:var(--elevated);border-radius:var(--radius-sm);padding:8px;text-align:center;border:1px solid var(--border);"><div style="font-size:1rem;font-weight:800;color:var(--gold);">${hc}</div><div style="font-size:0.55rem;color:var(--muted);">Героев</div></div>`;
    h += `<div style="flex:1;min-width:60px;background:var(--elevated);border-radius:var(--radius-sm);padding:8px;text-align:center;border:1px solid var(--border);"><div style="font-size:1rem;font-weight:800;color:var(--gold);">${totals.wins}</div><div style="font-size:0.55rem;color:var(--muted);">Побед</div></div>`;
    h += `<div style="flex:1;min-width:60px;background:var(--elevated);border-radius:var(--radius-sm);padding:8px;text-align:center;border:1px solid var(--border);"><div style="font-size:1rem;font-weight:800;color:var(--gold);">${twr}%</div><div style="font-size:0.55rem;color:var(--muted);">WR</div></div>`;
    h += `<div style="flex:1;min-width:60px;background:var(--elevated);border-radius:var(--radius-sm);padding:8px;text-align:center;border:1px solid var(--border);"><div style="font-size:1rem;font-weight:800;color:var(--gold);">${totals.best}</div><div style="font-size:0.55rem;color:var(--muted);">🔥 Стрик</div></div>`;
    h += `<div style="flex:1;min-width:60px;background:var(--elevated);border-radius:var(--radius-sm);padding:8px;text-align:center;border:1px solid var(--border);"><div style="font-size:1rem;font-weight:800;color:var(--gold);">${totals.tournaments}</div><div style="font-size:0.55rem;color:var(--muted);">👑 Тур.</div></div>`;
    h += `<div style="flex:1;min-width:60px;background:var(--elevated);border-radius:var(--radius-sm);padding:8px;text-align:center;border:1px solid var(--border);"><div style="font-size:1rem;font-weight:800;color:var(--gold);">${totals.maxLevel}</div><div style="font-size:0.55rem;color:var(--muted);">📈 Ур.</div></div>`;
    h += `<div style="flex:1;min-width:60px;background:var(--elevated);border-radius:var(--radius-sm);padding:8px;text-align:center;border:1px solid var(--border);"><div style="font-size:1rem;font-weight:800;color:var(--gold);">${totals.maxRecord || '-'}</div><div style="font-size:0.55rem;color:var(--muted);">🏔 Волн</div></div>`;
    h += '</div>';

    // Фильтр сезонов
    h += '<div class="season-tabs">';
    h += `<button class="season-tab ${currentSeasonFilter === 'all' ? 'active' : ''}" onclick="setSeasonFilter('all')">📋 Все</button>`;
    asi.forEach(si => {
        const name = sn[si] || cachedAllHeroes.find(h => h.seasonIndex === si)?.season || 'Сезон ' + si;
        h += `<button class="season-tab ${currentSeasonFilter === String(si) ? 'active' : ''}" onclick="setSeasonFilter('${si}')">${name}</button>`;
    });
    h += '</div>';

    // Карточки героев
    let sorted = [...filtered].sort((a, b) => b.seasonIndex - a.seasonIndex);
    h += '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;margin-top:12px;">';
    sorted.forEach(hh => {
        const t = (hh.wins || 0) + (hh.losses || 0);
        const wr = t > 0 ? (hh.wins * 100 / t).toFixed(1) : '0.0';
        const wrNum = parseFloat(wr);
        const wrColor = wrNum >= 55 ? 'var(--green)' : wrNum >= 45 ? 'var(--gold)' : 'var(--red)';
        const wrBg = wrNum >= 55 ? 'rgba(16,185,129,0.1)' : wrNum >= 45 ? 'rgba(240,185,11,0.1)' : 'rgba(232,93,58,0.1)';

        h += `<div style="background:var(--elevated);border-radius:var(--radius);padding:0;border:1px solid ${hh.isBest ? 'var(--gold)' : 'var(--border)'};overflow:hidden;transition:0.2s;${hh.isBest ? 'box-shadow:0 0 16px rgba(240,185,11,0.15);' : ''}">`;
        h += `<div style="padding:14px 14px 10px 14px;text-align:center;">`;
        h += `<div style="font-size:2.5rem;line-height:1;margin-bottom:6px;">${hh.emoji || '⚔️'}</div>`;
        h += `<div style="color:var(--gold);font-weight:700;font-size:0.85rem;margin-bottom:2px;">${hh.name || ''}${hh.isBest ? ' ⭐' : ''}</div>`;
        h += `<div style="color:var(--muted);font-size:0.65rem;margin-bottom:8px;">${hh.season}</div>`;
        h += `<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;text-align:center;font-size:0.7rem;margin-bottom:8px;">`;
        h += `<div style="background:var(--bg);border-radius:8px;padding:6px 4px;"><div style="color:var(--muted);font-size:0.55rem;">⚔️ Бои</div><div style="color:var(--text);font-weight:600;">${hh.wins || 0}<span style="color:var(--muted);">/</span>${hh.losses || 0}</div></div>`;
        h += `<div style="background:${wrBg};border-radius:8px;padding:6px 4px;"><div style="color:var(--muted);font-size:0.55rem;">📊 WR</div><div style="color:${wrColor};font-weight:700;">${wr}%</div></div>`;
        h += `<div style="background:var(--bg);border-radius:8px;padding:6px 4px;"><div style="color:var(--muted);font-size:0.55rem;">🔥 Стрик</div><div style="color:var(--text);font-weight:600;">${hh.best || 0}</div></div>`;
        h += `</div></div>`;
        h += `<div style="display:flex;justify-content:space-around;padding:8px 14px;background:var(--bg);font-size:0.6rem;color:var(--muted);border-top:1px solid var(--border);">`;
        h += `<span>📈 Ур.${hh.level || 0}</span>`;
        h += `${hh.record ? `<span>🏔 ${hh.record} волн</span>` : `<span></span>`}`;
        h += `<span>👑 ${hh.tournamentWins || 0}</span>`;
        h += `</div></div>`;
    });
    h += '</div>';

    container.innerHTML = h;
}

function setSeasonFilter(si) {
    currentSeasonFilter = si;
    renderSeasonView(currentProfileName);
}

// Экспорт функций в глобальную область
window.switchTab = switchTab;
window.setSeasonFilter = setSeasonFilter;
window.filterCompareList = filterCompareList;
window.selectCompare = selectCompare;
window.drawWinrateChart = drawWinrateChart;

// Мобильная навигация
document.querySelectorAll('.nav-label').forEach(label => {
    label.addEventListener('click', function(e) {
        if (window.innerWidth > 768) return;
        e.preventDefault();
        const dd = this.nextElementSibling;
        if (dd && dd.classList.contains('nav-dropdown')) {
            const isOpen = dd.style.display === 'block';
            document.querySelectorAll('.nav-dropdown').forEach(d => d.style.display = 'none');
            dd.style.display = isOpen ? 'none' : 'block';
        }
    });
});
</script>
</body>
