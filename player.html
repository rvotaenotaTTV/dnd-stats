// --- 7.1 Карточка игрока ---
function renderPlayerInfo(player, ranks) {
    const fc = player.faction === 'Орден Света' ? 'light' : player.faction === 'Культ Тьмы' ? 'dark' : '';
    const fe = player.faction === 'Орден Света' ? '🌝' : player.faction === 'Культ Тьмы' ? '🌚' : '';
    const badges = [];
    if (player.champion) badges.push('<span class="badge badge-gold">👑 Хранитель</span>');
    if (player.faction) badges.push(`<span class="badge ${fc === 'light' ? 'badge-light' : 'badge-dark'}">${fe} ${player.faction}</span>`);
    if (ranks && ranks.season > 0 && ranks.season <= 10) badges.push(`<span class="badge badge-light">🏆 Топ-${ranks.season} сезона</span>`);

    return `<section class="oracle-block gold" style="padding:0;overflow:hidden;">
        <div class="profile-hero">
            <div class="profile-emoji">${player.emoji || '⚔️'}</div>
            <div class="profile-name">${player.display}${player.champion ? ' 👑' : ''}</div>
            <div class="profile-class">${player.name || ''} · SKILL ${player.skill || 0} · Ур. ${player.level || 0}</div>
            <div class="profile-badges">${badges.join('')}</div>
            <button class="btn btn-secondary" onclick="copyProfileLink()">🔗 Копировать ссылку</button>
        </div>
    </section>`;
}

// --- 7.3 Обзор (статы + ранги + летопись + нарратив) ---
function renderOverviewTab(history, last, ranks, narrative) {
    const total = last.total;
    const winrate = (last.wr * 100).toFixed(1);
    const dungeon = last.dungeon;

    const stats = [
        { value: last.wins || 0, label: '⚔️ Победы' },
        { value: last.losses || 0, label: '💀 Поражения' },
        { value: winrate + '%', label: '📊 Винрейт' },
        { value: last.tournamentWins || 0, label: '👑 Турниры' },
        { value: total, label: '⚡ Всего боёв' },
        { value: last.best || 0, label: '🔥 Лучший стрик' },
        { value: last.worst || 0, label: '💔 Худший стрик' },
        { value: last.factionWins || 0, label: '🌍 Фракц. победы' },
        { value: last.level || 0, label: '📈 Уровень' },
        { value: last.shards || 0, label: '💎 Осколки' },
        { value: dungeon ? dungeon.record : '-', label: '🏔 Рекорд данжа' },
        { value: dungeon ? dungeon.trophies : '-', label: '🐉 Трофеев' }
    ];

    const rankList = [
        { rank: ranks.season, label: 'По SKILL' },
        { rank: ranks.wins, label: 'По победам' },
        { rank: ranks.winrate, label: 'По винрейту' },
        { rank: ranks.faction, label: 'По фракц. победам' },
        { rank: ranks.shards, label: 'По осколкам' },
        { rank: ranks.dungeon, label: 'По данжу' }
    ];
    const colorForRank = (rank) => rank <= 3 ? 'var(--gold)' : rank <= 10 ? 'var(--green)' : 'var(--muted)';

    let html = `<div id="tab-overview" class="tab-content active">`;

    html += `<div class="oracle-block gold"><div class="oracle-block-title">📜 Текущий сезон</div>`;

    html += `<div class="stats-grid">
        ${stats.map(s => `
            <div class="stat-card">
                <div class="stat-num">${s.value}</div>
                <div class="stat-label">${s.label}</div>
            </div>
        `).join('')}
    </div>`;

    html += `<div class="ranks-grid">
        ${rankList.map(r => `
            <div class="rank-card">
                <div class="rank-pos" style="color:${colorForRank(r.rank)}">#${r.rank || '-'}</div>
                <div class="rank-label">${r.label}</div>
            </div>
        `).join('')}
    </div>`;

    html += `</div>`;

    html += renderHistory(history, 5);
    html += renderVoice(narrative);
    html += '</div>';
    return html;
}

// --- 7.4 История (краткая таблица) ---
function renderHistory(history, limit = null) {
    const filtered = history.filter(h => !h.isDeleted);
    if (filtered.length === 0) return '';
    const list = limit ? filtered.slice(-limit) : filtered;

    let html = '<div class="oracle-block"><div class="oracle-block-title">📜 ' + (limit ? 'Последние ' + limit + ' сезонов' : 'Летопись') + '</div><div class="table-container"><table class="history-table"><thead><tr><th>Сезон</th><th class="num">W/L</th><th class="num">WR</th><th class="num">Ур.</th><th class="num">🏆</th></tr></thead><tbody>';

    list.forEach(h => {
        const wrC = wrColor(h.wr);
        const tourColor = h.tournamentWins > 0 ? 'var(--gold)' : 'var(--muted)';
        const tourIcon = h.tournamentWins >= 5 ? '🔥' : (h.tournamentWins > 0 ? '🏆' : '');
        const eraIcon = h.era === 'classic' ? ' 📜' : '';
        html += `<tr class="${h.isCurrent ? 'current' : ''}">
            <td class="season-num" data-label="Сезон">S${h.season}${h.isCurrent ? ' ⚡' : ''}${eraIcon}</td>
            <td class="num" data-label="W/L">${h.wins}-${h.losses}</td>
            <td class="num wr-cell" data-label="WR" style="color:${wrC};">${(h.wr * 100).toFixed(1)}%</td>
            <td class="num" data-label="Ур.">${h.level}</td>
            <td class="num" data-label="🏆" style="color:${tourColor};font-weight:${h.tournamentWins > 0 ? '700' : '400'};">${h.tournamentWins ? h.tournamentWins + ' ' + tourIcon : '—'}</td>
        </tr>`;
    });

	const totalWins = filtered.reduce((s, h) => s + h.wins, 0);
	const totalLosses = filtered.reduce((s, h) => s + h.losses, 0);
    const totalFights = totalWins + totalLosses;
    const totalWR = totalFights > 0 ? totalWins / totalFights : 0;
	const totalTournaments = filtered.reduce((s, h) => s + (h.tournamentWins || 0), 0);
	const maxLevel = Math.max(...filtered.map(h => h.level || 0));

    html += `<tr style="background:linear-gradient(90deg,rgba(163,113,247,0.12),rgba(163,113,247,0.04));font-weight:800;">
        <td class="season-num" style="color:var(--gold);">ВСЕГО</td>
        <td class="num" style="color:var(--text);">${totalWins}-${totalLosses}</td>
        <td class="num" style="color:${wrColor(totalWR)};">${(totalWR * 100).toFixed(1)}%</td>
        <td class="num" style="color:var(--gold);">${maxLevel}</td>
        <td class="num" style="color:var(--gold);">${totalTournaments} ${totalTournaments >= 10 ? '🔥' : '🏆'}</td>
    </tr>`;
    html += '</tbody></table></div></div>';
    return html;
}

// --- 7.7 График ---
function renderChart(history) {
    if (history.length < 2) return '';
    const points = history.map(h => h.wr * 100);
    const labels = history.map(h => `S${h.season}`);
    const W = 600, H = 200, P = 50;
    const minW = Math.min(...points) - 2, maxW = Math.max(...points) + 2;
    const range = maxW - minW || 1;
    const gX = (i) => P + (W - P * 2) * i / (points.length - 1);
    const gY = (v) => H - P - ((v - minW) / range) * (H - P * 2);
    const svgPoints = points.map((p, i) => `${gX(i)},${gY(p)}`).join(' ');
    const circles = points.map((p, i) => {
        const color = i === points.length - 1 ? (p >= points[0] ? '#10b981' : '#ef4444') : '#a371f7';
        return `<circle cx="${gX(i)}" cy="${gY(p)}" r="6" fill="var(--card)" stroke="${color}" stroke-width="2.5"/>`;
    }).join('');
    const texts = points.map((p, i) => `<text x="${gX(i)}" y="${gY(p) - 14}" text-anchor="middle" fill="#c4a5ff" font-size="11" font-weight="700">${p.toFixed(1)}%</text>`).join('');
    const bottomLabels = labels.map((l, i) => `<text x="${gX(i)}" y="${H - 8}" text-anchor="middle" fill="#8a94a8" font-size="10">${l}</text>`).join('');
    const diff = points[points.length - 1] - points[0];
    const diffText = diff >= 0 ? `+${diff.toFixed(1)}%` : `${diff.toFixed(1)}%`;
    const diffColor = diff >= 0 ? 'var(--green)' : 'var(--red)';

    return `<div class="oracle-block gold">
        <div class="oracle-block-title" style="margin-bottom:8px;">📈 Динамика винрейта по сезонам</div>
        <div style="text-align:center;margin-bottom:4px;font-size:.85rem;color:var(--sub)">${points[0].toFixed(1)}% → <span style="color:${diffColor};font-weight:700">${points[points.length - 1].toFixed(1)}% (${diffText})</span></div>
        <svg width="100%" height="${H}" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" style="display:block;max-width:100%">
            <defs>
                <linearGradient id="cg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#a371f7" stop-opacity="0.25"/><stop offset="100%" stop-color="#a371f7" stop-opacity="0"/></linearGradient>
                <linearGradient id="cl" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#8b5cf6"/><stop offset="50%" stop-color="#c4a5ff"/><stop offset="100%" stop-color="#f0b90b"/></linearGradient>
            </defs>
            <polygon points="${gX(0)},${H - P} ${svgPoints} ${gX(points.length - 1)},${H - P}" fill="url(#cg)"/>
            <polyline points="${svgPoints}" fill="none" stroke="url(#cl)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
            ${circles}${texts}${bottomLabels}
        </svg>
    </div>`;
}

// --- 7.7b График по коммитам GitHub ---
window.drawWinrateChart = async (playerName) => {
    const container = document.getElementById('githubChartContainer');
    if (!container) return;
    container.innerHTML = '<div style="text-align:center;padding:20px;"><span class="spinner" style="display:inline-block;width:24px;height:24px;border:2px solid var(--border);border-top-color:var(--gold);border-radius:50%;animation:spin 0.8s linear infinite;"></span> Загрузка...</div>';

    try {
        const pages = await Promise.all([1, 2, 3, 4, 5, 6].map(page =>
            fetch(`https://api.github.com/repos/rvotaenotaTTV/dnd-stats/commits?path=stats_data.json&per_page=30&page=${page}`).then(r => r.json())
        ));
        const allCommits = pages.flat().filter(c => c?.sha);
        if (allCommits.length < 5) {
            container.innerHTML = '<div style="text-align:center;padding:20px;color:var(--muted)">⚠️ Недостаточно истории</div>';
            return;
        }
        const step = Math.floor(allCommits.length / 4);
        const selectedCommits = [
            allCommits[allCommits.length - 1],
            allCommits[allCommits.length - 1 - step],
            allCommits[Math.floor(allCommits.length / 2)],
            allCommits[step]
        ];
        const oldSlices = await Promise.all(selectedCommits.map(commit =>
            fetch(`https://raw.githubusercontent.com/rvotaenotaTTV/dnd-stats/${commit.sha}/stats_data.json`).then(r => r.json())
        ));

        const points = [], labels = [];
        const now = Date.now();
        oldSlices.forEach((data, i) => {
            const p = (data.players || []).find(x => x.display === playerName);
            if (p) {
                const t = (p.wins || 0) + (p.losses || 0);
                const wr = t > 0 ? (p.wins / t * 100) : 0;
                points.push(wr);
                const hours = Math.round((now - new Date(selectedCommits[i].commit.committer.date).getTime()) / 3600000);
                labels.push(`${hours}ч`);
            }
        });

        const player = getPlayerHistory(playerName, allSeasonsCache);
        const last = player[player.length - 1];
        points.push(last.wr * 100);
        labels.push('Сейчас');

        if (points.length < 3) {
            container.innerHTML = '<div style="text-align:center;padding:20px;color:var(--muted)">⚠️ Недостаточно данных</div>';
            return;
        }

        renderWinrateChart(container, points, labels, playerName);
    } catch (e) {
        console.error(e);
        container.innerHTML = '<div style="text-align:center;padding:20px;color:var(--red)">❌ Ошибка загрузки</div>';
    }
};

    const gY = (v) => H - P - ((v - minW) / range) * (H - P * 2);
    const svgPoints = points.map((p, i) => `${gX(i)},${gY(p)}`).join(' ');

// --- 7.8 Тренды ---
function renderTrends(trend) {
    if (trend.trend === 'none' || trend.trend === 'first') return '';
    let ti, tt;
    if (trend.trend === 'growth') { ti = '↗'; tt = 'Рост'; }
    else if (trend.trend === 'fall') { ti = '↘'; tt = 'Угасание'; }
    else { ti = '→'; tt = 'Ровно'; }
    const formPct = (trend.form * 100).toFixed(0);
    const fi = trend.form >= 0.98 ? '🔥' : trend.form >= 0.9 ? '💪' : trend.form >= 0.75 ? '⚠️' : '🔻';
    return `<div class="oracle-block gold"><div class="oracle-block-title">📈 Тренды</div><div class="trend-grid">
        <div class="trend-item"><div class="trend-icon">${ti}</div><div class="trend-value">${tt}</div><div class="trend-label">Нить</div></div>
        <div class="trend-item"><div class="trend-icon">${fi}</div><div class="trend-value">${formPct}%</div><div class="trend-label">Форма</div></div>
        <div class="trend-item"><div class="trend-icon">📊</div><div class="trend-value">${(trend.stdDev * 100).toFixed(1)}%</div><div class="trend-label">Разброс</div></div>
    </div></div>`;
}

// --- 7.9 Взлёты/падения ---
function renderSwings(swings) {
    if (!swings.ups.length && !swings.downs.length) return '';
    let html = '<div class="oracle-block"><div class="oracle-block-title">📉 Взлёты и падения</div>';
    if (swings.ups.length) {
        html += '<div style="font-size:0.7rem;color:var(--green);margin-bottom:6px;text-transform:uppercase;letter-spacing:1px;">📈 Взлёты</div>';
        swings.ups.forEach(s => {
            html += `<div class="style-row" style="border-left:3px solid var(--green);"><div class="style-name"><span>S${s.from} → S${s.to}</span></div><div class="style-val" style="color:var(--green);">+${(s.delta * 100).toFixed(1)}% <span style="color:var(--muted);font-size:0.75rem;">(${(s.fromWR * 100).toFixed(0)}→${(s.toWR * 100).toFixed(0)})</span></div></div>`;
        });
    }
    if (swings.downs.length) {
        html += '<div style="font-size:0.7rem;color:var(--red);margin:14px 0 6px;text-transform:uppercase;letter-spacing:1px;">📉 Падения</div>';
        swings.downs.forEach(s => {
            html += `<div class="style-row" style="border-left:3px solid var(--red);"><div class="style-name"><span>S${s.from} → S${s.to}</span></div><div class="style-val" style="color:var(--red);">${(s.delta * 100).toFixed(1)}% <span style="color:var(--muted);font-size:0.75rem;">(${(s.fromWR * 100).toFixed(0)}→${(s.toWR * 100).toFixed(0)})</span></div></div>`;
        });
    }
    html += '</div>';
    return html;
}

// --- 7.11 Рекорды ---
function renderRecords(history) {
    if (history.length === 0) return '';
    const sa = analyzeSeasons(history);
    const rec = findPersonalRecords(history);
    if (!sa || !rec) return '';

    const tourValue = sa.mostTournaments.tournamentWins || 0;

    const factionSeason = factionValue > 0 && rec.maxFactionWins.season !== undefined && rec.maxFactionWins.season !== '—' ? `S${rec.maxFactionWins.season}` : '—';
    const bestStreakValue = rec.bestStreak.best || 0;
    const bestStreakSeason = bestStreakValue > 0 && rec.bestStreak.season !== undefined && rec.bestStreak.season !== '—' ? `S${rec.bestStreak.season}` : '—';

function getAchievementCondition(a) {
    switch (a.t) {
        case "level": return a.v + ' уровень';
        case "wins": return a.v + ' побед';
        case "losses": return a.v + ' поражений';
        case "best": return 'Стрик ' + a.v;
        case "worst": return 'Лузстрик ' + a.v;
        case "fights": return a.v + ' боёв';
        case "tournament": return a.v + ' турнирных побед';
        case "faction": return a.v + ' побед за ' + a.f;
        case "winrate": return 'Винрейт ' + a.v + '%';
        case "dungeon_record": return a.v + ' волн в данже';
        case "dungeon_trophies": return a.v + ' трофеев';
        case "dungeon_bosses": return a.v + ' боссов';
        case "dungeon_waves": return a.v + ' волн всего';
        case "champion": return 'Текущий чемпион';
        case "balance": return 'Побед = Поражений (20+ боёв)';
        default: return '';
    }
}

function checkAchievement(a, p, total, dp) {
    if (a.m && total < a.m) return false;
    switch (a.t) {
        case "level": return (p.level || 0) >= a.v;
        case "wins": return (p.wins || 0) >= a.v;
        case "losses": return (p.losses || 0) >= a.v;
        case "best": return (p.best || 0) >= a.v;
        case "worst": return (p.worst || 0) >= a.v;
        case "fights": return total >= a.v;
        case "tournament": return (p.tournamentWins || 0) >= a.v;
        case "faction": return p.faction === a.f && (p.factionWins || 0) >= a.v;
        case "winrate": return total > 0 && (p.wins * 100 / total) >= a.v;
        case "balance": return p.wins === p.losses && total >= (a.m || 20);
        case "champion": return p.champion === true;
        case "dungeon_record": return (dp?.record || 0) >= a.v;
        case "dungeon_trophies": return (dp?.trophies || 0) >= a.v;
        case "dungeon_bosses": return (dp?.bosses || 0) >= a.v;
        case "dungeon_waves": return (dp?.totalWaves || 0) >= a.v;
        default: return false;
    }
}

function getAchievementCurrent(a, p, total, dp) {
    switch (a.t) {
        case "level": return p.level || 0;
        case "wins": return p.wins || 0;
        case "losses": return p.losses || 0;
        case "best": return p.best || 0;
        case "worst": return p.worst || 0;
        case "fights": return total;
        case "tournament": return p.tournamentWins || 0;
        case "faction": return p.faction === a.f ? (p.factionWins || 0) : 0;
        case "winrate": return total > 0 ? parseFloat((p.wins * 100 / total).toFixed(1)) : 0;
        case "dungeon_record": return dp?.record || 0;
        case "dungeon_trophies": return dp?.trophies || 0;
        case "dungeon_bosses": return dp?.bosses || 0;
        case "dungeon_waves": return dp?.totalWaves || 0;
        case "champion": return p.champion ? 1 : 0;
        case "balance": return total >= 20 ? 1 : 0;
        default: return 0;
    }
}

            </div>
        </section>`;
    }

    if (locked.length) {
        html += `<section class="oracle-block">
            <div class="oracle-block-title">🔒 Не получены (${locked.length})</div>
            <div class="ach-grid">

                    const current = getAchievementCurrent(a, last, total, dp);

                    return `<div class="ach-card locked">

                        <div class="ach-name">${a.n}</div>
                        <div style="font-size:.65rem;color:var(--muted)">${getAchievementCondition(a)}</div>

    }

    html += '</div>';
    return html;
}

		return `<div style="display:grid;grid-template-columns:50px 1fr auto auto;gap:10px;align-items:center;padding:6px 10px;font-size:0.78rem;border-bottom:1px solid rgba(163,113,247,0.08);">
			<span style="color:var(--purple);font-weight:800;">S${m.season}</span>
			<span><strong style="color:${isInMetaNow ? 'var(--gold)' : 'var(--text)'};">${emoji} ${myClass}</strong></span>
			<span style="color:${rankColor};font-size:0.7rem;white-space:nowrap;">${myRank} из ${m.allClasses.length}</span>
			<span style="color:${wrColor(myObj.wr)};font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;">${(myObj.wr * 100).toFixed(1)}%</span>
		</div>`;
	};

    const currentMeta = metaBySeason.find(m => m.isCurrent);
    const archivedMeta = metaBySeason.filter(m => !m.isCurrent);

    let html = '<div class="oracle-block ice"><div class="oracle-block-title">📊 Мета по сезонам</div>';

    if (currentMeta && currentMeta.topClasses.length > 0) {
        const m = currentMeta;
        const historyItem = history.find(h => h.season === m.season);
        const nameParts = (historyItem?.name || '').split('-');
        const myClass = nameParts.length >= 2 ? nameParts[1] : (nameParts[0] || null);
        const myRank = myClass ? m.allClasses.findIndex(c => c.name === myClass) + 1 : 0;
        const myObj = myClass ? m.allClasses.find(c => c.name === myClass) : null;
        const myInMeta = myClass ? isInMeta(myClass, metaBySeason, m.season) : false;
        const posText = myRank > 0 ? ` · 📍 ${myRank} из ${m.allClasses.length}` : '';
        const statusText = myClass ? (myInMeta ? ' 🎯 в мете' : ' ⚔️ вне меты') : '';
        const emoji = myClass ? (classEmojis[myClass] || '') : '';

        html += `<div style="margin-bottom:14px;padding:12px 14px;background:linear-gradient(90deg,rgba(163,113,247,0.1),rgba(163,113,247,0.02));border-radius:var(--radius-sm);border-left:3px solid ${myInMeta ? 'var(--gold)' : 'var(--purple)'};">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:4px;">
                <div style="font-size:0.82rem;color:var(--purple);font-weight:800;">S${m.season} ⚡ <span style="color:var(--muted);font-weight:600;font-size:0.7rem;text-transform:uppercase;letter-spacing:1px;">текущий</span></div>
                ${myClass ? `<div style="font-size:0.7rem;color:var(--muted);">твой класс: <strong style="color:${myInMeta ? 'var(--gold)' : 'var(--text)'};">${emoji} ${myClass}${posText}${statusText}</strong></div>` : ''}
            </div>`;
        m.topClasses.forEach((c, i) => { html += rowTopHtml(c, i + 1, c.name === myClass); });
        if (myObj && !myInMeta && myRank > META_TOP) {
            html += `<div style="text-align:center;color:var(--muted);font-size:0.75rem;padding:4px 0;letter-spacing:2px;">···</div>`;
            if (myRank - 2 >= META_TOP) html += rowTopHtml(m.allClasses[myRank - 2], myRank - 1, false);
            html += rowTopHtml(myObj, myRank, true);
            if (myRank < m.allClasses.length) html += rowTopHtml(m.allClasses[myRank], myRank + 1, false);
        }
        html += '</div>';
    }

    const archivedWithHistory = archivedMeta
        .map(m => ({ m, h: history.find(h => h.season === m.season) }))
        .filter(x => x.h && x.h.name?.includes('-'))
        .sort((a, b) => b.m.season - a.m.season);

    if (archivedWithHistory.length > 0) {
        html += `<div style="font-size:0.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin:14px 0 8px;">📜 Твой класс по прошлым сезонам</div>`;
        html += `<div style="background:rgba(163,113,247,0.03);border-radius:var(--radius-sm);padding:4px 0;">`;
        archivedWithHistory.forEach(({ m, h }) => { html += rowCompactHtml(m, h); });
        html += `</div>`;
    }
    html += '</div>';
    return html;
}

function renderStyle(heroAnalysis, metaBySeason, history) {
    if (!heroAnalysis) return '';
    const hasClassData = Object.keys(heroAnalysis.classStats || {}).length > 0;
    const hasRaceData = Object.keys(heroAnalysis.raceStats || {}).length > 0;
    const hasCombo = !!heroAnalysis.bestCombo;
    if (!hasClassData && !hasRaceData && !hasCombo) {
        return '<div class="oracle-block ice"><div class="oracle-block-title">🎨 Твой стиль</div><div style="text-align:center;color:var(--muted);font-size:0.85rem;padding:20px 0;">Пока мало данных для анализа стиля</div></div>';
    }

    const classArr = Object.entries(heroAnalysis.classStats)
        .map(([n, s]) => ({ name: n, wins: s.wins, losses: s.losses, total: s.wins + s.losses, wr: s.wins / (s.wins + s.losses) }))
        .filter(c => c.total >= 5)
        .sort((a, b) => b.total - a.total);
    const raceArr = Object.entries(heroAnalysis.raceStats)
        .map(([n, s]) => ({ name: n, wins: s.wins, losses: s.losses, total: s.wins + s.losses, wr: s.wins / (s.wins + s.losses) }))
        .filter(c => c.total >= 5)
        .sort((a, b) => b.total - a.total);

    const bestCombo = heroAnalysis.bestCombo;

    const ce = (typeof classEmojis !== 'undefined' && classEmojis) ? classEmojis : {};
    const re = (typeof raceEmojis !== 'undefined' && raceEmojis) ? raceEmojis : {};

    let html = '<div class="oracle-block ice"><div class="oracle-block-title">🎨 Твой стиль</div>';
    html += '<div style="font-size:0.75rem;color:var(--muted);margin-bottom:14px;">Топ-3 по частоте</div>';

    if (classArr.length > 0) {
        html += '<div style="font-size:0.7rem;color:var(--muted);margin-bottom:8px;text-transform:uppercase;letter-spacing:1px;">⚔️ Классы</div>';
        classArr.slice(0, 3).forEach(c => {
            html += `<div class="style-row">
                <div class="style-name">${ce[c.name] || '⚔️'} ${c.name}</div>
                <div class="style-val">${c.wins}-${c.losses} (${(c.wr * 100).toFixed(1)}%)</div>
            </div>`;
        });
    }
    if (raceArr.length > 0) {
        html += '<div style="font-size:0.7rem;color:var(--muted);margin:18px 0 8px;text-transform:uppercase;letter-spacing:1px;">🌍 Расы</div>';
        raceArr.slice(0, 3).forEach(r => {
            html += `<div class="style-row">
                <div class="style-name">${re[r.name] || '🌍'} ${r.name}</div>
                <div class="style-val">${r.wins}-${r.losses} (${(r.wr * 100).toFixed(1)}%)</div>
            </div>`;
        });
    }
    if (bestCombo) {
        html += `<div style="margin-top:18px;padding-top:14px;border-top:1px solid var(--border);text-align:center;font-size:0.85rem;">
            🏆 Лучшее комбо: <strong style="color:var(--green);">${bestCombo.emoji} ${bestCombo.name}</strong> — ${(bestCombo.wr * 100).toFixed(1)}%
            <div style="font-size:0.7rem;color:var(--muted);margin-top:4px;">${bestCombo.wins}-${bestCombo.losses} боёв</div>
        </div>`;
    }
    html += '</div>';
    return html;
}

function renderFactions(factions) {
    if (!factions || (factions.light.count === 0 && factions.dark.count === 0)) return '';
    let html = `<div class="oracle-block"><div class="oracle-block-title">⚔️ Фракции</div>`;
    if (factions.light.count > 0) {
        html += `<div class="style-row"><div class="style-name"><span>🌝</span> Орден Света</div><div class="style-val">${factions.light.count} сез. · ⚔️ ${factions.light.factionWins} · <span style="color:${wrColor(factions.light.wr)};">${(factions.light.wr * 100).toFixed(1)}%</span></div></div>`;
    }
    if (factions.dark.count > 0) {
        html += `<div class="style-row"><div class="style-name"><span>🌚</span> Культ Тьмы</div><div class="style-val">${factions.dark.count} сез. · ⚔️ ${factions.dark.factionWins} · <span style="color:${wrColor(factions.dark.wr)};">${(factions.dark.wr * 100).toFixed(1)}%</span></div></div>`;
    }
    html += '</div>';
    return html;
}

function renderArchiveTab(allHistory, mainHistory, data2x2, playerName) {
    let html = `<div id="tab-archive" class="tab-content">`;
    html += renderArchiveBest(allHistory);
    html += renderFullHistory(allHistory);
    html += renderFactionHistory(mainHistory);
    html += renderSeasonEcho(mainHistory);
    html += render2x2(data2x2, playerName);
    html += '</div>';
    return html;
}

function renderFullHistory(history) {
    if (history.length < 2) return '';
    let html = '<div class="oracle-block"><div class="oracle-block-title">📜 Полная летопись</div>';
    html += '<div class="table-container"><table class="history-table full">';
    html += '<thead><tr>' +
        '<th>Сезон</th><th>Герой</th><th class="num">W/L</th><th class="num">WR</th>' +
        '<th class="num">🔥</th><th class="num">💀</th><th class="num">🎯</th>' +
        '<th class="num">👑</th><th class="num">⚔️</th><th class="num">Ур.</th><th class="num">💎</th>' +
    '</tr></thead><tbody>';

    const bySeason = new Map();
    history.forEach(h => {
        if (!bySeason.has(h.season)) bySeason.set(h.season, []);
        bySeason.get(h.season).push(h);
    });
    const sortedSeasons = [...bySeason.keys()].sort((a, b) => a - b);

    sortedSeasons.forEach(seasonNum => {
        const rows = bySeason.get(seasonNum);
        rows.forEach(h => {
            const eraIcon = h.era === 'classic' ? ' 📜' : '';
            const deletedIcon = h.isDeleted ? ' 🗑️' : '';
            const rowStyle = h.isDeleted ? 'opacity:0.7;' : '';
            const seasonExtra = h.isDeleted ? '🗑️' : (h.isCurrent ? ' ⚡' : '');
            html += `<tr class="${h.isCurrent && !h.isDeleted ? 'current' : ''}" style="${rowStyle}">
                <td class="season-num" data-label="Сезон">S${h.season}${seasonExtra}${eraIcon}</td>
                <td data-label="Герой" style="color:var(--sub);">${h.emoji} ${h.name || '—'}${deletedIcon}</td>
                <td class="num" data-label="W/L">${h.wins}-${h.losses}</td>
                <td class="num" data-label="WR" style="color:${wrColor(h.wr)};font-weight:700;">${(h.wr * 100).toFixed(1)}%</td>
                <td class="num" data-label="Стрик" style="color:var(--green);font-weight:600;">${h.best || '—'}</td>
                <td class="num" data-label="Лузстрик" style="color:var(--red);font-weight:600;">${h.worst || '—'}</td>
                <td class="num" data-label="Скилл" style="color:var(--purple);font-weight:600;">${h.skill || '—'}</td>
                <td class="num" data-label="Турниры" style="color:var(--gold);font-weight:600;">${h.tournamentWins || '—'}</td>
                <td class="num" data-label="Фракция" style="color:var(--ice);font-weight:600;">${h.factionWins || '—'}</td>
                <td class="num" data-label="Ур.">${h.level}</td>
                <td class="num" data-label="Осколки">${h.shards}</td>
            </tr>`;
        });

        if (rows.length > 1) {
            const sumWins = rows.reduce((s, h) => s + h.wins, 0);
            const sumLosses = rows.reduce((s, h) => s + h.losses, 0);
            const sumTotal = sumWins + sumLosses;
            const sumWR = sumTotal > 0 ? sumWins / sumTotal : 0;
            const maxLevel = Math.max(...rows.map(h => h.level || 0));
            const maxBest = Math.max(...rows.map(h => h.best || 0));
            const maxWorst = Math.max(...rows.map(h => h.worst || 0));
            const sumFactionWins = rows.reduce((s, h) => s + (h.factionWins || 0), 0);
            const sumShards = rows.reduce((s, h) => s + (h.shards || 0), 0);
            const sumTournaments = rows.reduce((s, h) => s + (h.tournamentWins || 0), 0);

            html += `<tr style="background:rgba(163,113,247,0.06);font-weight:700;">
                <td class="season-num" data-label="Сезон" style="color:var(--gold);">S${seasonNum} ИТОГО</td>
                <td data-label="Герой" style="color:var(--muted);font-style:italic;">сумма за сезон</td>
                <td class="num" data-label="W/L" style="color:var(--text);">${sumWins}-${sumLosses}</td>
                <td class="num" data-label="WR" style="color:${wrColor(sumWR)};">${(sumWR * 100).toFixed(1)}%</td>
                <td class="num" data-label="Стрик" style="color:var(--green);">${maxBest}</td>
                <td class="num" data-label="Лузстрик" style="color:var(--red);">${maxWorst}</td>
                <td class="num" data-label="Скилл">—</td>
                <td class="num" data-label="Турниры" style="color:var(--gold);">${sumTournaments || '—'}</td>
                <td class="num" data-label="Фракция" style="color:var(--ice);">${sumFactionWins || '—'}</td>
                <td class="num" data-label="Ур.">${maxLevel}</td>
                <td class="num" data-label="Осколки">${sumShards}</td>
            </tr>`;
        }
    });

    // ГРАНД-ИТОГО по всем сезонам
    const gWins = history.reduce((s, h) => s + (h.wins || 0), 0);
    const gLosses = history.reduce((s, h) => s + (h.losses || 0), 0);
    const gTotal = gWins + gLosses;
    const gWR = gTotal > 0 ? gWins / gTotal : 0;
    const gMaxLevel = Math.max(...history.map(h => h.level || 0));
    const gMaxBest = Math.max(...history.map(h => h.best || 0));
    const gMaxWorst = Math.max(...history.map(h => h.worst || 0));
    const gFactionWins = history.reduce((s, h) => s + (h.factionWins || 0), 0);
    const gShards = history.reduce((s, h) => s + (h.shards || 0), 0);
    const gTournaments = history.reduce((s, h) => s + (h.tournamentWins || 0), 0);

    html += `<tr style="background:linear-gradient(90deg,rgba(240,185,11,0.15),rgba(240,185,11,0.05));font-weight:800;border-top:2px solid var(--gold);">
        <td class="season-num" data-label="ВСЕГО" style="color:var(--gold);">ВСЕГО</td>
        <td data-label="Герой" style="color:var(--muted);font-style:italic;">${history.length} записей</td>
        <td class="num" data-label="W/L" style="color:var(--text);">${gWins}-${gLosses}</td>
        <td class="num" data-label="WR" style="color:${wrColor(gWR)};">${(gWR * 100).toFixed(1)}%</td>
        <td class="num" data-label="Стрик" style="color:var(--green);">${gMaxBest}</td>
        <td class="num" data-label="Лузстрик" style="color:var(--red);">${gMaxWorst}</td>
        <td class="num" data-label="Скилл">—</td>
        <td class="num" data-label="Турниры" style="color:var(--gold);">${gTournaments}</td>
        <td class="num" data-label="Фракция" style="color:var(--ice);">${gFactionWins}</td>
        <td class="num" data-label="Ур.">${gMaxLevel}</td>
        <td class="num" data-label="Осколки">${gShards}</td>
    </tr>`;

    html += '</tbody></table></div></div>';
    return html;
}

function renderArchiveBest(history) {
    if (history.length < 3) return '';
    const bySeason = new Map();
    history.forEach(h => {
        if (!bySeason.has(h.season)) bySeason.set(h.season, []);
        bySeason.get(h.season).push(h);
    });
    const seasonBest = [...bySeason.entries()].map(([season, rows]) => {
        const eligible = rows.filter(r => r.total >= MIN_FIGHTS_FOR_RECORD);
        if (eligible.length === 0) return null;
        const best = eligible.sort((a, b) => b.wr - a.wr)[0];
        return { ...best, season };
    }).filter(Boolean);
    const top = seasonBest.sort((a, b) => b.wr - a.wr).slice(0, 5);
    if (top.length === 0) return '';
    const medals = ['🥇', '🥈', '🥉', '4️⃣', '5️⃣'];
    let html = '<div class="oracle-block green"><div class="oracle-block-title">🏆 Лучшие сезоны по WR</div>';
    top.forEach((h, i) => {
        const deletedIcon = h.isDeleted ? ' 🗑️' : '';
        html += `<div class="archive-hero" style="border-left-color:${i === 0 ? 'var(--gold)' : i === 1 ? 'var(--silver)' : i === 2 ? 'var(--bronze)' : 'var(--border)'};">
            <div class="hero-info"><span>${medals[i]}</span> <span style="color:var(--purple);font-weight:800;">S${h.season}</span> <span style="color:var(--sub);font-size:0.8rem;">${h.emoji} ${h.name || ''}${deletedIcon}</span></div>
            <div><span style="color:${wrColor(h.wr)};font-weight:800;">${(h.wr * 100).toFixed(1)}%</span> <span style="color:var(--muted);font-size:0.72rem;">(${h.wins}-${h.losses})</span></div>
        </div>`;
    });
    html += '</div>';
    return html;
}

function renderFactionHistory(history) {
    if (history.length < 2) return '';
    const hasLight = history.some(h => h.faction === 'Орден Света');
    const hasDark = history.some(h => h.faction === 'Культ Тьмы');
    if (!hasLight && !hasDark) return '';

    let html = '<div class="oracle-block"><div class="oracle-block-title">⚔️ История фракций</div>';
    history.forEach(h => {
        if (!h.faction) return;
        const isLight = h.faction === 'Орден Света';
        const icon = isLight ? '🌝' : '🌚';
        const color = isLight ? 'var(--gold)' : 'var(--purple)';
        html += `<div class="archive-hero" style="border-left-color:${color};">
            <div class="hero-info"><span>${icon}</span> <span style="color:var(--purple);font-weight:800;">S${h.season}</span> <span style="color:var(--sub);font-size:0.8rem;">${h.faction}</span></div>
            <div><span style="color:${color};font-weight:700;">${h.factionWins || 0} ⚔️</span> <span style="color:var(--muted);font-size:0.72rem;">${h.wins}-${h.losses} (${(h.wr * 100).toFixed(0)}%)</span></div>
        </div>`;
    });
    if (!hasLight || !hasDark) {
        html += `<div style="text-align:center;font-size:0.75rem;color:var(--muted);margin-top:8px;font-style:italic;">
            Все сезоны — за <strong>${hasLight ? 'Орден Света' : 'Культ Тьмы'}</strong>
        </div>`;
    }
    html += '</div>';
    return html;
}

function renderSeasonEcho(history) {
    if (history.length < 3) return '';
    const echoes = [];
    const last = history[history.length - 1];
    const prev = history[history.length - 2];
    const wrDiff = last.wr - prev.wr;
    if (Math.abs(wrDiff) > 0.1) {
        if (wrDiff > 0) echoes.push(`📖 <strong>Сезон ${prev.season} → ${last.season}</strong>: рывок на <strong>+${(wrDiff * 100).toFixed(0)}%</strong>. Ты <strong>переписал свою историю</strong>.`);
        else echoes.push(`📖 <strong>Сезон ${prev.season} → ${last.season}</strong>: падение на <strong>${(wrDiff * 100).toFixed(0)}%</strong>. Это <strong>рана</strong>, но не смерть.`);
    }
    const best = history.reduce((m, h) => h.wr > m.wr ? h : m);
    if (best.season !== last.season && best.wr > last.wr + 0.1) echoes.push(`📖 <strong>Эхо S${best.season}</strong>: тогда ты показывал <strong>${(best.wr * 100).toFixed(0)}%</strong>. Сейчас — ${(last.wr * 100).toFixed(0)}%. <strong>Верни эту форму</strong>.`);
    if (history.length >= 5) {
        const first = history[0];
        if (last.wr > first.wr + 0.1) echoes.push(`📖 <strong>С S${first.season} по S${last.season}</strong>: ты вырос с ${(first.wr * 100).toFixed(0)}% до ${(last.wr * 100).toFixed(0)}%. <strong>Это путь воина</strong>.`);
        else if (last.wr < first.wr - 0.1) echoes.push(`📖 <strong>С S${first.season} по S${last.season}</strong>: ты упал с ${(first.wr * 100).toFixed(0)}% до ${(last.wr * 100).toFixed(0)}%. <strong>Вернись к истокам</strong>.`);
    }
    if (echoes.length === 0) {
        if (history.length >= 3) {
            echoes.push(`📖 Ты идёшь <strong>ровно</strong>. Ни взлётов, ни падений — редкий случай. Или скучный. Решать тебе.`);
        } else return '';
    }
    let html = '<div class="oracle-block"><div class="oracle-block-title">📖 Эхо прошлых сезонов</div>';
    echoes.forEach(e => html += `<div class="oracle-voice" style="border-left-color: var(--ice);">${e}</div>`);
    html += '</div>';
    return html;
}

function render2x2(data2x2, playerName) {
    if (!data2x2 || !playerName) return '';
    let stats = data2x2[playerName];
    if (!stats) {
        const lower = playerName.toLowerCase();
        const foundKey = Object.keys(data2x2).find(k => k.toLowerCase() === lower);
        if (foundKey) stats = data2x2[foundKey];
    }
    if (!stats || ((stats.teamWins || 0) + (stats.teamLoses || 0)) === 0) return '';

    const wins = stats.teamWins || 0;
    const loses = stats.teamLoses || 0;
    const tournaments = stats.teamTournamentWins || 0;
    const elo = stats.teamElo || 0;
    const total = wins + loses;
    const wr = total > 0 ? (wins * 100 / total).toFixed(1) : '0.0';

    const allElo = Object.entries(data2x2)
        .filter(([_, s]) => ((s.teamWins || 0) + (s.teamLoses || 0)) >= 5)
        .sort((a, b) => (b[1].teamElo || 0) - (a[1].teamElo || 0));
    const rank = allElo.findIndex(([k]) => k.toLowerCase() === playerName.toLowerCase()) + 1;

    const rankData = [
        { min: 60, name: '💠 Алмаз', color: 'var(--ice)' },
        { min: 55, name: '💎 Платина', color: 'var(--purple)' },
        { min: 50, name: '🥇 Золото', color: 'var(--gold)' },
        { min: 45, name: '🥈 Серебро', color: 'var(--silver)' },
        { min: 0,  name: '🥉 Бронза', color: 'var(--bronze)' }
    ];
    let rankName = '⚪ Без ранга';
    let rankColor = 'var(--muted)';
    if (total >= 5) {
        for (const r of rankData) {
            if (parseFloat(wr) >= r.min) { rankName = r.name; rankColor = r.color; break; }
        }
    }

    return `<div class="oracle-block gold">
        <div class="oracle-block-title">📦 2x2 — закрытый режим</div>
        <div style="text-align:center;font-size:0.75rem;color:var(--muted);margin-bottom:14px;">Данные сохранены для истории</div>
        <div class="stats-grid" style="grid-template-columns:repeat(3,1fr)">
            <div class="stat-card"><div class="stat-num">${wins}</div><div class="stat-label">⚔️ Победы</div></div>
            <div class="stat-card"><div class="stat-num">${loses}</div><div class="stat-label">💀 Поражения</div></div>
            <div class="stat-card"><div class="stat-num">${wr}%</div><div class="stat-label">📊 WR</div></div>
        </div>
        <div class="stats-grid" style="grid-template-columns:repeat(3,1fr)">
            <div class="stat-card"><div class="stat-num">${tournaments}</div><div class="stat-label">👑 Турниры</div></div>
            <div class="stat-card"><div class="stat-num">${elo}</div><div class="stat-label">🏆 Elo</div></div>
            <div class="stat-card"><div class="stat-num">${total}</div><div class="stat-label">⚡ Всего</div></div>
        </div>
        <div style="margin-top:20px;padding:16px;background:var(--elevated);border-radius:var(--radius-sm);text-align:center;border:1px solid var(--border)">
            <div style="font-size:0.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px">Ранг</div>
            <div style="font-size:1.3rem;font-weight:800;color:${rankColor}">${rankName}</div>
            ${rank > 0 ? `<div style="font-size:0.75rem;color:var(--muted);margin-top:6px">Место в топе: <strong style="color:var(--gold)">#${rank}</strong> из ${allElo.length}</div>` : ''}
        </div>
    </div>`;
}

window.filterCompareList = () => {
    const input = document.getElementById('compareInput');
    const dropdown = document.getElementById('compareDropdown');
    if (!input || !allPlayersCache) return;
    const value = input.value.toLowerCase().trim();
    if (!value) { dropdown.classList.remove('show'); return; }
    const filtered = allPlayersCache.filter(p => p.display.toLowerCase().includes(value)).slice(0, 8);
    if (!filtered.length) { dropdown.classList.remove('show'); return; }
    dropdown.innerHTML = filtered.map(p =>
        `<div class="autocomplete-item" onclick="selectCompare('${escapeHtml(p.display)}')">
            <span class="ac-emoji">${p.emoji}</span>
            <span class="ac-name">${p.display}</span>
            <span class="ac-class">${p.name}</span>
        </div>`
    ).join('');
    dropdown.classList.add('show');
};

window.selectCompare = (name) => {
    const input = document.getElementById('compareInput');
    const dropdown = document.getElementById('compareDropdown');
    if (input) input.value = name;
    if (dropdown) dropdown.classList.remove('show');
    compareWith(name);
};

window.compareWith = (name) => {
    const p1 = getPlayerHistory(currentPlayerName, allSeasonsCache);
    const p2 = getPlayerHistory(name, allSeasonsCache);
    const result = document.getElementById('compareResult');
    if (!result) return;
    if (!p1.length || !p2.length) {
        result.innerHTML = '<div style="text-align:center;padding:20px;color:var(--muted)">Игрок не найден</div>';
        return;
    }
    const last1 = p1[p1.length - 1];
    const last2 = p2[p2.length - 1];
    const d1 = last1.dungeon;
    const d2 = last2.dungeon;

    const rows = [
        ['Победы', last1.wins || 0, last2.wins || 0, true],
        ['Поражения', last1.losses || 0, last2.losses || 0, false],
        ['Винрейт', (last1.wr * 100).toFixed(1) + '%', (last2.wr * 100).toFixed(1) + '%', true],
        ['SKILL', last1.skill || 0, last2.skill || 0, true],
        ['Всего боёв', last1.total, last2.total, true],
        ['Лучший стрик', last1.best || 0, last2.best || 0, true],
        ['Осколки', last1.shards || 0, last2.shards || 0, true],
        ['Уровень', last1.level || 0, last2.level || 0, true],
        ['Турниры', last1.tournamentWins || 0, last2.tournamentWins || 0, true],
        ['Рекорд данжа', d1 ? d1.record : '-', d2 ? d2.record : '-', true]
    ];

    let tableHtml = `<div class="table-container"><table class="compare-table"><thead><tr><th>Стат</th><th>${last1.display}</th><th>${last2.display}</th></tr></thead><tbody>`;
    rows.forEach(([label, v1, v2, higherIsBetter]) => {
        let c1 = '', c2 = '';
        const n1 = parseFloat(v1), n2 = parseFloat(v2);
        if (!isNaN(n1) && !isNaN(n2)) {
            if (n1 > n2) { c1 = higherIsBetter ? 'td-better' : 'td-worse'; c2 = higherIsBetter ? 'td-worse' : 'td-better'; }
            else if (n2 > n1) { c1 = higherIsBetter ? 'td-worse' : 'td-better'; c2 = higherIsBetter ? 'td-better' : 'td-worse'; }
        }
        tableHtml += `<tr><td>${label}</td><td class="${c1}">${v1}</td><td class="${c2}">${v2}</td></tr>`;
    });
    tableHtml += '</tbody></table></div>';
    result.innerHTML = tableHtml;
};

function renderSkillTab(last) {
    const total = last.total;
    const wr = total > 0 ? (last.wins / total) : 0;

    const denominator = Math.sqrt(total / 75 + 1);

    const components = [
        { icon: '⚔️', name: 'Победы × Винрейт', detail: `${last.wins} × ${(wr * 100).toFixed(1)}% × 7`, value: (last.wins || 0) * wr * 7, color: 'var(--gold)' },
        { icon: '🔥', name: 'Лучший стрик', detail: `${last.best} × 10`, value: (last.best || 0) * 10, color: 'var(--red)' },

        </div>
        <div class="oracle-block gold" style="padding:20px;">
            <div style="display:flex; flex-direction:column; gap:12px;">
                ${components.map(c => {
                    const percent = totalValue > 0 ? (c.value / totalValue) * 100 : 0;
                    return `<div style="background:var(--elevated); border:1px solid var(--border); border-radius:var(--radius-sm); padding:14px 16px; border-left:3px solid ${c.color};">
                        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">

            <div style="font-size:0.7rem; color:var(--muted); margin-top:6px;">Делитель: √(${total} / 75 + 1) = ${denominator.toFixed(2)}</div>
        </div>
    </div>`;
}

// --- 7.22 Пророчества ---
function renderProphecyTab(history, trend, heroAnalysis, leaguePlace, dungeon, forecast, forecastText, advice) {
    let html = `<div id="tab-prophecy" class="tab-content">`;

    // Пророчества
    const prophecies = [];
    if (trend.trend === 'growth') prophecies.push(`📜 <strong>Следующий сезон</strong> станет для тебя <strong>испытанием огнём</strong>. Ты близок к пику. Один неверный шаг — и падение. Один верный — и <strong>новая высота</strong>.`);
    else if (trend.trend === 'fall') prophecies.push(`📜 <strong>Следующий сезон</strong> — это <strong>развилка</strong>. Или ты найдёшь в себе силы переломить падение, или нить окончательно истончится.`);
    else prophecies.push(`📜 <strong>Следующий сезон</strong> — это <strong>возможность</strong>. Ты застрял в равновесии. Пора сделать рывок. Или смириться.`);
    if (heroAnalysis.best && heroAnalysis.best.wr > 0.6) prophecies.push(`📜 Герой <strong>${heroAnalysis.best.emoji} ${heroAnalysis.best.name}</strong> ещё не сказал своего последнего слова. <strong>Вернись к нему</strong> — и он отблагодарит.`);
    if (leaguePlace && !leaguePlace.inTop8 && leaguePlace.gapToTop8 < 100) prophecies.push(`📜 До топ-8 — <strong>${leaguePlace.gapToTop8} SKILL</strong>. Это <strong>рядом</strong>. Один хороший вечер — и ты там.`);
    if (dungeon && dungeon.maxRecord < 20 && dungeon.totalWaves > 0) prophecies.push(`📜 Бездна ждёт. Твой рекорд — <strong>${dungeon.maxRecord} волн</strong>. Там, глубже, есть <strong>то, что ты ищешь</strong>.`);
    const totalTournaments = history.reduce((s, h) => s + (h.tournamentWins || 0), 0);
    if (totalTournaments === 0) prophecies.push(`📜 Ты ещё не брал <strong>турнирную корону</strong>. Но когда возьмёшь — это изменит всё.`);
    else if (totalTournaments >= 10) prophecies.push(`📜 <strong>${totalTournaments} турниров</strong> — это не предел. Следующая корона будет <strong>сладкой</strong>.`);

    if (prophecies.length) {
        html += '<div class="oracle-block"><div class="oracle-block-title">🔮 Пророчества</div>';
        prophecies.forEach(p => html += `<div class="oracle-voice" style="border-left-color: var(--gold);">${p}</div>`);
        html += '</div>';
    }

    // Слово повествовательницы
    if (forecastText && forecastText.length) {
        html += `<div class="oracle-block gold"><div class="oracle-block-title">🖋️ Слово Повествовательницы</div>`;
        forecastText.forEach(l => html += `<div class="oracle-voice">${l}</div>`);
        html += `</div>`;
    }

    // Совет
    if (advice) {
        html += `<div class="advice-block"><div class="advice-icon">🖋️</div><div class="advice-text">${advice}</div></div>`;
    }

    html += '</div>';
    return html;
}

// Ранги (только текущий сезон — stats_data.json)
function getCurrentSeasonPlayers() {
    const last = allSeasonsCache[allSeasonsCache.length - 1];
    return last?.data?.players || [];
}
function getSeasonRank(p) {
    const sorted = getCurrentSeasonPlayers()
        .filter(x => (x.skill || 0) > 0)
        .sort((a, b) => (b.skill || 0) - (a.skill || 0));
    return sorted.findIndex(x => x.display === p.display) + 1;
}
function getRankByWins(p) {
    const sorted = [...getCurrentSeasonPlayers()]
        .sort((a, b) => (b.wins || 0) - (a.wins || 0));
    return sorted.findIndex(x => x.display === p.display) + 1;
}
function getRankByWinrate(p) {
    const sorted = getCurrentSeasonPlayers()
        .filter(x => ((x.wins || 0) + (x.losses || 0)) >= 30)
        .sort((a, b) => {
            const wa = (a.wins || 0) / ((a.wins || 0) + (a.losses || 0));
            const wb = (b.wins || 0) / ((b.wins || 0) + (b.losses || 0));
            return wb - wa;
        });
    return sorted.findIndex(x => x.display === p.display) + 1;
}
function getRankByShards(p) {
    const sorted = [...getCurrentSeasonPlayers()]
        .sort((a, b) => (b.shards || 0) - (a.shards || 0));
    return sorted.findIndex(x => x.display === p.display) + 1;
}
function getRankByFaction(p) {
    const sorted = [...getCurrentSeasonPlayers()]
        .sort((a, b) => (b.factionWins || 0) - (a.factionWins || 0));
    return sorted.findIndex(x => x.display === p.display) + 1;
}
function getRankByDungeon(p) {
    const last = allSeasonsCache[allSeasonsCache.length - 1];
    if (!last) return 0;
    const dp = last.data.dungeon?.players || {};
    const sorted = Object.values(dp)
        .filter(d => d && d.record > 0)
        .sort((a, b) => {
            if (b.record !== a.record) return b.record - a.record;
            return (b.damage || 0) - (a.damage || 0);
        });
    return sorted.findIndex(x => x.display === p.display) + 1;
}

async function loadProfile() {
    const nickname = document.getElementById('playerSearch').value.trim();
    const content = document.getElementById('profileContent');
    autocompleteList.classList.remove('show');

    if (!nickname) {
        content.innerHTML = '<div class="not-found"><div class="nf-icon">📜</div><div>Назови имя героя</div></div>';
        return;
    }

    // Кеш уже есть — не показываем «Загружаем...»
    if (!allSeasonsCache) {
        content.innerHTML = '<div class="loading-block"><div class="spinner"></div><p id="loadProgress">Загружаем данные...</p></div>';
        allSeasonsCache = await loadAllSeasons((loaded, total) => {
            const el = document.getElementById('loadProgress');
            if (el) el.textContent = `Загрузка сезонов: ${loaded}/${total}`;
        });
        allPlayersCache = getAllPlayers(allSeasonsCache);
    } else if (!allPlayersCache) {
        allPlayersCache = getAllPlayers(allSeasonsCache);
    }

    try {
        const history = getPlayerHistory(nickname, allSeasonsCache);
        if (history.length === 0) {
            content.innerHTML = `<div class="not-found"><div class="nf-icon">👻</div><div>Я не вижу <strong>${nickname}</strong>.</div></div>`;
            return;
        }

        currentPlayerName = history[0].display;
        localStorage.setItem(LAST_PLAYER_KEY, currentPlayerName);
        window._currentSeasonFilter = 'all';

        // Все анализаторы
        const mainHistory = history.filter(h => !h.isDeleted);
        const last = mainHistory[mainHistory.length - 1] || history[history.length - 1];

        const trend = analyzeTrend(mainHistory);
        const heroAnalysis = analyzeHeroArchive(currentPlayerName, allSeasonsCache);
        const dungeon = analyzeDungeon(currentPlayerName, allSeasonsCache);
        const leaguePlace = getLeaguePlace(currentPlayerName, allSeasonsCache);
        const factions = analyzeFactions(mainHistory);
        const metaBySeason = analyzeMeta(allSeasonsCache);
        const legendSeason = findLegendSeason(mainHistory);
        const peakForm = findPeakForm(mainHistory);
        const swings = findSwings(mainHistory);
        const pace = findPace(mainHistory);
        const top10Compare = compareWithTop10(currentPlayerName, allSeasonsCache);
        const forecast = buildForecast(trend, leaguePlace);
        const narrative = generateNarrative(mainHistory, trend, heroAnalysis, dungeon, leaguePlace);
        const forecastText = generateForecastText(forecast, trend);
        const advice = generateAdvice(trend, heroAnalysis, leaguePlace, metaBySeason, mainHistory);
        const memes = generateMemeAnalysis(mainHistory, trend, heroAnalysis, metaBySeason, leaguePlace);

        // Ранги
        const ranks = {
            season: getSeasonRank(last),
            wins: getRankByWins(last),
            winrate: getRankByWinrate(last),
            faction: getRankByFaction(last),
            shards: getRankByShards(last),
            dungeon: getRankByDungeon(last)
        };

        // Сборка HTML
        let html = renderPlayerInfo(last, ranks);
        html += renderTabs();
        html += renderOverviewTab(mainHistory, last, ranks, narrative);
        html += renderAnalysisTab(mainHistory, trend, swings, pace, legendSeason, peakForm, top10Compare, memes, history);
        html += renderAchievementsTab(last);
        html += renderMetaStyleTab(heroAnalysis, metaBySeason, mainHistory, history, factions);
        html += renderDungeonTab(dungeon);
        html += renderArchiveTab(history, mainHistory, data2x2, currentPlayerName);
        html += renderCompareTab(currentPlayerName);
        html += renderSkillTab(last);
        html += renderProphecyTab(mainHistory, trend, heroAnalysis, leaguePlace, dungeon, forecast, forecastText, advice);

        content.innerHTML = html;

        // Открываем нужный таб из URL
        const urlTab = new URLSearchParams(window.location.search).get('tab');
        if (urlTab) {
            setTimeout(() => switchTab(urlTab), 100);
        }

        // Обновляем URL
        const url = new URL(window.location);
        url.searchParams.set('name', currentPlayerName);
        window.history.replaceState({}, '', url);

    } catch (e) {
        console.error(e);
        content.innerHTML = `<div class="not-found"><div class="nf-icon">💀</div><div>Ошибка: ${e.message}</div></div>`;
    }
}

/* ============================================================================
   СЕКЦИЯ 10. ПОИСК С АВТОКОМПЛИТОМ
   ========================================================================= */
let allSeasonsCache = null;
let allPlayersCache = null;
let currentPlayerName = '';
let data2x2 = {};
let classEmojis = {};
let raceEmojis = {};
let autocompleteIndex = -1;
let autocompleteTimer = null;

const searchInput = document.getElementById('playerSearch');
const autocompleteList = document.getElementById('autocompleteList');

if (searchInput) {
    searchInput.addEventListener('input', function() {
        clearTimeout(autocompleteTimer);
        const query = this.value.trim().toLowerCase();
        if (query.length < 1) { autocompleteList.classList.remove('show'); return; }
        autocompleteTimer = setTimeout(() => {
            if (!allPlayersCache || allPlayersCache.length === 0) {
                autocompleteList.innerHTML = '<div class="autocomplete-empty">⏳ Загрузка базы игроков...</div>';
                autocompleteList.classList.add('show');
                return;
            }
            const matches = allPlayersCache.filter(p => p.display.toLowerCase().includes(query)).slice(0, 10);
            if (matches.length === 0) {
                autocompleteList.innerHTML = '<div class="autocomplete-empty">Никого не найдено</div>';
                autocompleteList.classList.add('show');
                return;
            }
            autocompleteList.innerHTML = matches.map(p => {
                const idx = p.display.toLowerCase().indexOf(query);
                const before = p.display.slice(0, idx);
                const match = p.display.slice(idx, idx + query.length);
                const after = p.display.slice(idx + query.length);
                const tag = p.isActive === false
                    ? `<span style="color:var(--muted);font-size:0.7rem;">S${p.lastSeason}</span>`
                    : '';
                return `<div class="autocomplete-item" data-name="${p.display}">
                    <span class="ac-emoji">${p.emoji}</span>
                    <span class="ac-name">${before}<strong>${match}</strong>${after}</span>
                    <span class="ac-class">${p.name}</span>
                    ${tag}
                </div>`;
            }).join('');
            autocompleteList.classList.add('show');
            autocompleteIndex = -1;
            document.querySelectorAll('.autocomplete-item').forEach(item => {
                item.addEventListener('click', () => {
                    searchInput.value = item.dataset.name;
                    autocompleteList.classList.remove('show');
                    loadProfile();
                });
            });
        }, 50);
    });

    searchInput.addEventListener('keydown', function(e) {
        const items = autocompleteList.querySelectorAll('.autocomplete-item');
        if (e.key === 'ArrowDown') {
            e.preventDefault();
            autocompleteIndex = Math.min(autocompleteIndex + 1, items.length - 1);
            items.forEach((it, i) => it.classList.toggle('active', i === autocompleteIndex));
        } else if (e.key === 'ArrowUp') {
            e.preventDefault();
            autocompleteIndex = Math.max(autocompleteIndex - 1, -1);
            items.forEach((it, i) => it.classList.toggle('active', i === autocompleteIndex));
        } else if (e.key === 'Enter') {
            if (autocompleteIndex >= 0 && items[autocompleteIndex]) {
                e.preventDefault();
                searchInput.value = items[autocompleteIndex].dataset.name;
                autocompleteList.classList.remove('show');
                loadProfile();
            } else {
                autocompleteList.classList.remove('show');
                loadProfile();
            }
        } else if (e.key === 'Escape') {
            autocompleteList.classList.remove('show');
        }
    });
}

document.addEventListener('click', (e) => {
    if (!e.target.closest('.search-row')) autocompleteList?.classList.remove('show');
});

/* ============================================================================
   СЕКЦИЯ 11. UI — прогресс, scroll-top, навигация
   ========================================================================= */
(function() {
    const pb = document.getElementById('readingProgress');
    const st = document.getElementById('scrollTop');
    if (!pb || !st) return;
    window.addEventListener('scroll', () => {
        const s = window.scrollY;
        const dh = document.documentElement.scrollHeight - window.innerHeight;
        pb.style.transform = `scaleX(${dh > 0 ? s / dh : 0})`;
        st.classList.toggle('visible', s > 300);
    });
})();

document.querySelectorAll('.nav-link').forEach(l => {
    l.addEventListener('click', () => {
        document.getElementById('pageNav').classList.remove('show');
        document.querySelector('.nav-toggle').textContent = '☰ Меню';
    });
});
document.querySelectorAll('.nav-label').forEach(label => {
    label.addEventListener('click', function(e) {
        if (window.innerWidth > 768) return;
        e.preventDefault();
        const dd = this.nextElementSibling;
        if (dd && dd.classList.contains('nav-dropdown')) {
            const isOpen = dd.style.display === 'block';
            document.querySelectorAll('.nav-dropdown').forEach(d => d.style.display = 'none');
            dd.style.display = isOpen ? 'none' : 'block';
        }
    });
});

(function() {
    const saved = localStorage.getItem('eternis-theme');
    if (saved) document.documentElement.setAttribute('data-theme', saved);
})();
