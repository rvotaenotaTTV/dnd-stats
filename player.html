<html lang="ru" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Профиль игрока</title>

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

        .search-row { display: flex; gap: 10px; margin-bottom: 24px; align-items: center; flex-wrap: wrap; }
        .search-input {
            padding: 10px 16px;
            background: var(--elevated);
            border: 1px solid var(--border);
            border-radius: 20px;
            color: var(--text);
            font-size: 0.85rem;
            font-family: inherit;
            transition: 0.2s;
            width: 100%;
        }
        .search-input:focus { outline: none; border-color: var(--gold); }
        .search-input::placeholder { color: var(--muted); }
        
        .dropdown-wrap { position: relative; flex: 1; }
        .dropdown-list {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            max-height: 200px;
            overflow-y: auto;
            z-index: 10;
            margin-top: 4px;
        }
        .dropdown-item {
            padding: 10px 16px;
            cursor: pointer;
            color: var(--text);
            font-size: 0.85rem;
            border-bottom: 1px solid var(--border);
            transition: 0.2s;
        }
        .dropdown-item:last-child { border-bottom: none; }
        .dropdown-item:hover { background: var(--elevated); color: var(--gold); }
        
        .profile-hero {
            text-align: center;
            padding: 20px 28px;
            margin-bottom: 16px;
            animation: fadeSlideIn 0.4s ease;
        }
        .profile-emoji { font-size: 3rem; margin-bottom: 4px; }
        .profile-name { font-size: 1.4rem; font-weight: 800; color: var(--gold); }
        .profile-class { color: var(--sub); font-size: 0.85rem; margin-bottom: 2px; }
        .profile-badges {
            display: flex;
            gap: 6px;
            justify-content: center;
            flex-wrap: wrap;
            margin: 8px 0;
        }
        
        .badge {
            padding: 3px 10px;
            border-radius: 15px;
            font-size: 0.65rem;
            font-weight: 700;
        }
        .badge-gold { background: var(--gold); color: #000; }
        .badge-light { background: rgba(240, 185, 11, 0.15); color: var(--gold); }
        .badge-dark { background: rgba(163, 113, 247, 0.2); color: var(--purple); }
        
        .player-tabs {
            display: flex;
            gap: 4px;
            margin: 16px 0;
            padding: 4px;
            background: var(--card);
            border-radius: var(--radius);
            border: 1px solid var(--border);
            flex-wrap: wrap;
        }
        .player-tab {
            padding: 8px 14px;
            border: none;
            background: transparent;
            color: var(--sub);
            border-radius: 14px;
            cursor: pointer;
            font-size: 0.78rem;
            font-weight: 600;
            font-family: inherit;
            transition: 0.2s;
            white-space: nowrap;
            flex: 1;
            text-align: center;
        }
        .player-tab:hover { background: var(--elevated); color: var(--text); }
        .player-tab.active { background: var(--tab-active-bg); color: #000; font-weight: 700; }
        
        .player-tab-content { display: none; }
        .player-tab-content.active { display: block; }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }
        .stat-card {
            background: var(--elevated);
            border-radius: var(--radius-sm);
            padding: 12px 8px;
            text-align: center;
            border: 1px solid var(--border);
            animation: fadeSlideIn 0.3s ease;
        }
        .stat-num { font-size: 1.3rem; font-weight: 800; color: var(--gold); }
        .stat-label {
            font-size: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--muted);
            margin-top: 2px;
        }
        
        .ranks-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }
        .rank-card {
            background: var(--elevated);
            border-radius: var(--radius-sm);
            padding: 12px 8px;
            text-align: center;
            border: 1px solid var(--border);
            animation: fadeSlideIn 0.3s ease;
        }
        .rank-pos { font-size: 1.4rem; font-weight: 800; }
        .rank-label {
            font-size: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--muted);
            margin-top: 2px;
        }
        
        .season-tabs {
            display: flex;
            gap: 4px;
            margin: 16px 0;
            flex-wrap: wrap;
            justify-content: center;
            background: var(--elevated);
            padding: 3px;
            border-radius: 20px;
            border: 1px solid var(--border);
        }
        .season-tab {
            padding: 6px 14px;
            border-radius: 18px;
            font-size: 0.72rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
            background: transparent;
            color: var(--sub);
            font-family: inherit;
            transition: 0.2s;
            white-space: nowrap;
        }
        .season-tab:hover { color: var(--text); }
        .season-tab.active {
            background: var(--gold);
            color: #000;
            font-weight: 700;
            box-shadow: 0 2px 6px rgba(240, 185, 11, 0.25);
        }
        
        .compare-bar {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-bottom: 20px;
            padding: 14px;
            background: var(--elevated);
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            flex-wrap: wrap;
        }
        .compare-bar span { color: var(--sub); font-size: 0.85rem; white-space: nowrap; }
        
        th, td { text-align: center; }
        tr.best-hero td { background: rgba(240, 185, 11, 0.06); }
        tr.best-hero td:first-child::before {
            content: '⭐';
            margin-right: 4px;
            font-size: 0.6rem;
        }
        .td-better { color: var(--green) !important; font-weight: 700; }
        .td-worse { color: var(--red) !important; }
        .compare-table th:first-child, .compare-table td:first-child {
            text-align: left;
            color: var(--muted);
            font-weight: 500;
        }
        
        #allFormerHeroes table { min-width: 750px; }
        #allFormerHeroes td { white-space: nowrap; }
        
        .chart-placeholder {
            text-align: center;
            padding: 20px;
            background: var(--elevated);
            border-radius: var(--radius-sm);
            border: 1px dashed var(--border);
            margin-top: 12px;
        }
        .chart-loader {
            display: inline-block;
            width: 24px;
            height: 24px;
            border: 2px solid var(--border);
            border-top-color: var(--gold);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }
        
        .ach-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 8px;
        }
        .ach-card {
            background: var(--elevated);
            border-radius: var(--radius-sm);
            padding: 12px 10px;
            text-align: center;
            border: 1px solid var(--border);
        }
        .ach-card.earned { border-color: var(--gold); }
        .ach-card.locked { opacity: 0.6; }
        .ach-emoji { font-size: 1.8rem; }
        .ach-name { color: var(--gold); font-weight: 700; font-size: 0.8rem; margin: 4px 0; }
        .ach-progress {
            height: 4px;
            background: var(--bg);
            border-radius: 2px;
            margin-top: 6px;
        }
        .ach-fill { height: 4px; background: var(--gold); border-radius: 2px; }
        
        .skill-hero { text-align: center; margin-bottom: 20px; }
        .skill-value { font-size: 3rem; font-weight: 900; color: var(--gold); }
        .skill-formula-box, .skill-breakdown, .skill-total {
            background: var(--elevated);
            border-radius: var(--radius-sm);
            padding: 16px;
            margin-bottom: 20px;
        }
        .skill-component { margin-bottom: 14px; }
        .skill-bar {
            background: var(--bg);
            height: 6px;
            border-radius: 3px;
            overflow: hidden;
        }
        .skill-bar-fill { height: 6px; border-radius: 3px; }
        
        .hero-card {
            background: var(--elevated);
            border-radius: var(--radius);
            padding: 0;
            border: 1px solid var(--border);
            overflow: hidden;
            transition: 0.2s;
        }
        .hero-card.best {
            border-color: var(--gold);
            box-shadow: 0 0 16px rgba(240, 185, 11, 0.15);
        }
        .hero-card-header {
            padding: 14px 14px 10px 14px;
            text-align: center;
        }
        .hero-card-footer {
            display: flex;
            justify-content: space-around;
            padding: 8px 14px;
            background: var(--bg);
            font-size: 0.6rem;
            color: var(--muted);
            border-top: 1px solid var(--border);
        }
        
        .summary-stat {
            flex: 1;
            min-width: 60px;
            background: var(--elevated);
            border-radius: var(--radius-sm);
            padding: 8px;
            text-align: center;
            border: 1px solid var(--border);
        }
        .summary-value { font-size: 1rem; font-weight: 800; color: var(--gold); }
        .summary-label { font-size: 0.55rem; color: var(--muted); }
        
        .mini-stat {
            background: var(--bg);
            border-radius: 8px;
            padding: 6px 4px;
            font-size: 0.7rem;
        }
        .mini-stat-label { color: var(--muted); font-size: 0.55rem; }
        .mini-stat-value { color: var(--text); font-weight: 600; }
        
        tbody tr:nth-child(1) { animation-delay: 0.02s; }
        tbody tr:nth-child(2) { animation-delay: 0.04s; }
        tbody tr:nth-child(3) { animation-delay: 0.06s; }
        tbody tr:nth-child(4) { animation-delay: 0.08s; }
        tbody tr:nth-child(5) { animation-delay: 0.1s; }
        tbody tr:nth-child(6) { animation-delay: 0.12s; }
        tbody tr:nth-child(7) { animation-delay: 0.14s; }
        tbody tr:nth-child(8) { animation-delay: 0.16s; }
        tbody tr:nth-child(9) { animation-delay: 0.18s; }
        tbody tr:nth-child(10) { animation-delay: 0.2s; }
        tbody tr:nth-child(11) { animation-delay: 0.22s; }
        tbody tr:nth-child(12) { animation-delay: 0.24s; }
        tbody tr:nth-child(13) { animation-delay: 0.26s; }
        
        @media (max-width: 768px) {
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
            .ranks-grid { grid-template-columns: repeat(2, 1fr); }
            .player-tabs { flex-wrap: wrap; }
            .player-tab { font-size: 0.7rem; padding: 6px 8px; }
            .ach-grid { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>

    // ============ ИНИЦИАЛИЗАЦИЯ ============
    function initTheme() {
        const savedTheme = localStorage.getItem('eternis-theme');
        if (savedTheme) document.documentElement.setAttribute('data-theme', savedTheme);
    }

    window.toggleTheme = () => {
        const html = document.documentElement;
        const newTheme = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        html.setAttribute('data-theme', newTheme);
        localStorage.setItem('eternis-theme', newTheme);
    };

    window.toggleNav = () => {
        const nav = $('#pageNav');
        const btn = $('.nav-toggle');
        nav.classList.toggle('show');
        btn.textContent = nav.classList.contains('show') ? '✕ Закрыть' : '☰ Меню';
    };

    function initNavigation() {
        $('#pageNav').addEventListener('click', (e) => {
            if (e.target.classList.contains('nav-link')) {
                $('#pageNav').classList.remove('show');
                $('.nav-toggle').textContent = '☰ Меню';
            }
        });

        $$('.nav-label').forEach(label => {
            label.addEventListener('click', function() {
                if (window.innerWidth > 768) return;
                const dropdown = this.nextElementSibling;
                if (dropdown?.classList.contains('nav-dropdown')) {
                    const isOpen = dropdown.style.display === 'block';
                    $$('.nav-dropdown').forEach(d => d.style.display = 'none');
                    dropdown.style.display = isOpen ? 'none' : 'block';
                }
            });
        });
    }

    // ============ ЗАГРУЗКА ДАННЫХ ============
    async function loadData() {
        const urls = [
            'https://raw.githubusercontent.com/rvotaenotaTTV/dnd-stats/main/stats_data.json',
            'https://cdn.jsdelivr.net/gh/rvotaenotaTTV/dnd-stats@main/stats_data.json'
        ];
        
        for (const url of urls) {
            try {
                const response = await fetch(url);
                if (response.ok) {
                    const data = await response.json();
                    allPlayers = (data.players || []).filter(p => p.name && p.name !== 'Unknown');
                    dungeonPlayers = data.dungeon?.players || {};
                    heroArchive = data.heroArchive || {};
                    return true;
                }
            } catch (e) {
                console.warn('Failed to load from', url);
            }
        }
        return false;
    }

    // ============ ПОИСК ИГРОКОВ ============
    function findPlayer(name) {
        if (!name || !allPlayers.length) return null;
        const searchTerm = name.toLowerCase().trim();
        return allPlayers.find(p => p.display?.toLowerCase() === searchTerm)
            || allPlayers.find(p => p.display?.toLowerCase().includes(searchTerm))
            || null;
    }

    window.filterPlayerList = () => {
        const input = $('#playerSearch');
        const dropdown = $('#playerDropdown');
        const value = input.value.toLowerCase().trim();
        
        if (!value || !allPlayers.length) {
            dropdown.style.display = 'none';
            return;
        }
        
        const filtered = allPlayers
            .filter(p => p.display?.toLowerCase().includes(value))
            .slice(0, 8);
        
        if (!filtered.length) {
            dropdown.style.display = 'none';
            return;
        }
        
        dropdown.innerHTML = filtered.map(p => 
            `<div class="dropdown-item" onclick="selectPlayer('${escapeHtml(p.display)}')">${p.emoji || '⚔️'} ${p.display}</div>`
        ).join('');
        dropdown.style.display = 'block';
    };

    window.selectPlayer = (name) => {
        $('#playerSearch').value = name;
        $('#playerDropdown').style.display = 'none';
        loadProfile();
    };

    window.filterCompareList = () => {
        const input = $('#compareInput');
        const dropdown = $('#compareDropdown');
        if (!input) return;
        
        const value = input.value.toLowerCase().trim();
        if (!value || !allPlayers.length) {
            dropdown.style.display = 'none';
            return;
        }
        
        const filtered = allPlayers
            .filter(p => p.display?.toLowerCase().includes(value))
            .slice(0, 8);
        
        if (!filtered.length) {
            dropdown.style.display = 'none';
            return;
        }
        
        dropdown.innerHTML = filtered.map(p => 
            `<div class="dropdown-item" onclick="selectCompare('${escapeHtml(p.display)}')">${p.emoji || '⚔️'} ${p.display}</div>`
        ).join('');
        dropdown.style.display = 'block';
    };

    window.selectCompare = (name) => {
        $('#compareInput').value = name;
        $('#compareDropdown').style.display = 'none';
        compareWith(name);
    };

    // ============ РЕНДЕРИНГ ПРОФИЛЯ ============
    window.loadProfile = async () => {
        if (!allPlayers.length) await loadData();
        
        const player = findPlayer($('#playerSearch').value.trim());
        const content = $('#profileContent');
        
        if (player) {
            content.innerHTML = renderProfile(player);
            renderAchievements();
            setTimeout(() => loadAllSeasons(player.display), 200);
        } else {
            content.innerHTML = '<div class="status-message">Игрок не найден</div>';
        }
    };

    function renderProfile(p) {
        currentProfileName = p.display;
        const total = (p.wins || 0) + (p.losses || 0);
        const winrate = total > 0 ? (p.wins * 100 / total).toFixed(1) : '0.0';
        const faction = p.faction || '';
        const factionIcon = faction === 'Орден Света' ? '🌝' : (faction === 'Культ Тьмы' ? '🌚' : '');
        const dungeon = dungeonPlayers[p.display];
        
        const seasonRank = getSeasonRank(p);
        const winRank = getRankByWins(p);
        const winrateRank = getRankByWinrate(p);
        const shardsRank = getRankByShards(p);
        const dungeonRank = getRankByDungeon(p);
        const factionRank = getRankByFaction(p);
        
        const colorForRank = (rank) => rank <= 3 ? 'var(--gold)' : rank <= 10 ? 'var(--green)' : 'var(--muted)';
        
        let html = `
        <section class="section gold">
            <div class="profile-hero">
                <div class="profile-emoji">${p.emoji || '⚔️'}</div>
                <div class="profile-name">${p.display}${p.champion ? ' 👑' : ''}</div>
                <div class="profile-class">${p.name || ''} · SKILL ${p.skill || 0} · Ур. ${p.level || 0}</div>
                <div class="profile-badges">
                    ${p.champion ? '<span class="badge badge-gold">👑 Хранитель</span>' : ''}
                    ${faction ? `<span class="badge ${faction === 'Орден Света' ? 'badge-light' : 'badge-dark'}">${factionIcon} ${faction}</span>` : ''}
                    ${seasonRank > 0 ? `<span class="badge badge-light">🏆 Топ-${seasonRank} сезона</span>` : ''}
                </div>
                <button class="btn btn-secondary" onclick="copyProfileLink()">🔗 Копировать ссылку</button>
            </div>
        </section>`;
        
        html += renderTabs();
        html += renderOverviewTab(p, total, winrate, dungeon, winRank, winrateRank, shardsRank, dungeonRank, seasonRank, factionRank, colorForRank);
        html += `<div id="ptab-winrate" class="player-tab-content">
            <div class="chart-placeholder">
                <button class="btn btn-chart" onclick="drawWinrateChart('${escapeHtml(p.display)}')">📈 Показать график винрейта</button>
                <div style="color:var(--muted);font-size:.7rem;margin-top:6px">Загружает историю из GitHub</div>
            </div>
        </div>`;
        html += `<div id="ptab-achievements" class="player-tab-content">
            <div style="text-align:center;padding:40px;color:var(--sub)">Открой вкладку для загрузки</div>
        </div>`;
        html += `<div id="ptab-former" class="player-tab-content">
            <div id="allFormerHeroes" style="min-height:200px"></div>
        </div>`;
        html += `<div id="ptab-compare" class="player-tab-content">
            <div class="compare-bar">
                <span>⚔️ Сравнить с:</span>
                <div class="dropdown-wrap" style="flex:1;min-width:150px">
                    <input type="text" class="search-input" id="compareInput" placeholder="Введи ник..." oninput="filterCompareList()" onkeydown="if(event.key==='Enter'){const n=document.getElementById('compareInput').value.trim();if(n)compareWith(n)}">
                    <div class="dropdown-list" id="compareDropdown"></div>
                </div>
            </div>
            <div id="compareResult"></div>

        return html;

    function renderTabs() {
        const tabs = [
            ['current', '👤 Обзор', true],
            ['winrate', '📈 Винрейт', false],
            ['achievements', '🏅 Достижения', false],
            ['former', '👻 Бывшие', false],
            ['compare', '⚔️ Сравнить', false],
            ['skill', '📐 Skill', false]
        ];
        
        return `

                `<button class="player-tab ${active ? 'active' : ''}" onclick="switchTab('${id}')">${label}</button>`

    function renderOverviewTab(p, total, winrate, dungeon, winRank, winrateRank, shardsRank, dungeonRank, seasonRank, factionRank, colorForRank) {
        const teamWins = p.teamWins || 0;
        const teamLosses = p.teamLoses || 0;
        const teamTotal = teamWins + teamLosses;
        const teamWinrate = teamTotal > 0 ? (teamWins * 100 / teamTotal).toFixed(1) + '%' : '—';
        
		const stats = [
			// Ряд 1: Арена 1v1 (4)
			{ value: p.wins || 0, label: '⚔️ Победы' },
			{ value: p.losses || 0, label: '💀 Поражения' },
			{ value: winrate + '%', label: '📊 Винрейт' },
			{ value: p.tournamentWins || 0, label: '👑 Турниры' },
			
			// Ряд 2: Арена 2v2 (4)
			{ value: teamWins, label: '⚔️ 2v2 Победы' },
			{ value: teamLosses, label: '💀 2v2 Поражения' },
			{ value: teamWinrate, label: '📊 2v2 Винрейт' },
			{ value: p.teamTournamentWins || 0, label: '👑 2v2 Турниры' },
			
			// Ряд 3: Общее (4)
			{ value: total, label: '⚡ Всего боёв' },
			{ value: p.best || 0, label: '🔥 Лучший стрик' },
			{ value: p.worst || 0, label: '💔 Худший стрик' },
			{ value: p.factionWins || 0, label: '🌍 Фракционные победы' },
			
			// Ряд 4: Прогресс + PvE (4)
			{ value: p.level || 0, label: '📈 Уровень' },
			{ value: p.shards || 0, label: '💎 Осколки' },
			{ value: dungeon ? dungeon.record : '-', label: '🏔 Рекорд данжа' },
			{ value: dungeon ? dungeon.trophies : '-', label: '🐉 Трофеев' }
		];
        
		const ranks = [
			{ rank: seasonRank, label: 'По SKILL' },
			{ rank: winRank, label: 'По победам' },
			{ rank: winrateRank, label: 'По винрейту' },
			{ rank: factionRank, label: 'По фракционным победам' },
			{ rank: shardsRank, label: 'По осколкам' },
			{ rank: dungeonRank, label: 'По данжу' }
		];
        
        return `
        <div id="ptab-current" class="player-tab-content active">
            <div class="stats-grid">
                ${stats.map(s => `
                    <div class="stat-card">
                        <div class="stat-num">${s.value}</div>
                        <div class="stat-label">${s.label}</div>
                    </div>
                `).join('')}
            </div>
            <div class="ranks-grid">
                ${ranks.map(r => `
                    <div class="rank-card">
                        <div class="rank-pos" style="color:${colorForRank(r.rank)}">#${r.rank || '-'}</div>
                        <div class="rank-label">${r.label}</div>
                    </div>
                `).join('')}
            </div>
        </div>`;
    }

    // ============ РАНГИ ============
    function getSeasonRank(p) {
        const sorted = [...allPlayers]
            .filter(x => x.skill > 0)
            .sort((a, b) => b.skill - a.skill);
        return sorted.findIndex(x => x.display === p.display) + 1;
    }

    function getRankByWins(p) {
        const sorted = [...allPlayers].sort((a, b) => (b.wins || 0) - (a.wins || 0));
        return sorted.findIndex(x => x.display === p.display) + 1;
    }

    function getRankByWinrate(p) {
        const sorted = [...allPlayers]
            .filter(x => ((x.wins || 0) + (x.losses || 0)) >= 20)
            .sort((a, b) => {
                const wa = (a.wins || 0) / ((a.wins || 0) + (a.losses || 0));
                const wb = (b.wins || 0) / ((b.wins || 0) + (b.losses || 0));
                return wb - wa;
            });
        return sorted.findIndex(x => x.display === p.display) + 1;
    }

    function getRankByShards(p) {
        const sorted = [...allPlayers].sort((a, b) => (b.shards || 0) - (a.shards || 0));
        return sorted.findIndex(x => x.display === p.display) + 1;
    }

	function getRankByDungeon(p) {
		const playerRecord = dungeonPlayers[p.display]?.record || 0;
		const playerDamage = dungeonPlayers[p.display]?.damage || 0;
		
		const sorted = allPlayers
			.filter(x => {
				const d = dungeonPlayers[x.display];
				return d && d.record > 0;
			})
			.sort((a, b) => {
				const dA = dungeonPlayers[a.display];
				const dB = dungeonPlayers[b.display];
				
				// Сначала по рекорду
				if (dB.record !== dA.record) return dB.record - dA.record;
				
				// Потом по урону
				return (dB.damage || 0) - (dA.damage || 0);
			});
		
		return sorted.findIndex(x => x.display === p.display) + 1;
	}

    function getRankByFaction(p) {
        const sorted = [...allPlayers].sort((a, b) => (b.factionWins || 0) - (a.factionWins || 0));
        return sorted.findIndex(x => x.display === p.display) + 1;
    }

    // ============ ПЕРЕКЛЮЧЕНИЕ ВКЛАДОК ============
    window.switchTab = (tabId) => {
        $$('.player-tab').forEach(btn => btn.classList.remove('active'));
        $$('.player-tab-content').forEach(content => content.classList.remove('active'));
        
        const tabLabels = {
            current: '👤 Обзор',
            winrate: '📈 Винрейт',
            achievements: '🏅 Достижения',
            former: '👻 Бывшие',
            compare: '⚔️ Сравнить',
            skill: '📐 Skill'
        };
        
        $$('.player-tab').forEach(btn => {
            if (btn.textContent.trim() === tabLabels[tabId]) btn.classList.add('active');
        });
        
        const content = $('#ptab-' + tabId);
        if (content) content.classList.add('active');
        
        if (tabId === 'skill') {
            const player = findPlayer(currentProfileName);
            if (player) $('#ptab-skill').innerHTML = renderSkill(player);
        }
    };

	// ============ SKILL ============
	function renderSkill(p) {
		const total = (p.wins || 0) + (p.losses || 0);
		const wr = total > 0 ? (p.wins / total) : 0;
		const skill = p.skill || 0;
		const denominator = Math.sqrt(total / 75 + 1);
		
		const components = [
			{ icon: '⚔️', name: 'Победы × Винрейт', detail: `${p.wins} × ${(wr * 100).toFixed(1)}% × 7`, value: (p.wins || 0) * wr * 7, color: 'var(--gold)' },
			{ icon: '🔥', name: 'Лучший стрик', detail: `${p.best} × 10`, value: (p.best || 0) * 10, color: 'var(--red)' },
			{ icon: '📈', name: 'Уровень', detail: `${p.level} × 2`, value: (p.level || 0) * 2, color: 'var(--green)' },
			{ icon: '👑', name: 'Турнирные победы', detail: `${p.tournamentWins} × 25`, value: (p.tournamentWins || 0) * 25, color: 'var(--purple)' },
			{ icon: '🌍', name: 'Фракционные победы', detail: `${p.factionWins} × 2`, value: (p.factionWins || 0) * 2, color: 'var(--ice)' }
		];
		
		const totalValue = components.reduce((sum, c) => sum + c.value, 0);
		const calculatedSkill = Math.floor(totalValue / denominator);
		
		return `
		<div class="section gold" style="padding:24px 20px; text-align:center;">
			<div style="font-size:3rem; font-weight:900; color:var(--gold); line-height:1;">${skill}</div>
			<div style="font-size:0.65rem; color:var(--muted); text-transform:uppercase; letter-spacing:2px; margin-top:4px;">Текущий SKILL</div>
		</div>
			
		<div class="section gold" style="padding:20px;">
			<div style="display:flex; flex-direction:column; gap:12px;">
				${components.map(c => {
					const percent = totalValue > 0 ? (c.value / totalValue) * 100 : 0;
					return `
					<div style="background:var(--elevated); border:1px solid var(--border); border-radius:var(--radius-sm); padding:14px 16px; border-left:3px solid ${c.color};">
						<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
							<span style="font-size:0.85rem; color:var(--text); font-weight:600;">${c.icon} ${c.name}</span>
							<span style="font-size:0.8rem; color:${c.color}; font-weight:700;">${percent.toFixed(1)}%</span>
						</div>
						<div style="display:flex; justify-content:space-between; font-size:0.72rem; color:var(--muted); margin-bottom:8px;">
							<span>${c.detail}</span>
							<span>= ${c.value.toFixed(0)}</span>
						</div>
						<div style="background:var(--bg); height:6px; border-radius:3px; overflow:hidden;">
							<div style="width:${percent}%; height:6px; background:${c.color}; border-radius:3px;"></div>
						</div>
					</div>`;
				}).join('')}
			</div>
		</div>
		
		<div class="section gold" style="padding:20px; text-align:center;">
			<div style="font-size:0.8rem; color:var(--sub);">Сумма компонентов</div>
			<div style="font-size:1.3rem; font-weight:800; color:var(--gold); margin-top:4px;">${totalValue.toFixed(0)}</div>
			<div style="font-size:0.7rem; color:var(--muted); margin-top:6px;">Делитель: √(${total} / 75 + 1) = ${denominator.toFixed(2)}</div>
		</div>`;
	}

    // ============ ДОСТИЖЕНИЯ ============
    function renderAchievements() {
        const p = findPlayer($('#playerSearch').value.trim());
        if (!p) return;
        
        const dp = dungeonPlayers[p.display];
        if (dp) {
            p.dr = dp.record;
            p.dt = dp.trophies;
            p.db = dp.bosses;
            p.dw = dp.totalWaves;
        }
        
        const total = p.wins + p.losses;
        
        const checkAchievement = (a) => {
            if (a.m && total < a.m) return false;
            switch (a.t) {
                case "level": return p.level >= a.v;
                case "wins": return p.wins >= a.v;
                case "losses": return p.losses >= a.v;
                case "best": return p.best >= a.v;
                case "worst": return p.worst >= a.v;
                case "fights": return total >= a.v;
                case "tournament": return p.tournamentWins >= a.v;
                case "faction": return p.faction === a.f && p.factionWins >= a.v;
                case "winrate": return total > 0 && (p.wins * 100 / total) >= a.v;
                case "balance": return p.wins === p.losses && total >= (a.m || 20);
                case "champion": return p.champion === true;
                case "dungeon_record": return (p.dr || 0) >= a.v;
                case "dungeon_trophies": return (p.dt || 0) >= a.v;
                case "dungeon_bosses": return (p.db || 0) >= a.v;
                case "dungeon_waves": return (p.dw || 0) >= a.v;
                default: return false;
            }
        };
        
        const earned = ACHIEVEMENTS.filter(checkAchievement);
        const locked = ACHIEVEMENTS.filter(a => !checkAchievement(a));
        
        let html = `
        <div style="text-align:center;margin-bottom:16px">
            <span style="font-size:2rem">🏅</span>
            <div style="color:var(--gold);font-weight:700;font-size:1.1rem">${earned.length} / ${ACHIEVEMENTS.length} титулов</div>
            <div style="background:var(--bg);height:8px;border-radius:4px;margin:8px 0">
                <div style="background:var(--gold);height:8px;border-radius:4px;width:${(earned.length / ACHIEVEMENTS.length) * 100}%"></div>
            </div>
        </div>`;
        
        if (earned.length) {
            html += `
            <section class="section gold">
                <div class="section-title">✅ Полученные (${earned.length})</div>
                <div class="ach-grid">
                    ${earned.map(a => `
                        <div class="ach-card earned">
                            <div class="ach-emoji">${a.e}</div>
                            <div class="ach-name">${a.n}</div>
                            <div style="font-size:.6rem;color:var(--muted)">${getAchievementCondition(a)}</div>
                        </div>
                    `).join('')}
                </div>
            </section>`;
        }
        
        if (locked.length) {
            html += `
            <section class="section">
                <div class="section-title">🔒 Не получены (${locked.length})</div>
                <div class="ach-grid">
                    ${locked.map(a => renderLockedAchievement(a, p, total)).join('')}
                </div>
            </section>`;
        }
        
        $('#ptab-achievements').innerHTML = html;
    }

    function getAchievementCondition(a) {
        switch (a.t) {
            case "level": return a.v + ' уровень';
            case "wins": return a.v + ' побед';
            case "losses": return a.v + ' поражений';
            case "best": return 'Стрик ' + a.v;
            case "worst": return 'Лузстрик ' + a.v;
            case "fights": return a.v + ' боёв';
            case "tournament": return a.v + ' турнирных побед';
            case "faction": return a.v + ' побед за ' + a.f;
            case "winrate": return 'Винрейт ' + a.v + '%';
            case "dungeon_record": return a.v + ' волн в данже';
            case "dungeon_trophies": return a.v + ' трофеев';
            case "dungeon_bosses": return a.v + ' боссов';
            case "dungeon_waves": return a.v + ' волн всего';
            case "champion": return 'Текущий чемпион';
            case "balance": return 'Побед = Поражений (20+ боёв)';
            default: return '';
        }
    }

    function renderLockedAchievement(a, p, total) {
        let current = 0;
        let max = a.v || 0;
        let conditionText = getAchievementCondition(a);
        
        switch (a.t) {
            case "level": current = p.level; break;
            case "wins": current = p.wins; break;
            case "losses": current = p.losses; break;
            case "best": current = p.best; break;
            case "worst": current = p.worst; break;
            case "fights": current = total; break;
            case "tournament": current = p.tournamentWins; break;
            case "faction": current = p.faction === a.f ? p.factionWins : 0; break;
            case "winrate": current = total > 0 ? parseFloat((p.wins * 100 / total).toFixed(1)) : 0; break;
            case "dungeon_record": current = p.dr || 0; break;
            case "dungeon_trophies": current = p.dt || 0; break;
            case "dungeon_bosses": current = p.db || 0; break;
            case "dungeon_waves": current = p.dw || 0; break;
            case "champion": max = 1; break;
            case "balance": current = total >= 20 ? 1 : 0; max = 1; break;
        }
        
        const percent = Math.min(100, (current / max) * 100);
        
        return `
        <div class="ach-card locked">
            <div class="ach-emoji">${a.e}</div>
            <div class="ach-name">${a.n}</div>
            <div style="font-size:.65rem;color:var(--muted)">${conditionText}</div>
            ${a.t !== 'balance' && a.t !== 'champion' ? `
                <div style="font-size:.65rem;color:var(--muted)">${current}/${max}</div>
                <div class="ach-progress"><div class="ach-fill" style="width:${percent}%"></div></div>
            ` : ''}
        </div>`;
    }

    // ============ ГРАФИК ВИНРЕЙТА ============
    window.drawWinrateChart = async (playerName) => {
        const container = $('#ptab-winrate');
        if (!container) return;
        
        container.innerHTML = '<div class="chart-placeholder"><span class="chart-loader"></span> Загрузка...</div>';
        
        try {
            const player = allPlayers.find(p => p.display === playerName);
            if (!player) return;
            
            const pages = await Promise.all([1, 2, 3, 4, 5, 6].map(page =>
                fetch(`https://api.github.com/repos/rvotaenotaTTV/dnd-stats/commits?path=stats_data.json&per_page=30&page=${page}`).then(r => r.json())
            ));
            
            const allCommits = pages.flat().filter(c => c?.sha);
            if (allCommits.length < 5) {
                container.innerHTML = '<div class="chart-placeholder">⚠️ Недостаточно истории</div>';
                return;
            }
            
            const step = Math.floor(allCommits.length / 4);
            const selectedCommits = [
                allCommits[allCommits.length - 1],
                allCommits[allCommits.length - 1 - step],
                allCommits[Math.floor(allCommits.length / 2)],
                allCommits[step],
                null
            ];
            
            const oldSlices = await Promise.all(selectedCommits.slice(0, 4).map(commit =>
                fetch(`https://raw.githubusercontent.com/rvotaenotaTTV/dnd-stats/${commit.sha}/stats_data.json`).then(r => r.json())
            ));
            
            const points = [];
            const labels = [];
            const now = Date.now();
            
            oldSlices.forEach((data, i) => {
                const p = (data.players || []).find(x => x.display === playerName);
                if (p) {
                    const t = (p.wins || 0) + (p.losses || 0);
                    const wr = t > 0 ? (p.wins / t * 100) : 0;
                    points.push(wr);
                    labels.push(`${Math.round((now - new Date(selectedCommits[i].commit.committer.date).getTime()) / 3600000)}ч`);
                }
            });
            
            const t = (player.wins || 0) + (player.losses || 0);
            const currentWr = t > 0 ? (player.wins / t * 100) : 0;
            points.push(currentWr);
            labels.push('Сейчас');
            
            if (points.length < 3) {
                container.innerHTML = '<div class="chart-placeholder">⚠️ Недостаточно данных</div>';
                return;
            }
            
            renderWinrateChart(container, points, labels, playerName);
        } catch (e) {
            container.innerHTML = '<div class="chart-placeholder" style="color:var(--red)">❌ Ошибка</div>';
        }
    };

    function renderWinrateChart(container, points, labels, playerName) {
        const W = 600;
        const H = 200;
        const P = 50;
        const minW = Math.min(...points) - 2;
        const maxW = Math.max(...points) + 2;
        const range = maxW - minW || 1;
        
        const gX = (i) => P + (W - P * 2) * i / (points.length - 1);
        const gY = (v) => H - P - ((v - minW) / range) * (H - P * 2);
        
        const svgPoints = points.map((p, i) => `${gX(i)},${gY(p)}`).join(' ');
        const circles = points.map((p, i) => {
            const color = i === points.length - 1 ? (p >= points[0] ? '#10b981' : '#ef4444') : '#f0b90b';
            return `<circle cx="${gX(i)}" cy="${gY(p)}" r="6" fill="var(--card)" stroke="${color}" stroke-width="2.5"/>`;
        }).join('');
        const texts = points.map((p, i) => 
            `<text x="${gX(i)}" y="${gY(p) - 14}" text-anchor="middle" fill="#f0b90b" font-size="11" font-weight="700">${p.toFixed(1)}%</text>`
        ).join('');
        const bottomLabels = labels.map((l, i) => 
            `<text x="${gX(i)}" y="${H - 8}" text-anchor="middle" fill="#8a94a8" font-size="10">${l}</text>`
        ).join('');
        
        const diff = points[points.length - 1] - points[0];
        const diffText = diff >= 0 ? `+${diff.toFixed(1)}%` : `${diff.toFixed(1)}%`;
        const diffColor = diff >= 0 ? 'var(--green)' : 'var(--red)';
        
        container.innerHTML = `
        <section class="section gold" style="padding:18px">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
                <div class="section-title" style="font-size:.9rem;margin:0">📈 Динамика винрейта</div>
                <button class="btn btn-secondary" style="font-size:.7rem;padding:4px 10px" onclick="resetWinrateChart('${escapeHtml(playerName)}')">✕ Скрыть</button>
            </div>
            <div style="text-align:center;margin-bottom:4px;font-size:.8rem;color:var(--sub)">
                ${points[0].toFixed(1)}% → <span style="color:${diffColor};font-weight:700">${points[points.length - 1].toFixed(1)}% (${diffText})</span>
            </div>
            <svg width="100%" height="${H}" viewBox="0 0 ${W} ${H}" style="display:block">
                <polygon points="${gX(0)},${H - P} ${svgPoints} ${gX(points.length - 1)},${H - P}" fill="rgba(240,185,11,0.06)"/>
                <polyline points="${svgPoints}" fill="none" stroke="#f0b90b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                ${circles}${texts}${bottomLabels}
            </svg>
        </section>`;
    }

    window.resetWinrateChart = (playerName) => {
        const container = $('#ptab-winrate');
        if (container) {
            container.innerHTML = `
            <div class="chart-placeholder">
                <button class="btn btn-chart" onclick="drawWinrateChart('${escapeHtml(playerName)}')">📈 Показать график винрейта</button>
            </div>`;
        }
    };

    // ============ СРАВНЕНИЕ ============
    window.compareWith = (name) => {
        const p1 = findPlayer($('#playerSearch').value.trim());
        const p2 = findPlayer(name);
        const result = $('#compareResult');
        result.innerHTML = p2 ? renderCompare(p1, p2) : '';
    };

    function renderCompare(p1, p2) {
        if (!p1 || !p2) return '';
        
        const d1 = dungeonPlayers[p1.display];
        const d2 = dungeonPlayers[p2.display];
        
        const rows = [
            ['Победы', p1.wins || 0, p2.wins || 0, true],
            ['Поражения', p1.losses || 0, p2.losses || 0, false],
            ['Винрейт', 
                ((p1.wins || 0) / ((p1.wins || 0) + (p1.losses || 0) || 1) * 100).toFixed(1) + '%', 
                ((p2.wins || 0) / ((p2.wins || 0) + (p2.losses || 0) || 1) * 100).toFixed(1) + '%', 
                true],
            ['SKILL', p1.skill || 0, p2.skill || 0, true],
            ['Всего боёв', (p1.wins || 0) + (p1.losses || 0), (p2.wins || 0) + (p2.losses || 0), true],
            ['Лучший стрик', p1.best || 0, p2.best || 0, true],
            ['Осколки', p1.shards || 0, p2.shards || 0, true],
            ['Уровень', p1.level || 0, p2.level || 0, true],
            ['Турниры', p1.tournamentWins || 0, p2.tournamentWins || 0, true],
            ['Рекорд данжа', d1 ? d1.record : '-', d2 ? d2.record : '-', true]
        ];
        
        let tableHtml = '<div class="table-container"><table class="compare-table"><thead><tr><th>Стат</th><th>' + p1.display + '</th><th>' + p2.display + '</th></tr></thead><tbody>';
        
        rows.forEach(([label, val1, val2, higherIsBetter]) => {
            let class1 = '';
            let class2 = '';
            
            if (typeof val1 === 'number' && typeof val2 === 'number') {
                if (val1 > val2) {
                    class1 = higherIsBetter ? 'td-better' : 'td-worse';
                    class2 = higherIsBetter ? 'td-worse' : 'td-better';
                } else if (val2 > val1) {
                    class1 = higherIsBetter ? 'td-worse' : 'td-better';
                    class2 = higherIsBetter ? 'td-better' : 'td-worse';
                }
            }
            
            tableHtml += `<tr><td>${label}</td><td class="${class1}">${val1}</td><td class="${class2}">${val2}</td></tr>`;
        });
        
        tableHtml += '</tbody></table></div>';
        return tableHtml;
    }

    // ============ БЫВШИЕ ГЕРОИ ============
    async function loadAllSeasons(playerName) {
        const container = $('#allFormerHeroes');
        if (!container) return;
        
        cachedAllHeroes = [];
        const seen = new Set();
        const playerKey = playerName.toLowerCase();
        
        // Текущие герои из архива
        const currentArchive = heroArchive[playerKey] || [];
        const currentDungeon = dungeonPlayers[playerKey] || null;
        const currentPlayer = allPlayers.find(p => p.display?.toLowerCase() === playerKey);
        
        currentArchive.forEach(hero => {
            const id = `c-${hero.name}-${hero.wins}-${hero.losses}`;
            if (!seen.has(id)) {
                seen.add(id);
                cachedAllHeroes.push({
                    ...hero,
                    level: currentPlayer?.level || hero.level || 0,
                    record: currentDungeon?.record || hero.record || 0,
                    season: '📋 Текущий',
                    seasonIndex: 999,
                    isCurrent: true
                });
            }
        });
        
        // Загрузка архивных сезонов
        seasonNames = [];
        let seasonIndex = 0;
        
        while (seasonIndex < 20) {
            const filename = `season_${seasonIndex}.json`;
            let data = null;
            
            try {
                const response = await fetch(`https://raw.githubusercontent.com/rvotaenotaTTV/dnd-stats/main/seasons/${filename}`);
                if (!response.ok) break;
                data = await response.json();
            } catch (e) {
                break;
            }
            
            const icon = SEASON_ICONS[seasonIndex] || '📋';
            seasonNames[seasonIndex] = `${icon} Сезон ${seasonIndex}`;
            
            const player = data.players?.find(p => p.display?.toLowerCase() === playerKey);
            if (player?.name && player.name !== 'Unknown') {
                const id = `s${seasonIndex}-${player.name}`;
                if (!seen.has(id)) {
                    seen.add(id);
                    const seasonDungeon = data.dungeon?.players?.[playerKey] || null;
                    cachedAllHeroes.push({
                        name: player.name,
                        emoji: player.emoji || '',
                        wins: player.wins || 0,
                        losses: player.losses || 0,
                        best: player.best || 0,
                        worst: player.worst || 0,
                        tournamentWins: player.tournamentWins || 0,
                        level: player.level || 0,
                        record: seasonDungeon?.record || 0,
                        season: seasonNames[seasonIndex],
                        seasonIndex: seasonIndex,
                        isCurrent: false
                    });
                }
            }
            
            const archive = data.heroArchive?.[playerKey];
            if (archive) {
                archive.forEach(hero => {
                    const id = `s${seasonIndex}-a-${hero.name}-${hero.wins}-${hero.losses}`;
                    if (!seen.has(id)) {
                        seen.add(id);
                        cachedAllHeroes.push({
                            ...hero,
                            level: hero.level || 0,
                            record: hero.record || 0,
                            season: seasonNames[seasonIndex],
                            seasonIndex: seasonIndex,
                            isCurrent: false
                        });
                    }
                });
            }
            
            seasonIndex++;
        }
        
        // Обновляем текущий сезон
        const currentSeasonName = `${SEASON_ICONS[seasonIndex] || '📋'} Сезон ${seasonIndex}`;
        seasonNames[seasonIndex] = currentSeasonName;
        
        cachedAllHeroes.forEach(hero => {
            if (hero.isCurrent) {
                hero.seasonIndex = seasonIndex;
                hero.season = currentSeasonName;
            }
        });
        
        if (cachedAllHeroes.length === 0) {
            container.innerHTML = '';
            return;
        }
        
        // Определяем лучших героев по сезонам
        const bestPlayers = {};
        cachedAllHeroes.forEach(hero => {
            const total = hero.wins + hero.losses;
            if (total < MIN_FIGHTS_FOR_BEST) return;
            
            const winrate = total > 0 ? hero.wins / total : 0;
            if (!bestPlayers[hero.seasonIndex] || 
                winrate > bestPlayers[hero.seasonIndex].wr || 
                (winrate === bestPlayers[hero.seasonIndex].wr && total > bestPlayers[hero.seasonIndex].t)) {
                bestPlayers[hero.seasonIndex] = { wr: winrate, t: total, name: hero.name };
            }
        });
        
        const bestNames = {};
        Object.entries(bestPlayers).forEach(([si, data]) => {
            bestNames[si] = data.name;
        });
        
        cachedAllHeroes.forEach(hero => {
            hero.isBest = (bestNames[hero.seasonIndex] === hero.name) && 
                          ((hero.wins + hero.losses) >= MIN_FIGHTS_FOR_BEST);
        });
        
        currentSeasonFilter = 'all';
        renderSeasonView(playerName);
    }

    function renderSeasonView(playerName) {
        const container = $('#allFormerHeroes');
        if (!container || cachedAllHeroes.length === 0) return;
        
        const availableSeasons = [...new Set(cachedAllHeroes.map(h => h.seasonIndex))].sort((a, b) => a - b);
        let filtered = cachedAllHeroes;
        
        if (currentSeasonFilter !== 'all') {
            filtered = cachedAllHeroes.filter(h => h.seasonIndex === parseInt(currentSeasonFilter));
        }
        
        // Сводная статистика
        const totals = { wins: 0, losses: 0, best: 0, worst: 0, tournaments: 0, maxLevel: 0, maxRecord: 0 };
        filtered.forEach(hero => {
            totals.wins += hero.wins || 0;
            totals.losses += hero.losses || 0;
            totals.best = Math.max(totals.best, hero.best || 0);
            totals.worst = Math.max(totals.worst, hero.worst || 0);
            totals.tournaments += hero.tournamentWins || 0;
            totals.maxLevel = Math.max(totals.maxLevel, hero.level || 0);
            totals.maxRecord = Math.max(totals.maxRecord, hero.record || 0);
        });
        
        const totalFights = totals.wins + totals.losses;
        const totalWinrate = totalFights > 0 ? (totals.wins * 100 / totalFights).toFixed(1) : '0';
        
        let html = `
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
            <h3 style="color:var(--gold);margin:0;">👻 Бывшие герои</h3>
            <span style="color:var(--muted);font-size:0.75rem;">${cachedAllHeroes.length} всего</span>
        </div>
        
        <div style="display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;">
            <div class="summary-stat"><div class="summary-value">${filtered.length}</div><div class="summary-label">Героев</div></div>
            <div class="summary-stat"><div class="summary-value">${totals.wins}</div><div class="summary-label">Побед</div></div>
            <div class="summary-stat"><div class="summary-value">${totalWinrate}%</div><div class="summary-label">WR</div></div>
            <div class="summary-stat"><div class="summary-value">${totals.best}</div><div class="summary-label">🔥 Стрик</div></div>
            <div class="summary-stat"><div class="summary-value">${totals.tournaments}</div><div class="summary-label">👑 Тур.</div></div>
            <div class="summary-stat"><div class="summary-value">${totals.maxLevel}</div><div class="summary-label">📈 Ур.</div></div>
            <div class="summary-stat"><div class="summary-value">${totals.maxRecord || '-'}</div><div class="summary-label">🏔 Волн</div></div>
        </div>
        
        <div class="season-tabs">
            <button class="season-tab ${currentSeasonFilter === 'all' ? 'active' : ''}" onclick="setSeasonFilter('all')">📋 Все</button>
            ${availableSeasons.map(si => {
                const name = seasonNames[si] || cachedAllHeroes.find(h => h.seasonIndex === si)?.season || 'Сезон ' + si;
                return `<button class="season-tab ${currentSeasonFilter === String(si) ? 'active' : ''}" onclick="setSeasonFilter('${si}')">${name}</button>`;
            }).join('')}
        </div>`;
        
        const sortedHeroes = [...filtered].sort((a, b) => b.seasonIndex - a.seasonIndex);
        
        html += '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;margin-top:12px;">';
        
        sortedHeroes.forEach(hero => {
            const total = (hero.wins || 0) + (hero.losses || 0);
            const winrate = total > 0 ? (hero.wins * 100 / total).toFixed(1) : '0.0';
            const winrateNum = parseFloat(winrate);
            const winrateColor = winrateNum >= 55 ? 'var(--green)' : winrateNum >= 45 ? 'var(--gold)' : 'var(--red)';
            const winrateBg = winrateNum >= 55 ? 'rgba(16,185,129,0.1)' : winrateNum >= 45 ? 'rgba(240,185,11,0.1)' : 'rgba(232,93,58,0.1)';
            
            html += `
            <div class="hero-card ${hero.isBest ? 'best' : ''}">
                <div class="hero-card-header">
                    <div style="font-size:2.5rem;line-height:1;margin-bottom:6px;">${hero.emoji || '⚔️'}</div>
                    <div style="color:var(--gold);font-weight:700;font-size:0.85rem;margin-bottom:2px;">${hero.name || ''}${hero.isBest ? ' ⭐' : ''}</div>
                    <div style="color:var(--muted);font-size:0.65rem;margin-bottom:8px;">${hero.season}</div>
                    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;text-align:center;font-size:0.7rem;margin-bottom:8px;">
                        <div class="mini-stat">
                            <div class="mini-stat-label">⚔️ Бои</div>
                            <div class="mini-stat-value">${hero.wins || 0}<span style="color:var(--muted);">/</span>${hero.losses || 0}</div>
                        </div>
                        <div style="background:${winrateBg};border-radius:8px;padding:6px 4px;">
                            <div style="color:var(--muted);font-size:0.55rem;">📊 WR</div>
                            <div style="color:${winrateColor};font-weight:700;">${winrate}%</div>
                        </div>
                        <div class="mini-stat">
                            <div class="mini-stat-label">🔥 Стрик</div>
                            <div class="mini-stat-value">${hero.best || 0}</div>
                        </div>
                    </div>
                </div>
                <div class="hero-card-footer">
                    <span>📈 Ур.${hero.level || 0}</span>
                    ${hero.record ? `<span>🏔 ${hero.record} волн</span>` : '<span></span>'}
                    <span>👑 ${hero.tournamentWins || 0}</span>
                </div>
            </div>`;
        });
        
        html += '</div>';
        container.innerHTML = html;
    }

    window.setSeasonFilter = (seasonIndex) => {
        currentSeasonFilter = seasonIndex;
        renderSeasonView(currentProfileName);
    };

    // ============ КОПИРОВАНИЕ ССЫЛКИ ============
    window.copyProfileLink = async () => {
        const name = $('#playerSearch').value.trim();
        if (!name) return;
        
        const url = `${window.location.origin}${window.location.pathname}?name=${encodeURIComponent(name)}`;
        
        try {
            await navigator.clipboard.writeText(url);
            const btn = $('.btn-secondary');
            if (!btn) return;
            
            btn.innerHTML = '✅ Скопировано!';
            btn.style.background = 'var(--green)';
            btn.style.color = '#fff';
            btn.style.borderColor = 'var(--green)';
            
            setTimeout(() => {
                btn.innerHTML = '🔗 Копировать ссылку';
                btn.style.background = '';
                btn.style.color = '';
                btn.style.borderColor = '';
            }, 2000);
        } catch (e) {
            console.warn('Failed to copy:', e);
        }
    };

    // ============ ИНИЦИАЛИЗАЦИЯ ============
    initTheme();
    initNavigation();
    
    loadData().then((success) => {
        if (!success) {
            console.warn('Failed to load data');
            return;
        }
        
        const params = new URLSearchParams(window.location.search);
        const name = params.get('name');
        if (name) {
            $('#playerSearch').value = name;
            loadProfile();
        }
    });
})();
</script>
</body>
</html>
