<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Профиль игрока</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,600;14..32,800;14..32,900&display=swap" rel="stylesheet">
	<style>
		:root {
			--bg: #06040a; --card: #0e0a14; --elevated: #140c1a;
			--text: #e8ddf0; --sub: #8a7d94; --muted: #5e5268;
			--border: rgba(180,100,140,0.15);
			--gold: #f0b90b; --red: #e85d3a; --purple: #a371f7; --green: #10b981;
			--radius: 16px; --radius-sm: 10px;
		}
		[data-theme="light"] {
			--bg: #f7f2eb; --card: #fefcf8; --elevated: #fbf8f3;
			--text: #2d1a1a; --sub: #6b4e4e; --muted: #8b6b6b;
			--border: rgba(180,80,60,0.12);
			--gold: #b8860b; --red: #a03020; --purple: #7b5ea7; --green: #27ae60;
		}
		* { box-sizing: border-box; margin: 0; padding: 0; }
		html { scroll-behavior: smooth; scroll-padding-top: 100px; }
		body { font-family: 'Inter',system-ui,sans-serif; background: var(--bg); background-image: radial-gradient(ellipse at 50% 0%, rgba(200,40,40,0.06) 0%, transparent 60%), radial-gradient(ellipse at 20% 80%, rgba(163,113,247,0.04) 0%, transparent 50%); color: var(--text); min-height: 100vh; line-height: 1.5; }
		.container { max-width: 900px; margin: 0 auto; padding: 24px 20px 60px; }

		.header { text-align: center; padding: 32px 0 8px; position: relative; }
		.header-title { font-size: clamp(2.2rem,6vw,3.2rem); font-weight: 900; letter-spacing: -0.03em; background: linear-gradient(135deg,#8b0000 0%,#e85d3a 40%,#ffd700 70%,#e85d3a 100%); background-size: 200% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; filter: drop-shadow(0 0 30px rgba(232,93,58,0.5)); animation: shimmer 3s linear infinite; margin-bottom: 4px; }
		@keyframes shimmer { 0%{background-position:0% center} 100%{background-position:200% center} }
		.header-subtitle { font-size: 0.9rem; color: var(--red); font-weight: 500; letter-spacing: 0.04em; }
		.theme-toggle { position: absolute; right: 0; top: 50%; transform: translateY(-50%); background: var(--elevated); border: 1px solid var(--border); color: var(--sub); padding: 8px 12px; border-radius: 20px; cursor: pointer; font-size: 0.85rem; font-family: inherit; transition: 0.2s; }
		.theme-toggle:hover { background: var(--card); color: var(--red); border-color: var(--red); }

		.nav-wrapper { margin-bottom: 28px; position: sticky; top: 12px; z-index: 100; }
		.nav-toggle { display: none; width: 100%; padding: 13px 18px; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); color: var(--gold); font-size: 0.95rem; font-weight: 700; cursor: pointer; text-align: left; }
		.nav-bar { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; padding: 6px; background: var(--card); border-radius: var(--radius); border: 1px solid var(--border); }
		.nav-link { padding: 8px 14px; border-radius: 20px; color: var(--sub); text-decoration: none; font-size: 0.78rem; font-weight: 500; transition: 0.2s; }
		.nav-link:hover { color: var(--text); background: var(--elevated); }
		.nav-link.active { background: linear-gradient(135deg,var(--red),var(--gold)); color: #000; font-weight: 700; }

		.section { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px 22px; margin-bottom: 20px; position: relative; overflow: hidden; }
		.section::after { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; opacity: 0.6; }
		.section.gold::after { background: linear-gradient(90deg,transparent,var(--gold),transparent); }
		.section-title { font-size: 1.15rem; font-weight: 800; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
		.section.gold .section-title { color: var(--gold); }

		.search-row { display: flex; gap: 10px; margin-bottom: 24px; align-items: center; flex-wrap: wrap; }
		.search-input { padding: 10px 16px; background: var(--elevated); border: 1px solid var(--border); border-radius: 20px; color: var(--text); font-size: 0.85rem; font-family: inherit; transition: 0.2s; width: 100%; }
		.search-input:focus { outline: none; border-color: var(--gold); }
		.search-input::placeholder { color: var(--muted); }
		.btn { padding: 10px 20px; border-radius: 20px; font-weight: 700; cursor: pointer; border: none; font-size: 0.85rem; font-family: inherit; transition: 0.2s; }
		.btn-primary { background: linear-gradient(135deg,var(--gold),#e0a800); color: #000; }
		.btn-primary:hover { filter: brightness(1.1); transform: translateY(-1px); }
		.btn-secondary { background: var(--elevated); border: 1px solid var(--border); color: var(--text); }
		.btn-secondary:hover { border-color: var(--gold); color: var(--gold); }

		.dropdown-wrap { position: relative; flex: 1; }
		.dropdown-list { display: none; position: absolute; top: 100%; left: 0; right: 0; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-sm); max-height: 200px; overflow-y: auto; z-index: 10; margin-top: 4px; }
		.dropdown-item { padding: 10px 16px; cursor: pointer; color: var(--text); font-size: 0.85rem; border-bottom: 1px solid var(--border); transition: 0.2s; }
		.dropdown-item:last-child { border-bottom: none; }
		.dropdown-item:hover { background: var(--elevated); color: var(--gold); }

		.profile-hero { text-align: center; padding: 28px; margin-bottom: 20px; animation: fadeSlideIn 0.4s ease; }
		.profile-emoji { font-size: 4rem; margin-bottom: 8px; }
		.profile-name { font-size: 1.5rem; font-weight: 800; color: var(--gold); }
		.profile-class { color: var(--sub); font-size: 0.9rem; margin-bottom: 4px; }
		.profile-badges { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin: 10px 0; }
		.badge { padding: 4px 12px; border-radius: 15px; font-size: 0.7rem; font-weight: 700; }
		.badge-gold { background: var(--gold); color: #000; }
		.badge-light { background: rgba(240,185,11,0.15); color: var(--gold); }
		.badge-dark { background: rgba(163,113,247,0.2); color: var(--purple); }

		.stats-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 10px; margin-bottom: 24px; }
		.stat-card { background: var(--elevated); border-radius: var(--radius-sm); padding: 14px 10px; text-align: center; border: 1px solid var(--border); animation: fadeSlideIn 0.3s ease; }
		.stat-num { font-size: 1.4rem; font-weight: 800; color: var(--gold); }
		.stat-label { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin-top: 2px; }

		.ranks-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; margin-bottom: 24px; }
		.rank-card { background: var(--elevated); border-radius: var(--radius-sm); padding: 14px 10px; text-align: center; border: 1px solid var(--border); animation: fadeSlideIn 0.3s ease; }
		.rank-pos { font-size: 1.6rem; font-weight: 800; }
		.rank-label { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin-top: 2px; }

		.compare-bar { display: flex; gap: 10px; align-items: center; margin-bottom: 20px; padding: 14px; background: var(--elevated); border-radius: var(--radius-sm); border: 1px solid var(--border); flex-wrap: wrap; animation: fadeSlideIn 0.3s ease; }
		.compare-bar span { color: var(--sub); font-size: 0.85rem; white-space: nowrap; }

		.table-container { overflow-x: auto; border-radius: var(--radius-sm); border: 1px solid var(--border); margin-top: 10px; }
		table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
		th { background: var(--elevated); color: var(--gold); font-weight: 700; padding: 8px 10px; text-align: center; font-size: 0.7rem; text-transform: uppercase; }
		td { padding: 7px 10px; text-align: center; border-bottom: 1px solid var(--border); color: var(--text); }
		tr:hover td { background: rgba(255,255,255,0.02); }
		.td-better { color: var(--green) !important; font-weight: 700; }
		.td-worse { color: var(--red) !important; }
		.compare-table th:first-child, .compare-table td:first-child { text-align: left; color: var(--muted); font-weight: 500; }
		tbody tr { animation: fadeInRow 0.3s ease forwards; opacity: 0; }
		tbody tr:nth-child(1) { animation-delay: 0.02s; } tbody tr:nth-child(2) { animation-delay: 0.04s; } tbody tr:nth-child(3) { animation-delay: 0.06s; }
		tbody tr:nth-child(4) { animation-delay: 0.08s; } tbody tr:nth-child(5) { animation-delay: 0.10s; } tbody tr:nth-child(6) { animation-delay: 0.12s; }
		tbody tr:nth-child(7) { animation-delay: 0.14s; } tbody tr:nth-child(8) { animation-delay: 0.16s; } tbody tr:nth-child(9) { animation-delay: 0.18s; }
		tbody tr:nth-child(10) { animation-delay: 0.20s; } tbody tr:nth-child(11) { animation-delay: 0.22s; } tbody tr:nth-child(12) { animation-delay: 0.24s; }
		tbody tr:nth-child(13) { animation-delay: 0.26s; }

		#allFormerHeroes table { min-width: 700px; }
		#allFormerHeroes td { white-space: nowrap; }
		#allFormerHeroes td:first-child { white-space: nowrap; }
		#allFormerHeroes td:nth-child(2) { white-space: nowrap; min-width: 160px; }
		#allFormerHeroes td:last-child { white-space: nowrap; }

		.beer-btn { position: fixed; bottom: 20px; right: 20px; width: 48px; height: 48px; background: var(--gold); color: #000; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.3rem; text-decoration: none; box-shadow: 0 4px 16px rgba(240,185,11,0.3); z-index: 99; transition: transform 0.2s; animation: float 3s ease-in-out infinite; }
		.beer-btn:hover { transform: scale(1.1); }

		@keyframes fadeSlideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
		@keyframes fadeInRow { from { opacity: 0; transform: translateX(-8px); } to { opacity: 1; transform: translateX(0); } }
		@keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }

		@media (max-width: 768px) {
			.container { padding: 12px 14px 80px; }
			.header { padding: 20px 0 8px; }
			.header-title { font-size: 1.8rem; }
			.theme-toggle { position: static; transform: none; margin: 12px auto 0; display: block; width: fit-content; }
			.nav-toggle { display: block; }
			.nav-bar { display: none; flex-direction: column; margin-top: 8px; }
			.nav-bar.show { display: flex; }
			.nav-link { padding: 12px 16px; border-radius: var(--radius-sm); justify-content: center; }
			.stats-grid { grid-template-columns: repeat(2, 1fr); }
			.ranks-grid { grid-template-columns: repeat(2, 1fr); }
			.section { padding: 18px 14px; }
			.beer-btn { bottom: 16px; right: 16px; width: 42px; height: 42px; font-size: 1.1rem; }
		}
	</style>
</head>
<body>
<div class="container">
    <header class="header">
        <h1 class="header-title">ПРОФИЛЬ ИГРОКА</h1>
        <p class="header-subtitle">Полная статистика героя</p>
        <button class="theme-toggle" onclick="toggleTheme()">🌓</button>
    </header>

    <div class="nav-wrapper">
        <button class="nav-toggle" onclick="toggleNav()">☰ Меню</button>
        <nav class="nav-bar" id="pageNav">
            <a href="index.html" class="nav-link">📊 Статистика</a>
            <a href="logs.html" class="nav-link">📜 Логи</a>
            <a href="calc.html" class="nav-link">🎲 Калькулятор</a>
            <a href="balance.html" class="nav-link">⚖️ Баланс</a>
            <a href="simulator.html" class="nav-link">🧪 Симулятор</a>
            <a href="gradient.html" class="nav-link">📈 Градиент</a>
            <a href="guide.html" class="nav-link">⚔️ Гайд</a>
            <a href="hall.html" class="nav-link">🏆 Зал Славы</a>
            <a href="lore.html" class="nav-link">📜 Лор</a>
            <a href="tavern.html" class="nav-link">🍺 Таверна</a>
            <a href="dungeon.html" class="nav-link">🏔 Подземелье</a>
            <a href="league.html" class="nav-link">🏟 Лига</a>
			<a href="form.html" class="nav-link">🔥 Форма</a>
            <a href="player.html" class="nav-link active">👤 Профиль</a>
        </nav>
    </div>

    <div class="search-row">
        <div class="dropdown-wrap">
            <input type="text" class="search-input" id="playerSearch" placeholder="Введи ник игрока..." oninput="filterPlayerList()">
            <div class="dropdown-list" id="playerDropdown"></div>
        </div>
        <button class="btn btn-primary" onclick="loadProfile()">🔍 Найти</button>
    </div>
    <div id="profileContent"><div style="text-align:center;padding:48px 20px;color:var(--sub);">Введи имя игрока для просмотра профиля</div></div>
</div>
<a href="https://www.donationalerts.com/r/rvotaenota" target="_blank" class="beer-btn" title="Угостить пивом 🍺">🍺</a>

<script>
    function toggleTheme(){const h=document.documentElement;const c=h.getAttribute('data-theme');const n=c==='dark'?'light':'dark';h.setAttribute('data-theme',n);localStorage.setItem('eternis-theme',n);}
    (function(){const s=localStorage.getItem('eternis-theme');if(s)document.documentElement.setAttribute('data-theme',s);})();
    function toggleNav(){const nav=document.getElementById('pageNav'),btn=document.querySelector('.nav-toggle');nav.classList.toggle('show');btn.textContent=nav.classList.contains('show')?'✕ Закрыть':'☰ Меню';}
    document.querySelectorAll('.nav-link').forEach(l=>l.addEventListener('click',()=>{document.getElementById('pageNav').classList.remove('show');document.querySelector('.nav-toggle').textContent='☰ Меню';}));

    let allPlayers = [], dungeonPlayers = {}, seasonTop = [], heroArchive = {};

    async function loadData() {
        const urls = [
            'https://raw.githubusercontent.com/rvotaenotaTTV/dnd-stats/main/stats_data.json',
            'https://cdn.jsdelivr.net/gh/rvotaenotaTTV/dnd-stats@main/stats_data.json'
        ];
        for (const url of urls) {
            try {
                const r = await fetch(url);
                if (r.ok) {
                    const d = await r.json();
                    allPlayers = (d.players || []).filter(p => p.name && p.name !== 'Unknown');
                    if (d.dungeon?.players) dungeonPlayers = d.dungeon.players;
                    seasonTop = (d.players || []).filter(p => p.skill > 0).sort((a, b) => b.skill - a.skill).slice(0, 10);
                    heroArchive = d.heroArchive || {};
                    return;
                }
            } catch (e) {}
        }
    }

    function findPlayer(name) {
        if (!name || !allPlayers.length) return null;
        const lower = name.toLowerCase().trim();
        return allPlayers.find(p => p.display && p.display.toLowerCase() === lower) || 
               allPlayers.find(p => p.display && p.display.toLowerCase().includes(lower)) || null;
    }

    function filterPlayerList() {
        const input = document.getElementById('playerSearch'), dropdown = document.getElementById('playerDropdown');
        const val = input.value.toLowerCase().trim();
        if (!val || !allPlayers.length) { dropdown.style.display = 'none'; return; }
        const filtered = allPlayers.filter(x => x.display && x.display.toLowerCase().includes(val)).slice(0, 8);
        if (!filtered.length) { dropdown.style.display = 'none'; return; }
        dropdown.innerHTML = filtered.map(x => `<div class="dropdown-item" onclick="selectPlayer('${x.display.replace(/'/g, "\\'")}')">${x.emoji || '⚔️'} ${x.display}</div>`).join('');
        dropdown.style.display = 'block';
    }

    function selectPlayer(name) {
        document.getElementById('playerSearch').value = name;
        document.getElementById('playerDropdown').style.display = 'none';
        loadProfile();
    }

    function renderProfile(p) {
        if (!p) return '<div style="text-align:center;padding:48px 20px;color:var(--sub);">Игрок не найден</div>';
        const total = (p.wins || 0) + (p.losses || 0), wr = total > 0 ? (p.wins * 100 / total).toFixed(1) : '0.0';
        const faction = p.faction || '', fi = faction === 'Орден Света' ? '🌝' : '🌚';
        const dungeon = dungeonPlayers[p.display];
        const seasonRank = seasonTop.findIndex(s => s.display === p.display) + 1;
        const sortedByWins = [...allPlayers].sort((a, b) => (b.wins || 0) - (a.wins || 0));
        const rankWins = sortedByWins.findIndex(x => x.display === p.display) + 1;
        const sortedByWR = [...allPlayers].filter(x => ((x.wins || 0) + (x.losses || 0)) >= 20).sort((a, b) => {
            const wa = (a.wins || 0) / ((a.wins || 0) + (a.losses || 0)), wb = (b.wins || 0) / ((b.wins || 0) + (b.losses || 0));
            return wb - wa;
        });
        const rankWR = sortedByWR.findIndex(x => x.display === p.display) + 1;
        const sortedByShards = [...allPlayers].sort((a, b) => (b.shards || 0) - (a.shards || 0));
        const rankShards = sortedByShards.findIndex(x => x.display === p.display) + 1;
        const dungeonRecords = allPlayers.map(x => ({ display: x.display, record: dungeonPlayers[x.display]?.record || 0 })).sort((a, b) => b.record - a.record);
        const rankDungeon = dungeonRecords.findIndex(x => x.display === p.display && x.record > 0) + 1;
        const sortedByFaction = [...allPlayers].sort((a, b) => (b.factionWins || 0) - (a.factionWins || 0));
        const rankFaction = sortedByFaction.findIndex(x => x.display === p.display) + 1;
        const color = n => n <= 3 ? 'var(--gold)' : n <= 10 ? 'var(--green)' : 'var(--muted)';

        let html = `<div class="section gold"><div class="profile-hero"><div class="profile-emoji">${p.emoji || '⚔️'}</div><div class="profile-name">${p.display}${p.champion ? ' 👑' : ''}</div><div class="profile-class">${p.name || ''} · SKILL ${p.skill || 0}</div><div class="profile-badges">`;
        if (p.champion) html += '<span class="badge badge-gold">👑 Хранитель</span>';
        html += `<span class="badge ${faction === 'Орден Света' ? 'badge-light' : 'badge-dark'}">${fi} ${faction}</span>`;
        if (seasonRank > 0) html += `<span class="badge badge-light">🏆 Топ-${seasonRank} сезона</span>`;
        html += `</div><button class="btn btn-secondary" onclick="copyProfileLink()" style="margin-top:8px;">🔗 Копировать ссылку</button></div></div>`;

        html += '<div class="stats-grid">';
        html += `<div class="stat-card"><div class="stat-num">${p.wins || 0}</div><div class="stat-label">⚔️ Победы</div></div>`;
        html += `<div class="stat-card"><div class="stat-num">${p.losses || 0}</div><div class="stat-label">💀 Поражения</div></div>`;
        html += `<div class="stat-card"><div class="stat-num">${wr}%</div><div class="stat-label">📊 Винрейт</div></div>`;
        html += `<div class="stat-card"><div class="stat-num">${total}</div><div class="stat-label">⚡ Всего боёв</div></div>`;
        html += `<div class="stat-card"><div class="stat-num">${p.best || 0}</div><div class="stat-label">🔥 Лучший стрик</div></div>`;
        html += `<div class="stat-card"><div class="stat-num">${p.worst || 0}</div><div class="stat-label">💔 Худший стрик</div></div>`;
        html += `<div class="stat-card"><div class="stat-num">${p.shards || 0}</div><div class="stat-label">💎 Осколки</div></div>`;
        html += `<div class="stat-card"><div class="stat-num">${p.level || 0}</div><div class="stat-label">📈 Уровень</div></div>`;
        html += `<div class="stat-card"><div class="stat-num">${p.tournamentWins || 0}</div><div class="stat-label">👑 Турниры</div></div>`;
        html += `<div class="stat-card"><div class="stat-num">${p.factionWins || 0}</div><div class="stat-label">🌍 Фракция</div></div>`;
        html += `<div class="stat-card"><div class="stat-num">${dungeon ? dungeon.record : '-'}</div><div class="stat-label">🏔 Рекорд данжа</div></div>`;
        html += `<div class="stat-card"><div class="stat-num">${dungeon ? dungeon.trophies : '-'}</div><div class="stat-label">🐉 Трофеев</div></div>`;
        html += '</div>';

        html += '<div class="ranks-grid">';
        html += `<div class="rank-card"><div class="rank-pos" style="color:${color(rankWins)};">#${rankWins}</div><div class="rank-label">По победам</div></div>`;
        html += `<div class="rank-card"><div class="rank-pos" style="color:${color(rankWR)};">#${rankWR || '-'}</div><div class="rank-label">По винрейту</div></div>`;
        html += `<div class="rank-card"><div class="rank-pos" style="color:${color(rankShards)};">#${rankShards}</div><div class="rank-label">По осколкам</div></div>`;
        html += `<div class="rank-card"><div class="rank-pos" style="color:${color(rankDungeon)};">#${rankDungeon || '-'}</div><div class="rank-label">По данжу</div></div>`;
        html += `<div class="rank-card"><div class="rank-pos" style="color:${color(seasonRank)};">#${seasonRank || '-'}</div><div class="rank-label">Сезонный топ</div></div>`;
        html += `<div class="rank-card"><div class="rank-pos" style="color:${color(rankFaction)};">#${rankFaction || '-'}</div><div class="rank-label">По фракции</div></div>`;
        html += '</div>';

        html += `<div id="allFormerHeroes"></div>`;

        html += `<div class="compare-bar" style="margin-top:24px;"><span>⚔️ Сравнить с:</span><div class="dropdown-wrap" style="flex:1;min-width:150px;"><input type="text" class="search-input" id="compareInput" placeholder="Введи ник..." oninput="filterCompareList()"><div class="dropdown-list" id="compareDropdown"></div></div></div><div id="compareResult"></div>`;
        return html;
    }

    function renderCompare(p1, p2) {
        if (!p1 || !p2) return '';
        const d1 = dungeonPlayers[p1.display], d2 = dungeonPlayers[p2.display];
        const rows = [
            ['Победы', p1.wins || 0, p2.wins || 0, true],
            ['Поражения', p1.losses || 0, p2.losses || 0, false],
            ['Винрейт', ((p1.wins || 0) / ((p1.wins || 0) + (p1.losses || 0) || 1) * 100).toFixed(1) + '%', ((p2.wins || 0) / ((p2.wins || 0) + (p2.losses || 0) || 1) * 100).toFixed(1) + '%', true],
            ['SKILL', p1.skill || 0, p2.skill || 0, true],
            ['Всего боёв', (p1.wins || 0) + (p1.losses || 0), (p2.wins || 0) + (p2.losses || 0), true],
            ['Лучший стрик', p1.best || 0, p2.best || 0, true],
            ['Худший стрик', p1.worst || 0, p2.worst || 0, false],
            ['Осколки', p1.shards || 0, p2.shards || 0, true],
            ['Уровень', p1.level || 0, p2.level || 0, true],
            ['Турниры', p1.tournamentWins || 0, p2.tournamentWins || 0, true],
            ['Фракция', p1.factionWins || 0, p2.factionWins || 0, true],
            ['Рекорд данжа', d1 ? d1.record : '-', d2 ? d2.record : '-', true],
            ['Трофеев', d1 ? d1.trophies : '-', d2 ? d2.trophies : '-', true]
        ];
        let table = '<div class="table-container"><table class="compare-table"><thead><tr><th>Стат</th><th>' + p1.display + '</th><th>' + p2.display + '</th></tr></thead><tbody>';
        rows.forEach(([label, v1, v2, higherBetter]) => {
            let c1 = '', c2 = '';
            if (typeof v1 === 'number' && typeof v2 === 'number') {
                if (v1 > v2) { c1 = higherBetter ? 'td-better' : 'td-worse'; c2 = higherBetter ? 'td-worse' : 'td-better'; }
                else if (v2 > v1) { c1 = higherBetter ? 'td-worse' : 'td-better'; c2 = higherBetter ? 'td-better' : 'td-worse'; }
            }
            table += `<tr><td>${label}</td><td class="${c1}">${v1}</td><td class="${c2}">${v2}</td></tr>`;
        });
        table += '</tbody></table></div>';
        return table;
    }

    function compareWith(name) {
        const p1 = findPlayer(document.getElementById('playerSearch').value.trim()), p2 = findPlayer(name);
        document.getElementById('compareResult').innerHTML = p2 ? renderCompare(p1, p2) : '';
    }

    function filterCompareList() {
        const input = document.getElementById('compareInput'), dropdown = document.getElementById('compareDropdown');
        if (!input) return;
        const val = input.value.toLowerCase().trim();
        if (!val || !allPlayers.length) { dropdown.style.display = 'none'; return; }
        const filtered = allPlayers.filter(x => x.display && x.display.toLowerCase().includes(val)).slice(0, 8);
        if (!filtered.length) { dropdown.style.display = 'none'; return; }
        dropdown.innerHTML = filtered.map(x => `<div class="dropdown-item" onclick="selectCompare('${x.display.replace(/'/g, "\\'")}')">${x.emoji || '⚔️'} ${x.display}</div>`).join('');
        dropdown.style.display = 'block';
    }

    function selectCompare(name) {
        document.getElementById('compareInput').value = name;
        document.getElementById('compareDropdown').style.display = 'none';
        compareWith(name);
    }

    function copyProfileLink() {
        const name = document.getElementById('playerSearch').value.trim();
        if (!name) return;
        const url = `${window.location.origin}${window.location.pathname}?name=${encodeURIComponent(name)}`;
        navigator.clipboard.writeText(url).then(() => {
            const btn = document.querySelector('#profileContent .btn-secondary');
            if (!btn) return;
            btn.innerHTML = '✅ Скопировано!';
            btn.style.background = 'var(--green)'; btn.style.color = '#fff'; btn.style.borderColor = 'var(--green)';
            setTimeout(() => { btn.innerHTML = '🔗 Копировать ссылку'; btn.style.background = ''; btn.style.color = ''; btn.style.borderColor = ''; }, 2000);
        }).catch(() => {
            const input = document.createElement('input'); input.value = url; document.body.appendChild(input);
            input.select(); document.execCommand('copy'); document.body.removeChild(input);
        });
    }

    async function loadProfile() {
        if (!allPlayers.length) await loadData();
        const p = findPlayer(document.getElementById('playerSearch').value.trim());
        document.getElementById('profileContent').innerHTML = p ? renderProfile(p) : '<div style="text-align:center;padding:48px 20px;color:var(--sub);">Игрок не найден</div>';
        if (p) setTimeout(() => loadAllSeasons(p.display), 200);
    }

    loadData().then(() => {
        const params = new URLSearchParams(window.location.search);
        const name = params.get('name');
        if (name) { document.getElementById('playerSearch').value = name; loadProfile(); }
    });

    async function loadAllSeasons(playerName) {
        const container = document.getElementById('allFormerHeroes');
        if (!container) return;
        const archive = heroArchive || {};
        const allHeroes = [];
        const CURRENT = 3;
        const seasonNames = ['🏁 0', '🔥 1', '💫 2', '🩸 3'];
        const seasonKeys = ['season_0.json', 'season_1.json', 'season_2.json', 'season_3.json'];
        const seen = new Set();

        for (let i = 0; i <= CURRENT; i++) {
            if (i < CURRENT) {
                const url = `https://cdn.jsdelivr.net/gh/rvotaenotaTTV/dnd-stats@main/${seasonKeys[i]}`;
                try {
                    const r = await fetch(url);
                    const d = await r.json();
                    const key = playerName.toLowerCase();
                    const player = d.players?.find(p => p.display?.toLowerCase() === key);
                    if (player && player.name && player.name !== 'Unknown') {
                        const id = `${player.name}-${i}`;
                        if (!seen.has(id)) {
                            seen.add(id);
                            allHeroes.push({ name: player.name, emoji: player.emoji, wins: player.wins, losses: player.losses, best: player.best, worst: player.worst || 0, tournamentWins: player.tournamentWins || 0, season: seasonNames[i] });
                        }
                    }
                    const arch = d.heroArchive?.[key];
                    if (arch) {
                        arch.forEach(h => allHeroes.push({ ...h, season: seasonNames[i] }));
                    }
                } catch (e) {}
            } else {
                const currentArchive = archive[playerName.toLowerCase()] || [];
                currentArchive.forEach(h => {
                    if (!allHeroes.find(x => x.name === h.name && x.wins === h.wins && x.losses === h.losses && x.season === seasonNames[i])) {
                        allHeroes.push({ ...h, season: seasonNames[i] });
                    }
                });
            }
        }

        if (allHeroes.length === 0) { container.innerHTML = ''; return; }

        let html = `<h3 style="color:var(--gold);margin:16px 0 8px;">👻 Бывшие (${allHeroes.length})</h3>`;
        html += '<div class="table-container"><table><thead><tr>';
        html += '<th>Сезон</th><th>Герой</th><th>W</th><th>L</th><th>WR</th><th>🔥</th><th>💀</th><th>👑</th></tr></thead><tbody>';

        allHeroes.forEach(h => {
            const t = (h.wins || 0) + (h.losses || 0), wr = t > 0 ? (h.wins * 100 / t).toFixed(1) : '0.0', crown = (h.tournamentWins || 0) > 0;
            html += `<tr><td style="font-size:0.75rem;color:var(--muted);">${h.season}</td><td>${h.emoji || ''} ${h.name || ''}</td><td>${h.wins || 0}</td><td>${h.losses || 0}</td><td>${wr}%</td><td>${h.best || 0}</td><td>${h.worst || 0}</td><td>${h.tournamentWins || 0}${crown ? ' 👑' : ''}</td></tr>`;
        });

        html += '</tbody></table></div>';
        container.innerHTML = html;
    }
</script>
</body>
