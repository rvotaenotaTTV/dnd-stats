<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Подземелье</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="theme.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,600;14..32,800;14..32,900&display=swap" rel="stylesheet">
<style>
    .section.ice::after { background: linear-gradient(90deg,transparent,var(--ice),transparent); }
    .section.white::after { background: linear-gradient(90deg,transparent,var(--text),transparent); opacity: 0.3; }
    .section.ice .section-title { color: var(--ice); }
    .section.white .section-title { color: var(--text); }

    .crown-section { text-align: center; padding: 10px 0; }
    .crown-icon { font-size: 3rem; display: block; animation: float 3s ease-in-out infinite; }
    .crown-title { font-size: 1.1rem; font-weight: 800; color: var(--gold); margin: 4px 0; }
    .crown-owner { font-size: 0.8rem; color: var(--sub); margin-bottom: 12px; }
    .score-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-weight: 600; font-size: 0.9rem; }
    .score-light { color: var(--gold); } .score-dark { color: var(--purple); }
    .progress-bar { height: 36px; border-radius: 18px; overflow: hidden; display: flex; background: var(--bg); border: 2px solid var(--border); }
    .progress-fill { display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.8rem; transition: width 0.6s; min-width: 40px; }
    .progress-light { background: linear-gradient(135deg, #c49600, #ffd700); color: #000; }
    .progress-dark { background: linear-gradient(135deg, #3d1060, #a371f7); color: #fff; }
    .total-trophies { font-size: 0.75rem; color: var(--muted); margin-top: 8px; text-align: center; }

    .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 20px; }
    .stat-card { background: var(--elevated); border-radius: var(--radius-sm); padding: 16px 12px; text-align: center; border: 1px solid var(--border); }
    .stat-value { font-size: 1.5rem; font-weight: 800; color: var(--gold); }
    .stat-label { color: var(--muted); font-size: 0.65rem; margin-top: 4px; text-transform: uppercase; letter-spacing: 1px; }

    .podium { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 24px; }
    .podium-card { background: var(--elevated); border-radius: var(--radius-sm); padding: 20px 14px; text-align: center; border: 1px solid var(--border); display: flex; flex-direction: column; align-items: center; gap: 6px; }
    .podium-card.gold { border-color: rgba(240,185,11,0.5); box-shadow: 0 0 20px rgba(240,185,11,0.12); }
    .podium-card.silver { border-color: rgba(192,192,192,0.5); box-shadow: 0 0 16px rgba(192,192,192,0.1); }
    .podium-card.bronze { border-color: rgba(205,127,50,0.5); box-shadow: 0 0 16px rgba(205,127,50,0.1); }
    .podium-medal { font-size: 2.4rem; }
    .podium-name { font-size: 1rem; font-weight: 700; color: var(--text); }
    .podium-record { font-size: 1.8rem; font-weight: 800; color: var(--gold); }
    .podium-detail { font-size: 0.8rem; color: var(--muted); }

    .records-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 24px; }
    .record-item { background: var(--elevated); border-radius: var(--radius-sm); padding: 16px 12px; text-align: center; border: 1px solid var(--border); }
    .record-icon { font-size: 1.6rem; margin-bottom: 4px; }
    .record-value { font-size: 1.5rem; font-weight: 800; color: var(--ice); }
    .record-label { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin-top: 2px; }
    .record-player { font-size: 0.78rem; color: var(--sub); margin-top: 6px; font-weight: 500; }

    .highlight { color: var(--gold); font-weight: 700; }

    #all-table th:nth-child(1), #all-table td:nth-child(1) { min-width: 110px; }
    #all-table th:nth-child(2), #all-table td:nth-child(2) { min-width: 120px; }
    #leaderboard-table th:nth-child(2), #leaderboard-table td:nth-child(2),
    #leaderboard-table th:nth-child(3), #leaderboard-table td:nth-child(3),
    #all-table th:nth-child(1), #all-table td:nth-child(1),
    #all-table th:nth-child(2), #all-table td:nth-child(2) { text-align: left; padding-left: 14px; }

    @media (max-width: 768px) {
        .stats-grid { grid-template-columns: repeat(2, 1fr); gap: 8px; }
        .stat-value { font-size: 1.3rem; }
        .podium { grid-template-columns: 1fr; }
        .records-grid { grid-template-columns: repeat(2, 1fr); gap: 8px; }
        #leaderboard-table, #all-table { min-width: 600px; font-size: 0.7rem; }
        th, td { padding: 6px 8px; white-space: nowrap; }
    }
</style>
</head>
<body>
    <div class="container">
        <header class="header">
			<h1 class="header-title">БЕЗДНА РАЗЛОМА</h1>
			<p class="header-subtitle">Подземелье · Статистика</p>
            <button class="theme-toggle" onclick="toggleTheme()">🌓</button>
        </header>

        <div class="nav-wrapper">
            <button class="nav-toggle" onclick="toggleNav()">☰ Меню</button>
            <nav class="nav-bar" id="pageNav">
                <div class="nav-group">
                    <span class="nav-label">⚔️ Арена ▾</span>
                    <div class="nav-dropdown">
                        <a href="index.html" class="nav-link">📊 Статистика</a>
                        <a href="dungeon.html" class="nav-link active">🏔 Подземелье</a>
                        <a href="league.html" class="nav-link">🏟 Лига</a>
                        <a href="logs.html" class="nav-link">📜 Логи</a>
                        <a href="player.html" class="nav-link">👤 Профиль</a>
                    </div>
                </div>
                <div class="nav-group">
                    <span class="nav-label">📐 Аналитика ▾</span>
                    <div class="nav-dropdown">
                        <a href="balance.html" class="nav-link">⚖️ Баланс</a>
                        <a href="calc.html" class="nav-link">🎲 Калькулятор</a>
                        <a href="simulator.html" class="nav-link">🧪 Симулятор</a>
                        <a href="gradient.html" class="nav-link">📈 Градиент</a>
                        <a href="form.html" class="nav-link">🔥 Форма</a>
                    </div>
                </div>
                <div class="nav-group">
                    <span class="nav-label">🌍 Мир ▾</span>
                    <div class="nav-dropdown">
                        <a href="guide.html" class="nav-link">⚔️ Гайд</a>
                        <a href="lore.html" class="nav-link">📜 Лор</a>
                        <a href="hall.html" class="nav-link">🏆 Зал Славы</a>
                        <a href="tavern.html" class="nav-link">🍺 Таверна</a>
                    </div>
                </div>
            </nav>
        </div>

        <!-- ===== СТАТИСТИКА ===== -->
        <div id="stats-container">
            <div class="section ice" style="text-align:center;padding:40px 20px;">
                <div class="spinner"></div>
                <p>Бездна дышит...</p>
            </div>
        </div>
    </div>

    <a href="https://www.donationalerts.com/r/rvotaenota" target="_blank" class="beer-btn" title="Поддержать 🕯️">🕯️</a>

    <script>
        function toggleTheme(){const h=document.documentElement;const c=h.getAttribute('data-theme');const n=c==='dark'?'light':'dark';h.setAttribute('data-theme',n);localStorage.setItem('eternis-theme',n);}
        (function(){const s=localStorage.getItem('eternis-theme');if(s)document.documentElement.setAttribute('data-theme',s);})();
        function toggleNav(){const n=document.getElementById('pageNav'),b=document.querySelector('.nav-toggle');n.classList.toggle('show');b.textContent=n.classList.contains('show')?'✕ Закрыть':'☰ Меню';}
        document.querySelectorAll('.nav-link').forEach(l=>l.addEventListener('click',()=>{document.getElementById('pageNav').classList.remove('show');document.querySelector('.nav-toggle').textContent='☰ Меню';}));
        document.querySelectorAll('.nav-label').forEach(label=>{label.addEventListener('click',function(e){if(window.innerWidth>768)return;e.preventDefault();const dd=this.nextElementSibling;if(dd&&dd.classList.contains('nav-dropdown')){const isOpen=dd.style.display==='block';document.querySelectorAll('.nav-dropdown').forEach(d=>d.style.display='none');dd.style.display=isOpen?'none':'block';}});});

        const STATS_URL = 'https://raw.githubusercontent.com/rvotaenotaTTV/dnd-stats/main/stats_data.json';
        const container = document.getElementById('stats-container');
        fetch(STATS_URL + '?v=' + Date.now())
            .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
            .then(d => {
                const dungeon = d.dungeon || {};
                const players = Object.values(dungeon.players || {});
                const territory = d.territory || { light: 0, dark: 0 };
                if (!players.length) { container.innerHTML = `<div class="section ice" style="text-align:center;padding:40px 20px;"><div class="section-title" style="justify-content:center;">🩸 Разлом Бездны пустует</div><p style="color:var(--sub);">Напиши <code>!данж</code> и спустись в Бездну</p></div>`; return; }
                renderAll(players, territory);
            })
            .catch(e => { container.innerHTML = `<div class="section ice" style="text-align:center;padding:40px 20px;"><div class="section-title" style="justify-content:center;">🩸 Разлом Бездны</div><p style="color:var(--red);">❌ Ошибка загрузки</p></div>`; });

        function renderAll(players, territory) {
            const sorted = [...players].sort((a, b) => b.record - a.record || b.damage - a.damage);
            const totalTrophies = territory.light + territory.dark;
            const lp = totalTrophies > 0 ? (territory.light * 100 / totalTrophies) : 50;
            const owner = territory.light > territory.dark ? '🌝 Орден Света' : territory.dark > territory.light ? '🌚 Культ Тьмы' : '⚖️ Ничья';
            let html = '';

            html += `<div class="section gold"><div class="crown-section"><span class="crown-icon">👑</span><div class="crown-title">КОРОНА РАСКОЛА</div><div class="crown-owner">${owner}</div><div class="score-row"><span class="score-light">🌝 Свет: ${territory.light}</span><span class="score-dark">${territory.dark} :Тьма 🌚</span></div><div class="progress-bar"><div class="progress-fill progress-light" style="width:${lp}%">${lp>10?Math.round(lp)+'%':''}</div><div class="progress-fill progress-dark" style="width:${100-lp}%">${(100-lp)>10?Math.round(100-lp)+'%':''}</div></div><div class="total-trophies">Всего трофеев: ${totalTrophies}</div></div></div>`;

            const totalPlayers = players.length;
            const totalWaves = players.reduce((s, p) => s + (p.totalWaves || 0), 0);
            const totalBosses = players.reduce((s, p) => s + (p.bosses || 0), 0);
            const maxRecord = sorted[0]?.record || 0;
            html += '<div class="stats-grid">';
            html += `<div class="stat-card"><div class="stat-value">${totalPlayers}</div><div class="stat-label">👥 Участников</div></div>`;
            html += `<div class="stat-card"><div class="stat-value">${totalWaves}</div><div class="stat-label">🌊 Всего волн</div></div>`;
            html += `<div class="stat-card"><div class="stat-value">${totalBosses}</div><div class="stat-label">🐉 Боссов убито</div></div>`;
            html += `<div class="stat-card"><div class="stat-value">${maxRecord}</div><div class="stat-label">🏆 Рекорд волн</div></div>`;
            html += '</div>';

            const top3 = sorted.slice(0, 3);
            const medals = ['🥇', '🥈', '🥉'];
            const styles = ['gold', 'silver', 'bronze'];
            html += '<div class="podium">';
            top3.forEach((p, i) => {
                html += `<div class="podium-card ${styles[i]}"><div class="podium-medal">${medals[i]}</div><div class="podium-name">${p.emoji||'⚔️'} ${p.display||'???'}</div><div class="podium-record">${p.record}</div><div class="podium-detail">Урон: ${p.damage} · 💥${p.crits} · ❌${p.misses} · 🛡${p.blocks}</div></div>`;
            });
            html += '</div>';

            const br = sorted[0];
            const bd = [...players].sort((a, b) => b.damage - a.damage)[0];
            const bc = [...players].sort((a, b) => b.crits - a.crits)[0];
            const bb = [...players].sort((a, b) => b.blocks - a.blocks)[0];
            const bt = [...players].sort((a, b) => (b.trophies||0) - (a.trophies||0))[0];
            const bw = [...players].sort((a, b) => (b.totalWaves||0) - (a.totalWaves||0))[0];
            const ba = [...players].filter(p => p.swings > 0).sort((a, b) => (b.hits*100/b.swings) - (a.hits*100/a.swings))[0];
            const bavg = [...players].filter(p => p.record > 0).sort((a, b) => (b.damage/b.record) - (a.damage/a.record))[0];
            const recs = [
                ['🏆', br.record, 'Рекорд волн', br], ['💥', bd.damage, 'Рекорд урона', bd],
                ['🎯', ba ? Math.round(ba.hits*100/ba.swings)+'%' : '—', 'Меткость', ba||{}],
                ['👑', bt?.trophies||0, 'Рекорд трофеев', bt], ['💥', bc.crits, 'Рекорд критов', bc],
                ['🛡', bb.blocks, 'Рекорд блоков', bb], ['⚔', bavg ? Math.round(bavg.damage/bavg.record) : '—', 'Урон/волна', bavg||{}],
                ['🌊', bw?.totalWaves||0, 'Всего волн', bw]
            ];
            html += '<div class="records-grid">';
            recs.forEach(([icon, val, label, p]) => {
                html += `<div class="record-item"><div class="record-icon">${icon}</div><div class="record-value">${val}</div><div class="record-label">${label}</div><div class="record-player">${p?.emoji||''} ${p?.display||'???'}</div></div>`;
            });
            html += '</div>';

            html += `<div class="section gold"><div class="section-title">📊 Топ-10 лидеров</div><div class="table-container"><table id="leaderboard-table"><thead><tr><th class="sortable-header" data-sort="record">Волн</th><th class="sortable-header" data-sort="display">Имя</th><th class="sortable-header" data-sort="class">Класс</th><th class="sortable-header" data-sort="passive">Пассивка</th><th class="sortable-header" data-sort="damage">Урон</th><th class="sortable-header" data-sort="accuracy">🎯</th><th class="sortable-header" data-sort="crits">💥</th><th class="sortable-header" data-sort="misses">❌</th><th class="sortable-header" data-sort="blocks">🛡</th></tr></thead><tbody>`;
            sorted.slice(0, 10).forEach(p => {
                const pa = p.passive ? p.passive.split(' ')[0] : '';
                const acc = p.swings > 0 ? Math.round(p.hits*100/p.swings)+'%' : '—';
                html += `<tr data-record="${p.record}" data-display="${p.display||''}" data-class="${p.name||''}" data-passive="${pa}" data-damage="${p.damage}" data-accuracy="${p.swings>0?Math.round(p.hits*100/p.swings):0}" data-crits="${p.crits}" data-misses="${p.misses}" data-blocks="${p.blocks}"><td class="highlight">${p.record}</td><td>${p.emoji||''} ${p.display||'???'}</td><td>${p.name||''}</td><td title="${p.passive||''}">${pa}</td><td>${p.damage}</td><td>${acc}</td><td>${p.crits}</td><td>${p.misses}</td><td>${p.blocks}</td></tr>`;
            });
            html += '</tbody></table></div></div>';

            html += `<div class="section white"><div class="section-title">👥 Все участники</div><div class="table-container"><table id="all-table"><thead><tr><th class="sortable-header" data-sort="display">Имя</th><th class="sortable-header" data-sort="class">Класс</th><th class="sortable-header" data-sort="record">🏆</th><th class="sortable-header" data-sort="waves">🌊</th><th class="sortable-header" data-sort="trophies">👑</th><th class="sortable-header" data-sort="bosses">🐉</th><th class="sortable-header" data-sort="accuracy">🎯</th><th class="sortable-header" data-sort="avgdamage">⚔</th><th class="sortable-header" data-sort="faction">⚖</th></tr></thead><tbody>`;
            players.forEach(p => {
                const fi = p.faction === 'Орден Света' ? '🌝' : (p.faction === 'Культ Тьмы' ? '🌚' : '');
                const acc = p.swings > 0 ? Math.round(p.hits*100/p.swings)+'%' : '—';
                const avg = p.record > 0 ? Math.round(p.damage/p.record) : '—';
                html += `<tr data-display="${p.display||''}" data-class="${p.name||''}" data-record="${p.record||0}" data-waves="${p.totalWaves||0}" data-trophies="${p.trophies||0}" data-bosses="${p.bosses||0}" data-accuracy="${p.swings>0?Math.round(p.hits*100/p.swings):0}" data-avgdamage="${p.record>0?Math.round(p.damage/p.record):0}" data-faction="${fi}"><td>${p.emoji||''} ${p.display||'???'}</td><td>${p.name||''}</td><td class="highlight">${p.record||0}</td><td>${p.totalWaves||0}</td><td>${p.trophies||0}</td><td>${p.bosses||0}</td><td>${acc}</td><td>${avg}</td><td>${fi}</td></tr>`;
            });
            html += '</tbody></table></div></div>';

            container.innerHTML = html;
            setTimeout(() => { initSortable('leaderboard-table', 'record', 'desc'); initSortable('all-table', 'trophies', 'desc'); }, 150);
        }

        function initSortable(id, defSort, defDir) {
            const t = document.getElementById(id); if (!t) return;
            const b = t.querySelector('tbody'), h = t.querySelectorAll('.sortable-header');
            let cs = defSort, cd = defDir;
            function s(sb) {
                const r = Array.from(b.querySelectorAll('tr'));
                r.sort((a, b) => {
                    let va = a.dataset[sb], vb = b.dataset[sb];
                    if (sb === 'display' || sb === 'faction' || sb === 'class' || sb === 'passive') return cd === 'asc' ? va.localeCompare(vb) : vb.localeCompare(va);
                    va = parseFloat(va) || 0; vb = parseFloat(vb) || 0;
                    return cd === 'asc' ? va - vb : vb - va;
                });
                r.forEach(row => b.appendChild(row));
            }
            h.forEach(th => { th.addEventListener('click', () => { const sb = th.dataset.sort; h.forEach(x => x.classList.remove('asc', 'desc')); if (cs === sb) cd = cd === 'asc' ? 'desc' : 'asc'; else { cs = sb; cd = 'desc'; } th.classList.add(cd); s(cs); }); });
            const dh = t.querySelector(`[data-sort="${defSort}"]`);
            if (dh) { dh.classList.add(defDir); s(defSort); }
        }
    </script>
</body>
</html>
