<style>
/* --- КРУГОВАЯ ВЕРТУШКА --- */
.season-carousel-wrap{position:relative;margin:0 0 24px;padding:10px 0}
.season-carousel{display:flex;gap:8px;overflow-x:auto;scroll-behavior:smooth;padding:10px 20px;scrollbar-width:none;-ms-overflow-style:none;align-items:center}
.season-carousel::-webkit-scrollbar{display:none}
.season-card{flex:0 0 auto;width:100px;height:120px;background:var(--card);border:1px solid var(--border);border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:all .3s cubic-bezier(.4,0,.2,1);opacity:.6;transform:scale(.9);position:relative;user-select:none}
.season-card:hover{opacity:.9;transform:scale(.95);border-color:var(--purple)}
.season-card.active{opacity:1;transform:scale(1.1);border-color:var(--gold);box-shadow:0 0 24px rgba(240,185,11,.25);background:linear-gradient(160deg,var(--card),rgba(240,185,11,.06));z-index:2}
.season-card .sc-icon{font-size:2rem;margin-bottom:4px;filter:grayscale(.5);transition:filter .3s}
.season-card.active .sc-icon{filter:grayscale(0);transform:scale(1.1)}
.season-card .sc-num{font-size:1.2rem;font-weight:900;color:var(--muted)}
.season-card.active .sc-num{color:var(--gold)}
.season-card .sc-sub{font-size:.6rem;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-top:2px;text-align:center;padding:0 4px;line-height:1.2}
.season-card.active .sc-sub{color:var(--sub)}
.season-card .sc-badge{position:absolute;top:6px;right:6px;font-size:.5rem;padding:2px 5px;border-radius:8px;background:var(--gold);color:#000;font-weight:800;text-transform:uppercase;letter-spacing:.5px}
.season-card .sc-badge.ended{background:var(--elevated);color:var(--muted);border:1px solid var(--border)}
.carousel-btn{position:absolute;top:50%;transform:translateY(-50%);width:36px;height:36px;background:var(--card);border:1px solid var(--border);border-radius:50%;color:var(--gold);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:1.2rem;z-index:5;transition:all .2s;box-shadow:0 4px 12px rgba(0,0,0,.3)}
.carousel-btn:hover{background:var(--gold);color:#000;transform:translateY(-50%) scale(1.1)}
.carousel-btn.prev{left:0px}
.carousel-btn.next{right:0px}
/* --- ТАБЫ ТАБЛИЦ --- */
.table-tabs{display:flex;gap:6px;margin:14px 0;flex-wrap:wrap}
.table-tab{padding:7px 14px;border:1px solid var(--border);background:var(--elevated);color:var(--sub);border-radius:20px;cursor:pointer;font-size:.75rem;font-weight:600;font-family:inherit;transition:.2s;white-space:nowrap}
.table-tab:hover{border-color:var(--gold);color:var(--gold)}
.table-tab.active{background:var(--gold);color:#000;border-color:var(--gold);font-weight:800}
.table-panel{display:none;animation:fadeSlideIn .2s ease}
.table-panel.active{display:block}
/* --- ОБЩИЕ СТИЛИ (из оригинала) --- */
.season-frame{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:28px 24px;margin-bottom:20px;position:relative;overflow:hidden;animation:fadeSlideIn .4s ease}
.season-frame::after{content:'';position:absolute;top:0;left:0;right:0;height:2px;opacity:.6;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.season-frame.live{border-color:rgba(240,185,11,.4)}
.season-frame.ended{opacity:.9}
.season-title{font-size:1.2rem;font-weight:800;color:var(--gold);margin-bottom:2px;display:flex;align-items:center;gap:10px}
.season-badge{display:inline-block;padding:3px 12px;border-radius:20px;font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:1px}
.season-badge.ended{background:var(--elevated);color:var(--muted)}
.season-badge.live{background:var(--gold);color:#000;animation:softGlow 2s ease infinite}
@keyframes softGlow{0%,100%{box-shadow:0 0 8px rgba(240,185,11,.3)}50%{box-shadow:0 0 16px rgba(240,185,11,.6)}}
.season-quote{background:var(--elevated);border-left:3px solid var(--gold);padding:10px 16px;margin:12px 0 20px;color:var(--sub);font-size:.85rem;font-style:italic;border-radius:0 var(--radius-sm) var(--radius-sm) 0}
.section-subtitle{display:flex;align-items:center;gap:8px;color:var(--gold);font-size:.85rem;font-weight:700;margin:22px 0 12px;padding-bottom:8px;border-bottom:1px solid var(--border);text-transform:uppercase;letter-spacing:2px}
.section-subtitle::before{content:'';display:inline-block;width:4px;height:16px;background:var(--gold);border-radius:2px}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px}
.stat-card{background:var(--elevated);border-radius:var(--radius-sm);padding:16px 12px;text-align:center;border:1px solid var(--border);transition:transform .2s,box-shadow .2s}
.stat-card:hover{transform:translateY(-2px)}
.stat-value{font-size:1.5rem;font-weight:800;color:var(--gold);margin-bottom:2px}
.stat-label{color:var(--muted);font-size:0.65rem;margin-top:4px;text-transform:uppercase;letter-spacing:1px}
.stat-sub{color:var(--sub);font-size:.65rem;margin-top:2px}
.crown-section{margin-bottom:20px}
.crown-bar-visual{display:flex;height:40px;border-radius:var(--radius-sm);overflow:hidden;border:1px solid var(--border);margin-bottom:8px;position:relative}
.crown-light{background:linear-gradient(90deg,rgba(240,185,11,.7),rgba(240,185,11,.4));display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.8rem;color:#000;transition:flex .5s ease;min-width:40px}
.crown-dark{background:linear-gradient(90deg,rgba(163,113,247,.4),rgba(163,113,247,.7));display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.8rem;color:#fff;transition:flex .5s ease;min-width:40px}
.crown-icon-center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:1.4rem;z-index:3;filter:drop-shadow(0 0 6px rgba(240,185,11,.8));transition:left .5s ease}
.crown-owner{text-align:center;font-size:.8rem;color:var(--sub);font-weight:600}
.champion-section{background:var(--elevated);border:1px solid rgba(240,185,11,.2);border-radius:var(--radius-sm);padding:20px;margin-bottom:20px;animation:fadeSlideIn .4s ease}
.champion-section-title{color:var(--gold);font-size:.9rem;font-weight:700;text-align:center;margin-bottom:16px;letter-spacing:2px;text-transform:uppercase}
.champion-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.champion-card{background:var(--card);border-radius:var(--radius-sm);padding:20px 10px;text-align:center;border:1px solid var(--border);animation:fadeSlideIn .3s ease;transition:transform .2s,box-shadow .2s}
.champion-card:hover{transform:translateY(-3px)}
.champion-card.rank-1{border-color:rgba(240,185,11,.5);box-shadow:0 0 24px rgba(240,185,11,.15)}
.champion-card.rank-2{border-color:rgba(192,192,192,.3)}
.champion-card.rank-3{border-color:rgba(205,127,50,.3)}
.champ-avatar{width:52px;height:52px;border-radius:50%;background:var(--elevated);border:2px solid var(--border);display:flex;align-items:center;justify-content:center;margin:0 auto 8px;font-size:1.8rem;transition:border-color .2s}
.champion-card.rank-1 .champ-avatar{border-color:var(--gold);box-shadow:0 0 16px rgba(240,185,11,.3)}
.champ-name{color:var(--gold);font-weight:700;font-size:.85rem;word-break:break-word;margin-bottom:4px}
.champ-crowns{display:flex;justify-content:center;align-items:center;gap:1px;font-size:.85rem;flex-wrap:wrap;max-width:100%}
.champ-wins-text{color:var(--muted);font-size:.65rem;margin-top:2px}
tr.row-gold td:first-child{border-left:3px solid var(--gold)}
tr.row-silver td:first-child{border-left:3px solid var(--silver)}
tr.row-bronze td:first-child{border-left:3px solid var(--bronze)}
.tabs{display:flex;gap:14px;margin:20px 0;padding:4px;background:var(--card);border-radius:var(--radius);border:1px solid var(--border);justify-content:center}
.tab-btn{padding:10px 16px;border:none;background:transparent;color:var(--sub);border-radius:14px;cursor:pointer;font-weight:600;font-size:0.75rem;font-family:inherit;transition:0.2s;white-space:nowrap}
.tab-btn:hover{background:var(--elevated);color:var(--text)}
.tab-btn.active{background:linear-gradient(135deg,var(--ice),var(--gold));color:#000;font-weight:700}
.tab-content{display:none;animation:fadeSlideIn .3s ease}
.tab-content.active{display:block}
.sortable-header{cursor:pointer;user-select:none;position:relative;padding-right:18px;transition:color .2s}
.sortable-header:hover{color:var(--gold)}
.sortable-header::after{content:' ↕';position:absolute;right:4px;opacity:0.4;font-size:0.7rem}
.sortable-header.asc::after{content:' ↑';opacity:1;color:var(--gold)}
.sortable-header.desc::after{content:' ↓';opacity:1;color:var(--gold)}
.search-row{display:flex;gap:10px;margin-bottom:16px;align-items:center;flex-wrap:wrap}
.search-input{padding:10px 16px;background:var(--elevated);border:1px solid var(--border);border-radius:20px;color:var(--text);font-size:.85rem;font-family:inherit;transition:.2s;width:100%;max-width:340px}
.search-input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(240,185,11,0.1)}
.search-input::placeholder{color:var(--muted)}
.search-clear{background:var(--elevated);border:1px solid var(--border);color:var(--sub);padding:8px 14px;border-radius:20px;cursor:pointer;font-size:.75rem;font-family:inherit;transition:.2s;white-space:nowrap}
.search-clear:hover{border-color:var(--gold);color:var(--gold)}
#total-table tbody tr{transition:background .2s}
#total-table tbody tr:hover{background:var(--card)}
#total-table tbody tr.row-gold{background:rgba(240,185,11,0.06)}
#total-table tbody tr.row-silver{background:rgba(192,192,192,0.04)}
#total-table tbody tr.row-bronze{background:rgba(205,127,50,0.04)}
#total-table tbody td{padding:10px 12px;font-size:0.82rem}
#total-table tbody td.number{font-variant-numeric:tabular-nums}
#total-table thead th{position:sticky;top:0;background:var(--elevated);z-index:2;padding:10px 12px;font-size:0.7rem;text-transform:uppercase;letter-spacing:0.5px}
.player-link{color:var(--gold);text-decoration:none;font-weight:600;transition:color .2s}
.player-link:hover{color:var(--text);text-decoration:underline}
@keyframes spin{to{transform:rotate(360deg)}}
.load-percent{width:72px;height:72px;margin:40px auto 0;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--elevated);border:2px solid var(--purple);color:var(--gold);font-size:1.2rem;font-weight:800;position:relative}
.load-percent::before{content:'';position:absolute;inset:-6px;border-radius:50%;border:2px solid transparent;border-top-color:var(--gold);border-right-color:var(--purple);animation:spin 1s linear infinite}
.load-bar{width:220px;height:6px;background:var(--bg);border-radius:3px;margin:14px auto 0;overflow:hidden;border:1px solid var(--border)}
.load-bar-fill{height:100%;background:linear-gradient(90deg,var(--purple),var(--gold));border-radius:3px;transition:width .3s ease}
.load-info{text-align:center;color:var(--muted);font-size:.75rem;margin-top:8px}
.load-title{text-align:center;color:var(--sub);font-size:.85rem;margin-top:4px}
.reading-progress{position:fixed;top:0;left:0;width:100%;height:3px;background:linear-gradient(90deg,var(--gold),var(--purple),var(--ice),var(--red));transform-origin:0 50%;transform:scaleX(0);z-index:1000}
.scroll-top{position:fixed;bottom:80px;right:20px;width:44px;height:44px;background:var(--card);border:1px solid var(--gold);border-radius:50%;color:var(--gold);display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:0;pointer-events:none;transition:all .3s ease;z-index:98;font-size:1.1rem;box-shadow:0 4px 12px rgba(0,0,0,.2)}
.scroll-top.visible{opacity:1;pointer-events:all}
.scroll-top:hover{background:var(--gold);color:#000;transform:translateY(-3px)}
@media(max-width:768px){
.stats-grid{grid-template-columns:repeat(2,1fr);gap:8px}
.stat-value{font-size:1.3rem}
.season-frame{padding:18px 14px}
.season-title{font-size:1.05rem;flex-wrap:wrap;gap:6px}
.champion-grid{grid-template-columns:repeat(2,1fr);gap:8px}
.champion-section{padding:14px 12px}
.crown-bar-visual{height:32px}
.crown-light,.crown-dark{font-size:.7rem}
.crown-icon-center{font-size:1.2rem}
.tabs{gap:6px}
.tab-btn{padding:9px 16px;font-size:.78rem;flex:1;text-align:center}
.search-row{flex-direction:column;align-items:stretch}
.search-input{max-width:100%}
.search-clear{width:100%;text-align:center}
.table-tabs{gap:4px}
.table-tab{padding:6px 10px;font-size:.68rem}
.season-card{width:80px;height:100px}
.season-card .sc-icon{font-size:1.5rem}
.season-card .sc-num{font-size:1rem}
.season-card .sc-sub{font-size:.5rem}
.carousel-btn{width:30px;height:30px;font-size:1rem}
.table-container{overflow-x:auto}
table{font-size:.72rem}
th,td{padding:6px 8px;white-space:nowrap}
.scroll-top{bottom:70px;right:16px;width:40px;height:40px;font-size:1rem}
}
@keyframes fadeSlideIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.season-card.is-live { border-color: var(--gold); box-shadow: 0 0 15px rgba(240,185,11,0.2); }
.season-card.is-live .sc-badge { animation: pulseLive 1.5s infinite alternate; }
@keyframes pulseLive { 0% { transform: scale(1); opacity: 1; } 100% { transform: scale(1.1); opacity: 0.8; } }
.table-panel table td { vertical-align: middle; }
.table-panel table td:first-child { text-align: center; color: var(--muted); font-weight: 700; }
.table-panel table td img { vertical-align: middle; margin-right: 6px; }
.table-panel table td.num { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
</style>
</head>

<script>
// ============ КОНСТАНТЫ ============
const STATS_URL = 'https://raw.githubusercontent.com/rvotaenotaTTV/dnd-stats/main/stats_data.json';
const STATS_URL_FALLBACK = 'https://cdn.jsdelivr.net/gh/rvotaenotaTTV/dnd-stats@main/stats_data.json';
const ARCHIVE_BASE = 'https://raw.githubusercontent.com/rvotaenotaTTV/dnd-stats/main/seasons/season_';
const ARCHIVE_BASE_FALLBACK = 'https://cdn.jsdelivr.net/gh/rvotaenotaTTV/dnd-stats@main/seasons/season_';
const SEASON_ICONS = ['🌱','🏁','🔥','🩸','🕯️','⚡','💀','🌑','⚔️','🌟','🌊','🏔','👑','💎','🌌','🏆'];
const SEASON_SUBTITLES = ['Пролог','Рождение','Эпоха Легенд','Кровь Бездны','Экспедиция','Раскол Ордена','Возвращение','Восход','Война','Рассвет','Прилив','Глубины','Корона','Осколки','Бездна','Финал'];
const SEASON_SCAN_LIMIT = 15;
let currentSeasonNum = -1;
let seasonTabs = [];
let activeSeason = -1;
let totalPlayersData = [];
let seasonCache = {};

function getRaceIcon(name) {
    const map = {'Человек':'human','Орк':'orc','Дворф':'dwarf','Эльф':'elf','Нежить':'undead','Табакси':'tabaxi','Тифлинг':'tiefling'};
    return map[name] ? `icons/${map[name]}.png` : null;
}
function getClassIcon(name) {
    const map = {'Воин':'warrior','Паладин':'paladin','Плут':'rogue','Монах':'monk','Следопыт':'ranger','Чародей':'sorcerer','Бард':'bard','Друид':'druid','Изобретатель':'artificer','Варвар':'barbarian','Волшебница':'wizard','Некромант':'necromancer','Жрец':'cleric','Колдун':'warlock','Алхимик':'alchemist'};
    return map[name] ? `icons/${map[name]}.png` : null;
}
function getPlayerIcon(playerName, emojiFallback, size = 24) {
    const imgStyle = `width:${size}px;height:${size}px;object-fit:contain;vertical-align:middle;margin-right:4px;display:inline-block;`;
    const img = (src) => `<img src="${src}" style="${imgStyle}" onerror="this.style.display='none'">`;
    const emoji = (char) => `<span style="display:inline-block;width:${size}px;height:${size}px;text-align:center;line-height:${size}px;font-size:${size*0.8}px;vertical-align:middle;margin-right:4px;">${char}</span>`;
    
    if (!playerName || typeof playerName !== 'string' || !playerName.includes('-')) return emoji(emojiFallback);
    const parts = playerName.split('-'), raceName = parts[0], className = parts[1];
    const raceIcon = getRaceIcon(raceName), classIcon = getClassIcon(className);
    if (raceIcon && classIcon) return `${img(raceIcon)}${img(classIcon)}`;
    if (raceIcon) return `${img(raceIcon)}${emoji(emojiFallback || '')}`;
    if (classIcon) return `${emoji(emojiFallback || '')}${img(classIcon)}`;
    return emoji(emojiFallback || '');
}

// ============ ЗАГРУЗКА ============
async function getSeasonData(n) {
    const KEY = 'eternis-season-v2-' + n;
    try { const c = JSON.parse(localStorage.getItem(KEY) || 'null'); if (c) return c.data; } catch (e) {}
    const fetchT = async (url) => {
        const ctrl = new AbortController(); const t = setTimeout(() => ctrl.abort(), 3000);
        try { const r = await fetch(url, { signal: ctrl.signal }); clearTimeout(t); return r; } catch (e) { clearTimeout(t); throw e; }
    };
    try {
        let r; try { r = await fetchT(`${ARCHIVE_BASE}${n}.json`); } catch (e) { r = await fetchT(`${ARCHIVE_BASE_FALLBACK}${n}.json`); }
        if (!r || !r.ok) return null;
        const data = await r.json();
        try { localStorage.setItem(KEY, JSON.stringify({ ts: Date.now(), data })); } catch (e) {}
        return data;
    } catch (e) { return null; }
}
const STATS_CACHE_KEY = 'eternis-stats';
const STATS_CACHE_TTL = 2 * 60 * 1000;
let statsPromise = null;
function getStatsData() {
    if (statsPromise) return statsPromise;
    statsPromise = (async () => {
        try { const c = JSON.parse(localStorage.getItem(STATS_CACHE_KEY) || 'null'); if (c && (Date.now() - c.ts < STATS_CACHE_TTL)) return c.data; } catch (e) {}
        let r = await fetch(STATS_URL); if (!r.ok) r = await fetch(STATS_URL_FALLBACK);
        const data = await r.json();
        try { localStorage.setItem(STATS_CACHE_KEY, JSON.stringify({ ts: Date.now(), data })); } catch (e) {}
        return data;
    })().catch(e => { statsPromise = null; throw e; });
    return statsPromise;
}
function renderProgress(loaded, total, title) {
    const rawPct = total > 0 ? Math.round((loaded / total) * 100) : 0;
    const pct = loaded >= total ? 100 : Math.min(99, rawPct);
    const el = document.getElementById('progressBox'); if (!el) return;
    el.innerHTML = `<div class="load-percent">${pct}%</div><div class="load-bar"><div class="load-bar-fill" style="width:${pct}%"></div></div><div class="load-info">Загружено ${loaded} из ${total}</div>${title ? `<div class="load-title">${title}</div>` : ''}`;
}
function getRankClass(i) { return i === 0 ? 'row-gold' : i === 1 ? 'row-silver' : i === 2 ? 'row-bronze' : ''; }

// ============ ВЕРТУШКА ============
function renderCarousel() {
    const el = document.getElementById('seasonCarousel');
    if (!el) return;
    const sorted = [...seasonTabs].sort((a, b) => a - b);
    const cardHTML = (n) => {
        const isActive = n === activeSeason;
        const isCurrent = n === currentSeasonNum;
        const badge = isCurrent ? '<div class="sc-badge">LIVE</div>' : '<div class="sc-badge ended">END</div>';
        const liveClass = isCurrent ? 'is-live' : '';
        return `<div class="season-card ${isActive ? 'active' : ''} ${liveClass}" data-num="${n}" onclick="switchSeason(${n})">
            ${badge}
            <div class="sc-icon">${SEASON_ICONS[n] || '📋'}</div>
            <div class="sc-num">${n}</div>
            <div class="sc-sub">${SEASON_SUBTITLES[n] || ''}</div>
        </div>`;
    };
    const clonesBefore = sorted.slice(-3);
    const clonesAfter = sorted.slice(0, 3);
    el.innerHTML = clonesBefore.map(cardHTML).join('') + sorted.map(cardHTML).join('') + clonesAfter.map(cardHTML).join('');
    setTimeout(() => {
        const active = el.querySelector('.season-card.active');
        if (active) active.scrollIntoView({ behavior: 'auto', inline: 'center', block: 'nearest' });
    }, 50);
    let scrollLock = false;
    el.onscroll = () => {
        if (scrollLock) return;
        const max = el.scrollWidth - el.clientWidth;
        if (el.scrollLeft < 20) { scrollLock = true; el.scrollLeft = max / 2; setTimeout(() => scrollLock = false, 100); }
        else if (el.scrollLeft > max - 20) { scrollLock = true; el.scrollLeft = max / 2; setTimeout(() => scrollLock = false, 100); }
    };
}
function scrollCarousel(dir) {
    const idx = seasonTabs.indexOf(activeSeason);
    if (idx < 0) return;
    let next = idx + dir;
    if (next < 0) next = seasonTabs.length - 1;
    if (next >= seasonTabs.length) next = 0;
    switchSeason(seasonTabs[next]);
}
window.scrollCarousel = scrollCarousel;

// ============ ОБЗОР СЕЗОНА (7 ТАБЛИЦ) ============
function renderSeason(data, seasonNum, isCurrent) {
    const dungeonPlayers = (data.dungeon && data.dungeon.players) ? data.dungeon.players : {};
    const players = data.players || [];
    const heroArchive = data.heroArchive || {};
    const seasonTop = data.seasonTop && data.seasonTop.length > 0
        ? data.seasonTop
        : [...players].filter(p => (p.skill || 0) > 0).sort((a, b) => (b.skill || 0) - (a.skill || 0));
    const factionScore = data.factionScore || {};
    const territory = data.dungeonTrophies || data.territory || (data.dungeon && (data.dungeon.dungeonTrophies || data.dungeon.territory)) || { light: 0, dark: 0 };
    const totalPlayers = players.length;
    let rawFights = players.reduce((s, p) => s + (p.wins || 0) + (p.losses || 0), 0);
    let maxStreak = players.reduce((m, p) => (p.best || 0) > m ? (p.best || 0) : m, 0);
    let maxShards = players.reduce((m, p) => (p.shards || 0) > m ? (p.shards || 0) : m, 0);
    let maxLevel = players.reduce((m, p) => (p.level || 0) > m ? (p.level || 0) : m, 0);
    let maxFactionWins = players.reduce((m, p) => (p.factionWins || 0) > m ? (p.factionWins || 0) : m, 0);
    let worstStreak = players.reduce((m, p) => (p.worst || 0) > m ? (p.worst || 0) : m, 0);
    let allForWR = [...players];
    const archivedPlayers = [];
    Object.entries(heroArchive).forEach(([playerKey, heroes]) => {
        heroes.forEach(h => {
            rawFights += (h.wins || 0) + (h.losses || 0);
            if ((h.best || 0) > maxStreak) maxStreak = h.best || 0;
            if ((h.worst || 0) > worstStreak) worstStreak = h.worst || 0;
            const archived = {
                display: playerKey, name: h.name || '', emoji: h.emoji || '⚔️',
                wins: h.wins || 0, losses: h.losses || 0, best: h.best || 0, worst: h.worst || 0,
                tournamentWins: h.tournamentWins || 0, shards: 0, level: 0, factionWins: 0
            };
            archivedPlayers.push(archived);
            allForWR.push({ wins: archived.wins, losses: archived.losses, display: archived.display, name: archived.name });
        });
    });
    const totalFights = Math.floor(rawFights / 2);
    const allPlayers = [...players, ...archivedPlayers];
    const topWR = allForWR.filter(p => (p.wins || 0) + (p.losses || 0) >= 30).sort((a, b) => {
        const wa = (a.wins || 0) / ((a.wins || 0) + (a.losses || 0) || 1);
        const wb = (b.wins || 0) / ((b.wins || 0) + (b.losses || 0) || 1);
        return wb - wa;
    });
    const maxWinrate = topWR.length > 0 ? topWR[0] : null;
    const champions = players.filter(p => (p.tournamentWins || 0) > 0).sort((a, b) => (b.tournamentWins || 0) - (a.tournamentWins || 0));
    Object.entries(heroArchive).forEach(([playerKey, heroes]) => {
        heroes.forEach(h => {
            if ((h.tournamentWins || 0) > 0) {
                champions.push({ display: playerKey, emoji: h.emoji || '', name: h.name || '', tournamentWins: h.tournamentWins || 0, wins: h.wins || 0, losses: h.losses || 0, faction: '', champion: false });
            }
        });
    });
    champions.sort((a, b) => (b.tournamentWins || 0) - (a.tournamentWins || 0));
    const maxDungeonBosses = players.reduce((m, p) => { const d = dungeonPlayers[p.display]; return d && d.bosses > m ? d.bosses : m; }, 0);
    const maxSkill = seasonTop.length > 0 ? seasonTop[0].skill || '—' : '—';
    const maxDungeonRecord = players.reduce((m, p) => { const d = dungeonPlayers[p.display]; return d && d.record > m ? d.record : m; }, 0);
    const maxDungeonTrophies = players.reduce((m, p) => { const d = dungeonPlayers[p.display]; return d && d.trophies > m ? d.trophies : m; }, 0);
    const topDungeon = players.map(p => { const d = dungeonPlayers[p.display]; return { ...p, record: d?.record || 0, trophies: d?.trophies || 0 }; }).filter(p => p.record > 0).sort((a, b) => b.record - a.record || b.trophies - a.trophies);
    const duelLight = factionScore.duelLight || 0, duelDark = factionScore.duelDark || 0;
    const battleLight = factionScore.battleLight || 0, battleDark = factionScore.battleDark || 0;
    const totalTerritory = (territory.light || 0) + (territory.dark || 0);
    const lightPct = totalTerritory > 0 ? (territory.light / totalTerritory) * 100 : 50;
    const darkPct = totalTerritory > 0 ? (territory.dark / totalTerritory) * 100 : 50;
    const crownOwner = territory.light > territory.dark ? '🌝 Орден Света' : territory.dark > territory.light ? '🌚 Культ Тьмы' : '⚖️ Ничья';
    const seasonName = `${SEASON_ICONS[seasonNum] || '📋'} Сезон ${seasonNum}`;
    const subtitle = SEASON_SUBTITLES[seasonNum] || '';
    let html = `<div class="season-frame ${isCurrent ? 'live' : 'ended'}">`;
    html += `<div class="season-title">${seasonName} <span class="season-badge ${isCurrent ? 'live' : 'ended'}">${isCurrent ? 'LIVE' : 'ЗАВЕРШЁН'}</span></div>`;
    if (subtitle) html += `<div class="season-quote">«${subtitle}»</div>`;
    html += '<div class="section-subtitle">🏟 Арена</div><div class="stats-grid">';
    html += `<div class="stat-card"><div class="stat-value">${totalPlayers}</div><div class="stat-label">👥 Игроков</div></div>`;
    html += `<div class="stat-card"><div class="stat-value">${totalFights}</div><div class="stat-label">⚔️ Боёв</div></div>`;
    html += `<div class="stat-card"><div class="stat-value">${champions.length || '—'}</div><div class="stat-label">👑 Чемпионов</div></div>`;
    html += `<div class="stat-card"><div class="stat-value">${maxSkill}</div><div class="stat-label">⭐ Макс. SKILL</div></div>`;
    html += `<div class="stat-card"><div class="stat-value">${maxLevel}</div><div class="stat-label">📈 Макс. уровень</div></div>`;
    html += `<div class="stat-card"><div class="stat-value">${maxShards}</div><div class="stat-label">💎 Макс. осколков</div></div>`;
    html += `<div class="stat-card"><div class="stat-value">${maxWinrate ? ((maxWinrate.wins || 0) * 100 / ((maxWinrate.wins || 0) + (maxWinrate.losses || 0) || 1)).toFixed(1) + '%' : '—'}</div><div class="stat-label">📈 Лучший винрейт</div><div class="stat-sub">${maxWinrate ? (maxWinrate.display || maxWinrate.name || '') : ''}</div></div>`;
    html += `<div class="stat-card"><div class="stat-value">${maxStreak}</div><div class="stat-label">🔥 Макс. стрик</div></div>`;
    if (worstStreak > 0 || isCurrent) html += `<div class="stat-card"><div class="stat-value">${worstStreak || '—'}</div><div class="stat-label">💔 Худший стрик</div></div>`;
    if (maxFactionWins > 0 || isCurrent) html += `<div class="stat-card"><div class="stat-value">${maxFactionWins || '—'}</div><div class="stat-label">⚔️ Побед за фракцию</div></div>`;
    if (duelLight + duelDark > 0 || isCurrent) html += `<div class="stat-card"><div class="stat-value">${duelLight} : ${duelDark}</div><div class="stat-label">⚔️ Дуэли Свет vs Тьма</div></div>`;
    if (battleLight + battleDark > 0 || isCurrent) html += `<div class="stat-card"><div class="stat-value">${battleLight} : ${battleDark}</div><div class="stat-label">🏆 Битвы Свет vs Тьма</div></div>`;
    html += '</div>';
    if (totalTerritory > 0) {
        html += '<div class="section-subtitle">👑 Корона Раскола</div><div class="crown-section">';
        html += '<div class="crown-bar-visual">';
        html += `<div class="crown-light" style="flex:${lightPct}">${territory.light > 0 ? territory.light : ''}</div>`;
        html += `<div class="crown-dark" style="flex:${darkPct}">${territory.dark > 0 ? territory.dark : ''}</div>`;
        html += `<div class="crown-icon-center" style="left:${lightPct}%">👑</div>`;
        html += '</div>';
        html += `<div class="crown-owner">Владелец: ${crownOwner}</div>`;
        html += '</div>';
    }
    const dungeonKeys = Object.keys(dungeonPlayers);
    if (dungeonKeys.length > 0) {
        html += '<div class="section-subtitle">🏔 Подземелье</div><div class="stats-grid">';
        html += `<div class="stat-card"><div class="stat-value">${dungeonKeys.length}</div><div class="stat-label">👥 Игроков</div></div>`;
        html += `<div class="stat-card"><div class="stat-value">${maxDungeonRecord || '—'}</div><div class="stat-label">🏆 Рекорд волн</div></div>`;
        html += `<div class="stat-card"><div class="stat-value">${maxDungeonBosses || '—'}</div><div class="stat-label">💀 Боссов убито</div></div>`;
        html += `<div class="stat-card"><div class="stat-value">${maxDungeonTrophies || '—'}</div><div class="stat-label">🐉 Трофеев</div></div>`;
        html += '</div>';
    }
    if (champions.length > 0) {
        html += '<div class="champion-section"><div class="champion-section-title">👑 Чемпионы сезона</div><div class="champion-grid">';
        champions.slice(0, 4).forEach((p, i) => {
            const rankClass = i === 0 ? 'rank-1' : i === 1 ? 'rank-2' : i === 2 ? 'rank-3' : '';
            const wins = p.tournamentWins || 0;
            const crownsHtml = wins <= 5 ? '👑'.repeat(wins) : `👑 ×${wins}`;
            html += `<div class="champion-card ${rankClass}"><div class="champ-avatar" style="display:flex;align-items:center;justify-content:center;">${getPlayerIcon(p.name || p.display, p.emoji || '⚔️', 36)}</div><div class="champ-name">${p.display}</div><div class="champ-crowns">${crownsHtml}</div><div class="champ-wins-text">${wins} побед</div></div>`;
        });
        html += '</div></div>';
    } else if (!isCurrent) {
        html += '<div class="champion-section" style="opacity:0.5;text-align:center;padding:20px;color:var(--muted);font-style:italic;">Турниры не проводились — эпоха чистых дуэлей</div>';
    }
    // ===== ТАБЛИЦЫ ЛИДЕРОВ: 7 ВКЛАДОК =====
    const skillRows = seasonTop.slice(0, 5).map((p, i) => `<tr class="${getRankClass(i)}"><td>${i + 1}</td><td>${getPlayerIcon(p.name, p.emoji, 20)} ${p.display || '???'}</td><td class="number">${p.skill || 0}</td><td class="number">${p.wins || 0}</td></tr>`).join('');
    
    const mostActive = [...allPlayers].sort((a, b) => ((b.wins || 0) + (b.losses || 0)) - ((a.wins || 0) + (a.losses || 0))).slice(0, 5);
    const activeRows = mostActive.map((p, i) => `<tr class="${getRankClass(i)}"><td>${i + 1}</td><td>${getPlayerIcon(p.name, p.emoji, 20)} ${p.display || '???'}</td><td class="number">${(p.wins || 0) + (p.losses || 0)}</td></tr>`).join('');
    
    const topShards = [...allPlayers].sort((a, b) => (b.shards || 0) - (a.shards || 0)).slice(0, 5);
    const shardRows = topShards.map((p, i) => `<tr class="${getRankClass(i)}"><td>${i + 1}</td><td>${getPlayerIcon(p.name, p.emoji, 20)} ${p.display || '???'}</td><td class="number">${p.shards || 0}</td></tr>`).join('');
    
    const topStreaks = [...allPlayers].sort((a, b) => (b.best || 0) - (a.best || 0)).slice(0, 5);
    const streakRows = topStreaks.map((p, i) => `<tr class="${getRankClass(i)}"><td>${i + 1}</td><td>${getPlayerIcon(p.name, p.emoji, 20)} ${p.display || '???'}</td><td class="number">${p.best || 0}</td></tr>`).join('');
    
    const wrRows = topWR.slice(0, 5).map((p, i) => `<tr class="${getRankClass(i)}"><td>${i + 1}</td><td>${getPlayerIcon(p.name, p.emoji, 20)} ${p.display || p.name || '???'}</td><td class="number">${((p.wins || 0) * 100 / ((p.wins || 0) + (p.losses || 0) || 1)).toFixed(1)}%</td><td class="number">${p.wins || 0}-${p.losses || 0}</td></tr>`).join('');
    
    const dungeonRecordRows = topDungeon.slice(0, 5).map((p, i) => `<tr class="${getRankClass(i)}"><td>${i + 1}</td><td>${getPlayerIcon(p.name, p.emoji, 20)} ${p.display || '???'}</td><td class="number">${p.record || 0}</td></tr>`).join('');
    
    const dungeonBossRows = [...topDungeon].sort((a, b) => (b.trophies || 0) - (a.trophies || 0)).slice(0, 5).map((p, i) => `<tr class="${getRankClass(i)}"><td>${i + 1}</td><td>${getPlayerIcon(p.name, p.emoji, 20)} ${p.display || '???'}</td><td class="number">${p.trophies || 0}</td></tr>`).join('');

    html += '<div class="section-subtitle">📊 Таблицы лидеров</div>';
    html += '<div class="table-tabs">';
    const tabBtn = (id, iconSvg, label, isActive) => `<button class="table-tab ${isActive ? 'active' : ''}" data-tab="${id}" onclick="switchTableTab('${id}', this)" style="display:inline-flex;align-items:center;justify-content:center;gap:6px;">${iconSvg} <span>${label}</span></button>`;
    html += tabBtn('skill', '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 4l3 12h14l3-12-6 7-4-7-4 7-6-7z"/></svg>', 'SKILL', true);
    html += tabBtn('wr', '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 20V10"/><path d="M12 20V4"/><path d="M6 20v-6"/></svg>', 'Винрейт', false);
    html += tabBtn('shards', '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3h12l4 6-10 12L2 9l4-6z"/></svg>', 'Осколки', false);
    html += tabBtn('streaks', '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg>', 'Стрики', false);
    html += tabBtn('dungeonRecord', '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/><path d="M12 2L2 7l10 5 10-5-10-5z"/></svg>', 'Данж-волны', false);
    html += tabBtn('dungBoss', '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>', 'Данж-боссы', false);
    html += tabBtn('active', '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>', 'Активность', false);
    html += '</div>';

    // Панели с таблицами
    const makePanel = (id, active, head, rows) => `
        <div class="table-panel ${active ? 'active' : ''}" data-panel="${id}">
            <div class="table-container" style="overflow-x:auto;max-height:60vh;overflow-y:auto;margin-top:10px;">
                <table style="min-width:500px">
                    <thead><tr>${head}</tr></thead>
                    <tbody>${rows || '<tr><td colspan="5" style="text-align:center;color:var(--muted);padding:30px">Нет данных</td></tr>'}</tbody>
                </table>
            </div>
        </div>`;

    html += makePanel('skill', true, '<th style="width:40px;text-align:center;">#</th><th>Игрок</th><th class="num">Skill</th><th class="num">Победы</th>', skillRows);
    html += makePanel('wr', false, '<th style="width:40px;text-align:center;">#</th><th>Игрок</th><th class="num">WR</th><th class="num">W/L</th>', wrRows);
    html += makePanel('shards', false, '<th style="width:40px;text-align:center;">#</th><th>Игрок</th><th class="num">Осколков</th>', shardRows);
    html += makePanel('streaks', false, '<th style="width:40px;text-align:center;">#</th><th>Игрок</th><th class="num">Стрик</th>', streakRows);
    html += makePanel('dungeonRecord', false, '<th style="width:40px;text-align:center;">#</th><th>Игрок</th><th class="num">Волн</th>', dungeonRecordRows);
    html += makePanel('dungBoss', false, '<th style="width:40px;text-align:center;">#</th><th>Игрок</th><th class="num">Трофеев</th>', dungeonBossRows);
    html += makePanel('active', false, '<th style="width:40px;text-align:center;">#</th><th>Игрок</th><th class="num">Боёв</th>', activeRows);

    html += '</div></div>';
    return html;
}

// ============ ЗАГРУЗКА СЕЗОНОВ ============
async function detectSeasons() {
    renderProgress(0, SEASON_SCAN_LIMIT + 2, 'Определяю сезоны...');
    const checks = await Promise.all(
        Array.from({ length: SEASON_SCAN_LIMIT + 1 }, (_, n) => {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 5000);
            return fetch(`${ARCHIVE_BASE}${n}.json`, { signal: controller.signal })
                .then(r => { clearTimeout(timeoutId); return r.ok ? n : -1; })
                .catch(() => { clearTimeout(timeoutId); return -1; });
        })
    );
    const foundSeasons = checks.filter(n => n >= 0).sort((a, b) => a - b);
    currentSeasonNum = foundSeasons.length > 0 ? foundSeasons[foundSeasons.length - 1] + 1 : 0;
    seasonTabs = [...foundSeasons, currentSeasonNum];
    renderProgress(SEASON_SCAN_LIMIT + 1, SEASON_SCAN_LIMIT + 2, 'Готовлю отображение...');
    const contentContainer = document.getElementById('tab-content-container');
    contentContainer.innerHTML = '';
    const totalLoads = seasonTabs.length;
    let loadedCount = 0;
    function onSeasonLoaded() {
        loadedCount++;
        renderProgress(loadedCount, totalLoads, `Загружено ${loadedCount} из ${totalLoads} сезонов`);
        if (loadedCount >= totalLoads) {
            setTimeout(() => { const loader = document.getElementById('initial-loader'); if (loader) loader.style.display = 'none'; }, 500);
        }
    }
    seasonTabs.forEach((sn, idx) => {
        const isCurrent = sn === currentSeasonNum;
        const isLast = idx === seasonTabs.length - 1;
        const tabId = `tab-s${sn}`;
        const div = document.createElement('div');
        div.id = tabId;
        div.className = `tab-content${isLast ? ' active' : ''}`;
        div.innerHTML = '<div class="status-message" style="text-align:center;padding:40px;color:var(--muted)">Загрузка...</div>';
        contentContainer.appendChild(div);
        const loader = isCurrent ? loadCurrentSeason(sn, tabId) : loadArchiveSeason(sn, tabId);
        if (loader && loader.then) loader.then(onSeasonLoaded);
        else onSeasonLoaded();
    });
    activeSeason = currentSeasonNum;
    renderCarousel();
    loadTotalStats();
}
async function loadCurrentSeason(sn, tabId) {
    const container = document.getElementById(tabId);
    try {
        const d = await getStatsData();
        container.innerHTML = renderSeason(d, sn, true);
        return true;
    } catch {
        container.innerHTML = `<div class="season-frame live"><div class="season-title">${SEASON_ICONS[sn] || '📋'} Сезон ${sn}</div><div style="text-align:center;padding:20px;color:var(--muted)">❌ Не удалось загрузить данные</div></div>`;
        return false;
    }
}
async function loadArchiveSeason(sn, tabId) {
    const container = document.getElementById(tabId);
    try {
        const d = await getSeasonData(sn);
        if (!d) throw new Error('no data');
        container.innerHTML = renderSeason(d, sn, false);
        return true;
    } catch {
        container.innerHTML = `<div class="season-frame ended"><div class="season-title">${SEASON_ICONS[sn] || '📋'} Сезон ${sn}</div><div style="text-align:center;padding:20px;color:var(--muted)">❌ Архив недоступен</div></div>`;
        return false;
    }
}
function switchSeason(sn) {
    if (sn === activeSeason) return;
    activeSeason = sn;
    renderCarousel();
    document.querySelectorAll('#seasons-tab-seasons .tab-content').forEach(t => t.classList.remove('active'));
    const el = document.getElementById(`tab-s${sn}`);
    if (el) el.classList.add('active');
}
window.switchSeason = switchSeason;

// ============ ЛЕГЕНДЫ ============
async function loadTotalStats() {
    const tbody = document.getElementById('total-table-body');
    const summary = document.getElementById('total-summary');
    if (!tbody) return;
    const aggregated = {};
    function addPlayer(display, wins, losses, best, shards, tournaments, dp) {
        if (!display) return;
        if (!aggregated[display]) aggregated[display] = { display, wins: 0, losses: 0, best: 0, shards: 0, tournaments: 0, dungeonRecord: 0, dungeonWaves: 0, dungeonBosses: 0, fights: 0, winrate: 0 };
        const a = aggregated[display];
        a.wins += wins || 0; a.losses += losses || 0; a.best = Math.max(a.best, best || 0); a.shards += shards || 0; a.tournaments += tournaments || 0;
        if (dp) { a.dungeonRecord = Math.max(a.dungeonRecord, dp.record || 0); a.dungeonWaves += dp.totalWaves || 0; a.dungeonBosses += dp.bosses || 0; }
    }
    try {
        const d = await getStatsData();
        (d.players || []).forEach(p => { const dp = d.dungeon?.players?.[p.display]; addPlayer(p.display, p.wins, p.losses, p.best, p.shards, p.tournamentWins, dp); });
        if (d.heroArchive) { Object.entries(d.heroArchive).forEach(([playerName, heroes]) => { heroes.forEach(h => { addPlayer(playerName, h.wins, h.losses, h.best, 0, h.tournamentWins, null); }); }); }
    } catch (e) {}
    for (let n = 0; n < currentSeasonNum; n++) {
        try {
            const d = await getSeasonData(n);
            if (!d) break;
            (d.players || []).forEach(p => { const dp = d.dungeon?.players?.[p.display]; addPlayer(p.display, p.wins, p.losses, p.best, p.shards, p.tournamentWins, dp); });
            if (d.heroArchive) { Object.entries(d.heroArchive).forEach(([playerName, heroes]) => { heroes.forEach(h => { addPlayer(playerName, h.wins, h.losses, h.best, 0, h.tournamentWins, null); }); }); }
        } catch (e) { break; }
    }
    totalPlayersData = Object.values(aggregated).map(p => { p.fights = p.wins + p.losses; p.winrate = p.fights > 0 ? parseFloat((p.wins * 100 / p.fights).toFixed(1)) : 0; return p; });
    if (totalPlayersData.length === 0) { tbody.innerHTML = '<tr><td colspan="11" style="text-align:center;color:var(--muted);padding:40px">Нет данных</td></tr>'; return; }
    totalPlayersData.sort((a, b) => b.wins - a.wins);
    const totalWins = totalPlayersData.reduce((s, p) => s + p.wins, 0);
    const totalLosses = totalPlayersData.reduce((s, p) => s + p.losses, 0);
    const totalFightsAll = Math.floor((totalWins + totalLosses) / 2);
    const totalShardsAll = totalPlayersData.reduce((s, p) => s + p.shards, 0);
    const totalTournamentsAll = totalPlayersData.reduce((s, p) => s + p.tournaments, 0);
    const totalDungeonWavesAll = totalPlayersData.reduce((s, p) => s + p.dungeonWaves, 0);
    const totalDungeonBossesAll = totalPlayersData.reduce((s, p) => s + p.dungeonBosses, 0);
    summary.innerHTML = `
        <div style="background:var(--elevated);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 16px;text-align:center;flex:1;min-width:100px"><div style="font-size:1.4rem;font-weight:800;color:var(--gold)">${totalPlayersData.length}</div><div style="font-size:0.65rem;color:var(--muted);margin-top:2px">👥 Игроков</div></div>
        <div style="background:var(--elevated);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 16px;text-align:center;flex:1;min-width:100px"><div style="font-size:1.4rem;font-weight:800;color:var(--gold)">${totalFightsAll.toLocaleString()}</div><div style="font-size:0.65rem;color:var(--muted);margin-top:2px">⚔️ Боёв</div></div>
        <div style="background:var(--elevated);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 16px;text-align:center;flex:1;min-width:100px"><div style="font-size:1.4rem;font-weight:800;color:var(--gold)">${totalShardsAll.toLocaleString()}</div><div style="font-size:0.65rem;color:var(--muted);margin-top:2px">💎 Осколков</div></div>
        <div style="background:var(--elevated);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 16px;text-align:center;flex:1;min-width:100px"><div style="font-size:1.4rem;font-weight:800;color:var(--gold)">${totalTournamentsAll}</div><div style="font-size:0.65rem;color:var(--muted);margin-top:2px">👑 Турниров</div></div>
        <div style="background:var(--elevated);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 16px;text-align:center;flex:1;min-width:100px"><div style="font-size:1.4rem;font-weight:800;color:var(--gold)">${totalDungeonWavesAll.toLocaleString()}</div><div style="font-size:0.65rem;color:var(--muted);margin-top:2px">🌊 Волн данжа</div></div>
        <div style="background:var(--elevated);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 16px;text-align:center;flex:1;min-width:100px"><div style="font-size:1.4rem;font-weight:800;color:var(--gold)">${totalDungeonBossesAll.toLocaleString()}</div><div style="font-size:0.65rem;color:var(--muted);margin-top:2px">🐉 Боссов</div></div>
    `;
    renderTotalTableFromSorted();
    initTotalSortable();
}
function filterTotalTable() {
    const query = document.getElementById('totalSearch').value.toLowerCase().trim();
    const tbody = document.getElementById('total-table-body');
    if (!tbody || !totalPlayersData.length) return;
    if (!query) { renderTotalTableFromSorted(); return; }
    const filtered = totalPlayersData.filter(p => p.display.toLowerCase().includes(query));
    if (!filtered.length) { tbody.innerHTML = '<tr><td colspan="11" style="text-align:center;color:var(--muted);padding:40px">🔍 Никого не найдено</td></tr>'; return; }
    renderRows(filtered);
}
window.filterTotalTable = filterTotalTable;
function renderTotalTableFromSorted() {
    const tbody = document.getElementById('total-table-body');
    if (!tbody || !totalPlayersData.length) return;
    const query = document.getElementById('totalSearch').value.toLowerCase().trim();
    const data = query ? totalPlayersData.filter(p => p.display.toLowerCase().includes(query)) : totalPlayersData;
    if (!data.length) { tbody.innerHTML = '<tr><td colspan="11" style="text-align:center;color:var(--muted);padding:40px">🔍 Никого не найдено</td></tr>'; return; }
    renderRows(data);
}
function renderRows(data) {
    const tbody = document.getElementById('total-table-body');
    tbody.innerHTML = data.map((p, i) => {
        const wrColor = p.winrate >= 55 ? 'var(--green)' : p.winrate >= 45 ? 'var(--gold)' : 'var(--red)';
        return `<tr class="${i === 0 ? 'row-gold' : i === 1 ? 'row-silver' : i === 2 ? 'row-bronze' : ''}"><td><a href="player.html?name=${encodeURIComponent(p.display)}" class="player-link">${p.display}</a></td><td class="number">${p.wins.toLocaleString()}</td><td class="number">${p.losses.toLocaleString()}</td><td class="number" style="color:${wrColor};font-weight:700">${p.winrate}%</td><td class="number">${p.fights.toLocaleString()}</td><td class="number">${p.best}</td><td class="number">${p.shards.toLocaleString()}</td><td class="number">${p.tournaments}</td><td class="number">${p.dungeonRecord || '—'}</td><td class="number">${p.dungeonWaves.toLocaleString() || '—'}</td><td class="number">${p.dungeonBosses.toLocaleString() || '—'}</td></tr>`;
    }).join('');
}
function initTotalSortable() {
    const table = document.getElementById('total-table');
    if (!table) return;
    const headers = table.querySelectorAll('.sortable-header');
    let currentSort = 'wins';
    let currentDir = 'desc';
    headers.forEach(th => {
        th.addEventListener('click', () => {
            const sortBy = th.dataset.sort;
            headers.forEach(h => h.classList.remove('asc', 'desc'));
            if (currentSort === sortBy) currentDir = currentDir === 'asc' ? 'desc' : 'asc';
            else { currentSort = sortBy; currentDir = 'desc'; }
            th.classList.add(currentDir);
            if (sortBy === 'display') totalPlayersData.sort((a, b) => currentDir === 'asc' ? a.display.localeCompare(b.display) : b.display.localeCompare(a.display));
            else if (sortBy === 'winrate') totalPlayersData.sort((a, b) => currentDir === 'asc' ? a.winrate - b.winrate : b.winrate - a.winrate);
            else totalPlayersData.sort((a, b) => currentDir === 'asc' ? (a[sortBy] || 0) - (b[sortBy] || 0) : (b[sortBy] || 0) - (a[sortBy] || 0));
            filterTotalTable();
        });
    });
    const defaultHeader = table.querySelector('[data-sort="wins"]');
    if (defaultHeader) defaultHeader.classList.add('desc');
}
const validSeasonTabs = ['seasons', 'alltime'];
const initialHash = window.location.hash.substring(1);
if (initialHash && validSeasonTabs.includes(initialHash)) {
    switchSeasonsTab(initialHash);
}
detectSeasons();

/* === SCROLL PROGRESS + SCROLL TOP === */
(function() {
    const progressBar = document.getElementById('readingProgress');
    const scrollTopBtn = document.getElementById('scrollTop');
    if (!progressBar || !scrollTopBtn) return;
    window.addEventListener('scroll', () => {
        const scrollTop = window.scrollY;
        const docHeight = document.documentElement.scrollHeight - window.innerHeight;
        const progress = docHeight > 0 ? (scrollTop / docHeight) * 100 : 0;
        progressBar.style.transform = `scaleX(${progress / 100})`;
        if (scrollTop > 300) scrollTopBtn.classList.add('visible');
        else scrollTopBtn.classList.remove('visible');
    });
})();
</script>
